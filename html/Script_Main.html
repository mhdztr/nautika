function _fmtTs(ts) {
  var d = new Date(ts);
  return isNaN(d) ? (ts || '\u2014') : d.toLocaleString('id-ID');
}

// Headline KPI card (top row, bigger number)
// opt (semua optional, hanya dirender saat data nyata, value != '\u2014'):
//   ring    {pct}              → gauge cincin % (mis. SP2D)
//   spark   [Number]           → sparkline area seri bulanan
//   minibars [Number]          → strip batang 6 bulan terakhir
//   donut   {segs,tone,center} → donut ≤4 irisan + angka tengah (mis. armada)
//   dots    [{label,melapor}]  → titik per item (mis. 7 divisi melapor)
//   trend   {delta,prev}       → panah delta vs bulan sebelumnya
function _kpiHeadline(label, value, unit, sub, opt) {
  opt = opt || {};
  var hasData = value !== '\u2014';

  // 1. Header baris atas: Judul Title Case + Trend Badge di sudut kanan atas (kompak & single-line)
  var trendHtml = '';
  if (opt.trend && opt.trend.delta && hasData) {
    var d = Number(opt.trend.delta) || 0;
    if (d !== 0) {
      var isUp = d > 0;
      var arrow = isUp ? '\u25B2' : '\u25BC';
      var numStr = (isUp ? '+' : '') + _idNum(d);
      var prevShort = _ovMonthShort(opt.trend.prev);
      var prevFull = _ovMonthLabel(opt.trend.prev);
      var tip = 'Perubahan ' + numStr + ' dibanding ' + prevFull;
      trendHtml = '<div class="ov-trend ' + (isUp ? 'up' : 'down') + '" title="' + _esc(tip) + '">' +
        arrow + ' ' + Math.abs(d) +
        (prevShort ? ' <span class="ov-trend-cmp">vs ' + _esc(prevShort) + '</span>' : '') +
      '</div>';
    }
  }

  // 2. Indikator kemajuan kontekstual (sleek horizontal track 5px)
  var trackHtml = '';
  if (hasData) {
    var pct = null;
    var barClass = '';
    if (opt.pct !== undefined && opt.pct !== null) {
      pct = Math.max(0, Math.min(100, Number(opt.pct) || 0));
    } else if (unit === '%') {
      pct = Math.max(0, Math.min(100, parseFloat(String(value).replace(',', '.')) || 0));
    } else if (unit === '/ 7') {
      pct = Math.max(0, Math.min(100, (Number(value) || 0) / 7 * 100));
    } else if (opt.pctKapal !== undefined) {
      pct = Math.max(0, Math.min(100, Number(opt.pctKapal) || 0));
    } else if (opt.donut && opt.donut.segs && opt.donut.center) {
      var siapVal = 0;
      (opt.donut.segs || []).forEach(function(s){ if (s.tone === 'ok') siapVal = Number(s.val) || 0; });
      pct = opt.donut.center > 0 ? Math.max(0, Math.min(100, (siapVal / opt.donut.center) * 100)) : 0;
    } else if (unit === 'kapal') {
      var mTot = String(sub || '').match(/dari\s+(\d+)\s+armada/i);
      var tot = mTot ? Number(mTot[1]) : 0;
      if (tot > 0) pct = Math.max(0, Math.min(100, (Number(value) || 0) / tot * 100));
    } else if (unit === 'hari') {
      var mPct = String(sub || '').match(/\((\d+)%\)/);
      if (mPct) pct = Number(mPct[1]) || 0;
    }

    if (pct !== null) {
      trackHtml = '<div class="kpi-track"><div class="kpi-track-fill" style="width:' + pct.toFixed(1) + '%;"></div></div>';
    }
  }

  // 3. Subtext bawah terstruktur (dua kolom key-value, anti-wrap, bukan teks slap acak)
  var footHtml = '';
  if (opt.foot && opt.foot.left && opt.foot.right) {
    footHtml = '<div class="kpi-foot">' +
      '<div class="kpi-foot-item">' +
        (opt.foot.left.lbl ? '<span class="kpi-foot-lbl">' + _esc(opt.foot.left.lbl) + '</span> ' : '') +
        '<span class="kpi-foot-val">' + _esc(opt.foot.left.val) + '</span>' +
      '</div>' +
      '<div class="kpi-foot-item right">' +
        (opt.foot.right.lbl ? '<span class="kpi-foot-lbl">' + _esc(opt.foot.right.lbl) + '</span> ' : '') +
        '<span class="kpi-foot-val">' + _esc(opt.foot.right.val) + '</span>' +
      '</div>' +
    '</div>';
  } else if (sub) {
    // Parser fallback cerdas jika data lama/view lain mengirim string dengan pemisah "·"
    var parts = String(sub).split(/\s*[·\u00B7]\s*/);
    if (parts.length >= 2) {
      footHtml = '<div class="kpi-foot">' +
        '<div class="kpi-foot-item"><span class="kpi-foot-val">' + _esc(parts[0]) + '</span></div>' +
        '<div class="kpi-foot-item right"><span class="kpi-foot-val">' + _esc(parts[1]) + '</span></div>' +
      '</div>';
    } else {
      footHtml = '<div class="kpi-foot">' +
        '<div class="kpi-foot-item"><span class="kpi-foot-lbl">' + _esc(sub) + '</span></div>' +
      '</div>';
    }
  }

  return '<div class="kpi-card">' +
    '<div class="kpi-head">' +
      '<div class="kpi-label" title="' + _esc(label) + '">' + _esc(label) + '</div>' +
      trendHtml +
    '</div>' +
    '<div class="kpi-value">' + value +
      (unit ? '<span class="kpi-unit">' + _esc(unit) + '</span>' : '') +
    '</div>' +
    trackHtml +
    footHtml +
  '</div>';
}

// ── Visual mini KPI (SVG inline; palet token tema, tanpa axis) ──

// Gauge cincin % (DESIGN §10.2: pengganti gauge analog; tetap baca jelas lewat angka).
function _ovRing(pct, size) {
  size = size || 68;
  var r = (size - 12) / 2;
  var c = 2 * Math.PI * r;
  var filled = Math.max(0, Math.min(100, Number(pct) || 0)) / 100 * c;
  var cx = size / 2, cy = size / 2;
  return '<svg width="' + size + '" height="' + size + '" viewBox="0 0 ' + size + ' ' + size + '">' +
    '<circle cx="' + cx + '" cy="' + cy + '" r="' + r + '" fill="none" stroke="var(--n-surface-2)" stroke-width="8"/>' +
    '<circle cx="' + cx + '" cy="' + cy + '" r="' + r + '" fill="none" stroke="var(--n-primary)" stroke-width="8" stroke-linecap="round" ' +
      'stroke-dasharray="' + filled.toFixed(1) + ' ' + c.toFixed(1) + '" transform="rotate(-90 ' + cx + ' ' + cy + ')"/>' +
    '<text x="' + cx + '" y="' + cy + '" text-anchor="middle" dominant-baseline="central" font-size="' + Math.round(size * 0.26) + '" font-weight="800" fill="var(--n-text-primary)">' + Math.round(pct) + '%</text>' +
  '</svg>';
}

// Sparkline area seri bulanan (Jan → terpilih); disembunyikan bila < 2 titik.
function _ovSpark(series, color, fillColor) {
  var nums = (series || []).map(function (n) { return Number(n) || 0; });
  if (nums.length < 2 || nums.every(function (n) { return n === 0; })) return '';
  var w = 120, h = 40, pad = 3;
  var max = Math.max.apply(null, nums.concat([1]));
  var stepX = (w - pad * 2) / (nums.length - 1);
  var pts = nums.map(function (n, i) {
    return [pad + i * stepX, h - pad - (n / max) * (h - pad * 2)];
  });
  var line = pts.map(function (p, i) { return (i ? 'L' : 'M') + p[0].toFixed(1) + ' ' + (p[1].toFixed(1)); }).join(' ');
  var area = line + ' L' + (w - pad).toFixed(1) + ' ' + (h - pad) + ' L' + pad + ' ' + (h - pad) + ' Z';
  var last = pts[pts.length - 1];
  return '<svg width="' + w + '" height="' + h + '" viewBox="0 0 ' + w + ' ' + h + '">' +
    '<path d="' + area + '" fill="' + (fillColor || 'rgba(43,54,116,0.14)') + '" stroke="none"/>' +
    '<path d="' + line + '" fill="none" stroke="' + (color || 'var(--n-primary)') + '" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>' +
    '<rect x="' + (last[0] - 3) + '" y="' + (last[1] - 3) + '" width="6" height="6" rx="3" fill="' + (color || 'var(--n-primary)') + '"/>' +
  '</svg>';
}

// Strip batang nilai total (6 bulan terakhir) — konteks tren cepat.
function _ovMiniBars(values, color) {
  var nums = (values || []).map(function (n) { return Number(n) || 0; });
  if (!nums.length) return '';
  nums = nums.slice(-6);
  var max = Math.max.apply(null, nums.concat([1]));
  var bw = 10, gap = 5, h = 40, padT = 6;
  var w = nums.length * (bw + gap) + 10;
  var bars = nums.map(function (v, i) {
    var hh = Math.max(2, (v / max) * (h - padT - 3));
    var x = 5 + i * (bw + gap);
    return '<rect x="' + x + '" y="' + (h - hh - 3) + '" width="' + bw + '" height="' + hh + '" rx="2.5" fill="' + (color || 'var(--n-primary)') + '"/>';
  }).join('');
  return '<svg width="' + w + '" height="' + h + '" viewBox="0 0 ' + w + ' ' + h + '">' + bars + '</svg>';
}

// Donut komposisi (≤4 irisan) + angka tengah; segmen 0 dilewati, total ≤ 0 → hidden.
function _ovDonut(segs, size, center, subLabel) {
  var total = _ovSegTotal(segs);
  if (total <= 0) return '';
  size = size || 76;
  var r = (size - 14) / 2;
  var c = 2 * Math.PI * r;
  var cx = size / 2, cy = size / 2, sw = size > 100 ? 15 : 12;
  var off = 0;
  var arcs = segs.filter(function (s) { return (Number(s.val) || 0) > 0; }).map(function (s) {
    var len = (Number(s.val) || 0) / total * c;
    var el = '<circle cx="' + cx + '" cy="' + cy + '" r="' + r + '" fill="none" stroke="' + _ovTone(s.tone) + '" stroke-width="' + sw + '" ' +
      'stroke-dasharray="' + Math.max(1, len - 2).toFixed(1) + ' ' + (c - len + 2).toFixed(1) + '" stroke-dashoffset="' + (-off).toFixed(1) + '" ' +
      'transform="rotate(-90 ' + cx + ' ' + cy + ')"/>';
    off += len + 2;
    return el;
  }).join('');
  var subText = (subLabel && size > 100) ? (
    '<text x="' + cx + '" y="' + (cy + 17) + '" text-anchor="middle" font-size="10" font-weight="600" letter-spacing="-0.01em" fill="var(--n-text-secondary)">' + _esc(subLabel) + '</text>'
  ) : '';
  var numY = (subLabel && size > 100) ? (cy - 3) : cy;
  return '<svg width="' + size + '" height="' + size + '" viewBox="0 0 ' + size + ' ' + size + '">' + arcs +
    '<text x="' + cx + '" y="' + numY + '" text-anchor="middle" dominant-baseline="central" font-size="' + Math.round(size * (subLabel ? 0.22 : 0.24)) + '" font-weight="800" fill="var(--n-text-primary)">' + _esc(String(center !== undefined ? center : '')) + '</text>' +
    subText +
  '</svg>';
}

// Deretan titik status (7 divisi melapor) — isi = melapor.
function _ovDots(items) {
  if (!items || !items.length) return '';
  return '<div class="ov-dots">' + items.map(function (it) {
    var st = it.melapor ? ' on' : '';
    return '<span class="ov-dot' + st + '" title="' + _esc(it.label) + (it.melapor ? '\u2014 melapor' : '\u2014 belum melapor') + '"></span>';
  }).join('') + '</div>';
}

// Baris batang horizontal (label + track + nilai) — kapal teraktif / stok.
function _ovBars(items, opt) {
  if (!items || !items.length) return '';
  opt = opt || {};
  var max = Math.max.apply(null, items.map(function (it) { return Number(it.val) || 0; }).concat([1]));
  return '<div class="ov-bars">' + items.map(function (it, idx) {
    var pct = Math.max(3, (Number(it.val) || 0) / max * 100);
    var rankHtml = opt.ranked ? (
      '<span class="bar-rank' + (idx === 0 ? ' top' : '') + '">#' + (idx + 1) + '</span>'
    ) : '';
    var unitHtml = opt.unit ? (
      ' <span class="bar-line-unit">' + _esc(opt.unit) + '</span>'
    ) : '';
    return '<div class="bar-line' + (opt.ranked ? ' has-rank' : '') + '">' +
      rankHtml +
      '<div class="bar-line-lbl" title="' + _esc(it.label) + '">' + _esc(it.label) + '</div>' +
      '<div class="bar-line-track"><div class="bar-line-fill" style="width:' + pct + '%;background:' + _ovTone(it.tone) + ';"></div></div>' +
      '<div class="bar-line-val">' + _idNum(it.val) + unitHtml + '</div>' +
    '</div>';
  }).join('') + '</div>';
}

function _ovSegTotal(segs) {
  return (segs || []).reduce(function (a, s) { return a + (Number(s.val) || 0); }, 0);
}

// Plot donut + legenda untuk sel chart (DESIGN §6.3: komposisi → donut ≤4).
function _ovPlotDonut(segs, size, subLabel) {
  var total = _ovSegTotal(segs);
  if (total <= 0) return '';
  var donut = _ovDonut(segs, size || 160, _idNum(total), subLabel || 'Kapal');
  var legend = segs.filter(function (s) { return (Number(s.val) || 0) > 0; }).map(function (s) {
    var pct = Math.round((Number(s.val) || 0) / total * 100);
    return '<div class="legend-row">' +
      '<i style="background:' + _ovTone(s.tone) + ';"></i>' +
      '<span class="legend-lbl">' + _esc(s.label) + '</span>' +
      '<span class="legend-val">' + _idNum(s.val) + '</span>' +
      '<span class="legend-pct">' + pct + '%</span>' +
    '</div>';
  }).join('');
  return '<div class="ov-plot">' + donut + '<div class="ov-plot-legend">' + legend + '</div></div>';
}

// Thin stacked bar (proportion) — DESIGN.md §6.3: navy gradasi + status semantik.
// Segmen bernilai 0 dilewati (tidak membentuk lebar maupun entri legenda).
function _ovStackHtml(segs) {
  if (!segs || !segs.length) return '';
  var total = 0;
  for (var i = 0; i < segs.length; i++) total += (Number(segs[i].val) || 0);
  if (total <= 0) return '';
  var bar = segs.map(function (s) {
    var w = (Number(s.val) || 0) / total * 100;
    return '<div class="stk-seg" style="width:' + w + '%;background:' + _ovTone(s.tone) + ';"></div>';
  }).join('');
  var legend = segs.filter(function (s) { return (Number(s.val) || 0) > 0; })
    .map(function (s) {
      return '<span class="stk-item"><i style="background:' + _ovTone(s.tone) + ';"></i>' +
        _esc(s.label) + ' ' + _idNum(s.val) + '</span>';
    }).join('');
  return '<div class="stk-wrap"><div class="stk-bar">' + bar + '</div>' +
    '<div class="stk-legend">' + legend + '</div></div>';
}

// Pemetaan tone → token CSS tema (DESIGN.md §3; tanpa hue baru).
function _ovTone(t) {
  switch (t) {
    case 'ok':      return 'var(--n-ok)';
    case 'warn':    return 'var(--n-warn)';
    case 'crit':    return 'var(--n-crit)';
    case 'soft':    return 'rgba(43,54,116,0.62)';
    case 'light':   return 'rgba(43,54,116,0.35)';
    case 'lighter': return 'rgba(43,54,116,0.20)';
    default:        return 'var(--n-primary)';
  }
}

// '2026-07' → 'Juli 2026' (MONTHS didefinisikan di bawah literal global).
function _ovMonthLabel(key) {
  if (!key) return '\u2014';
  var p = String(key).split('-');
  var mi = parseInt(p[1], 10);
  if (!mi || mi < 1 || mi > 12) return String(key);
  return MONTHS[mi - 1] + (p[0] ? ' ' + p[0] : '');
}

// Division summary card
// metrics: [{lbl, val, unit, prog, progMax, stack}] — prog=true adds a placeholder
// progress bar; stack=[{label,val,tone}] adds a thin stacked bar under the row.
// stack (card-level) = {caption, segments:[...]} renders a thin stacked bar
// setelah seluruh baris metrik (mis. komposisi AKN).
function _divCard(title, metrics, stack, dots, opts) {
  opts = opts || {};
  var span = Number(opts.span) || 0;
  var rows = metrics.map(function(m, idx) {
    var isMuted = m.val === '\u2014';
    var badgeHtml = (m.badge && !isMuted) ? (
      '<span class="div-metric-badge ' + (m.tone || 'info') + '">' + _esc(m.badge) + '</span>'
    ) : '';
    var valHtml = '<span class="div-metric-val' + (isMuted ? ' muted' : (idx === 0 && opts.hero ? ' hero' : '')) + '">' +
      m.val + (m.unit ? ' <span class="div-metric-unit">' + m.unit + '</span>' : '') +
    '</span>';
    var hasRaw = m.raw !== null && m.raw !== undefined && m.raw !== '';
    var progHtml = (m.prog && !isMuted && hasRaw) ? (
      '<div class="div-micro-bar">' +
        '<div class="div-micro-bar-fill' + (Number(m.raw) < 50 ? ' warn' : '') + '" style="width:' +
          Math.max(0, Math.min(100, Number(m.raw) || 0)) + '%;"></div>' +
      '</div>'
    ) : '';
    var progTargetHtml = (m.progMax && !isMuted && hasRaw) ? (
      '<div class="div-micro-bar">' +
        '<div class="div-micro-bar-fill" style="width:' +
          Math.max(0, Math.min(100, (Number(m.raw) || 0) / m.progMax * 100)) + '%;"></div>' +
      '</div>'
    ) : '';
    var stackHtml = (m.stack && !isMuted) ? _ovStackHtml(m.stack) : '';
    return '<div class="div-metric-row">' +
      '<div class="div-metric">' +
        '<span class="div-metric-lbl">' + _esc(m.lbl) + '</span>' +
        '<div class="div-metric-right">' + valHtml + badgeHtml + '</div>' +
      '</div>' +
      progHtml + progTargetHtml + stackHtml +
    '</div>';
  }).join('');
  // Visual: viz dari server (bentuk bervariasi per kartu) → bila tidak ada
  // (cache lama / Profil Kapal) jatuh ke footer lama. `loading` = placeholder.
  var foot;
  if (opts.foot === false) foot = '';
  else if (opts.loading) foot = '<div class="vz"><div class="vz-body"><div class="vz-empty">Memuat\u2026</div></div></div>';
  else if (opts.viz) foot = _vzRender(opts.viz);
  else foot = _ovCardFoot(metrics, stack, dots);
  var cls = 'div-card' + (span ? ' s' + span : '') + (span >= 4 ? ' wide' : '');
  return '<div class="' + cls + '">' +
    '<div class="div-card-title">' + title + '</div>' +
    '<div class="div-card-body">' +
      '<div class="div-card-metrics">' + rows + '</div>' +
      foot +
    '</div>' +
  '</div>';
}

// ===========================================================================
// VISUAL KARTU DIVISI (Fase 14) — tiap kartu memilih bentuk yang menjawab
// pertanyaan datanya sendiri (DESIGN §6.1). Semua murni HTML/SVG + token tema;
// tanpa gauge. Angka detail muncul di tooltip (`title`) bila terlalu padat
// untuk label langsung, supaya angka tidak saling tabrak.
// ===========================================================================
function _ovTrim1(x) { return String(Math.round(x * 10) / 10).replace('.', ','); }

// 1.250.000 → "1,3 jt"; fmt 'rp' selalu dipadatkan, selainnya hanya ≥ 10.000.
function _ovCompact(n, fmt) {
  n = Number(n) || 0;
  var a = Math.abs(n);
  if (fmt !== 'rp' && a < 10000) return _idNum(n);
  if (a >= 1e12) return _ovTrim1(n / 1e12) + ' T';
  if (a >= 1e9)  return _ovTrim1(n / 1e9) + ' M';
  if (a >= 1e6)  return _ovTrim1(n / 1e6) + ' jt';
  if (a >= 1e3)  return _ovTrim1(n / 1e3) + ' rb';
  return _idNum(n);
}

// '2026-07' → 'Jul'; label lain dikembalikan apa adanya.
function _ovMonthShort(key) {
  var m = /^\d{4}-(\d{2})$/.exec(String(key || ''));
  if (!m) return String(key || '');
  var i = parseInt(m[1], 10);
  return (i >= 1 && i <= 12) ? MONTHS[i - 1].slice(0, 3) : String(key);
}

function _vzLegend(series) {
  if (!series || series.length < 2) return '';
  return '<div class="vz-legend">' + series.map(function (s) {
    return '<span><i style="background:' + _ovTone(s.tone) + ';"></i>' + _esc(s.name) + '</span>';
  }).join('') + '</div>';
}

// Kolom vertikal (grouped / tunggal). Batang diposisikan absolut terhadap
// sel setinggi area visual, jadi mengisi tinggi kartu berapa pun.
function _vzCols(v) {
  var series = v.series || [], groups = v.groups || [];
  var max = 0;
  groups.forEach(function (g) { (g.vals || []).forEach(function (x) { max = Math.max(max, Number(x) || 0); }); });
  if (!groups.length || max <= 0) return '';
  var showVals = groups.length * Math.max(1, series.length) <= 12;
  var cols = groups.map(function (g) {
    var glabel = _ovMonthShort(g.label);
    var bars = (g.vals || []).map(function (x, i) {
      var n = Number(x) || 0;
      var h = n > 0 ? Math.max(3, n / max * 80) : 0;
      var tip = glabel + (series[i] ? ' \u00B7 ' + series[i].name : '') + ': ' + _ovCompact(n, v.fmt);
      return '<div class="vz-bar-wrap" title="' + _esc(tip) + '">' +
        (showVals && n > 0 ? '<span class="vz-bar-val" style="bottom:calc(' + h + '% + 3px);">' + _esc(_ovCompact(n, v.fmt)) + '</span>' : '') +
        '<div class="vz-bar" style="height:' + h + '%;background:' + _ovTone((series[i] || {}).tone) + ';"></div>' +
      '</div>';
    }).join('');
    return '<div class="vz-col"><div class="vz-col-bars">' + bars + '</div>' +
      '<div class="vz-col-lbl" title="' + _esc(glabel) + '">' + _esc(glabel) + '</div></div>';
  }).join('');
  return '<div class="vz-cols"><div class="vz-bars">' + cols + '</div>' + _vzLegend(series) + '</div>';
}

// Donut proporsi (≤4 irisan) + legenda berangka (label langsung).
function _vzDonut(v) {
  var segs = (v.segs || []).filter(function (s) { return (Number(s.val) || 0) > 0; });
  var total = _ovSegTotal(segs);
  if (total <= 0) return '';
  var legend = segs.map(function (s) {
    var pct = Math.round((Number(s.val) || 0) / total * 100);
    return '<div class="legend-row"><i style="background:' + _ovTone(s.tone) + ';"></i>' +
      '<span class="legend-lbl">' + _esc(s.label) + '</span>' +
      '<span class="legend-val">' + _idNum(s.val) + '</span>' +
      '<span class="legend-pct">' + pct + '%</span></div>';
  }).join('');
  return '<div class="vz-donut">' + _ovDonut(segs, 116, _idNum(total), v.sub || '') +
    '<div class="vz-donut-legend">' + legend + '</div></div>';
}

// Batang horizontal berperingkat (label + track + nilai).
function _vzHbars(v) {
  var items = (v.items || []).slice().sort(function (a, b) { return (Number(b.val) || 0) - (Number(a.val) || 0); });
  if (_ovSegTotal(items) <= 0) return '';
  return '<div class="vz-hbars">' + _ovBars(items) + '</div>';
}

// Garis multi-seri (maks. 2–3), sumbu 0 di dasar, label bulan di bawah.
function _vzLine(v) {
  var labels = v.labels || [], series = v.series || [];
  var n = labels.length;
  var max = 0;
  series.forEach(function (s) { (s.data || []).forEach(function (x) { max = Math.max(max, Number(x) || 0); }); });
  if (n < 2 || max <= 0) return '';
  var W = 200, H = 100, padX = 4, padY = 8;
  var sx = (W - padX * 2) / (n - 1);
  var paths = series.map(function (s, si) {
    var pts = (s.data || []).map(function (x, i) {
      return [padX + i * sx, H - padY - ((Number(x) || 0) / max) * (H - padY * 2)];
    });
    var d = pts.map(function (p, i) { return (i ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1); }).join(' ');
    var area = si === 0 ? '<path d="' + d + ' L' + (W - padX) + ' ' + (H - padY) + ' L' + padX + ' ' + (H - padY) + ' Z" fill="rgba(43,54,116,0.10)"/>' : '';
    return area + '<path d="' + d + '" fill="none" stroke="' + _ovTone(s.tone) + '" stroke-width="2" vector-effect="non-scaling-stroke" stroke-linecap="round" stroke-linejoin="round"/>';
  }).join('');
  var grid = [0.25, 0.5, 0.75].map(function (f) {
    var y = padY + (H - padY * 2) * f;
    return '<line x1="0" x2="' + W + '" y1="' + y + '" y2="' + y + '" stroke="rgba(0,0,0,0.06)" stroke-width="1" vector-effect="non-scaling-stroke"/>';
  }).join('');
  var base = '<line x1="0" x2="' + W + '" y1="' + (H - padY) + '" y2="' + (H - padY) + '" stroke="rgba(0,0,0,0.12)" stroke-width="1" vector-effect="non-scaling-stroke"/>';
  var step = n > 8 ? 2 : 1;
  var xl = labels.map(function (l, i) {
    return '<span>' + (i % step === 0 ? _esc(_ovMonthShort(l)) : '') + '</span>';
  }).join('');
  var peak = series.map(function (s) {
    return _esc(s.name) + ' maks ' + _ovCompact(Math.max.apply(null, (s.data || [0]).map(Number))) ;
  }).join(' \u00B7 ');
  return '<div class="vz-line"><div class="vz-line-plot" title="' + peak + '">' +
    '<svg viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="none" aria-hidden="true">' + grid + base + paths + '</svg></div>' +
    '<div class="vz-line-x" style="grid-template-columns:repeat(' + n + ',1fr);">' + xl + '</div>' +
    _vzLegend(series) + '</div>';
}

// Waffle 10×4 = 40 sel; alokasi sisa terbesar supaya jumlah sel selalu 40.
function _vzWaffle(v) {
  var segs = (v.segs || []).filter(function (s) { return (Number(s.val) || 0) > 0; });
  var total = _ovSegTotal(segs);
  if (total <= 0) return '';
  var CELLS = 40;
  var alloc = segs.map(function (s) {
    var raw = (Number(s.val) || 0) / total * CELLS;
    return { floor: Math.floor(raw), rem: raw - Math.floor(raw) };
  });
  var used = alloc.reduce(function (a, x) { return a + x.floor; }, 0);
  alloc.map(function (x, i) { return i; })
    .sort(function (a, b) { return alloc[b].rem - alloc[a].rem; })
    .slice(0, CELLS - used).forEach(function (i) { alloc[i].floor++; });
  var cells = '';
  segs.forEach(function (s, i) {
    for (var k = 0; k < alloc[i].floor; k++) {
      cells += '<i style="background:' + _ovTone(s.tone) + ';" title="' + _esc(s.label + ': ' + _idNum(s.val)) + '"></i>';
    }
  });
  var legend = segs.map(function (s) {
    return '<span><i style="background:' + _ovTone(s.tone) + ';"></i>' + _esc(s.label) + ' <b>' + _idNum(s.val) + '</b></span>';
  }).join('');
  return '<div class="vz-waffle">' + cells + '</div><div class="vz-legend">' + legend + '</div>';
}

// Heat strip: intensitas per bulan (opasitas navy), angka di dalam sel.
function _vzHeat(v) {
  var labels = v.labels || [], vals = (v.vals || []).map(function (x) { return Number(x) || 0; });
  var max = Math.max.apply(null, vals.concat([0]));
  if (!labels.length || max <= 0) return '';
  var cells = labels.map(function (l, i) {
    var n = vals[i] || 0;
    var a = n > 0 ? (0.14 + 0.78 * n / max) : 0;
    var style = n > 0 ? 'background:rgba(43,54,116,' + a.toFixed(2) + ');color:' + (a > 0.5 ? '#FFFFFF' : 'var(--n-text-primary)') + ';' : '';
    return '<div class="vz-heat-unit" title="' + _esc(_ovMonthShort(l) + ': ' + n + ' kegiatan') + '">' +
      '<div class="vz-heat-cell' + (n > 0 ? '' : ' zero') + '" style="' + style + '">' + (n > 0 ? n : '') + '</div>' +
      '<div class="vz-heat-lbl">' + _esc(_ovMonthShort(l)) + '</div></div>';
  }).join('');
  return '<div class="vz-heat" style="grid-template-columns:repeat(' + labels.length + ',minmax(0,1fr));">' + cells + '</div>';
}

// Chip status per item (terisi = sudah melapor).
function _vzChips(v) {
  var items = v.items || [];
  if (!items.length) return '';
  return '<div class="vz-chips">' + items.map(function (it) {
    return '<span class="vz-chip' + (it.melapor ? ' on' : '') + '" title="' + _esc(it.label + (it.melapor ? ' \u2014 melapor' : ' \u2014 belum melapor')) + '">' +
      '<i></i>' + _esc(it.label) + '</span>';
  }).join('') + '</div>';
}

var _VZ_RENDERERS = { cols: _vzCols, donut: _vzDonut, hbars: _vzHbars, line: _vzLine, waffle: _vzWaffle, heat: _vzHeat, chips: _vzChips };

function _vzRender(v) {
  if (!v || !_VZ_RENDERERS[v.type]) return '';
  var inner = _VZ_RENDERERS[v.type](v);
  return '<div class="vz">' +
    (v.caption ? '<div class="div-card-foot-cap">' + _esc(v.caption) + '</div>' : '') +
    '<div class="vz-body">' + (inner || '<div class="vz-empty">Belum ada data pada periode ini.</div>') + '</div>' +
  '</div>';
}

// Nilai numerik yang layak dibandingkan dalam kartu (bukan rupiah/koordinat).
function _ovMetricNum(m) {
  if (m.raw === null || m.raw === undefined || m.raw === '') return null;
  if (m.unit === 'Rp' || m.unit === 'NM\u00B2') return null;
  var n = Number(m.raw);
  return isNaN(n) ? null : n;
}

// Footer visual kartu — mengisi sisa tinggi kartu agar tidak ada area kosong.
// Prioritas: dots → stack kartu → bars metrik → gabungan stack per baris.
function _ovCardFoot(metrics, stack, dots) {
  if (dots && dots.length) {
    var dOn = dots.filter(function (d) { return d.melapor; }).length;
    return '<div class="div-card-foot">' +
      '<div class="div-card-foot-cap">Status 7 Divisi \u2014 ' + dOn + '/' + dots.length + ' Melapor</div>' +
      '<div class="div-card-foot-dots">' + _ovDots(dots) + '</div>' +
    '</div>';
  }
  if (stack && stack.segments && stack.segments.length) {
    var s2 = _ovStackHtml(stack.segments);
    if (s2) return '<div class="div-card-foot">' +
      '<div class="div-card-foot-cap">' + (stack.caption || 'Proporsi') + '</div>' + s2 + '</div>';
  }
  for (var i = 0; i < metrics.length; i++) {
    var m = metrics[i];
    if (m.bars && m.bars.length && m.val !== '\u2014') {
      return '<div class="div-card-foot">' +
        '<div class="div-card-foot-cap">' + m.lbl + '</div>' + _ovBars(m.bars) + '</div>';
    }
  }
  // Gabungkan beberapa stack per-baris jika ada
  var groups = 0, st = [];
  metrics.forEach(function (m) {
    if (m.stack && m.stack.length && m.val !== '\u2014' && _ovSegTotal(m.stack) > 0) {
      groups++;
      m.stack.slice(0, 2).forEach(function (seg) {
        st.push({ label: m.lbl.replace(/\s*\(KII\/KIA\)\s*$/, '') + ' \u00B7 ' + seg.label, val: seg.val, tone: seg.tone });
      });
    }
  });
  if (groups >= 2) {
    return '<div class="div-card-foot">' +
      '<div class="div-card-foot-cap">Komposisi Penindakan</div>' + _ovBars(st.slice(0, 6)) + '</div>';
  }
  return '';
}

// ===========================================================================
// LOADER LEAFLET ON-DEMAND (Shared: Ikhtisar, Operasi Laut, Operasi Udara)
// ===========================================================================
// Leaflet CSS+JS tidak di-load di Index.html (itu memblokir DOMContentLoaded).
// Di-inject secara dinamis saat modul/view yang membutuhkan peta dibuka.
var _LEAFLET_LOADED = false;
var _leafletQueue   = [];
function _loadLeaflet(cb) {
  if (typeof L !== 'undefined' || _LEAFLET_LOADED) {
    if (cb) { try { cb(); } catch (e) { console.error(e); } }
    return;
  }
  if (cb) _leafletQueue.push(cb);
  if (document.getElementById('leaflet-js')) return; // sedang loading, tunggu callback

  // Inject CSS
  if (!document.getElementById('leaflet-css')) {
    var link = document.createElement('link');
    link.id   = 'leaflet-css';
    link.rel  = 'stylesheet';
    link.href = 'https://unpkg.com/leaflet@1.9.4/dist/leaflet.css';
    document.head.appendChild(link);
  }

  // Inject JS
  var script = document.createElement('script');
  script.id  = 'leaflet-js';
  script.src = 'https://unpkg.com/leaflet@1.9.4/dist/leaflet.js';
  script.onload = function () {
    _LEAFLET_LOADED = true;
    var queue = _leafletQueue.slice();
    _leafletQueue = [];
    queue.forEach(function (fn) { try { fn(); } catch (e) { console.error(e); } });
  };
  script.onerror = function () {
    console.error('Gagal memuat Leaflet dari CDN');
    var queue = _leafletQueue.slice();
    _leafletQueue = [];
    queue.forEach(function (fn) { try { fn(new Error('Gagal memuat Leaflet dari CDN')); } catch (e) { console.error(e); } });
  };
  document.head.appendChild(script);
}

// Window resize listener untuk menjaga ukuran map Leaflet tetap sinkron
if (typeof window !== 'undefined' && typeof window.addEventListener === 'function') {
  window.addEventListener('resize', function () {
    if (typeof _OV_MAP !== 'undefined' && _OV_MAP.map) {
      try { _OV_MAP.map.invalidateSize(); } catch (e) {}
    }
    if (typeof opsLautMap !== 'undefined' && opsLautMap) {
      try { opsLautMap.invalidateSize(); } catch (e) {}
    }
    if (typeof opsUdaraMap !== 'undefined' && opsUdaraMap) {
      try { opsUdaraMap.invalidateSize(); } catch (e) {}
    }
  });
}

// ===========================================================================
// PETA CHOROPLETH WPP — IKHTISAR (Fase 14)
// ===========================================================================
// Peta di Ikhtisar memakai geometri yang PERSIS sama dengan peta Operasi, lewat
// `_opsGetGeoData()` — jadi tidak ada unduhan 10 MB kedua di sesi ini (PRD §8.1).
// Yang membedakan: 5 metrik yang bisa dipilih user, panel ranking WPP, dan
// skala intensitas yang menyesuaikan nilai metrik terpilih (bukan bucket tetap
// seperti peta Operasi, karena Cakupan NM² vs KII punya orde besaran beda jauh).
//
// Peta ini READ-ONLY (PRD §5.1): klik WPP tidak memfilter tabel mana pun,
// hanya menyorot + memfokuskan kamera.
var _OV_MAP = {
  metric: 'aktivitas',
  fleetFilter: 'ALL',
  data: null,      // payload wppMap dari server (termasuk .fleet)
  map: null,
  layer: null,
  fleetLayer: null
};

// Ramp 1 hue navy, sama dengan peta Operasi (§8.1: gradasi intensitas satu
// warna, bukan traffic-light). Hex, bukan var(): Leaflet menulis fill sebagai
// ATRIBUT SVG.
var _OV_MAP_RAMP = ['#E4E7F2', '#A9B0D0', '#6B76A8', '#2B3674'];
var _OV_MAP_RAMP_LINE = 'rgba(43,54,116,0.45)';

// Deskripsi metrik di bawah judul (data provenance, bukan hiasan).
var _OV_MAP_META = {
  aktivitas: 'KII + KIA + rumpon · Operasi Laut & Udara · kumulatif Jan s/d bulan terpilih',
  kii:        'Operasi Laut & Udara · kumulatif Jan s/d bulan terpilih',
  kia:        'Operasi Laut & Udara · kumulatif Jan s/d bulan terpilih',
  rump:       'Operasi Laut · kumulatif Jan s/d bulan terpilih',
  cakupan:    'Operasi Udara · kumulatif Jan s/d bulan terpilih'
};

function _ovMapMetricDef(key) {
  var m = _OV_MAP.data && _OV_MAP.data.metrics ? _OV_MAP.data.metrics : [];
  for (var i = 0; i < m.length; i++) if (m[i].key === key) return m[i];
  return null;
}

// Ambil nilai satu metrik untuk satu kode WPP (aman terhadap kode spasi).
function _ovMapVal(kode) {
  var rows = _OV_MAP.data && _OV_MAP.data.rows;
  if (!rows) return 0;
  var b = rows[kode];
  if (b === undefined) b = rows[String(kode == null ? '' : kode).trim()];
  if (!b) return 0;
  return Number(b[_OV_MAP.metric]) || 0;
}

function _ovMapName(kode) {
  var rows = _OV_MAP.data && _OV_MAP.data.rows;
  var b = rows && (rows[kode] || rows[String(kode == null ? '' : kode).trim()]);
  return b && b.nama ? b.nama : ('WPP ' + kode);
}

// ── Skala 4 bucket adaptif per metrik ────────────────────
// Bucket tetap milik peta Operasi (0 / 1-5 / 6-15 / >15) tidak bisa dipakai di
// sini: Cakupan bisa ratusan, KII bisa satuan. Ambang dihitung dari nilai
// tertinggi pada metrik aktif supaya gradasi tetap terbaca untuk semua metrik.
// 3 ambang → 4 bucket: 0, 1–s0, s0+1–s1, ≥ s1+1. Bucket teratas terbuka
// (label '≥') supaya tidak ada warna tanpa labelnya.
function _ovMapScale() {
  var rows = _OV_MAP.data && _OV_MAP.data.rows;
  var max = 0;
  if (rows) {
    Object.keys(rows).forEach(function (k) {
      var v = Number(rows[k][_OV_MAP.metric]) || 0;
      if (v > max) max = v;
    });
  }
  var s = [1, 2, 3].map(function (i) { return Math.ceil(max * i / 4); });
  // Buka bucket agar tidak ada dua anak tangga bernilai sama (mis. max=1).
  for (var i = 1; i < s.length; i++) if (s[i] <= s[i - 1]) s[i] = s[i - 1] + 1;
  var def = _ovMapMetricDef(_OV_MAP.metric);
  var unit = def && def.unit ? ' ' + def.unit : '';
  var labels = [
    '0',
    '1–' + s[0] + unit,
    (s[0] + 1) + '–' + s[1] + unit,
    '≥ ' + (s[1] + 1) + unit
  ];
  return { max: max, labels: labels, fill: function (v) {
    var n = Number(v) || 0;
    if (n <= 0) return _OV_MAP_RAMP[0];
    if (n <= s[0]) return _OV_MAP_RAMP[1];
    if (n <= s[1]) return _OV_MAP_RAMP[2];
    return _OV_MAP_RAMP[3];
  } };
}

// ── Chip pengalih metrik ────────────────────────────────
function _ovMapRenderChips() {
  var host = document.getElementById('ov-map-metrics');
  if (!host) return;
  var metrics = (_OV_MAP.data && _OV_MAP.data.metrics) || [];
  host.innerHTML = metrics.map(function (m) {
    var on = m.key === _OV_MAP.metric;
    return '<button type="button" class="ov-map-chip' + (on ? ' is-on' : '') + '"' +
      ' data-ov-metric="' + m.key + '" aria-pressed="' + (on ? 'true' : 'false') + '">' +
      m.label + '</button>';
  }).join('');
  host.querySelectorAll('[data-ov-metric]').forEach(function (b) {
    b.addEventListener('click', function () {
      var k = b.getAttribute('data-ov-metric');
      if (!k || k === _OV_MAP.metric) return;
      _OV_MAP.metric = k;
      _ovMapRenderChips();
      _ovMapPaint();
      _ovMapRenderRank();
    });
  });

  var def = _ovMapMetricDef(_OV_MAP.metric);
  var title = document.getElementById('ov-map-title');
  var sub = document.getElementById('ov-map-sub');
  if (title && def) title.textContent = def.label + (def.unit ? ' (' + def.unit + ')' : '');
  if (sub) sub.textContent = _OV_MAP_META[_OV_MAP.metric] || '';
}

// ── Legenda skala (dibuat dari JS, polunya sama dengan peta Operasi) ──
function _ovMapLegend(scale) {
  var host = document.getElementById('ov-map');
  if (!host) return;
  var old = host.querySelector('.ov-map-legend');
  if (old) old.remove();
  var el = document.createElement('div');
  el.className = 'ov-map-legend';
  var html = '<div class="ov-map-legend-title">Skala intensitas</div>';
  scale.labels.forEach(function (lb, i) {
    html += '<div class="ov-map-legend-row"><i style="background:' + _OV_MAP_RAMP[i] + '"></i>' + lb + '</div>';
  });
  el.innerHTML = html;
  host.appendChild(el);
}

// ── Layer choropleth ────────────────────────────────────
function _ovMapPaint() {
  var host = document.getElementById('ov-map');
  if (!host || !_OV_MAP.layer) return;
  var scale = _ovMapScale();
  _OV_MAP.layer.setStyle(function (f) {
    return { fillColor: scale.fill(_ovMapVal(f.properties.wppnri)) };
  });
  // Label metrik datang dari server. Kalau kunci metrik lokal tidak ada di
  // daftar itu (deploy versi berbeda), _ovMapMetricDef() null — tanpa guard di
  // sini satu TypeError menggagalkan seluruh paint + legenda.
  var def = _ovMapMetricDef(_OV_MAP.metric);
  var defLabel = def && def.label ? def.label : '';
  _OV_MAP.layer.eachLayer(function (l) {
    var kode = l.feature && l.feature.properties ? l.feature.properties.wppnri : '';
    l.setTooltipContent('<strong>' + _ovMapName(kode) + '</strong><br>' +
      defLabel + ': ' + _ovMapVal(kode));
  });
  _ovMapLegend(scale);
}

// Panel ranking: 5 WPP teratas untuk metrik aktif, tersinkron dengan hover peta.
function _ovMapRenderRank() {
  var host = document.getElementById('ov-map-rank');
  if (!host) return;
  var rows = _OV_MAP.data && _OV_MAP.data.rows;
  if (!rows || !Object.keys(rows).length) {
    host.innerHTML = '<div class="ov-map-rank-empty">Belum ada laporan pada periode ini.</div>';
    return;
  }
  var def = _ovMapMetricDef(_OV_MAP.metric);
  var list = Object.keys(rows).map(function (k) {
    return { kode: k, nama: rows[k].nama || ('WPP ' + k), val: Number(rows[k][_OV_MAP.metric]) || 0 };
  }).sort(function (a, b) { return b.val - a.val; }).slice(0, 5);
  var max = list.length ? list[0].val : 0;

  var hd = '<div class="ov-map-rank-hd">5 WPP teratas · ' + (def ? def.label : '') + '</div>';
  hd += '<div class="ov-map-rank-list">' + list.map(function (r, i) {
    var w = max > 0 ? Math.max(2, Math.round(r.val / max * 100)) : 0;
    return '<div class="ov-map-rank-row" data-ov-kode="' + r.kode + '" tabindex="0" role="button" ' +
      'aria-label="' + r.nama + ', ' + r.val + '">' +
      '<span class="ov-map-rank-no">' + (i + 1) + '</span>' +
      '<span class="ov-map-rank-nm">' + r.nama + '</span>' +
      '<span class="ov-map-rank-bar"><i style="width:' + w + '%"></i></span>' +
      '<span class="ov-map-rank-val">' + r.val + '</span></div>';
  }).join('') + '</div>';

  var tw = _OV_MAP.data.tanpaWpp;
  if (tw) {
    hd += '<div class="ov-map-rank-note">' + tw + ' baris laporan tidak mencantumkan WPP ' +
      'dan tidak dipetakan.</div>';
  }
  host.innerHTML = hd;

  host.querySelectorAll('[data-ov-kode]').forEach(function (el) {
    var kode = el.getAttribute('data-ov-kode');
    var focus = function () { _ovMapFocus(kode); };
    el.addEventListener('mouseenter', focus);
    el.addEventListener('focus', focus);
    el.addEventListener('click', function () { _ovMapZoom(kode); });
    el.addEventListener('keydown', function (e) {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); _ovMapZoom(kode); }
    });
  });
}

function _ovMapFindLayer(kode) {
  var found = null;
  if (!_OV_MAP.layer) return null;
  _OV_MAP.layer.eachLayer(function (l) {
    if (found) return;
    var p = l.feature && l.feature.properties;
    if (p && String(p.wppnri).trim() === String(kode).trim()) found = l;
  });
  return found;
}

function _ovMapFocus(kode) {
  var l = _ovMapFindLayer(kode);
  if (!l || !_OV_MAP.layer) return;
  _OV_MAP.layer.eachLayer(function (x) {
    x.setStyle({ weight: String(x.feature.properties.wppnri).trim() === String(kode).trim() ? 2.5 : 1 });
  });
  if (l.bringToFront) l.bringToFront();
}

function _ovMapZoom(kode) {
  var l = _ovMapFindLayer(kode);
  if (!l || !_OV_MAP.map) return;
  try {
    _OV_MAP.map.fitBounds(l.getBounds(), { padding: [28, 28], maxZoom: 7, animate: true });
  } catch (e) { /* geometri tidak valid — biarkan tampilan apa adanya */ }
}

// ── Inisialisasi map (lazy, sekali per masuk view) ───────
function _ovMapInit() {
  var host = document.getElementById('ov-map');
  if (!host) return;
  if (_OV_MAP.map) { try { _OV_MAP.map.invalidateSize(); } catch (e) {} return; }

  _loadLeaflet(function () {
    var h = document.getElementById('ov-map');
    if (!h) return;
    if (_OV_MAP.map) { try { _OV_MAP.map.invalidateSize(); } catch (e) {} return; }
    if (typeof L === 'undefined' || !L.map) return;

    if (h._leaflet_id && !_OV_MAP.map) {
      try { delete h._leaflet_id; } catch (e) {}
    }

    _OV_MAP.map = L.map('ov-map', {
      zoomControl: true,
      scrollWheelZoom: false, center: [-2.5489, 118.0149], zoom: 5
    });
    // Basemap memakai key CARTO_API_KEY yang sudah ada (Script Property,
    // dibaca utils_getCartoKey) — sama persis dengan peta Operasi Laut/Udara.
    // Tidak ada key atau variabel terpisah untuk Ikhtisar. `attributionControl`
    // sengaja ON: OSM/CARTO mewajibkan atribusi tampil, dan legenda kita ada di
    // pojok kiri sedangkan baris atribusi Leaflet di kanan, jadi tidak tumpang.
    _ensureCartoKey(function (key) {
      if (!_OV_MAP.map) return;                 // pindah tab sebelum key tiba
      L.tileLayer(_cartoTileUrl(key), {
        attribution: '&copy; OpenStreetMap contributors &copy; CARTO',
        subdomains: 'abcd', maxZoom: 20
      }).addTo(_OV_MAP.map);
    });

    _ovMapLoadGeo();
    _ovMapRenderFleetMarkers();

    setTimeout(function () {
      if (_OV_MAP.map) {
        try { _OV_MAP.map.invalidateSize(); } catch (e) {}
      }
    }, 200);
  });
}

// ── Chip Filter Status Armada Kapal (Fase 18) ─────────────
function _ovMapRenderFleetChips() {
  var host = document.getElementById('ov-fleet-filter-bar');
  if (!host) return;
  var fleet = (_OV_MAP.data && _OV_MAP.data.fleet) || [];
  var total = fleet.length;
  var opCount = 0, siapCount = 0, galCount = 0;
  fleet.forEach(function (k) {
    if (k.status === 'OPERASIONAL') opCount++;
    else if (k.status === 'SIAP_PANGKALAN') siapCount++;
    else if (k.status === 'GALANGAN') galCount++;
  });

  var filters = [
    { key: 'ALL', label: 'Semua Armada (' + total + ')' },
    { key: 'OPERASIONAL', label: 'Operasional (' + opCount + ')' },
    { key: 'SIAP_PANGKALAN', label: 'Siap Pangkalan (' + siapCount + ')' },
    { key: 'GALANGAN', label: 'Galangan (' + galCount + ')' }
  ];

  host.innerHTML = filters.map(function (f) {
    var on = (_OV_MAP.fleetFilter || 'ALL') === f.key;
    return '<button type="button" class="ov-fleet-chip' + (on ? ' is-on' : '') + '"' +
      ' data-fleet-filter="' + f.key + '" aria-pressed="' + (on ? 'true' : 'false') + '">' +
      _esc(f.label) + '</button>';
  }).join('');

  host.querySelectorAll('[data-fleet-filter]').forEach(function (b) {
    b.addEventListener('click', function () {
      var k = b.getAttribute('data-fleet-filter');
      if (!k || k === _OV_MAP.fleetFilter) return;
      _OV_MAP.fleetFilter = k;
      _ovMapRenderFleetChips();
      _ovMapRenderFleetMarkers();
    });
  });
}

// ── Render Marker 34 Kapal Pengawas Ukuran Besar (Fase 18) ──
function _ovMapRenderFleetMarkers() {
  if (!_OV_MAP.map) return;
  if (!_OV_MAP.fleetLayer) {
    _OV_MAP.fleetLayer = L.layerGroup().addTo(_OV_MAP.map);
  } else {
    _OV_MAP.fleetLayer.clearLayers();
  }

  var fleet = (_OV_MAP.data && _OV_MAP.data.fleet) || [];
  var activeFilter = _OV_MAP.fleetFilter || 'ALL';

  fleet.forEach(function (k) {
    if (activeFilter !== 'ALL' && k.status !== activeFilter) return;
    if (k.lat == null || k.lng == null) return;

    var isOp = k.status === 'OPERASIONAL';
    var isSiap = k.status === 'SIAP_PANGKALAN';
    var statusCls = isOp ? 'status-op' : (isSiap ? 'status-siap' : 'status-galangan');
    var pulseHtml = isOp ? '<span class="ship-beacon-pulse"></span>' : '';

    var iconHtml =
      '<div class="ship-marker ' + statusCls + '">' +
        pulseHtml +
        '<span class="ship-marker-dot"></span>' +
        '<span class="ship-marker-lbl">' + _esc(k.nama.replace('KP. ', '')) + '</span>' +
      '</div>';

    var icon = L.divIcon({
      className: 'ship-marker-wrap',
      html: iconHtml,
      iconSize: [84, 26],
      iconAnchor: [42, 13]
    });

    var marker = L.marker([k.lat, k.lng], { icon: icon });

    var badgeText = isOp ? 'Operasional di Laut' : (isSiap ? 'Siap di Pangkalan' : 'Pemeliharaan di Galangan');
    var badgeStyle = isOp ? 'background:rgba(16,185,129,0.12);color:#059669;' :
      (isSiap ? 'background:rgba(245,158,11,0.12);color:#D97706;' : 'background:rgba(239,68,68,0.12);color:#DC2626;');

    var pctNas = Math.min(k.pctNasional || Math.round((k.hariOperasi / 44) * 100), 100);
    var pctPus = Math.min(k.pctPusat || Math.round((k.hariOperasi / 49) * 100), 100);

    var popupHtml =
      '<div class="ship-popover">' +
        '<div class="ship-pop-hd">' +
          '<span class="ship-pop-badge" style="' + badgeStyle + '">' + badgeText + '</span>' +
          '<div class="ship-pop-name">' + _esc(k.nama) + '</div>' +
          '<div class="ship-pop-sub">Kelas ' + _esc(k.kelas || '—') + ' &bull; WPP ' + _esc(k.wpp || '—') + '</div>' +
        '</div>' +
        '<div class="ship-pop-body">' +
          '<div class="ship-pop-row"><span class="ship-pop-lbl">Posisi Koordinat</span><span class="ship-pop-val table-num font-mono">' + (k.lat != null ? k.lat.toFixed(4) : '—') + '&deg;, ' + (k.lng != null ? k.lng.toFixed(4) : '—') + '&deg;</span></div>' +
          '<div class="ship-pop-row"><span class="ship-pop-lbl">Komandan</span><span class="ship-pop-val font-semibold">' + _esc(k.komandan || '—') + '</span></div>' +
          '<div class="ship-pop-row"><span class="ship-pop-lbl">Pangkalan</span><span class="ship-pop-val">' + _esc(k.pangkalan || '—') + '</span></div>' +
          '<div class="ship-pop-row"><span class="ship-pop-lbl">Hari Layar Kumulatif</span><span class="ship-pop-val"><strong>' + k.hariOperasi + '</strong> hari</span></div>' +
          '<div class="ship-pop-benchmark">' +
            '<div class="ship-bm-row"><span>vs Rerata Nasional (44 hr)</span><span class="table-num">' + (k.pctNasional || Math.round((k.hariOperasi / 44) * 100)) + '%</span></div>' +
            '<div class="ship-bm-bar"><div class="ship-bm-fill" style="width:' + pctNas + '%;"></div></div>' +
            '<div class="ship-bm-row"><span>vs Rerata Pusat (49 hr)</span><span class="table-num">' + (k.pctPusat || Math.round((k.hariOperasi / 49) * 100)) + '%</span></div>' +
            '<div class="ship-bm-bar"><div class="ship-bm-fill ship-bm-center" style="width:' + pctPus + '%;"></div></div>' +
          '</div>' +
        '</div>' +
        '<div class="ship-pop-ft">' +
          '<button type="button" class="btn-sm btn-sm-ghost" onclick="_openProfilKapal(\'' + _esc(k.id) + '\')">Buka Profil Kapal &rarr;</button>' +
        '</div>' +
      '</div>';

    marker.bindPopup(popupHtml, { maxWidth: 280, className: 'n-leaflet-pop' });
    _OV_MAP.fleetLayer.addLayer(marker);
  });
}

// Pemuatan geometri dipisah dari pembuatan map supaya tombol "coba lagi"
// benar-benar mengulang fetch. Kalau retry diarahkan ke _ovMapInit(), map sudah
// ada sehingga fungsi itu return di baris guard — retry jadi tidak melakukan
// apa-apa tanpa pesan apa pun.
function _ovMapLoadGeo() {
  if (!_OV_MAP.map) return;                   // pindah tab saat unduhan berjalan
  _opsMapStatus('ov-map', 'loading');
  _opsGetGeoData(function (geoData, err) {
    if (!_OV_MAP.map) return;
    if (err) { _opsMapStatus('ov-map', 'error', err, _ovMapLoadGeo); return; }
    var scale = _ovMapScale();
    _OV_MAP.layer = L.geoJSON(geoData, {
      style: function (f) {
        return {
          fillColor: scale.fill(_ovMapVal(f.properties.wppnri)),
          fillOpacity: 0.85, weight: 1, opacity: 1, color: _OV_MAP_RAMP_LINE
        };
      },
      onEachFeature: function (feature, layer) {
        var kode = feature.properties.wppnri;
        layer.bindTooltip('<strong>' + _ovMapName(kode) + '</strong><br>' +
          (_ovMapMetricDef(_OV_MAP.metric) ? _ovMapMetricDef(_OV_MAP.metric).label : '') +
          ': ' + _ovMapVal(kode), { sticky: true });
      }
    }).addTo(_OV_MAP.map);
    _opsMapStatus('ov-map', null);
    _ovMapLegend(scale);
    setTimeout(function () {
      if (_OV_MAP.map) {
        try { _OV_MAP.map.invalidateSize(); } catch (e) {}
      }
    }, 150);
  });
}

// Teardown saat pindah tab — map Leaflet yang menempel ke container yang sudah
// dihapus akan tampil kosong.
function _ovMapDestroy() {
  if (_OV_MAP.fleetLayer) {
    try { _OV_MAP.fleetLayer.clearLayers(); } catch (e) {}
    _OV_MAP.fleetLayer = null;
  }
  if (_OV_MAP.map) { try { _OV_MAP.map.remove(); } catch (e) {} }
  _OV_MAP.map = null;
  _OV_MAP.layer = null;
  var host = document.getElementById('ov-map');
  if (host && host._leaflet_id) {
    try { delete host._leaflet_id; } catch (e) {}
  }
}

// Dipanggil setelah payload overview tiba.
function _ovMapLoad(payload) {
  _ovMapDestroy();
  if (!payload) return;
  _OV_MAP.data = payload;
  _ovMapRenderChips();
  _ovMapRenderFleetChips();
  _ovMapRenderRank();
  _ovMapInit();
}

// ── APPROVAL MANAGEMENT ───────────────────────────────────
// Parametrik agar bisa dipakai pada halaman "Kelola Akun" dan
// panel geser kanan (banner KADIV/approver) tanpa duplikasi.
// id default: ka-* → halaman Kelola Akun; dr-* → drawer kanan.
var APPROVAL_WRAPS = [
  { wrapId: 'ka-approval-table-wrap', msgId: 'ka-approval-msg' },
  { wrapId: 'dr-approval-table-wrap', msgId: 'dr-approval-msg' }
];

function _appActiveWraps() {
  var out = [];
  for (var i = 0; i < APPROVAL_WRAPS.length; i++) {
    var w = APPROVAL_WRAPS[i];
    if (document.getElementById(w.wrapId)) out.push(w);
  }
  return out;
}

function _loadApprovals() {
  var act = _appActiveWraps();
  if (act.length === 0) return;
  var firstWrap = document.getElementById(act[0].wrapId);
  if (firstWrap) firstWrap.innerHTML = _loadingInline('Memuat permintaan registrasi\u2026');

  google.script.run
    .withSuccessHandler(function (res) {
      if (!res || !res.success) { _appMsg('error', (res && res.error) || 'Gagal memuat data.'); return; }
      _renderApprovalTable(res.data);
    })
    .withFailureHandler(function () { _appMsg('error', 'Gagal memuat data.'); })
    .auth_getPendingApprovals(APP.token);
}

// Reload seluruh panel approval yang sedang tampil (halaman + drawer).
function _refreshApprovalPanels() { _loadApprovals(); }

function _appMsg(type, text) {
  var act = _appActiveWraps();
  if (act.length === 0) return;
  var el = document.getElementById(act[0].msgId);
  if (!el) return;
  el.className = 'n-msg ' + type + ' show';
  el.textContent = text;
}

function _renderApprovalTable(items) {
  var act = _appActiveWraps();
  if (act.length === 0) return;

  for (var w = 0; w < act.length; w++) {
    var wrap = document.getElementById(act[w].wrapId);
    if (!wrap) continue;

    if (!items || items.length === 0) {
      wrap.innerHTML = '<div style="color:var(--n-text-muted);font-size:.875rem;padding:8px 0;">Tidak ada permintaan yang menunggu persetujuan.</div>';
      continue;
    }

    var rows = items.map(function (it) {
      var d = it.registeredAt ? new Date(it.registeredAt).toLocaleDateString('id-ID') : '-';
      return '<tr>' +
        '<td>' + _esc(it.nama) +
          '<br><span style="font-size:.8rem;color:var(--n-text-muted);">' + _esc(it.email) + '</span></td>' +
        '<td>' + _esc(it.namaDivisi || '-') + '</td>' +
        '<td>' + (it.roleDilamar === 'KADIV' ? 'Kepala Divisi / Ketua Tim Kerja' : 'Staf') + '</td>' +
        '<td>' + d + '</td>' +
        '<td><div class="ctl-row ctl-sm ctl-nowrap">' +
          '<button class="btn-primary" onclick="doApprove(\'' + _esc(it.queueId) + '\')">Setujui</button>' +
          '<button class="btn-danger"  onclick="openRejectModal(\'' + _esc(it.queueId) + '\')">Tolak</button>' +
        '</div></td>' +
      '</tr>';
    }).join('');

    wrap.innerHTML =
      '<table class="n-table">' +
        '<thead><tr><th>Nama</th><th>Unit Kerja</th><th>Jabatan</th><th>Tgl Daftar</th><th>Tindakan</th></tr></thead>' +
        '<tbody>' + rows + '</tbody>' +
      '</table>';
  }
}

function doApprove(queueId) {
  if (!confirm('Setujui registrasi ini?')) return;
  google.script.run
    .withSuccessHandler(function (res) {
      if (!res || !res.success) { _appMsg('error', (res && res.error) || 'Terjadi kesalahan.'); return; }
      _appMsg('success', 'Registrasi berhasil disetujui.');
      _loadApprovals();
      _applyShellStatus();
    })
    .withFailureHandler(function () { _appMsg('error', 'Terjadi kesalahan. Coba lagi.'); })
    .auth_decideApproval({ token: APP.token, queueId: queueId, approve: true, alasan: '' });
}

function openRejectModal(queueId) {
  APP.pendingQueueId = queueId;
  document.getElementById('reject-reason').value = '';
  document.getElementById('modal-reject').classList.remove('n-hidden');
}
function closeRejectModal() {
  APP.pendingQueueId = null;
  document.getElementById('modal-reject').classList.add('n-hidden');
}

document.addEventListener('DOMContentLoaded', function () {
  var btnConfirm = document.getElementById('btn-confirm-reject');
  if (!btnConfirm) return;
  btnConfirm.addEventListener('click', function () {
    var alasan = document.getElementById('reject-reason').value.trim();
    if (!alasan) { alert('Alasan penolakan wajib diisi.'); return; }
    google.script.run
      .withSuccessHandler(function (res) {
        closeRejectModal();
        if (!res || !res.success) { _appMsg('error', (res && res.error) || 'Terjadi kesalahan.'); return; }
        _appMsg('success', 'Registrasi berhasil ditolak.');
        _loadApprovals();
        _applyShellStatus();
      })
      .withFailureHandler(function () {
        closeRejectModal();
        _appMsg('error', 'Terjadi kesalahan. Coba lagi.');
      })
      .auth_decideApproval({ token: APP.token, queueId: APP.pendingQueueId, approve: false, alasan: alasan });
  });
});

// ── MODULE STUBS ──────────────────────────────────────────
function _moduleStub(title) {
  return '<div class="module-stub">' +
    '<div class="module-stub-title">' + _esc(title) + '</div>' +

function _renderMasterData(el) {

// ── ADMIN PANEL — persetujuan + pengguna + audit log (Fase 13) ──
// Menu "Admin Panel" (SUPERADMIN/DIREKTUR). Tab Pengguna & Audit Log hanya
// ditampilkan untuk SUPERADMIN (server juga menolak non-SUPERADMIN).
// APP_mWraps() dipakai: ka-* di sini; dr-* di-drawer kanan.
var _ADN = { tab: 'persetujuan', users: [], audit: [], userFormId: null, divisi: [] };

function _renderKelolaAkun(el) {
  var tpl = document.getElementById('view-tpl-kelola-akun');
  if (!tpl) { el.innerHTML = _moduleStub('Admin Panel'); return; }
  el.innerHTML = tpl.innerHTML;

  var isSA = (APP.user && APP.user.role === 'SUPERADMIN');
  var tabPengguna = document.getElementById('adn-tab-pengguna');
  var tabAudit = document.getElementById('adn-tab-audit');
  var tabReminder = document.getElementById('adn-tab-reminder');
  if (tabPengguna) {
    if (isSA) tabPengguna.removeAttribute('hidden'); else tabPengguna.setAttribute('hidden', '');
  }
  if (tabAudit) {
    if (isSA) tabAudit.removeAttribute('hidden'); else tabAudit.setAttribute('hidden', '');
  }
  if (tabReminder) {
    if (isSA) tabReminder.removeAttribute('hidden'); else tabReminder.setAttribute('hidden', '');
  }

  _ADN.tab = 'persetujuan';
  _ADN.users = [];
  _ADN.audit = [];
  _ADN.userFormId = null;
  _adnSyncTabs();
  _renderApprovalsInto('ka');
}

function _adnSyncTabs() {
  var tabs = document.querySelectorAll('#adn-tabs .n-tab');
  for (var i = 0; i < tabs.length; i++) {
    tabs[i].classList.toggle('active', tabs[i].getAttribute('data-tab') === _ADN.tab);
  }
  var panels = {
    persetujuan: 'adn-panel-persetujuan',
    pengguna: 'adn-panel-pengguna',
    audit: 'adn-panel-audit',
    reminder: 'adn-panel-reminder'
  };
  Object.keys(panels).forEach(function (k) {
    var el = document.getElementById(panels[k]);
    if (el) el.hidden = (k !== _ADN.tab);
  });
}

function _adnSwitch(tab) {
  // Guard client-side; server tetap menolak role non-SUPERADMIN (assertScope).
  if (tab !== 'persetujuan' && !(APP.user && APP.user.role === 'SUPERADMIN')) return;
  _ADN.tab = tab;
  _adnSyncTabs();
  if (tab === 'pengguna') { _adnLoadUsers(); _adnLoadDivisi(); }
  if (tab === 'audit') _adnLoadAudit();
  if (tab === 'reminder') _adnLoadReminder();
}

function _adnGoMasterData() { _routeTo('master-data'); }

// ── TAB PENGGUNA ───────────────────────────────────────────
function _adnStatusBadge(st) {
  if (st === 'APPROVED') return '<span class="status-badge" style="background:#ecfdf5;color:#047857;">AKTIF</span>';
  if (st === 'PENDING')  return '<span class="status-badge" style="background:var(--n-primary-light);color:var(--n-primary);">MENUNGGU</span>';
  if (st === 'REJECTED') return '<span class="status-badge" style="background:#fee2e2;color:var(--n-status-critical);">DITOLAK</span>';
  if (st === 'NONAKTIF') return '<span class="status-badge" style="background:#f3f4f6;color:#374151;">NONAKTIF</span>';
  return _esc(st || '—');
}

function _adnLoadUsers() {
  var wrap = document.getElementById('adn-users-wrap');
  if (!wrap) return;
  wrap.innerHTML = _loadingInline('Memuat daftar pengguna\u2026');
  _msg('adn-users-msg', null);
  _asyncArm('adn-users', wrap, '_adnLoadUsers()');

  google.script.run
    .withSuccessHandler(function (res) {
      _asyncDisarm('adn-users');
      if (_asyncResErr(res)) {
        _asyncResFail('adn-users', wrap, res, '_adnLoadUsers()');
        return;
      }
      try {
        _ADN.users = res.data || [];
        _adnRenderUsers();
      } catch (e) {
        _asyncRenderFail('adn-users', wrap, e);
      }
    })
    .withFailureHandler(function (err) {
      _asyncDisarm('adn-users');
      wrap.innerHTML = '<div class="n-msg error">' + _esc(_failOrLogout(err) || 'Koneksi terputus.') + '</div>';
    })
    .admin_getUsers(APP.token);
}

function _adnRenderUsers() {
  var wrap = document.getElementById('adn-users-wrap');
  if (!wrap) return;

  if (_ADN.users.length === 0) {
    wrap.innerHTML = '<div class="n-pad-muted">Belum ada pengguna.</div>';
    return;
  }

  var t = '<table class="n-table n-table-full"><thead><tr>' +
    '<th>Nama</th><th>Unit Kerja</th><th>Jabatan</th><th>Status</th><th>Tgl Daftar</th><th>Aksi</th>' +
    '</tr></thead><tbody>';

  for (var i = 0; i < _ADN.users.length; i++) {
    var u = _ADN.users[i];
    var roleLabel = ROLE_LABEL[u.role] || u.role;
    var isSelf = (APP.user && String(APP.user.userId) === String(u.userId));
    t += '<tr>' +
      '<td>' + _esc(u.nama) +
        '<br><span style="font-size:.8rem;color:var(--n-text-muted);">' +
          _esc(u.nip ? 'NIP ' + u.nip + ' · ' : '') + _esc(u.email) + '</span></td>' +
      '<td>' + _esc(u.namaDivisi) + '</td>' +
      '<td>' + _esc(roleLabel) + '</td>' +
      '<td>' + _adnStatusBadge(u.status) + '</td>' +
      '<td>' + _esc(_adnFmtDate(u.registeredAt)) + '</td>' +
      '<td>' +
        (isSelf
          ? '<span style="font-size:.8rem;color:var(--n-text-muted);">Akun Anda</span>'
          : '<button class="btn-mini" onclick="_adnOpenEdit(\'' + _esc(u.userId) + '\')">Kelola</button>') +
      '</td></tr>';
  }

  t += '</tbody></table>';
  wrap.innerHTML = t;
}

function _adnFmtDate(v) {
  if (!v) return '—';
  var d = new Date(v);
  if (isNaN(d.getTime())) return '—';
  return d.toLocaleDateString('id-ID');
}

function _adnLoadDivisi() {
  if (_ADN.divisi.length > 0) return;
  google.script.run
    .withSuccessHandler(function (res) {
      if (res.success) {
        _ADN.divisi = res.data || [];
        // Form mungkin sudah dibuka sebelum daftar divisi tiba.
        if (_ADN.userFormId) _adnFillDivisi(_ADN.userFormId);
      }
    })
    .withFailureHandler(function () {})
    .auth_getDivisiList();
}

// Isi dropdown Unit Kerja; selected = UserID agar pilihan awal ikut ter-restore.
function _adnFillDivisi(selectedUserId) {
  var sel = document.getElementById('adn-f-divisi');
  if (!sel) return;
  var u = selectedUserId ? _adnFindUser(selectedUserId) : null;
  var current = u ? String(u.divisiId || '') : '';
  sel.innerHTML = '<option value="">— Lintas Divisi —</option>' + _ADN.divisi.map(function (d) {
    return '<option value="' + _esc(d.divisiId) + '"' + (d.divisiId === current ? ' selected' : '') + '>' +
      _esc(d.namaDashboard) + '</option>';
  }).join('');
  if (!_ADN.divisi.length) {
    sel.innerHTML = '<option value="">Memuat unit kerja…</option>';
  }
}

// ── FORM KELOLA AKUN (modal) ───────────────────────────────
function _adnFindUser(userId) {
  for (var i = 0; i < _ADN.users.length; i++) {
    if (String(_ADN.users[i].userId) === String(userId)) return _ADN.users[i];
  }
  return null;
}

function _adnOpenEdit(userId) {
  var u = _adnFindUser(userId);
  if (!u) return;
  _ADN.userFormId = userId;

  var roleOpts = ['SUPERADMIN', 'DIREKTUR', 'KADIV', 'STAF'].map(function (r) {
    return '<option value="' + r + '"' + (r === u.role ? ' selected' : '') + '>' + _esc(ROLE_LABEL[r] || r) + '</option>';
  }).join('');

  var statusOpts = ['APPROVED', 'REJECTED', 'NONAKTIF'].map(function (s) {
    var label = s === 'APPROVED' ? 'Aktif' : (s === 'REJECTED' ? 'Ditolak' : 'Nonaktif');
    return '<option value="' + s + '"' + (s === u.status ? ' selected' : '') + '>' + label + '</option>';
  }).join('');

  document.getElementById('adn-form-title').textContent = 'Kelola Akun — ' + u.nama;
  document.getElementById('adn-f-nama').textContent = u.nama;
  document.getElementById('adn-f-email').textContent = u.email;
  document.getElementById('adn-f-role').innerHTML = roleOpts;
  document.getElementById('adn-f-status').innerHTML = statusOpts;
  document.getElementById('adn-f-password').value = '';
  _msg('adn-form-msg', null);
  // Dropdown unit kerja butuh daftar divisi; kalau belum tiba, placeholder dulu.
  _adnFillDivisi(userId);
  _adnLoadDivisi();
  document.getElementById('modal-admin-user').classList.remove('n-hidden');
  _adnOnRoleChange();
}

function _adnOnRoleChange() {
  var role = document.getElementById('adn-f-role').value;
  var divisi = document.getElementById('adn-f-divisi');
  if (role === 'SUPERADMIN' || role === 'DIREKTUR') {
    divisi.value = '';
    divisi.disabled = true;
  } else {
    divisi.disabled = false;
  }
}

function _adnCloseForm() {
  document.getElementById('modal-admin-user').classList.add('n-hidden');
  _ADN.userFormId = null;
}

function _adnSaveUser() {
  var userId = _ADN.userFormId;
  if (!userId) return;
  var params = {
    userId:   userId,
    role:     document.getElementById('adn-f-role').value,
    divisiId: document.getElementById('adn-f-divisi').value,
    status:   document.getElementById('adn-f-status').value
  };

  var btn = document.getElementById('btn-adn-save');
  _setLoading(btn, true);
  google.script.run
    .withSuccessHandler(function (res) {
      _setLoading(btn, false);
      if (!res.success) { _msg('adn-form-msg', 'error', res.error); return; }
      _adnCloseForm();
      _msg('adn-users-msg', 'success', (res.data.changes || []).join('; ') || 'Tidak ada perubahan.');
      _adnLoadUsers();
    })
    .withFailureHandler(function (err) {
      _setLoading(btn, false);
      _msg('adn-form-msg', 'error', _failOrLogout(err) || 'Terjadi kesalahan. Coba lagi.');
    })
    .admin_updateUser(APP.token, params);
}

function _adnResetPassword() {
  var userId = _ADN.userFormId;
  if (!userId) return;
  var pass = document.getElementById('adn-f-password').value;
  if (pass.length < 8) { _msg('adn-form-msg', 'error', 'Password minimal 8 karakter.'); return; }
  if (!confirm('Setel ulang password akun ini? Password lama tidak berlaku lagi.')) return;

  var btn = document.getElementById('btn-adn-reset');
  _setLoading(btn, true);
  google.script.run
    .withSuccessHandler(function (res) {
      _setLoading(btn, false);
      if (!res.success) { _msg('adn-form-msg', 'error', res.error); return; }
      document.getElementById('adn-f-password').value = '';
      _msg('adn-form-msg', 'success', 'Password berhasil disetel ulang. Sampaikan password baru ke pengguna secara aman.');
    })
    .withFailureHandler(function (err) {
      _setLoading(btn, false);
      _msg('adn-form-msg', 'error', _failOrLogout(err) || 'Terjadi kesalahan. Coba lagi.');
    })
    .admin_resetPassword(APP.token, { userId: userId, newPassword: pass });
}

// ── TAB AUDIT LOG ──────────────────────────────────────────
function _adnLoadAudit() {
  var wrap = document.getElementById('adn-audit-wrap');
  if (!wrap) return;
  wrap.innerHTML = _loadingInline('Memuat jejak audit\u2026');
  _msg('adn-audit-msg', null);
  _asyncArm('adn-audit', wrap, '_adnReloadAudit()');

  google.script.run
    .withSuccessHandler(function (res) {
      _asyncDisarm('adn-audit');
      if (_asyncResErr(res)) {
        _asyncResFail('adn-audit', wrap, res, '_adnReloadAudit()');
        return;
      }
      try {
        _ADN.audit = res.data || [];
        _adnRenderAudit();
      } catch (e) {
        _asyncRenderFail('adn-audit', wrap, e);
      }
    })
    .withFailureHandler(function (err) {
      _asyncDisarm('adn-audit');
      wrap.innerHTML = '<div class="n-msg error">' + _esc(_failOrLogout(err) || 'Koneksi terputus.') + '</div>';
    })
    .admin_getAuditLog(APP.token, { limit: 300 });
}

function _adnReloadAudit() { _ADN.audit = []; _adnLoadAudit(); }

function _adnRenderAudit() {
  var wrap = document.getElementById('adn-audit-wrap');
  if (!wrap) return;

  if (_ADN.audit.length === 0) {
    wrap.innerHTML = '<div class="n-pad-muted">Belum ada jejak audit.</div>';
    return;
  }

  var t = '<table class="n-table n-table-full"><thead><tr>' +
    '<th>Waktu</th><th>Pelaku</th><th>Aksi</th><th>Target</th><th>Keterangan</th>' +
    '</tr></thead><tbody>';

  for (var i = 0; i < _ADN.audit.length; i++) {
    var r = _ADN.audit[i];
    t += '<tr>' +
      '<td style="white-space:nowrap;">' + _esc(_adnFmtDateTime(r.timestamp)) + '</td>' +
      '<td>' + _esc(r.userName) +
        '<br><span style="font-size:.8rem;color:var(--n-text-muted);">' + _esc(ROLE_LABEL[r.userRole] || r.userRole || '—') + '</span></td>' +
      '<td>' + _esc(r.aksi) + '</td>' +
      '<td>' + _esc(r.sheetTarget || '—') +
        (r.rowIdTarget ? '<br><span style="font-size:.8rem;color:var(--n-text-muted);">' + _esc(r.rowIdTarget) + '</span>' : '') + '</td>' +
      '<td>' + _esc(r.alasan || '—') + '</td>' +
      '</tr>';
  }

  t += '</tbody></table>';
  wrap.innerHTML = t;
}

function _adnFmtDateTime(v) {
  if (!v) return '—';
  var d = new Date(v);
  if (isNaN(d.getTime())) return '—';
  return d.toLocaleString('id-ID');
}

// ── TAB PENGINGAT MINGGUAN (SUPERADMIN) ───────────────────
function _adnLoadReminder() {
  var statusEl = document.getElementById('adn-reminder-status');
  if (statusEl) statusEl.textContent = 'Memuat…';
  _msg('adn-reminder-msg', null);
  _asyncArm('adn-reminder', statusEl, '_adnLoadReminder()');

  google.script.run
    .withSuccessHandler(function (res) {
      _asyncDisarm('adn-reminder');
      if (_asyncResErr(res)) {
        if (statusEl) statusEl.textContent = _asyncResErr(res);
        return;
      }
      try {
        _adnRenderReminder(res.data);
      } catch (e) {
        _asyncDisarm('adn-reminder');
        if (window.console && console.error) console.error('[nautika] render gagal: reminder', e);
        if (statusEl) statusEl.textContent = 'Gagal menampilkan status: ' +
          (e && e.message ? e.message : String(e));
      }
    })
    .withFailureHandler(function (err) {
      _asyncDisarm('adn-reminder');
      if (statusEl) statusEl.textContent = _failOrLogout(err) || 'Koneksi terputus.';
    })
    .notifikasi_getReminderSettings(APP.token);
}

function _adnRenderReminder(data) {
  var statusEl = document.getElementById('adn-reminder-status');
  var btn = document.getElementById('btn-adn-reminder-toggle');
  if (statusEl) {
    statusEl.textContent = (data && data.aktif)
      ? 'Aktif — dikirim otomatis setiap ' + data.jadwal
      : 'Nonaktif — belum ada pengiriman otomatis. Jadwal: ' + (data ? data.jadwal : 'Jumat 16:00');
  }
  if (btn) {
    btn.textContent = (data && data.aktif) ? 'Matikan Otomatis' : 'Aktifkan Otomatis';
    btn._aktif = !!(data && data.aktif);
  }
}

function _adnToggleReminder() {
  var btn = document.getElementById('btn-adn-reminder-toggle');
  var next = !(btn && btn._aktif);
  _setLoading(btn, true);
  google.script.run
    .withSuccessHandler(function (res) {
      _setLoading(btn, false);
      if (!res.success) { _msg('adn-reminder-msg', 'error', res.error); return; }
      _adnRenderReminder(res.data);
      _msg('adn-reminder-msg', 'success', next ? 'Pengiriman otomatis diaktifkan.' : 'Pengiriman otomatis dimatikan.');
    })
    .withFailureHandler(function (err) {
      _setLoading(btn, false);
      _msg('adn-reminder-msg', 'error', _failOrLogout(err) || 'Terjadi kesalahan. Coba lagi.');
    })
    .notifikasi_setReminderAktif(APP.token, next);
}

function _adnSendReminderNow() {
  if (!confirm('Kirim pengingat sekarang ke divisi yang belum melapor?')) return;
  var btn = document.getElementById('btn-adn-reminder-send');
  _setLoading(btn, true);
  _msg('adn-reminder-msg', null);
  var box = document.getElementById('adn-reminder-result');
  if (box) box.innerHTML = '';

  google.script.run
    .withSuccessHandler(function (res) {
      _setLoading(btn, false);
      if (!res.success) { _msg('adn-reminder-msg', 'error', res.error); return; }
      _msg('adn-reminder-msg', 'success', 'Pengingat dikirim.');
      if (box) box.innerHTML = _adnReminderResult(res.data);
    })
    .withFailureHandler(function (err) {
      _setLoading(btn, false);
      _msg('adn-reminder-msg', 'error', _failOrLogout(err) || 'Terjadi kesalahan. Coba lagi.');
    })
    .notifikasi_generateReminderMingguan(APP.token);
}

function _adnReminderResult(d) {
  if (!d) return '';
  if (!d.divisions || d.divisions.length === 0) {
    return '<div class="n-card"><div class="n-pad-muted" style="padding:0;">' +
      'Semua divisi sudah melapor minggu ini (' + _esc(d.periode || '') + '). Tidak ada pengingat yang dikirim.</div></div>';
  }
  var rows = d.divisions.map(function (x) {
    return '<tr><td>' + _esc(x.label) + '</td><td>' + x.targetCount + '</td></tr>';
  }).join('');
  // Kegagalan email tidak boleh terlihat seperti "tidak ada yang perlu dikirim".
  var errBlock = '';
  if (d.emailErrors && d.emailErrors.length) {
    var errRows = d.emailErrors.map(function (e) {
      return '<tr><td>' + _esc(e.email || '?') + '</td><td>' + _esc(e.reason || 'Gagal.') + '</td></tr>';
    }).join('');
    errBlock = '<div style="margin-top:12px">' +
      '<div class="n-msg error" style="margin:0 0 8px">' +
      d.emailErrors.length + ' email gagal terkirim. Notifikasi dalam aplikasi tetap masuk.</div>' +
      '<table class="n-table n-table-full"><thead><tr><th>Penerima</th><th>Penyebab</th></tr></thead>' +
      '<tbody>' + errRows + '</tbody></table></div>';
  }
  return '<div class="n-card" style="padding:0;overflow:hidden">' +
    '<div class="content-section-hd" style="padding:14px 20px;border-bottom:1px solid var(--n-border-subtle);">Ringkasan Periode ' + _esc(d.periode || '') + '</div>' +
    '<table class="n-table n-table-full"><thead><tr><th>Divisi Belum Melapor</th><th>Penerima</th></tr></thead><tbody>' + rows + '</tbody></table>' +
    '<div class="n-pad-muted">Email terkirim: ' + d.sentEmails + ' · notifikasi aplikasi: ' + d.notified + '</div>' +
    errBlock +
    '</div>';
}

// Render antrean ke salah satu grup APPROVAL_WRAPS (ka/dr).

function _renderApprovalsInto(grp) {

var _MD = {
