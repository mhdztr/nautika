// ── KPI ───────────────────────────────────────────────────

function _logLoadKPI() {
  var strip = document.getElementById('log-kpi-strip');
  if (strip) strip.innerHTML = _kpiSkeleton(4);

  google.script.run
    .withSuccessHandler(function (res) {
      if (!res.success) { _msg('lga-history-msg', 'error', res.error); return; }
      _LOG.kpi = res.data;
      _logRenderKPI(res.data);
      _logBuildCharts();
      _logBuildPaneCharts();
    })
    .withFailureHandler(function () {
      var s = document.getElementById('log-kpi-strip');
      if (s) s.innerHTML = '<div class="n-msg error show">Gagal memuat KPI Logistik.</div>';
    })
    .logistik_getKPI(APP.token, APP.filter);
}

function _logRenderKPI(d) {
  var el = document.getElementById('log-kpi-strip');
  if (!el) return;
  el.innerHTML =
    '<div class="ov-kpi-row">' +
      _kpiHeadline('Stok Akhir Amunisi', _idNum(d.totalStokAkhir), 'tembakan', d.amunisi.length + ' jenis terpantau') +
      _kpiHeadline('Realisasi BBM', _idNum(d.totalBBMRealisasi), 'liter', 'Kumulatif tahun berjalan') +
      _kpiHeadline('Sisa Pagu BBM', _idNum(d.totalBBMSisa), 'liter', 'Pagu dikurangi realisasi') +
      _kpiHeadline('Logistik Personil', _rupiah(d.totalPersonil), '', 'Jumlah dalam rentang filter') +
    '</div>';
}

// ── CHARTS ────────────────────────────────────────────────

function _logDestroyPaneCharts() {
  _chartDestroy('lga-chart-donut');
  _chartDestroy('lgb-chart-pct');
  _chartDestroy('lgp-chart-komponen');
}

function _logBuildCharts() {
  var k = _LOG.kpi;
  if (!k) return;

  // Stok akhir amunisi per jenis (ranking horizontal)
  _chartBar('log-chart-stok',
    k.amunisi.map(function (x) { return x.jenis; }),
    [{ label: 'Stok Akhir', data: k.amunisi.map(function (x) { return x.stokAkhir; }), color: _CHART_COLORS.primary }],
    { horizontal: true, fmt: _chartNum, emptyMsg: 'Belum ada baseline amunisi pada tahun berjalan.' }
  );

  _logLoadTren();
}

function _logLoadTren() {
  google.script.run
    .withSuccessHandler(function (res) {
      if (!res.success) return;
      var d = res.data;
      var labels = d.months.map(function (m) { return _chartMonthLabel(m); });
      var amTot = d.months.map(function (_, i) {
        return Object.keys(d.amunisi).reduce(function (s, j) { return s + (d.amunisi[j][i] || 0); }, 0);
      });
      var bbTot = d.months.map(function (_, i) {
        return Object.keys(d.bbm).reduce(function (s, j) { return s + (d.bbm[j][i] || 0); }, 0);
      });
      _chartLine('log-chart-tren', labels, [
        { label: 'Penggunaan Amunisi', data: amTot, color: _CHART_COLORS.primary },
        { label: 'Realisasi BBM',       data: bbTot, color: _CHART_COLORS.warn }
      ], { fmt: _chartNum, emptyMsg: 'Belum ada penggunaan/realisasi pada rentang terpilih.' });
    })
    .withFailureHandler(function () {})
    .logistik_getTren(APP.token, APP.filter);
}

function _logBuildPaneCharts() {
  var k = _LOG.kpi;
  if (!k) return;

  // Donut sisa vs terpakai (semua jenis amunisi)
  var sisa = k.amunisi.reduce(function (s, x) { return s + x.stokAkhir; }, 0);
  var terpakai = k.amunisi.reduce(function (s, x) { return s + x.penggunaan; }, 0);
  _chartDonut('lga-chart-donut', ['Sisa', 'Terpakai'], [sisa, terpakai],
    [_CHART_COLORS.ok, _CHART_COLORS.warn],
    { center: _idNum(sisa), centerSub: 'Sisa Stok', emptyMsg: 'Belum ada baseline amunisi.' });

  // Bar % realisasi terhadap pagu per jenis BBM
  _chartBar('lgb-chart-pct',
    k.bbm.map(function (x) { return x.jenis; }),
    [{ label: 'Realisasi % Pagu', data: k.bbm.map(function (x) { return x.pct; }), color: _CHART_COLORS.primary }],
    { horizontal: false, fmt: function (v) { return v + '%'; }, emptyMsg: 'Belum ada pagu BBM tahun berjalan.' }
  );

  // Bar nilai personil per komponen
  _chartBar('lgp-chart-komponen',
    k.personil.map(function (x) { return _logLabel('personil', x.komponen); }),
    [{ label: 'Nilai', data: k.personil.map(function (x) { return x.total; }), color: _CHART_COLORS.primary }],
    { horizontal: true, fmt: _rupiah, emptyMsg: 'Belum ada nilai logistik personil pada periode ini.' }
  );
}

// ── HISTORY ───────────────────────────────────────────────

function _logFetchHistory(jenis) {
  var prefix = _LOG_PREFIX[jenis];
  var wrap = document.getElementById(prefix + '-history-wrap');
  if (wrap) wrap.innerHTML = _loadingInline('Memuat riwayat\u2026');

  var runner = google.script.run
    .withSuccessHandler(function (res) {
      if (!res.success) {
        _msg(prefix + '-history-msg', 'error', res.error);
        if (wrap) wrap.innerHTML = '';
        return;
      }
      _LOG.history[jenis] = res.data;
      _logRenderHistory(jenis, res.data);
    })
    .withFailureHandler(function () {
      _msg(prefix + '-history-msg', 'error', 'Gagal memuat riwayat.');
    });

  if (jenis === 'amunisi')  runner.logistik_getAmunisi(APP.token, APP.filter);
  else if (jenis === 'bbm') runner.logistik_getBBM(APP.token, APP.filter);
  else                      runner.logistik_getPersonil(APP.token, APP.filter);
}

function _logModeBadge(mode) {
  if (mode === 'BASELINE') return _histBadgeTone('BASELINE', 'baseline');
  return _histBadgeTone('PENGGUNAAN', 'ditimpa');
}

function _logRenderHistory(jenis, items) {
  var sheet = 'TX_Logistik_' + (jenis === 'amunisi' ? 'Amunisi' : (jenis === 'bbm' ? 'BBM' : 'Personil'));
  var label = _LOG_LABEL[jenis];

  _histRender(_LOG_PREFIX[jenis] + '-history-wrap', {
    columns: _logColumns(jenis),
    cells: function (r) { return _logCells(jenis, r); },
    refSheet: sheet,
    title: function (r) { return label + ' — Periode ' + r.periode; },
    detail: function (r) { return _logDetailFields(jenis, r); },
    revisi: _logCanWrite() ? function (r) { return "_logOpenRevisi('" + jenis + "','" + _esc(r.rowId) + "')"; } : null,
    anulir: _logCanAnulir() ? function (r) { return "_logOpenAnulir('" + jenis + "','" + _esc(r.rowId) + "')"; } : null,
    empty: 'Belum ada laporan untuk periode ini.'
  }, items);
}

// Field modal Lihat — dipakai bersama tabel riwayat dan modal revisi.
function _logDetailFields(jenis, r) {
  var dikirim = ['Dikirim', _esc(r.timestamp ? new Date(r.timestamp).toLocaleString('id-ID') : '—')];
  if (jenis === 'amunisi') {
    return [
      ['Periode', _esc(r.periode)],
      ['Kapal', _esc(_kapalName(r.kapalId))],
      ['Jenis', _esc(_logLabel('amunisi', r.jenis))],
      ['Mode', _esc(r.mode)],
      ['Stok Awal', r.mode === 'BASELINE' ? _idNum(r.stokAwal) : '—'],
      ['Penggunaan Minggu Ini', r.mode === 'PENGGUNAAN' ? _idNum(r.penggunaan) : '—']
    ].concat(dikirim, [['Status', _esc(r.status)]]);
  }
  if (jenis === 'bbm') {
    return [
      ['Periode', _esc(r.periode)],
      ['Kapal', _esc(_kapalName(r.kapalId))],
      ['Jenis', _esc(_logLabel('bbm', r.jenis))],
      ['Mode', _esc(r.mode)],
      ['Pagu', r.mode === 'BASELINE' ? _idNum(r.pagu) : '—'],
      ['Realisasi', r.mode === 'PENGGUNAAN' ? _idNum(r.realisasi) : '—'],
      ['Harga Acuan', _esc(r.hargaAcuan || '—')],
      ['Tunggakan', _esc(r.tunggakan || '—')]
    ].concat(dikirim, [['Status', _esc(r.status)]]);
  }
  return [
    ['Periode', _esc(r.periode)],
    ['Komponen', _esc(_logLabel('personil', r.komponen))],
    ['Nilai (Rp)', _rupiah(r.nilai)]
  ].concat(dikirim, [['Status', _esc(r.status)]]);
}

function _logColumns(jenis) {
  if (jenis === 'amunisi')  return ['Periode', 'Kapal', 'Jenis', 'Mode', 'StokAwal', 'Penggunaan Minggu'];
  if (jenis === 'bbm')      return ['Periode', 'Kapal', 'Jenis', 'Mode', 'Pagu', 'Realisasi', 'Harga Acuan', 'Tunggakan'];
  return ['Periode', 'Komponen', 'Nilai (Rp)'];
}

function _logCells(jenis, r) {
  if (jenis === 'amunisi') {
    return [
      _esc(r.periode),
      _kapalCellPlain(r.kapalId),
      _esc(_logLabel('amunisi', r.jenis)),
      _logModeBadge(r.mode),
      r.mode === 'BASELINE' ? _idNum(r.stokAwal) : '—',
      r.mode === 'PENGGUNAAN' ? _idNum(r.penggunaan) : '—'
    ];
  }
  if (jenis === 'bbm') {
    return [
      _esc(r.periode),
      _kapalCellPlain(r.kapalId),
      _esc(_logLabel('bbm', r.jenis)),
      _logModeBadge(r.mode),
      r.mode === 'BASELINE' ? _idNum(r.pagu) : '—',
      r.mode === 'PENGGUNAAN' ? _idNum(r.realisasi) : '—',
      _esc(r.hargaAcuan || '—'),
      _esc(r.tunggakan || '—')
    ];
  }
  return [
    _esc(r.periode),
    _esc(_logLabel('personil', r.komponen)),
    _rupiah(r.nilai)
  ];
}

function _logOpenRevisi(jenis, rowId) {
  var row = (_LOG.history[jenis] || []).filter(function (r) { return r.rowId === rowId; })[0];
  if (!row) return;
  _LOG.revisi = { jenis: jenis, rowId: rowId, mode: row.mode || 'PENGGUNAAN' };

  var info = document.getElementById('log-revisi-info');
  if (info) info.textContent = 'Merevisi ' + _LOG_LABEL[jenis] + ' periode ' + row.periode +
    ' (' + (_LOG_MODE_LABEL[_LOG.revisi.mode] || _LOG.revisi.mode) + ').';

  var fields = document.getElementById('log-revisi-fields');
  fields.innerHTML = _logRevisiFieldsHtml(jenis, row);

  document.getElementById('log-revisi-alasan').value = '';
  var refSheet = 'TX_Logistik_' + (jenis === 'amunisi' ? 'Amunisi' : (jenis === 'bbm' ? 'BBM' : 'Personil'));
  _attachInit('log-revisi', { refSheet: refSheet });
  _msg('log-revisi-msg', null);
  document.getElementById('modal-log-revisi').classList.remove('n-hidden');
}

function _logRevisiFieldsHtml(jenis, row) {
  var m = row.mode || 'PENGGUNAAN';
  if (jenis === 'amunisi') {
    if (m === 'BASELINE') {
      return '<div class="form-grp"><label>Jenis Amunisi</label>' +
        '<input type="text" value="' + _esc(_logLabel('amunisi', row.jenis)) + '" disabled></div>' +
        '<div class="form-grp"><label>Stok Awal Tahun</label>' +
        '<input type="number" id="rv-lga-stok" min="0" step="1" value="' + (row.stokAwal || 0) + '"></div>';
    }
    return '<div class="form-grp"><label>Jenis Amunisi</label>' +
      '<input type="text" value="' + _esc(_logLabel('amunisi', row.jenis)) + '" disabled></div>' +
      '<div class="form-grp"><label>Penggunaan Minggu Ini</label>' +
      '<input type="number" id="rv-lga-penggunaan" min="0" step="1" value="' + (row.penggunaan || 0) + '"></div>';
  }
  if (jenis === 'bbm') {
    if (m === 'BASELINE') {
      return '<div class="form-grp"><label>Jenis BBM</label>' +
        '<input type="text" value="' + _esc(_logLabel('bbm', row.jenis)) + '" disabled></div>' +
        '<div class="form-grp"><label>Pagu Tahun</label>' +
        '<input type="number" id="rv-lgb-pagu" min="0" step="1" value="' + (row.pagu || 0) + '"></div>';
    }
    return '<div class="form-grp"><label>Jenis BBM</label>' +
      '<input type="text" value="' + _esc(_logLabel('bbm', row.jenis)) + '" disabled></div>' +
      '<div style="display:grid;grid-template-columns:1fr 1fr;gap:14px;">' +
        '<div class="form-grp"><label>Realisasi</label>' +
        '<input type="number" id="rv-lgb-realisasi" min="0" step="1" value="' + (row.realisasi || 0) + '"></div>' +
        '<div class="form-grp"><label>Harga Acuan</label>' +
        '<input type="number" id="rv-lgb-harga" min="0" step="1" value="' + _esc(row.hargaAcuan || '') + '"></div>' +
      '</div>' +
      '<div class="form-grp"><label>Status Tunggakan</label>' +
      '<input type="text" id="rv-lgb-tunggakan" value="' + _esc(row.tunggakan || '') + '"></div>';
  }
  return '<div class="form-grp"><label>Komponen</label>' +
    '<input type="text" value="' + _esc(_logLabel('personil', row.komponen)) + '" disabled></div>' +
    '<div class="form-grp"><label>Nilai (Rp)</label>' +
    '<input type="number" id="rv-lgp-nilai" min="0" step="1" value="' + (row.nilai || 0) + '"></div>';
}

function _logRevisiConfirm() {
  var jenis = _LOG.revisi.jenis;
  var btn = document.getElementById('log-btn-revisi-save');
  var alasan = _v('log-revisi-alasan');
  _msg('log-revisi-msg', null);
  if (!alasan.trim()) { _msg('log-revisi-msg', 'error', 'Alasan revisi wajib diisi.'); return; }
  _setLoading(btn, true);

  var params = { targetRowId: _LOG.revisi.rowId, alasanRevisi: alasan };
  if (jenis === 'amunisi') {
    if (_LOG.revisi.mode === 'BASELINE') params.stokAwal = _v('rv-lga-stok');
    else params.penggunaan = _v('rv-lga-penggunaan');
  } else if (jenis === 'bbm') {
    if (_LOG.revisi.mode === 'BASELINE') params.pagu = _v('rv-lgb-pagu');
    else {
      params.realisasi = _v('rv-lgb-realisasi');
      params.hargaAcuan = _v('rv-lgb-harga');
      params.tunggakanStatus = _v('rv-lgb-tunggakan');
    }
  } else {
    params.nilai = _v('rv-lgp-nilai');
  }

  var runner = google.script.run
    .withSuccessHandler(function (res) {
      _setLoading(btn, false);
      if (!res.success) { _msg('log-revisi-msg', 'error', res.error); return; }
      _attachCarry('TX_Logistik_' + (
        jenis === 'amunisi' ? 'Amunisi' : (jenis === 'bbm' ? 'BBM' : 'Personil')
      ), params.targetRowId, res.data.rowId);
      _attachUploadAll('log-revisi', [res.data.rowId], function () {
        _logCloseRevisi();
        _msg(_LOG_PREFIX[jenis] + '-history-msg', 'success', res.data.message);
        (res.data.warnings || []).forEach(function (w) { _msg(_LOG_PREFIX[jenis] + '-history-msg', 'warn', w); });
        _logLoadKPI();
        _logFetchHistory(jenis);
      });
    })
    .withFailureHandler(function () {
      _setLoading(btn, false);
      _msg('log-revisi-msg', 'error', 'Terjadi kesalahan. Coba lagi.');
    });

  if (jenis === 'amunisi')  runner.logistik_revisiAmunisi(APP.token, params);
  else if (jenis === 'bbm') runner.logistik_revisiBBM(APP.token, params);
  else                      runner.logistik_revisiPersonil(APP.token, params);
}

function _logCloseRevisi() {
  _LOG.revisi = { jenis: null, rowId: null, mode: null };
  closeModal('modal-log-revisi');
}

var _AWK = {
  tab: 'akn',
  options: null,
  kpi: null,
  history: { akn: [], kegiatan: [] },
  revisi: { jenis: null, rowId: null },
  anulir: { jenis: null, rowId: null }
};
var _AWK_LABEL  = { akn: 'Komposisi AKN', kegiatan: 'Kegiatan Personel' };
var _AWK_PREFIX = { akn: 'akn', kegiatan: 'akk' };
// Label & urutan token AKN berasal dari sheet `Opsi` (server: awak_getOptions).
function _awkLbl(map, token) {
  var t = String(token || '');
  return ((_AWK.options || {})[map] || {})[t] || t;
}
function _awkScopeLbl(t) { return _awkLbl('labelScope', t); }
function _awkKatLbl(t)   { return _awkLbl('labelKategori', t); }
function _awkKatOrder()  { return ((_AWK.options || {}).kategori || []).map(function (it) { return it.value; }); }
function _awkScopeOrder(){ return ((_AWK.options || {}).scopes || []).map(function (it) { return it.value; }); }
// Palet seri untuk chart multi-scope;(netral, lalu warna aksen)
var _AWK_SCOPE_COLORS = [_CHART_COLORS.neutral, _CHART_COLORS.primary, _CHART_COLORS.warn, _CHART_COLORS.ok, _CHART_COLORS.primarySoft, _CHART_COLORS.primaryAlpha];
function _awkScopeColor(i) { return _AWK_SCOPE_COLORS[i % _AWK_SCOPE_COLORS.length]; }

// ── RENDER UTAMA ────────────────────────────────────────

function _renderPengawakan(el) {
  var tpl = document.getElementById('view-tpl-pengawakan');
  if (!tpl) { el.innerHTML = _moduleStub('Pengawakan'); return; }
  el.innerHTML = tpl.innerHTML;

  _AWK.tab = 'akn';
  _awkSetTab('akn');

  _awkLoadOptions();
  _awkLoadKPI();
}

function _awkSyncTabState() {
  var tabs = document.querySelectorAll('#awak-tabs .n-tab');
  tabs.forEach(function (t) {
    t.classList.toggle('active', t.getAttribute('data-awak-tab') === _AWK.tab);
  });
}

function _awkSetTab(name) {
  if (!_AWK_LABEL[name]) return;
  _AWK.tab = name;
  _awkSyncTabState();

  var pane = document.getElementById('awak-tab-pane');
  if (!pane) return;
  var tpl = document.getElementById('view-tpl-awak-' + name);
  pane.innerHTML = tpl ? tpl.innerHTML : '';
  _awkInitPane(name);
}

// RBAC UI mengikuti server: write = SUPERADMIN atau (KADIV/STAF DIV-AWAK);
// anulir = SUPERADMIN/DIREKTUR atau KADIV DIV-AWAK.
function _awkCanWrite() {
  var u = APP.user || {};
  return u.role === 'SUPERADMIN' || (u.divisiId === 'DIV-AWAK' && (u.role === 'STAF' || u.role === 'KADIV'));
}

function _awkCanAnulir() {
  var u = APP.user || {};
  return u.role === 'SUPERADMIN' || u.role === 'DIREKTUR' || (u.divisiId === 'DIV-AWAK' && u.role === 'KADIV');
}

function _awkInitPane(name) {
  var prefix = _AWK_PREFIX[name] + '-';

  var formSection = document.getElementById(prefix + 'form-section');
  if (formSection) formSection.style.display = _awkCanWrite() ? '' : 'none';

  _opsInitPeriodeUi(prefix);
  ['tahun', 'bulan', 'minggu'].forEach(function (k) {
    var sel = document.getElementById(prefix + 'periode-' + k);
    if (sel) sel.onchange = function () { _awkUpdatePeriodeHint(name); };
  });
  _awkUpdatePeriodeHint(name);

  _attachInit(name === 'akn' ? 'awkakn' : 'awkkeg', {
    refSheet: 'TX_Pengawakan_' + (name === 'akn' ? 'AKN' : 'Kegiatan')
  });

  _awkPopulateOptions();
  _awkRenderKomposisi(_AWK.kpi);

  _awkFetchHistory(name);
}

function _awkUpdatePeriodeHint(name) {
  var hint = document.getElementById(_AWK_PREFIX[name] + '-periode-hint');
  if (hint) hint.textContent = _composePeriode(_AWK_PREFIX[name] + '-') || '—';
}

// Form popup: reset field + attach + tampilkan modal (Backlog A)
function _awkOpenForm(name) {
  var prefix = _AWK_PREFIX[name];

  if (name === 'akn') {
    ['akn-jumlah'].forEach(function (id) {
      var el = document.getElementById(id);
      if (el) el.value = '';
    });
    var scope = document.getElementById('akn-scope');
    if (scope && scope.options.length) scope.selectedIndex = 0; // scope pertama dari `Opsi`
    var kat = document.getElementById('akn-kategori');
    if (kat) kat.selectedIndex = 0; // placeholder "(Pilih Kategori)" dari `Opsi`
  } else {
    ['akk-judul','akk-tglmulai','akk-tglselesai','akk-wilayah','akk-peserta','akk-deskripsi'].forEach(function (id) {
      var el = document.getElementById(id);
      if (el) el.value = '';
    });
  }

  _msg(prefix + '-form-msg', '', '');
  _attachInit(name === 'akn' ? 'awkakn' : 'awkkeg', {
    refSheet: 'TX_Pengawakan_' + (name === 'akn' ? 'AKN' : 'Kegiatan')
  });
  var m = document.getElementById('modal-' + prefix + '-form');
  if (m) m.classList.remove('n-hidden');
}

// ── OPTIONS ───────────────────────────────────────────────

function _awkLoadOptions() {
  if (_AWK.options) { _awkPopulateOptions(); return; }
  google.script.run
    .withSuccessHandler(function (res) {
      if (!res.success) return;
      _AWK.options = res.data;
      _awkPopulateOptions();
    })
    .withFailureHandler(function () {})
    .awak_getOptions(APP.token);
}

function _awkPopulateOptions() {
  if (!_AWK.options) return;
  _fillOpsiSelect('akn-kategori', _AWK.options.kategori, '(Pilih Kategori)');
  _fillOpsiSelect('akn-scope', _AWK.options.scopes);
}

// ── KPI ───────────────────────────────────────────────────

function _awkLoadKPI() {
  var strip = document.getElementById('awak-kpi-strip');
  if (strip) strip.innerHTML = _kpiSkeleton(4);

  google.script.run
    .withSuccessHandler(function (res) {
      if (!res.success) { _msg('akn-history-msg', 'error', res.error); return; }
      _AWK.kpi = res.data;
      _awkRenderKPI(res.data);
      _awkBuildCharts();
      _awkRenderKomposisi(res.data);
    })
    .withFailureHandler(function () {
      var s = document.getElementById('awak-kpi-strip');
      if (s) s.innerHTML = '<div class="n-msg error show">Gagal memuat KPI Pengawakan.</div>';
    })
    .awak_getKPI(APP.token, APP.filter);
}

function _awkRenderKPI(d) {
  var el = document.getElementById('awak-kpi-strip');
  if (!el) return;
  // Satu kartu KPI per scope; label & urutan dari sheet `Opsi`.
  var scopeCards = _awkScopeOrder().map(function (sc) {
    return _kpiHeadline('Total AKN ' + _awkScopeLbl(sc), _idNum((d.akn.totalPerScope || {})[sc] || 0), 'orang', 'Komposisi tahun berjalan');
  }).join('');
  el.innerHTML =
    '<div class="ov-kpi-row">' +
      scopeCards +
      _kpiHeadline('Kegiatan Personel', _idNum(d.kegiatan.count), 'kegiatan', 'Dalam rentang filter') +
      _kpiHeadline('Total Peserta Kegiatan', _idNum(d.kegiatan.totalPeserta), 'peserta', 'Dalam rentang filter') +
    '</div>';
}

// ── CHARTS & KOMPOSISI ───────────────────────────────────

function _awkBuildCharts() {
  var k = _AWK.kpi;
  if (!k) return;

  var kat = _awkKatOrder();
  var kes = k.akn.perKategori;
  _chartBar('awak-chart-komposisi',
    kat.map(function (x) { return _awkKatLbl(x); }),
    // Satu seri per scope, label & warna mengikuti sheet `Opsi`.
    _awkScopeOrder().map(function (sc, i) {
      return {
        label: _awkScopeLbl(sc),
        data:  kat.map(function (x) { return (kes[x] || {})[sc] || 0; }),
        color: _awkScopeColor(i)
      };
    }),
    { horizontal: true, fmt: _chartNum, emptyMsg: 'Belum ada komposisi AKN tahun berjalan.' }
  );

  _awkLoadTren();
}

function _awkLoadTren() {
  google.script.run
    .withSuccessHandler(function (res) {
      if (!res.success) return;
      var d = res.data;
      var labels = d.months.map(function (m) { return _chartMonthLabel(m); });
      // Satu seri per scope; label dari sheet `Opsi` (server: aknScopeLabels).
      _chartLine('awak-chart-tren', labels,
        _awkScopeOrder().map(function (sc, i) {
          return { label: (d.aknScopeLabels || {})[sc] || _awkScopeLbl(sc),
                   data: (d.aknPerScope || {})[sc] || [], color: _awkScopeColor(i) };
        }),
        { fmt: _chartNum, emptyMsg: 'Belum ada komposisi AKN pada rentang terpilih.' });
    })
    .withFailureHandler(function () {})
    .awak_getTren(APP.token, APP.filter);
}

function _awkRenderKomposisi(d) {
  var el = document.getElementById('akn-komposisi-wrap');
  if (!el) return;
  if (!d) { el.innerHTML = '<div style="padding:20px 24px;color:var(--n-text-muted);font-size:.875rem;">Memuat komposisi…</div>'; return; }
  var rows = d.akn.rows || [];
  if (!rows.length) {
    el.innerHTML = '<div style="padding:20px 24px;color:var(--n-text-muted);font-size:.875rem;">Belum ada komposisi AKN tercatat untuk tahun berjalan.</div>';
    return;
  }
  rows.sort(function (a, b) {
    // Urutan mengikuti sheet `Opsi`, bukan nama scope tertentu.
    var so = _awkScopeOrder();
    var dso = so.indexOf(a.scope) - so.indexOf(b.scope);
    if (dso !== 0) return dso;
    var ord = _awkKatOrder();
    return ord.indexOf(a.kategori) - ord.indexOf(b.kategori);
  });
  var t = '<table class="n-table"><thead><tr><th>Scope</th><th>Kategori</th><th>Jumlah</th><th>Periode Terakhir</th></tr></thead><tbody>';
  rows.forEach(function (r) {
    t += '<tr><td>' + _esc(_awkScopeLbl(r.scope)) + '</td>' +
      '<td>' + _esc(_awkKatLbl(r.kategori)) + '</td>' +
      '<td>' + _idNum(r.jumlah) + '</td>' +
      '<td>' + _esc(r.periode) + '</td></tr>';
  });
  t += '</tbody></table>';
  el.innerHTML = t;
}

// ── HISTORY ───────────────────────────────────────────────

function _awkFetchHistory(jenis) {
  var prefix = _AWK_PREFIX[jenis];
  var wrap = document.getElementById(prefix + '-history-wrap');
  if (wrap) wrap.innerHTML = _loadingInline('Memuat riwayat\u2026');

  var runner = google.script.run
    .withSuccessHandler(function (res) {
      if (!res.success) {
        _msg(prefix + '-history-msg', 'error', res.error);
        if (wrap) wrap.innerHTML = '';
        return;
      }
      _AWK.history[jenis] = res.data;
      _awkRenderHistory(jenis, res.data);
    })
    .withFailureHandler(function () {
      _msg(prefix + '-history-msg', 'error', 'Gagal memuat riwayat.');
    });

  if (jenis === 'akn')       runner.awak_getAKN(APP.token, APP.filter);
  else                       runner.awak_getKegiatan(APP.token, APP.filter);
}

function _awkRenderHistory(jenis, items) {
  var sheet = 'TX_Pengawakan_' + (jenis === 'akn' ? 'AKN' : 'Kegiatan');
  var label = _AWK_LABEL[jenis];

  _histRender(_AWK_PREFIX[jenis] + '-history-wrap', {
    columns: _awkColumns(jenis),
    cells: function (r) { return _awkCells(jenis, r); },
    refSheet: sheet,
    title: function (r) { return label + ' — Periode ' + r.periode; },
    detail: function (r) { return _awkDetailFields(jenis, r); },
    revisi: _awkCanWrite() ? function (r) { return "_awkOpenRevisi('" + jenis + "','" + _esc(r.rowId) + "')"; } : null,
    anulir: _awkCanAnulir() ? function (r) { return "_awkOpenAnulir('" + jenis + "','" + _esc(r.rowId) + "')"; } : null,
    empty: 'Belum ada laporan untuk periode ini.'
  }, items);
}

// Field modal Lihat — dipakai bersama tabel riwayat dan modal revisi.
function _awkDetailFields(jenis, r) {
  var dikirim = ['Dikirim', _esc(r.timestamp ? new Date(r.timestamp).toLocaleString('id-ID') : '—')];
  if (jenis === 'akn') {
    return [
      ['Periode', _esc(r.periode)],
      ['Scope', _esc(_awkScopeLbl(r.scope))],
      ['Kategori', _esc(_awkKatLbl(r.kategori))],
      ['Jumlah', _idNum(r.jumlah)]
    ].concat(dikirim, [['Status', _esc(r.status)]]);
  }
  return [
    ['Periode', _esc(r.periode)],
    ['Judul Kegiatan', _esc(r.judul || '—')],
    ['Mulai', r.tanggalMulai ? new Date(r.tanggalMulai).toLocaleDateString('id-ID') : '—'],
    ['Selesai', r.tanggalSelesai ? new Date(r.tanggalSelesai).toLocaleDateString('id-ID') : '—'],
    ['Wilayah', _esc(r.wilayah || '—')],
    ['Jumlah Peserta', _idNum(r.jumlahPeserta)]
  ].concat(dikirim, [['Status', _esc(r.status)]]);
}

function _awkColumns(jenis) {
  if (jenis === 'akn') return ['Periode', 'Scope', 'Kategori', 'Jumlah'];
  return ['Periode', 'Judul Kegiatan', 'Mulai', 'Selesai', 'Wilayah', 'Peserta'];
}

function _awkCells(jenis, r) {
  if (jenis === 'akn') {
    return [
      _esc(r.periode),
      _esc(_awkScopeLbl(r.scope)),
      _esc(_awkKatLbl(r.kategori)),
      _idNum(r.jumlah)
    ];
  }
  return [
    _esc(r.periode),
    _esc(r.judul || '—'),
    r.tanggalMulai ? new Date(r.tanggalMulai).toLocaleDateString('id-ID') : '—',
    r.tanggalSelesai ? new Date(r.tanggalSelesai).toLocaleDateString('id-ID') : '—',
    _esc(r.wilayah || '—'),
    _idNum(r.jumlahPeserta)
  ];
}

// ── SUBMIT ────────────────────────────────────────────────

function _awkSubmitAkn() {
  var btn = document.getElementById('akn-btn-submit');
  _msg('akn-form-msg', null);
  var attachErr = _attachValidate('awkakn');
  if (attachErr) { _msg('akn-form-msg', 'error', attachErr); return; }
  _setLoading(btn, true);
  var params = {
    periode:  _composePeriode('akn-'),
    scope:    _v('akn-scope'),
    kategori: _v('akn-kategori'),
    jumlah:   _v('akn-jumlah')
  };
  google.script.run
    .withSuccessHandler(function (res) {
      _setLoading(btn, false);
      if (!res.success) { _msg('akn-form-msg', 'error', res.error); return; }
      _msg('akn-form-msg', 'success', res.data.message);
      document.getElementById('akn-jumlah').value = '';
      _attachUploadAll('awkakn', [res.data.rowId], function(ok) {
        _formSubmitDone('modal-akn-form', 'Perubahan komposisi AKN tersimpan.', function () {
          _awkLoadKPI();
          _awkFetchHistory('akn');
        }, ok);
      });
    })
    .withFailureHandler(function () { _setLoading(btn, false); _msg('akn-form-msg', 'error', 'Terjadi kesalahan koneksi. Coba lagi.'); })
    .awak_submitAKN(APP.token, params);
}

function _awkSubmitKegiatan() {
  var btn = document.getElementById('akk-btn-submit');
  _msg('akk-form-msg', null);
  var attachErr = _attachValidate('awkkeg');
  if (attachErr) { _msg('akk-form-msg', 'error', attachErr); return; }
  _setLoading(btn, true);
  var params = {
    periode:        _composePeriode('akk-'),
    judul:          _v('akk-judul'),
    tanggalMulai:   _v('akk-tglmulai'),
    tanggalSelesai: _v('akk-tglselesai'),
    wilayah:        _v('akk-wilayah'),
    jumlahPeserta:  _v('akk-peserta'),
    deskripsi:      _v('akk-deskripsi')
  };
  google.script.run
    .withSuccessHandler(function (res) {
      _setLoading(btn, false);
      if (!res.success) { _msg('akk-form-msg', 'error', res.error); return; }
      _msg('akk-form-msg', 'success', res.data.message);
      document.getElementById('akk-judul').value = '';
      document.getElementById('akk-wilayah').value = '';
      document.getElementById('akk-peserta').value = '';
      _attachUploadAll('awkkeg', [res.data.rowId], function(ok) {
        _formSubmitDone('modal-akk-form', 'Log kegiatan personel tersimpan.', function () {
          _awkLoadKPI();
          _awkFetchHistory('kegiatan');
        }, ok);
      });
    })
    .withFailureHandler(function () { _setLoading(btn, false); _msg('akk-form-msg', 'error', 'Terjadi kesalahan koneksi. Coba lagi.'); })
    .awak_submitKegiatan(APP.token, params);
}

// ── REVISI ────────────────────────────────────────────────

function _awkOpenRevisi(jenis, rowId) {
  var row = (_AWK.history[jenis] || []).filter(function (r) { return r.rowId === rowId; })[0];
  if (!row) return;
  _AWK.revisi = { jenis: jenis, rowId: rowId };

  var info = document.getElementById('awak-revisi-info');
  if (info) info.textContent = 'Merevisi ' + _AWK_LABEL[jenis] + ' periode ' + row.periode + '.';

  var fields = document.getElementById('awak-revisi-fields');
  fields.innerHTML = _awkRevisiFieldsHtml(jenis, row);

  document.getElementById('awak-revisi-alasan').value = '';
  var refSheet = 'TX_Pengawakan_' + (jenis === 'akn' ? 'AKN' : 'Kegiatan');
  _attachInit('awak-revisi', { refSheet: refSheet });
  _msg('awak-revisi-msg', null);
  document.getElementById('modal-awak-revisi').classList.remove('n-hidden');
}

function _awkRevisiFieldsHtml(jenis, row) {
  if (jenis === 'akn') {
    return '<div style="display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px;">' +
        '<div class="form-grp"><label>Scope</label>' +
        '<input type="text" value="' + _esc(_awkScopeLbl(row.scope)) + '" disabled></div>' +
        '<div class="form-grp"><label>Kategori</label>' +
        '<input type="text" value="' + _esc(_awkKatLbl(row.kategori)) + '" disabled></div>' +
      '</div>' +
      '<div class="form-grp"><label>Jumlah (Total Terbaru)</label>' +
      '<input type="number" id="rv-akn-jumlah" min="0" step="1" value="' + (row.jumlah || 0) + '"></div>';
  }
  return '<div class="form-grp"><label>Judul Kegiatan</label>' +
    '<input type="text" id="rv-akk-judul" value="' + _esc(row.judul || '') + '"></div>' +
    '<div style="display:grid;grid-template-columns:1fr 1fr;gap:14px;">' +
      '<div class="form-grp"><label>Tanggal Mulai</label>' +
      '<input type="date" id="rv-akk-tglmulai" value="' + (row.tanggalMulai ? row.tanggalMulai.substring(0, 10) : '') + '"></div>' +
      '<div class="form-grp"><label>Tanggal Selesai</label>' +
      '<input type="date" id="rv-akk-tglselesai" value="' + (row.tanggalSelesai ? row.tanggalSelesai.substring(0, 10) : '') + '"></div>' +
    '</div>' +
    '<div style="display:grid;grid-template-columns:1fr 1fr;gap:14px;">' +
      '<div class="form-grp"><label>Wilayah</label>' +
      '<input type="text" id="rv-akk-wilayah" value="' + _esc(row.wilayah || '') + '"></div>' +
      '<div class="form-grp"><label>Jumlah Peserta</label>' +
      '<input type="number" id="rv-akk-peserta" min="0" step="1" value="' + (row.jumlahPeserta || 0) + '"></div>' +
    '</div>' +
    '<div class="form-grp"><label>Deskripsi</label>' +
    '<textarea id="rv-akk-deskripsi" rows="3">' + _esc(row.deskripsi || '') + '</textarea></div>';
}

function _awkRevisiConfirm() {
  var jenis = _AWK.revisi.jenis;
  var btn = document.getElementById('awak-btn-revisi-save');
  var alasan = _v('awak-revisi-alasan');
  _msg('awak-revisi-msg', null);
  if (!alasan.trim()) { _msg('awak-revisi-msg', 'error', 'Alasan revisi wajib diisi.'); return; }
  _setLoading(btn, true);

  var params = { targetRowId: _AWK.revisi.rowId, alasanRevisi: alasan };
  if (jenis === 'akn') {
    params.jumlah = _v('rv-akn-jumlah');
  } else {
    params.judul = _v('rv-akk-judul');
    params.tanggalMulai = _v('rv-akk-tglmulai');
    params.tanggalSelesai = _v('rv-akk-tglselesai');
    params.wilayah = _v('rv-akk-wilayah');
    params.jumlahPeserta = _v('rv-akk-peserta');
    params.deskripsi = _v('rv-akk-deskripsi');
  }

  var runner = google.script.run
    .withSuccessHandler(function (res) {
      _setLoading(btn, false);
      if (!res.success) { _msg('awak-revisi-msg', 'error', res.error); return; }
      _attachCarry('TX_Pengawakan_' + (jenis === 'akn' ? 'AKN' : 'Kegiatan'), params.targetRowId, res.data.rowId);
      _attachUploadAll('awak-revisi', [res.data.rowId], function () {
        _awkCloseRevisi();
        _msg(_AWK_PREFIX[jenis] + '-history-msg', 'success', res.data.message);
        _awkLoadKPI();
        _awkFetchHistory(jenis);
      });
    })
    .withFailureHandler(function () {
      _setLoading(btn, false);
      _msg('awak-revisi-msg', 'error', 'Terjadi kesalahan. Coba lagi.');
    });

  if (jenis === 'akn') runner.awak_revisiAKN(APP.token, params);
  else                 runner.awak_revisiKegiatan(APP.token, params);
}

function _awkCloseRevisi() {
  _AWK.revisi = { jenis: null, rowId: null };
  closeModal('modal-awak-revisi');
}

// ── ANULIR ────────────────────────────────────────────────

function _awkOpenAnulir(jenis, rowId) {
  var row = (_AWK.history[jenis] || []).filter(function (r) { return r.rowId === rowId; })[0];
  if (!row) return;
  _AWK.anulir = { jenis: jenis, rowId: rowId };
  var info = document.getElementById('awak-anulir-info');
  if (info) info.textContent = 'Akan menganulir laporan ' + _AWK_LABEL[jenis] + ' periode ' + row.periode + ' (ID: ' + rowId + ').';
  document.getElementById('awak-anulir-alasan').value = '';
  _msg('awak-anulir-msg', null);
  document.getElementById('modal-awak-anulir').classList.remove('n-hidden');
}

function _awkAnulirConfirm() {
  var jenis = _AWK.anulir.jenis;
  var btn = document.getElementById('awak-btn-anulir-save');
  var alasan = _v('awak-anulir-alasan');
  _msg('awak-anulir-msg', null);
  if (!alasan.trim()) { _msg('awak-anulir-msg', 'error', 'Komentar anulir wajib diisi.'); return; }
  _setLoading(btn, true);

  google.script.run
    .withSuccessHandler(function (res) {
      _setLoading(btn, false);
      _awkCloseAnulir();
      if (!res.success) { _msg(_AWK_PREFIX[jenis] + '-history-msg', 'error', res.error); return; }
      _msg(_AWK_PREFIX[jenis] + '-history-msg', 'success', res.data.message);
      _awkLoadKPI();
      _awkFetchHistory(jenis);
    })
    .withFailureHandler(function () {
      _setLoading(btn, false);
      _msg('awak-anulir-msg', 'error', 'Terjadi kesalahan. Coba lagi.');
    })
    .awak_anulir(APP.token, {
      jenis: jenis.toUpperCase(),
      targetRowId: _AWK.anulir.rowId,
      voidReason: alasan
    });
}

function _awkCloseAnulir() {
  _AWK.anulir = { jenis: null, rowId: null };
  closeModal('modal-awak-anulir');
}

</script>
