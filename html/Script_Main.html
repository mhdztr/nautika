function _opsUdaraRenderHistory(data) {
  var wrap = document.getElementById('ops-udara-history-wrap');
  if(!wrap) return;
  _hdReset();
  if(data.length === 0) {
    wrap.innerHTML = '<div style="padding:20px 24px;">Tidak ada riwayat untuk periode ini.</div>';
    return;
  }

  var isStaf = (APP.user && APP.user.role === 'STAF');
  var isPimpinan = (APP.user && (APP.user.role==='DIREKTUR' || APP.user.role==='SUPERADMIN' || APP.user.role==='KADIV'));

  var t = '<table class="n-table"><thead><tr>';
  t += '<th>Periode</th><th>WPP</th><th>KII/KIA</th><th>Objek SDK</th><th>Rumpon</th><th>Cakupan (NM&sup2;)</th><th>Hari Op</th><th>Status</th><th>Aksi</th>';
  t += '</tr></thead><tbody>';

  for(var i=0; i<data.length; i++) {
    var r = data[i];

    var st = '<span class="status-badge" style="background:#f3f4f6;color:#374151;">DITIMPA</span>';
    if(r.Status === 'ACTIVE') st = '<span class="status-badge" style="background:var(--n-primary-light);color:var(--n-primary);">AKTIF</span>';
    else if(r.Status === 'VOID') st = '<span class="status-badge" style="background:#fee2e2;color:var(--n-status-critical);">DIANULIR</span>';

    var bRev = (r.Status==='ACTIVE' && !isStaf && APP.user.divisiId === 'DIV-OPS') ? '<button class="btn-mini" onclick="opsUdaraOpenRevisiModal(\'' + r.RowID + '\')">Revisi</button>' : '';
    var bAn  = (r.Status==='ACTIVE' && isPimpinan) ? '<button class="btn-mini" style="color:var(--n-status-critical);border-color:var(--n-status-critical);" onclick="opsUdaraOpenAnulirModal(\'' + r.RowID + '\')">Anulir</button>' : '';

    if(r.Status==='ACTIVE' && (APP.user.role==='STAF'||APP.user.role==='KADIV') && APP.user.divisiId === 'DIV-OPS'){
      bRev = '<button class="btn-mini" onclick="opsUdaraOpenRevisiModal(\'' + r.RowID + '\')">Revisi</button>';
    }

    var bLk = '<button class="btn-mini" onclick="_hdOpen(' + _hdPush('TX_OperasiUdara', r.RowID, 'Operasi Udara — Periode ' + r.Periode + ' (' + r.WPPCode + ')', [
      ['Periode', _esc(r.Periode)],
      ['WPP', _esc(r.WPPCode)],
      ['Kapal Ditangkap (KII)', _idNum(r.KII)],
      ['Kapal Ditangkap (KIA)', _idNum(r.KIA)],
      ['Objek SDK', _idNum(r.ObjekSDK)],
      ['Rumpon Lokal Teridentifikasi', _idNum(r.RumponLokalTeridentifikasi)],
      ['Cakupan Wilayah (NM\u00b2)', _idNum(r.CakupanWilayah_NM2)],
      ['Hari Operasi — Jumlah', _idNum(r.HariOperasi_Jumlah)],
      ['Hari Operasi — Target', _idNum(r.HariOperasi_Target)],
      ['Dikirim', _esc(r.Timestamp ? new Date(r.Timestamp).toLocaleString('id-ID') : '—')],
      ['Status', _esc(r.Status)]
    ]) + ')">Lihat</button>';

    var rowCls = (r.Status==='VOID') ? 'style="background:#fef2f2;"' : (r.Status==='SUPERSEDED' ? 'style="opacity:0.6;"' : '');

    t += '<tr ' + rowCls + '>';
    t += '<td>' + r.Periode + '</td>';
    t += '<td>' + r.WPPCode + '</td>';
    t += '<td>' + (r.KII||0) + ' / ' + (r.KIA||0) + '</td>';
    t += '<td>' + (r.ObjekSDK||0) + '</td>';
    t += '<td>' + (r.RumponLokalTeridentifikasi||0) + '</td>';
    t += '<td>' + (r.CakupanWilayah_NM2||0) + '</td>';
    t += '<td>' + (r.HariOperasi_Jumlah||0) + '</td>';
    t += '<td>' + st + '</td>';
    t += '<td><div style="display:flex;gap:6px;">' + bLk + bRev + bAn + '</div></td>';
    t += '</tr>';

    if(r.Status === 'VOID' && r.VoidReason) {
      t += '<tr style="background:#fef2f2;"><td colspan="9" style="padding-top:0; border-bottom:1px solid #fee2e2; color:var(--n-status-critical); font-size:13px;">';
      t += '<strong>Alasan Anulir:</strong> ' + r.VoidReason + ' (oleh ' + r.VoidedBy + ')';
      t += '</td></tr>';
    }
  }

  t += '</tbody></table>';
  wrap.innerHTML = t;
}

    wrap.innerHTML = '<div style="padding:20px 24px;color:var(--n-text-muted);font-size:.875rem;">Belum ada data kawasan konservasi pada master.</div>';

  }

  var t = '<table class="n-table n-table-full"><thead><tr>' +

  for (var i = 0; i < rows.length; i++) {
    var r = rows[i];
    var tren = '<span style="color:var(--n-text-muted);">—</span>';
    if (r.tren === 'NAIK')  tren = '<span style="color:var(--n-status-critical);font-weight:600;">▲ Naik</span>';
    else if (r.tren === 'TURUN') tren = '<span style="color:var(--n-status-success);font-weight:600;">▼ Turun</span>';

    t += '<tr>';
    t += '<td>' + _esc(r.nama) + '</td>';
    t += '<td>' + _esc(r.provinsi) + '</td>';

function _intelRenderHistory(data) {
  var wrap = document.getElementById('int-history-wrap');
  if (!wrap) return;
  _hdReset();

  var rows = data || [];
  if (_INTEL.kawasanFilter) {
    rows = rows.filter(function(r){ return String(r.KawasanID || '') === String(_INTEL.kawasanFilter); });
  }

  var chip = '';
  if (_INTEL.kawasanFilter) {
    chip = '<div style="padding:12px 24px;border-bottom:1px solid var(--n-border-subtle);font-size:.82rem;">' +
      'Menampilkan kawasan: <strong>' + _esc(_INTEL.kawasanFilterNama) + '</strong> ' +
      '<button class="btn-mini" onclick="intelClearKawasanFilter()">Tampilkan Semua</button></div>';
  }

  if (rows.length === 0) {
    wrap.innerHTML = chip + '<div style="padding:20px 24px;color:var(--n-text-muted);font-size:.875rem;">Tidak ada riwayat untuk periode ini.</div>';
    return;
  }

  var isPimpinan = (APP.user && (APP.user.role === 'DIREKTUR' || APP.user.role === 'SUPERADMIN' || APP.user.role === 'KADIV'));
  var canWrite = (APP.user && (APP.user.role === 'SUPERADMIN' || (APP.user.divisiId === 'DIV-INTEL' && (APP.user.role === 'STAF' || APP.user.role === 'KADIV'))));

  var t = chip + '<table class="n-table n-table-full"><thead><tr>' +
    '<th>Periode</th><th>Kategori</th><th>Jumlah</th><th>Detail</th><th>Tanggal</th><th>Status</th><th>Aksi</th>' +
    '</tr></thead><tbody>';

  for (var i = 0; i < rows.length; i++) {
    var r = rows[i];

    var st = '<span class="status-badge" style="background:#f3f4f6;color:#374151;">DITIMPA</span>';
    if (r.Status === 'ACTIVE') st = '<span class="status-badge" style="background:var(--n-primary-light);color:var(--n-primary);">AKTIF</span>';
    else if (r.Status === 'VOID') st = '<span class="status-badge" style="background:#fee2e2;color:var(--n-status-critical);">DIANULIR</span>';

    var label = INTEL_LABELS[r.Jenis] || r.Jenis;
    var detail = r.Jenis === 'KAWASAN_KONSERVASI' ? (r.kawasanNama || r.KawasanID || '—') : (r.Keterangan || '—');

    var bRev = (r.Status === 'ACTIVE' && canWrite) ? '<button class="btn-mini" onclick="intelOpenRevisiModal(\'' + r.RowID + '\')">Revisi</button>' : '';
    var bAn  = (r.Status === 'ACTIVE' && isPimpinan) ? '<button class="btn-mini" style="color:var(--n-status-critical);border-color:var(--n-status-critical);" onclick="intelOpenAnulirModal(\'' + r.RowID + '\')">Anulir</button>' : '';

    var bLk = '<button class="btn-mini" onclick="_hdOpen(' + _hdPush('TX_Intelijen', r.RowID, 'Intelijen — ' + label + ' · Periode ' + r.Periode, [
      ['Periode', _esc(r.Periode)],
      ['Kategori', _esc(label)],
      ['Jumlah', _idNum(r.Jumlah)],
      ['Kawasan', r.Jenis !== 'KAWASAN_KONSERVASI' ? '—' : _esc(r.kawasanNama || r.KawasanID || '—')],
      ['Detail', _esc(r.Jenis === 'KAWASAN_KONSERVASI' ? (r.KawasanID || '—') : (r.Keterangan || '—'))],
      ['Dikirim', _esc(r.Timestamp ? new Date(r.Timestamp).toLocaleString('id-ID') : '—')],
      ['Status', _esc(r.Status)]
    ]) + ')">Lihat</button>';

    var rowCls = (r.Status === 'VOID') ? 'style="background:#fef2f2;"' : (r.Status === 'SUPERSEDED' ? 'style="opacity:0.6;"' : '');
    var ts = r.Timestamp ? new Date(r.Timestamp).toLocaleDateString('id-ID') : '—';

    t += '<tr ' + rowCls + '>';
    t += '<td>' + _esc(r.Periode) + '</td>';
    t += '<td>' + _esc(label) + '</td>';
    t += '<td>' + (Number(r.Jumlah) || 0) + '</td>';
    t += '<td>' + _esc(detail) + '</td>';
    t += '<td>' + ts + '</td>';
    t += '<td>' + st + '</td>';
    t += '<td><div style="display:flex;gap:6px;">' + bLk + bRev + bAn + '</div></td>';
    t += '</tr>';

    if (r.Status === 'VOID' && r.VoidReason) {
      t += '<tr style="background:#fef2f2;"><td colspan="7" style="padding-top:0;border-bottom:1px solid #fee2e2;color:var(--n-status-critical);font-size:13px;">' +
        '<strong>Alasan Anulir:</strong> ' + _esc(r.VoidReason) + ' (oleh ' + _esc(r.VoidedBy) + ')</td></tr>';
    }
  }

  t += '</tbody></table>';
  wrap.innerHTML = t;
}

// ── Submit ──
function intelSubmit(e) {
  _msg('int-form-msg', '', '');
  var attachErr = _attachValidate('intel');
  if (attachErr) { _msg('int-form-msg', 'error', attachErr); return; }
  var periode = _composePeriode('int-');
  if (!periode) { _msg('int-form-msg', 'error', 'Periode wajib dipilih.'); return; }

  var items = [];
  var numMap = [
    ['int-dredging',  'DREDGING'],
    ['int-perizinan', 'PELANGGARAN_PERIZINAN'],
    ['int-transmitter','PELANGGARAN_TRANSMITTER'],
    ['int-nota-dinas','NOTA_DINAS'],
    ['int-pengangkut','KAPAL_PENGANGKUT_IKAN_HIDUP']
  ];
  numMap.forEach(function(pair) {
    var v = _v(pair[0]);
    if (v !== '' && v !== null) items.push({ jenis: pair[1], jumlah: parseInt(v, 10) || 0 });
  });

  var kwRows = document.querySelectorAll('#int-kawasan-rows .int-kawasan-row');
  for (var i = 0; i < kwRows.length; i++) {
    var sel = kwRows[i].querySelector('.int-kw-sel');
    var jml = kwRows[i].querySelector('.int-kw-jml');
    var ket = kwRows[i].querySelector('.int-kw-ket');
    if (sel && sel.value) {
      items.push({
        jenis: 'KAWASAN_KONSERVASI',
        kawasanId: sel.value,
        jumlah: parseInt(jml && jml.value, 10) || 0,
        keterangan: ket ? ket.value : ''
      });
    }
  }

  if (items.length === 0) { _msg('int-form-msg', 'error', 'Minimal satu angka atau kawasan wajib diisi.'); return; }

  var btn = document.getElementById('int-btn-submit');
  _setLoading(btn, true);

  google.script.run
    .withSuccessHandler(function(res) {
      _setLoading(btn, false);
      if (res.success) {
        _msg('int-form-msg', 'success', res.data.message);
        var rowIds = (res.data && res.data.rowIds) || [];
        _intelResetForm();
        _attachUploadAll('intel', rowIds, function() {
          _intelLoadKPI();
          _intelLoadHistory();
          _msg('int-form-msg', '', '');
        });
      } else {
        _msg('int-form-msg', 'error', res.error);
      }
    })
    .withFailureHandler(function() {
      _setLoading(btn, false);
      _msg('int-form-msg', 'error', 'Koneksi terputus.');
    })
    .intelijen_submitMingguan(APP.token, { periode: periode, items: items });
}

function _intelResetForm() {
  ['int-dredging','int-perizinan','int-transmitter','int-nota-dinas','int-pengangkut'].forEach(function(id){
    var el = document.getElementById(id);
    if (el) el.value = '';
  });
  var wrap = document.getElementById('int-kawasan-rows');
  if (wrap) wrap.innerHTML = '';
  intelAddKawasanRow();
}

function _intelFindRow(rowId) {
  for (var i = 0; i < _INTEL.rows.length; i++) {
    if (String(_INTEL.rows[i].RowID) === String(rowId)) return _INTEL.rows[i];
  }
  return null;
}

  document.getElementById('int-revisi-info').textContent =
    (INTEL_LABELS[r.Jenis] || r.Jenis) + ' — Periode ' + r.Periode +
    (r.Jenis === 'KAWASAN_KONSERVASI' ? ' (' + (r.kawasanNama || r.KawasanID) + ')' : '');

    ]) + ')">Lihat</button>';

    var rowCls = (r.Status === 'VOID') ? 'style="background:#fef2f2;"' : (r.Status === 'SUPERSEDED' ? 'style="opacity:0.6;"' : '');
    var ts = r.Timestamp ? new Date(r.Timestamp).toLocaleDateString('id-ID') : '—';

    t += '<tr ' + rowCls + '>';
    t += '<td>' + _esc(r.Periode) + '</td>';
    t += '<td>' + _esc(label) + '</td>';
    t += '<td>' + (Number(r.Jumlah) || 0) + '</td>';
    t += '<td>' + _esc(detail) + '</td>';
    t += '<td>' + ts + '</td>';
    t += '<td>' + st + '</td>';
    t += '<td><div style="display:flex;gap:6px;">' + bLk + bRev + bAn + '</div></td>';
    t += '</tr>';

    if (r.Status === 'VOID' && r.VoidReason) {
      t += '<tr style="background:#fef2f2;"><td colspan="7" style="padding-top:0;border-bottom:1px solid #fee2e2;color:var(--n-status-critical);font-size:13px;">' +
        '<strong>Alasan Anulir:</strong> ' + _esc(r.VoidReason) + ' (oleh ' + _esc(r.VoidedBy) + ')</td></tr>';
    }
  }

  t += '</tbody></table>';
  wrap.innerHTML = t;
}

// ── Submit ──
function pemSubmit(e) {
  _msg('pem-form-msg', '', '');
  var attachErr = _attachValidate('pem');
  if (attachErr) { _msg('pem-form-msg', 'error', attachErr); return; }
  var periode = _composePeriode('pem-');
  if (!periode) { _msg('pem-form-msg', 'error', 'Periode wajib dipilih.'); return; }

  var items = [];
  [['pem-username','USERNAME'],['pem-skat','SKAT'],['pem-migrasi','PEMASANGAN_MIGRASI']].forEach(function(pair){
    var v = _v(pair[0]);
    if (v !== '' && v !== null) items.push({ jenis: pair[1], jumlah: parseInt(v, 10) || 0 });
  });

  var pRows = document.querySelectorAll('#pem-penyedia-rows .pem-penyedia-row');
  for (var i = 0; i < pRows.length; i++) {
    var nama = pRows[i].querySelector('.pem-penyedia-nama');
    var jml  = pRows[i].querySelector('.pem-penyedia-jml');
    if (nama && nama.value.trim()) {
      items.push({ jenis: 'PERSETUJUAN_PENYEDIA', namaPenyedia: nama.value.trim(), jumlah: parseInt(jml && jml.value, 10) || 1 });
    }
  }

  var mRows = document.querySelectorAll('#pem-marabahaya-rows .pem-marabahaya-row');
  for (var j = 0; j < mRows.length; j++) {
    var kapal = mRows[j].querySelector('.pem-mb-kapal');
    var kond  = mRows[j].querySelector('.pem-mb-kondisi');
    var stat  = mRows[j].querySelector('.pem-mb-status');
    if (kapal && kapal.value) {
      items.push({ jenis: 'MARABAHAYA', kapalId: kapal.value, kondisiDarurat: kond ? kond.value : '', statusPenanganan: stat ? stat.value : '' });
    }
  }

  if (items.length === 0) { _msg('pem-form-msg', 'error', 'Minimal satu data pemantauan wajib diisi.'); return; }

  var btn = document.getElementById('pem-btn-submit');
  _setLoading(btn, true);

  google.script.run
    .withSuccessHandler(function(res) {
      _setLoading(btn, false);
      if (res.success) {
        _msg('pem-form-msg', 'success', res.data.message);
        var rowIds = (res.data && res.data.rowIds) || [];
        _pemResetForm();
        _attachUploadAll('pem', rowIds, function() {
          _pemLoadKPI();
          _pemLoadHistory();
          _msg('pem-form-msg', '', '');
        });
      } else {
        _msg('pem-form-msg', 'error', res.error);
      }
    })
    .withFailureHandler(function() {
      _setLoading(btn, false);
      _msg('pem-form-msg', 'error', 'Koneksi terputus.');
    })
    .pemantauan_submitMingguan(APP.token, { periode: periode, items: items });
}

function _pemResetForm() {
  ['pem-username','pem-skat','pem-migrasi'].forEach(function(id){
    var el = document.getElementById(id);
    if (el) el.value = '';
  });
  var pw = document.getElementById('pem-penyedia-rows');
  if (pw) pw.innerHTML = '';
  var mw = document.getElementById('pem-marabahaya-rows');

  pemAddMarabahayaRow();
}

// ── FORMAT RUPIAH ─────────────────────────────────────────

function _rupiah(angka) {
  if (angka === null || angka === undefined) return 'Rp —';
  var n = parseFloat(angka) || 0;
  var prefix = n < 0 ? '-Rp ' : 'Rp ';
  return prefix + Math.abs(Math.round(n)).toLocaleString('id-ID');
}

function _renderPerawatan(el) {
  var tpl = document.getElementById('view-tpl-perawatan');
  if (!tpl) { el.innerHTML = _moduleStub('Perawatan'); return; }
  el.innerHTML = tpl.innerHTML;

  _RAWAT.tab = 'kesiapan';
  _rawatSetTab('kesiapan');

  _rawatLoadOptions();
  _rawatLoadKPI();
}

function _rawatSyncTabState() {
  var tabs = document.querySelectorAll('#rawat-tabs .n-tab');
  tabs.forEach(function (t) {
    t.classList.toggle('active', t.getAttribute('data-rawat-tab') === _RAWAT.tab);
  });
}

function _rawatSetTab(name) {
  if (name !== 'kesiapan' && name !== 'docking' && name !== 'item') return;
  _RAWAT.tab = name;
  _rawatSyncTabState();

  // Chart pane lama dibersihkan sebelum DOM pane di-rebuild
  _chartDestroy('rawd-chart-tahap');
  _chartDestroy('rawi-chart-kategori');

  var pane = document.getElementById('rawat-tab-pane');
  if (!pane) return;
  var tpl = document.getElementById('view-tpl-rawat-' + name);
  pane.innerHTML = tpl ? tpl.innerHTML : '';
  _rawatInitPane(name);
}

// RBAC UI mengikuti server: write = SUPERADMIN atau (KADIV/STAF DIV-RAWAT);
// anulir = SUPERADMIN/DIREKTUR atau KADIV DIV-RAWAT.
function _rawatCanWrite() {
  var u = APP.user || {};
  return u.role === 'SUPERADMIN' || (u.divisiId === 'DIV-RAWAT' && (u.role === 'STAF' || u.role === 'KADIV'));
}

function _rawatCanAnulir() {
  var u = APP.user || {};
  return u.role === 'SUPERADMIN' || u.role === 'DIREKTUR' || (u.divisiId === 'DIV-RAWAT' && u.role === 'KADIV');
}

function _rawatInitPane(name) {
  var prefix = _RAWAT_PREFIX[name] + '-';

  var formSection = document.getElementById(prefix + '-form-section');
  if (formSection) formSection.style.display = _rawatCanWrite() ? '' : 'none';

  var fbody = document.getElementById(prefix + '-form-body');
  var ficon = document.getElementById(prefix + '-form-toggle-icon');
  if (fbody) fbody.style.display = _RAWAT.formOpen[name] ? 'block' : 'none';
  if (ficon) ficon.textContent = _RAWAT.formOpen[name] ? '\u25be' : '\u25b8';

  _attachInit(name === 'kesiapan' ? 'rawk' : (name === 'docking' ? 'rawd' : 'rawi'), {
    refSheet: 'TX_Perawatan_' + (name === 'kesiapan' ? 'Kesiapan' : (name === 'docking' ? 'Docking' : 'Item'))
  });

  _opsInitPeriodeUi(prefix);
  ['tahun', 'bulan', 'minggu'].forEach(function (k) {
    var sel = document.getElementById(prefix + 'periode-' + k);
    if (sel) sel.onchange = function () { _rawatUpdatePeriodeHint(name); };
  });
  _rawatUpdatePeriodeHint(name);

  _rawatPopulateOptions();
  _rawatFetchHistory(name);
  _rawatBuildPaneCharts();

  if (name === 'kesiapan') _rawatKesiapanStatusChange();
}

function _rawatUpdatePeriodeHint(name) {
  var hint = document.getElementById(_RAWAT_PREFIX[name] + '-periode-hint');
  if (hint) hint.textContent = _composePeriode(_RAWAT_PREFIX[name] + '-') || '—';
}

function _rawatToggleForm(name) {
  var prefix = _RAWAT_PREFIX[name];
  var body = document.getElementById(prefix + '-form-body');
  var icon = document.getElementById(prefix + '-form-toggle-icon');
  if (!body) return;
  _RAWAT.formOpen[name] = !_RAWAT.formOpen[name];
  body.style.display = _RAWAT.formOpen[name] ? 'block' : 'none';
  if (icon) icon.textContent = _RAWAT.formOpen[name] ? '▾' : '▸';
}

function _rawatLoadOptions() {
  if (_RAWAT.options) { _rawatPopulateOptions(); return; }
  google.script.run
    .withSuccessHandler(function (res) {
      if (!res.success) return;
      _RAWAT.options = res.data;
      _rawatPopulateOptions();
    })
    .withFailureHandler(function () {})
    .perawatan_getOptions(APP.token);
}

function _rawatPopulateOptions() {
  if (!_RAWAT.options) return;
  var kapal = _RAWAT.options.kapal || [];

  ['rawk-kapal', 'rawd-kapal'].forEach(function (id) {
    var sel = document.getElementById(id);
    if (!sel) return;
    var prev = sel.value;
    sel.innerHTML = '<option value="">(Pilih Kapal)</option>';
    kapal.forEach(function (k) {
      var o = document.createElement('option');
      o.value = k.kapalId;
      o.textContent = k.nama + (k.aktif ? '' : ' (non-aktif)');
      sel.appendChild(o);
    });
    if (prev) sel.value = prev;
  });

  var dSel = document.getElementById('rawi-docking');
  if (dSel) {
    var pd = dSel.value;
    dSel.innerHTML = '<option value="">— Tidak terkait baris docking —</option>';
    (_RAWAT.options.docking || []).forEach(function (d) {
      var o = document.createElement('option');
      o.value = d.rowId;
      o.textContent = d.label;
      dSel.appendChild(o);
    });
    if (pd) dSel.value = pd;
  }
}

    .withSuccessHandler(function (res) {
      if (!res.success) { _msg('rawk-history-msg', 'error', res.error); return; }
      _RAWAT.kpi = res.data;
      _rawatRenderKPI(res.data);
      _rawatBuildCharts();
      _rawatBuildPaneCharts();
    })
    .withFailureHandler(function () {
      var s = document.getElementById('rawat-kpi-strip');
      if (s) s.innerHTML = '<div class="n-msg error show">Gagal memuat KPI Perawatan.</div>';
    })
    .perawatan_getKPI(APP.token, APP.filter);
}

function _rawatRenderKPI(d) {
  var el = document.getElementById('rawat-kpi-strip');
  if (!el) return;
  var k = d.kesiapan, dk = d.docking, it = d.item;

  var dockingAktif = 0;
  Object.keys(dk.byTahap).forEach(function (t) { if (t !== 'SELESAI') dockingAktif += dk.byTahap[t]; });

  el.innerHTML =
    '<div class="ov-kpi-row">' +
      _kpiHeadline('Armada Siap Operasi', k.siap, 'kapal', k.pctSiap + '% dari ' + k.totalArmada + ' armada aktif') +
      _kpiHeadline('Kapal Tidak Siap', k.tidakSiap, 'kapal', k.tidakSiap > 0 ? 'Perlu perhatian' : 'Seluruh armada siap') +
      _kpiHeadline('Docking Berjalan', dockingAktif, 'kapal', dk.total + ' kapal terdokumentasi') +
      _kpiHeadline('Nilai Item Pekerjaan', _rupiah(it.totalNilai), '', it.total + ' item tercatat') +
    '</div>';
}

// ── CHARTS ────────────────────────────────────────────────

function _rawatBuildCharts() {
  var k = (_RAWAT.kpi || {}).kesiapan;
  if (k) {
    _chartDonut('rawat-chart-kesiapan', ['Siap', 'Tidak Siap'], [k.siap, k.tidakSiap],
      [_CHART_COLORS.ok, _CHART_COLORS.crit],
      { center: k.pctSiap + '%', centerSub: 'Siap Operasi', emptyMsg: 'Belum ada status kesiapan pada periode ini.' });
  }
  _rawatLoadTren();
}

function _rawatLoadTren() {
  google.script.run
    .withSuccessHandler(function (res) {
      if (!res.success) return;
      var d = res.data;
      var labels = d.months.map(function (m) { return _chartMonthLabel(m); });
      _chartLine('rawat-chart-tren', labels, [
        { label: 'Siap',        data: d.siap,      color: _CHART_COLORS.ok },
        { label: 'Tidak Siap',  data: d.tidakSiap, color: _CHART_COLORS.crit }
      ], { fmt: _chartNum, emptyMsg: 'Belum ada status kesiapan pada rentang terpilih.' });
    })
    .withFailureHandler(function () {})
    .perawatan_getTren(APP.token, APP.filter);
}

function _rawatBuildPaneCharts() {
  var kpi = _RAWAT.kpi;
  if (!kpi) return;

  var dk = kpi.docking;
  var tahapKeys = ['PROSES_PENGADAAN', 'TANDATANGAN_KONTRAK', 'PROSES_DOCKING', 'SELESAI'];
  _chartBar('rawd-chart-tahap',
    tahapKeys.map(function (t) { return _RAWAT_TAHAP_LABEL[t] || t; }),
    [{ label: 'Kapal', data: tahapKeys.map(function (t) { return dk.byTahap[t] || 0; }), color: _CHART_COLORS.primary }],
    { horizontal: true, fmt: _chartNum, emptyMsg: 'Belum ada progres docking pada periode ini.' }
  );

  var it = kpi.item;
  var katKeys = ['PERENCANAAN', 'PROSES_PEMBAYARAN', 'SELESAI'];
  _chartDonut('rawi-chart-kategori',
    katKeys.map(function (k) { return _RAWAT_KATEGORI_LABEL[k] || k; }),
    katKeys.map(function (k) { return (it.byKategori[k] || {}).count || 0; }),
    [_CHART_COLORS.primary, _CHART_COLORS.warn, _CHART_COLORS.ok],
    { center: it.total, centerSub: 'Item', emptyMsg: 'Belum ada item pekerjaan pada periode ini.' }
  );
}

// ── HISTORY ───────────────────────────────────────────────

// Endpoint getter per jenis (ditulis eksplisit agar google.script.run aman)
function _rawatFetchHistory(jenis) {
  var prefix = _RAWAT_PREFIX[jenis];
  var wrap = document.getElementById(prefix + '-history-wrap');
  if (wrap) wrap.innerHTML = _loadingInline('Memuat riwayat\u2026');

  var runner = google.script.run
    .withSuccessHandler(function (res) {
      if (!res.success) {
        _msg(prefix + '-history-msg', 'error', res.error);
        if (wrap) wrap.innerHTML = '';
        return;
      }
      _RAWAT.history[jenis] = res.data;
      _rawatRenderHistory(jenis, res.data);
      _rawatLoadEvidenceCounts(jenis, res.data);
    })
    .withFailureHandler(function () {
      _msg(prefix + '-history-msg', 'error', 'Gagal memuat riwayat.');
    });

  if (jenis === 'kesiapan')      runner.perawatan_getKesiapan(APP.token, APP.filter);
  else if (jenis === 'docking')  runner.perawatan_getDocking(APP.token, APP.filter);
  else                           runner.perawatan_getItem(APP.token, APP.filter);
}

function _rawatRenderHistory(jenis, items) {
  var prefix = _RAWAT_PREFIX[jenis];
  var wrap = document.getElementById(prefix + '-history-wrap');
  if (!wrap) return;
  _hdReset();

  var canRevisi = _rawatCanWrite();
  var canAnulir = _rawatCanAnulir();

  if (!items || items.length === 0) {
    wrap.innerHTML = '<div style="padding:20px 24px;color:var(--n-text-muted);font-size:.875rem;">Belum ada laporan untuk periode ini.</div>';
    return;
  }

  var cols = _rawatColumns(jenis);
  var t = '<table class="n-table"><thead><tr>';
  cols.forEach(function (c) { t += '<th>' + c + '</th>'; });
  t += '<th>Tanggal</th><th>Status</th><th>Aksi</th></tr></thead><tbody>';

  items.forEach(function (r) {
    var st = '<span class="status-badge" style="background:#f3f4f6;color:#374151;">DITIMPA</span>';
    if (r.status === 'ACTIVE') st = '<span class="status-badge" style="background:var(--n-primary-light);color:var(--n-primary);">AKTIF</span>';
    else if (r.status === 'VOID') st = '<span class="status-badge" style="background:#fee2e2;color:var(--n-status-critical);">DIANULIR</span>';

    var bRev = (r.status === 'ACTIVE' && canRevisi) ? '<button class="btn-mini" onclick="_rawatOpenRevisi(\'' + jenis + '\',\'' + _esc(r.rowId) + '\')">Revisi</button>' : '';
    var bAn  = (r.status === 'ACTIVE' && canAnulir) ? '<button class="btn-mini" style="color:var(--n-status-critical);border-color:var(--n-status-critical);" onclick="_rawatOpenAnulir(\'' + jenis + '\',\'' + _esc(r.rowId) + '\')">Anulir</button>' : '';
    var bEv  = '<button class="btn-mini" onclick="_rawatOpenEvidence(\'' + jenis + '\',\'' + _esc(r.rowId) + '\')">Lampiran<span id="evc-' + jenis + '-' + _esc(r.rowId) + '"></span></button>';

    var detailFields = [['Periode', _esc(r.periode)], ['Dikirim', _esc(r.timestamp ? new Date(r.timestamp).toLocaleString('id-ID') : '—')], ['Status', _esc(r.status)]];
    if (jenis === 'kesiapan') {
      detailFields = [
        ['Periode', _esc(r.periode)],
        ['Kapal', _esc(r.kapalNama)],
        ['Status Kapal', r.statusSiap ? 'SIAP' : 'TIDAK SIAP'],
        ['Penyebab Ketidaksiapan', _esc(r.penyebab || '—')],
        ['Dikirim', _esc(r.timestamp ? new Date(r.timestamp).toLocaleString('id-ID') : '—')],
        ['Status', _esc(r.status)]
      ];
    } else if (jenis === 'docking') {
      detailFields = [
        ['Periode', _esc(r.periode)],
        ['Kapal', _esc(r.kapalNama)],
        ['Lokasi', _esc(_RAWAT_LOKASI_LABEL[r.lokasi] || r.lokasi)],
        ['Tahap', _esc(_RAWAT_TAHAP_LABEL[r.tahap] || r.tahap)],
        ['Nilai Kontrak', _rupiah(r.nilaiKontrak)],
        ['Kontraktor', _esc(r.kontraktor || '—')],
        ['Dikirim', _esc(r.timestamp ? new Date(r.timestamp).toLocaleString('id-ID') : '—')],
        ['Status', _esc(r.status)]
      ];
    } else {
      detailFields = [
        ['Periode', _esc(r.periode)],
        ['Nama Pekerjaan', _esc(r.namaPekerjaan)],
        ['Kategori', _esc(_RAWAT_KATEGORI_LABEL[r.kategori] || r.kategori)],
        ['Nilai', _rupiah(r.nilai)],
        ['Terkait Docking', _esc(r.dockingLabel || '—')],
        ['Dikirim', _esc(r.timestamp ? new Date(r.timestamp).toLocaleString('id-ID') : '—')],
        ['Status', _esc(r.status)]
      ];
    }
    var bLk = '<button class="btn-mini" onclick="_hdOpen(' + _hdPush(_RAWAT_SHEET[jenis], r.rowId, _RAWAT_LABEL[jenis] + ' — Periode ' + r.periode, detailFields) + ')">Lihat</button>';

    var rowCls = (r.status === 'VOID') ? 'style="background:#fef2f2;"' : (r.status === 'SUPERSEDED' ? 'style="opacity:0.6;"' : '');
    var tgl = r.timestamp ? new Date(r.timestamp).toLocaleDateString('id-ID') : '—';

    t += '<tr ' + rowCls + '>';
    _rawatCells(jenis, r).forEach(function (cell) { t += '<td>' + cell + '</td>'; });
    t += '<td>' + tgl + '</td>';
    t += '<td>' + st + '</td>';
    t += '<td><div style="display:flex;gap:6px;flex-wrap:wrap;">' + bLk + bRev + bAn + bEv + '</div></td>';
    t += '</tr>';

    if (r.status === 'VOID' && r.voidReason) {
      t += '<tr style="background:#fef2f2;"><td colspan="' + (cols.length + 3) + '" style="padding-top:0;border-bottom:1px solid #fee2e2;color:var(--n-status-critical);font-size:13px;">' +
        '<strong>Alasan Anulir:</strong> ' + _esc(r.voidReason) + (r.voidedBy ? ' (oleh ' + _esc(r.voidedBy) + ')' : '') +
        '</td></tr>';
    }
  });

  t += '</tbody></table>';
  wrap.innerHTML = t;
}

function _rawatColumns(jenis) {
  if (jenis === 'kesiapan') return ['Periode', 'Kapal', 'Status', 'Penyebab'];
  if (jenis === 'docking')  return ['Periode', 'Kapal', 'Lokasi', 'Tahap', 'Nilai Kontrak', 'Kontraktor'];
  return ['Periode', 'Nama Pekerjaan', 'Kategori', 'Nilai', 'Terkait Docking'];
}

function _rawatCells(jenis, r) {
  if (jenis === 'kesiapan') {
    var badge = r.statusSiap
      ? '<span class="status-badge" style="background:#dcfce7;color:#166534;">SIAP</span>'
      : '<span class="status-badge" style="background:#fee2e2;color:#b91c1c;">TIDAK SIAP</span>';
    return [_esc(r.periode), _esc(r.kapalNama), badge, _esc(r.penyebab || '—')];
  }
  if (jenis === 'docking') {
    return [
      _esc(r.periode),
      _esc(r.kapalNama),
      _esc(_RAWAT_LOKASI_LABEL[r.lokasi] || r.lokasi),
      _esc(_RAWAT_TAHAP_LABEL[r.tahap] || r.tahap),
      _rupiah(r.nilaiKontrak),
      _esc(r.kontraktor || '—')
    ];
  }
  return [
    _esc(r.periode),
    _esc(r.namaPekerjaan),
    _esc(_RAWAT_KATEGORI_LABEL[r.kategori] || r.kategori),
    _rupiah(r.nilai),
    _esc(r.dockingLabel || '—')
  ];
}

function _rawatLoadEvidenceCounts(jenis, items) {
  if (!items || !items.length) return;
  var ids = items.map(function (r) { return r.rowId; });
  google.script.run
    .withSuccessHandler(function (res) {
      if (!res || !res.success) return;
      var map = res.data || {};
      Object.keys(map).forEach(function (rid) {
        var el = document.getElementById('evc-' + jenis + '-' + rid);
        if (el) el.textContent = ' (' + map[rid].length + ')';
      });
    })
    .withFailureHandler(function () {})
    .evidence_listBatch(APP.token, _RAWAT_SHEET[jenis], ids);
}

// ── REVISI ────────────────────────────────────────────────

function _rawatOpenRevisi(jenis, rowId) {
  var row = (_RAWAT.history[jenis] || []).filter(function (r) { return r.rowId === rowId; })[0];
  if (!row) return;
  _RAWAT.revisi = { jenis: jenis, rowId: rowId };

  var info = document.getElementById('rawat-revisi-info');
  if (info) info.textContent = 'Merevisi ' + _RAWAT_LABEL[jenis] + ' periode ' + row.periode + '.';

  var fields = document.getElementById('rawat-revisi-fields');
  fields.innerHTML = _rawatRevisiFieldsHtml(jenis, row);

  document.getElementById('rawat-revisi-alasan').value = '';
  _msg('rawat-revisi-msg', null);
  document.getElementById('modal-rawat-revisi').classList.remove('n-hidden');
}

function _rawatRevisiFieldsHtml(jenis, row) {
  if (jenis === 'kesiapan') {
    return '<div class="form-grp"><label>Kapal</label>' +
      '<input type="text" value="' + _esc(row.kapalNama) + '" disabled></div>' +
      '<div style="display:grid;grid-template-columns:1fr 1fr;gap:14px;">' +
        '<div class="form-grp"><label>Status</label>' +
          '<select id="rv-rawk-status">' +
            '<option value="true"' + (row.statusSiap ? ' selected' : '') + '>Siap Operasi</option>' +
            '<option value="false"' + (row.statusSiap ? '' : ' selected') + '>Tidak Siap</option>' +
          '</select></div>' +
        '<div class="form-grp"><label>Penyebab (jika tidak siap)</label>' +
          '<input type="text" id="rv-rawk-penyebab" value="' + _esc(row.penyebab || '') + '"></div>' +
      '</div>';
  }
  if (jenis === 'docking') {
    var lok = ['PUSAT', 'UPT'].map(function (v) {
      return '<option value="' + v + '"' + (row.lokasi === v ? ' selected' : '') + '>' + _RAWAT_LOKASI_LABEL[v] + '</option>';
    }).join('');
    var tah = ['PROSES_PENGADAAN', 'TANDATANGAN_KONTRAK', 'PROSES_DOCKING', 'SELESAI'].map(function (v) {
      return '<option value="' + v + '"' + (row.tahap === v ? ' selected' : '') + '>' + _RAWAT_TAHAP_LABEL[v] + '</option>';
    }).join('');
    return '<div class="form-grp"><label>Kapal</label>' +
      '<input type="text" value="' + _esc(row.kapalNama) + '" disabled></div>' +
      '<div style="display:grid;grid-template-columns:1fr 1fr;gap:14px;">' +
        '<div class="form-grp"><label>Lokasi</label><select id="rv-rawd-lokasi">' + lok + '</select></div>' +
        '<div class="form-grp"><label>Tahap</label><select id="rv-rawd-tahap">' + tah + '</select></div>' +
      '</div>' +
      '<div style="display:grid;grid-template-columns:1fr 1fr;gap:14px;">' +
        '<div class="form-grp"><label>Nilai Kontrak (Rp)</label><input type="number" id="rv-rawd-nilai" min="0" value="' + (row.nilaiKontrak || 0) + '"></div>' +
        '<div class="form-grp"><label>Kontraktor</label><input type="text" id="rv-rawd-kontraktor" value="' + _esc(row.kontraktor || '') + '"></div>' +
      '</div>';
  }
  var kat = ['PERENCANAAN', 'PROSES_PEMBAYARAN', 'SELESAI'].map(function (v) {
    return '<option value="' + v + '"' + (row.kategori === v ? ' selected' : '') + '>' + _RAWAT_KATEGORI_LABEL[v] + '</option>';
  }).join('');
  var dockOpts = '<option value="">— Tidak terkait —</option>' +
    ((_RAWAT.options && _RAWAT.options.docking) || []).map(function (d) {
      return '<option value="' + _esc(d.rowId) + '"' + (row.dockingRowId === d.rowId ? ' selected' : '') + '>' + _esc(d.label) + '</option>';
    }).join('');
  return '<div class="form-grp"><label>Nama Pekerjaan</label>' +
    '<input type="text" id="rv-rawi-nama" value="' + _esc(row.namaPekerjaan) + '"></div>' +
    '<div style="display:grid;grid-template-columns:1fr 1fr;gap:14px;">' +
      '<div class="form-grp"><label>Kategori</label><select id="rv-rawi-kategori">' + kat + '</select></div>' +
      '<div class="form-grp"><label>Nilai (Rp)</label><input type="number" id="rv-rawi-nilai" min="0" value="' + (row.nilai || 0) + '"></div>' +
    '</div>' +
    '<div class="form-grp"><label>Terkait Docking</label><select id="rv-rawi-docking">' + dockOpts + '</select></div>';
}

function _rawatRevisiConfirm() {
  var jenis = _RAWAT.revisi.jenis;
  var btn = document.getElementById('rawat-btn-revisi-save');
  var alasan = _v('rawat-revisi-alasan');
  _msg('rawat-revisi-msg', null);
  if (!alasan.trim()) { _msg('rawat-revisi-msg', 'error', 'Alasan revisi wajib diisi.'); return; }
  _setLoading(btn, true);

  var params = { targetRowId: _RAWAT.revisi.rowId, alasanRevisi: alasan };
  if (jenis === 'kesiapan') {
    params.statusSiap = _v('rv-rawk-status') === 'true';
    params.penyebab   = _v('rv-rawk-penyebab');
  } else if (jenis === 'docking') {
    params.lokasi = _v('rv-rawd-lokasi');
    params.tahap = _v('rv-rawd-tahap');
    params.nilaiKontrak = _v('rv-rawd-nilai');
    params.kontraktor = _v('rv-rawd-kontraktor');
  } else {
    params.namaPekerjaan = _v('rv-rawi-nama');
    params.kategori = _v('rv-rawi-kategori');
    params.nilai = _v('rv-rawi-nilai');
    params.dockingRowId = _v('rv-rawi-docking');
  }

  var runner = google.script.run
    .withSuccessHandler(function (res) {
      _setLoading(btn, false);
      _rawatCloseRevisi();
      if (!res.success) { _msg(_RAWAT_PREFIX[jenis] + '-history-msg', 'error', res.error); return; }
      _msg(_RAWAT_PREFIX[jenis] + '-history-msg', 'success', res.data.message);
      _attachCarry('TX_Perawatan_' + (
        jenis === 'kesiapan' ? 'Kesiapan' : (jenis === 'docking' ? 'Docking' : 'Item')
      ), params.targetRowId, res.data.rowId);
      _rawatLoadKPI();
      _rawatFetchHistory(jenis);
    })
    .withFailureHandler(function () {
      _setLoading(btn, false);
      _msg('rawat-revisi-msg', 'error', 'Terjadi kesalahan. Coba lagi.');
    });

  if (jenis === 'kesiapan')      runner.perawatan_revisiKesiapan(APP.token, params);
  else if (jenis === 'docking')  runner.perawatan_revisiDocking(APP.token, params);
  else                           runner.perawatan_revisiItem(APP.token, params);
}

function _rawatCloseRevisi() {
  _RAWAT.revisi = { jenis: null, rowId: null };
  closeModal('modal-rawat-revisi');
}

// ── ANULIR ────────────────────────────────────────────────

function _rawatOpenAnulir(jenis, rowId) {
  var row = (_RAWAT.history[jenis] || []).filter(function (r) { return r.rowId === rowId; })[0];
  if (!row) return;
  _RAWAT.anulir = { jenis: jenis, rowId: rowId };
  var info = document.getElementById('rawat-anulir-info');
  if (info) info.textContent = 'Akan menganulir ' + _RAWAT_LABEL[jenis] + ' periode ' + row.periode + ' (ID: ' + rowId + ').';
  document.getElementById('rawat-anulir-alasan').value = '';
  _msg('rawat-anulir-msg', null);
  document.getElementById('modal-rawat-anulir').classList.remove('n-hidden');
}

function _rawatAnulirConfirm() {
  var jenis = _RAWAT.anulir.jenis;
  var btn = document.getElementById('rawat-btn-anulir-save');
  var alasan = _v('rawat-anulir-alasan');
  _msg('rawat-anulir-msg', null);
  if (!alasan.trim()) { _msg('rawat-anulir-msg', 'error', 'Komentar anulir wajib diisi.'); return; }
  _setLoading(btn, true);

  google.script.run
    .withSuccessHandler(function (res) {
      _setLoading(btn, false);
      _rawatCloseAnulir();
      if (!res.success) { _msg(_RAWAT_PREFIX[jenis] + '-history-msg', 'error', res.error); return; }
      _msg(_RAWAT_PREFIX[jenis] + '-history-msg', 'success', res.data.message);
      _rawatLoadKPI();
      _rawatFetchHistory(jenis);
    })
    .withFailureHandler(function () {
      _setLoading(btn, false);
      _msg('rawat-anulir-msg', 'error', 'Terjadi kesalahan. Coba lagi.');
    })
    .perawatan_anulir(APP.token, {
      jenis: jenis.toUpperCase(),
      targetRowId: _RAWAT.anulir.rowId,
      voidReason: alasan
    });
}

function _rawatCloseAnulir() {
  _RAWAT.anulir = { jenis: null, rowId: null };
  closeModal('modal-rawat-anulir');
}

// ── EVIDENCE ──────────────────────────────────────────────

function _rawatOpenEvidence(jenis, rowId) {
  _RAWAT.evidence = { refSheet: _RAWAT_SHEET[jenis], refRowId: rowId };
  var info = document.getElementById('rawat-evidence-info');
  if (info) info.textContent = 'Lampiran untuk ' + _RAWAT_LABEL[jenis] + ' (RowID: ' + rowId + ').';
  _msg('rawat-evidence-msg', null);
  var f = document.getElementById('rawat-evidence-file');
  if (f) f.value = '';
  var l = document.getElementById('rawat-evidence-link');
  if (l) l.value = '';
  _rawatLoadEvidence();
  document.getElementById('modal-rawat-evidence').classList.remove('n-hidden');
}

function _rawatCloseEvidence() {
  _RAWAT.evidence = { refSheet: null, refRowId: null };
  closeModal('modal-rawat-evidence');
}

function _rawatLoadEvidence() {
  var ev = _RAWAT.evidence;
  var list = document.getElementById('rawat-evidence-list');
  if (!ev.refSheet || !list) return;
  list.innerHTML = _loadingInline('Memuat lampiran\u2026');

  google.script.run
    .withSuccessHandler(function (res) {
      if (!res.success) { list.innerHTML = '<div class="n-msg error show">' + _esc(res.error) + '</div>'; return; }
      if (!res.data.length) { list.innerHTML = '<div style="color:var(--n-text-muted);font-size:.85rem;">Belum ada lampiran.</div>'; return; }
      list.innerHTML = res.data.map(function (e) {
        var tgl = e.uploadedAt ? new Date(e.uploadedAt).toLocaleString('id-ID') : '';
        return '<div style="display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--n-border-subtle);">' +
          '<a href="' + _esc(e.viewUrl) + '" target="_blank" style="color:var(--n-primary);font-size:.85rem;">' + _esc(e.fileName) + '</a>' +
          '<span style="font-size:.75rem;color:var(--n-text-muted);">' + _esc(e.sourceMode) + ' · ' + tgl + '</span>' +
        '</div>';
      }).join('');
    })
    .withFailureHandler(function () { list.innerHTML = '<div class="n-msg error show">Gagal memuat lampiran.</div>'; })
    .evidence_list(APP.token, ev.refSheet, ev.refRowId);
}

function _rawatEvidenceUploadFile() {
  var ev = _RAWAT.evidence;
  var fileEl = document.getElementById('rawat-evidence-file');
  var btn = document.getElementById('rawat-btn-evidence-upload');
  _msg('rawat-evidence-msg', null);
  if (!fileEl || !fileEl.files || !fileEl.files.length) {
    _msg('rawat-evidence-msg', 'error', 'Pilih file terlebih dahulu.');
    return;
  }
  var file = fileEl.files[0];
  var isVideo = /^video\//i.test(file.type);
  var limit = isVideo ? 50 * 1024 * 1024 : 15 * 1024 * 1024;
  if (file.size > limit) {
    _msg('rawat-evidence-msg', 'error', isVideo
      ? 'Ukuran video melebihi 50MB. Kompres terlebih dahulu.'
      : 'Ukuran file melebihi 15MB. Pilih file yang lebih kecil.');
    return;
  }

  _setLoading(btn, true);
  var reader = new FileReader();
  reader.onload = function () {
    var base64 = String(reader.result).split(',')[1] || '';
    google.script.run
      .withSuccessHandler(function (res) {
        _setLoading(btn, false);
        if (!res.success) { _msg('rawat-evidence-msg', 'error', res.error); return; }
        _msg('rawat-evidence-msg', 'success', res.data.message);
        fileEl.value = '';
        _rawatLoadEvidence();
        _rawatRefreshEvidenceCount(ev.refSheet, ev.refRowId);
      })
      .withFailureHandler(function () { _setLoading(btn, false); _msg('rawat-evidence-msg', 'error', 'Gagal mengunggah file. Coba lagi.'); })
      .evidence_upload(APP.token, {
        refSheet: ev.refSheet,
        refRowId: ev.refRowId,
        fileName: file.name,
        mimeType: file.type || 'application/octet-stream',
        dataBase64: base64
      });
  };
  reader.onerror = function () { _setLoading(btn, false); _msg('rawat-evidence-msg', 'error', 'Gagal membaca file.'); };
  reader.readAsDataURL(file);
}

function _rawatEvidenceUploadLink() {
  var ev = _RAWAT.evidence;
  var btn = document.getElementById('rawat-btn-evidence-link');
  var url = _v('rawat-evidence-link');
  _msg('rawat-evidence-msg', null);
  if (!url.trim()) { _msg('rawat-evidence-msg', 'error', 'Tempel link Google Drive terlebih dahulu.'); return; }
  _setLoading(btn, true);

  google.script.run
    .withSuccessHandler(function (res) {
      _setLoading(btn, false);
      if (!res.success) { _msg('rawat-evidence-msg', 'error', res.error); return; }
      _msg('rawat-evidence-msg', 'success', res.data.message);
      document.getElementById('rawat-evidence-link').value = '';
      _rawatLoadEvidence();
      _rawatRefreshEvidenceCount(ev.refSheet, ev.refRowId);
    })
    .withFailureHandler(function () { _setLoading(btn, false); _msg('rawat-evidence-msg', 'error', 'Gagal menyalin file. Coba lagi.'); })
    .evidence_uploadFromLink(APP.token, { refSheet: ev.refSheet, refRowId: ev.refRowId, url: url });
}

function _rawatRefreshEvidenceCount(refSheet, refRowId) {
  var jenis = null;
  Object.keys(_RAWAT_SHEET).forEach(function (j) { if (_RAWAT_SHEET[j] === refSheet) jenis = j; });
  if (!jenis) return;
  _rawatLoadEvidenceCounts(jenis, _RAWAT.history[jenis]);
}

// ============================================================
// MODUL LOGISTIK (Fase 10) — DIV-LOG
// Amunisi / BBM / Logistik Personil (mingguan + baseline tahunan)
// ============================================================

var _LOG = {
  tab: 'amunisi',
  options: null,
  kpi: null,
  history: { amunisi: [], bbm: [], personil: [] },
  formOpen: { amunisi: true, bbm: true, personil: true },
  revisi: { jenis: null, rowId: null, mode: null },
  anulir: { jenis: null, rowId: null }
};
var _LOG_LABEL  = { amunisi: 'Amunisi', bbm: 'BBM', personil: 'Logistik Personil' };
var _LOG_PREFIX = { amunisi: 'lga', bbm: 'lgb', personil: 'lgp' };
var _LOG_MODE_LABEL = { BASELINE: 'Baseline', PENGGUNAAN: 'Penggunaan' };
var _LOG_KOM_LABEL = {
  NATURA: 'Natura', BPDT: 'BPDT', AIR_BERSIH: 'Air Bersih', DELEGASI: 'Delegasi', JAGA_SANDAR: 'Jaga Sandar'
};

function _idNum(v) {
  var n = Number(v);
  return isNaN(n) ? '0' : n.toLocaleString('id-ID');
}

// ── RENDER UTAMA ────────────────────────────────────────

function _renderLogistik(el) {
  var tpl = document.getElementById('view-tpl-logistik');
  if (!tpl) { el.innerHTML = _moduleStub('Logistik'); return; }
  el.innerHTML = tpl.innerHTML;

  _LOG.tab = 'amunisi';
  _logSetTab('amunisi');

  _logLoadOptions();
  _logLoadKPI();
}

function _logSyncTabState() {
  var tabs = document.querySelectorAll('#log-tabs .n-tab');
  tabs.forEach(function (t) {
    t.classList.toggle('active', t.getAttribute('data-log-tab') === _LOG.tab);
  });
}

function _logSetTab(name) {
  if (!_LOG_LABEL[name]) return;
  _LOG.tab = name;
  _logSyncTabState();

  _logDestroyPaneCharts();

  var pane = document.getElementById('log-tab-pane');
  if (!pane) return;
  var tpl = document.getElementById('view-tpl-log-' + name);
  pane.innerHTML = tpl ? tpl.innerHTML : '';
  _logInitPane(name);
}

// RBAC UI mengikuti server: write = SUPERADMIN atau (KADIV/STAF DIV-LOG);
// anulir = SUPERADMIN/DIREKTUR atau KADIV DIV-LOG.
function _logCanWrite() {
  var u = APP.user || {};
  return u.role === 'SUPERADMIN' || (u.divisiId === 'DIV-LOG' && (u.role === 'STAF' || u.role === 'KADIV'));
}

function _logCanAnulir() {
  var u = APP.user || {};
  return u.role === 'SUPERADMIN' || u.role === 'DIREKTUR' || (u.divisiId === 'DIV-LOG' && u.role === 'KADIV');
}

function _logInitPane(name) {
  var prefix = _LOG_PREFIX[name] + '-';

  var formSection = document.getElementById(prefix + 'form-section');
  if (formSection) formSection.style.display = _logCanWrite() ? '' : 'none';

  var fbody = document.getElementById(prefix + 'form-body');
  var ficon = document.getElementById(prefix + 'form-toggle-icon');
  if (fbody) fbody.style.display = _LOG.formOpen[name] ? 'block' : 'none';
  if (ficon) ficon.textContent = _LOG.formOpen[name] ? '\u25be' : '\u25b8';

  _opsInitPeriodeUi(prefix);
  ['tahun', 'bulan', 'minggu'].forEach(function (k) {
    var sel = document.getElementById(prefix + 'periode-' + k);
    if (sel) sel.onchange = function () { _logUpdatePeriodeHint(name); };
  });
  _logUpdatePeriodeHint(name);

  _attachInit(name === 'amunisi' ? 'lga' : (name === 'bbm' ? 'lgb' : 'lgp'), {
    refSheet: 'TX_Logistik_' + (name === 'amunisi' ? 'Amunisi' : (name === 'bbm' ? 'BBM' : 'Personil'))
  });

  _logPopulateOptions();
  if (name === 'amunisi') _logAmunisiModeChange();
  if (name === 'bbm')     _logBbmModeChange();

  _logFetchHistory(name);
  _logBuildPaneCharts();
}

function _logUpdatePeriodeHint(name) {
  var hint = document.getElementById(_LOG_PREFIX[name] + '-periode-hint');
  if (hint) hint.textContent = _composePeriode(_LOG_PREFIX[name] + '-') || '—';
}

function _logToggleForm(name) {
  var prefix = _LOG_PREFIX[name];
  var body = document.getElementById(prefix + '-form-body');
  var icon = document.getElementById(prefix + '-form-toggle-icon');
  if (!body) return;
  _LOG.formOpen[name] = !_LOG.formOpen[name];
  body.style.display = _LOG.formOpen[name] ? 'block' : 'none';
  if (icon) icon.textContent = _LOG.formOpen[name] ? '▾' : '▸';
}

// ── OPTIONS ───────────────────────────────────────────────

function _logLoadOptions() {
  if (_LOG.options) { _logPopulateOptions(); return; }
  google.script.run
    .withSuccessHandler(function (res) {
      if (!res.success) return;
      _LOG.options = res.data;
      _logPopulateOptions();
    })
    .withFailureHandler(function () {})
    .logistik_getOptions(APP.token);
}

function _logPopulateOptions() {
  if (!_LOG.options) return;

  var aSel = document.getElementById('lga-jenis');
  if (aSel) {
    var pa = aSel.value;
    aSel.innerHTML = '<option value="">(Pilih Jenis Amunisi)</option>';
    (_LOG.options.amunisi || []).forEach(function (j) {
      var o = document.createElement('option');
      o.value = j;
      o.textContent = j;
      aSel.appendChild(o);
    });
    if (pa) aSel.value = pa;
  }

  var pSel = document.getElementById('lgp-komponen');
  if (pSel) {
    var pp = pSel.value;
    pSel.innerHTML = '<option value="">(Pilih Komponen)</option>';
    (_LOG.options.personil || []).forEach(function (k) {
      var o = document.createElement('option');
      o.value = k;
      o.textContent = _LOG_KOM_LABEL[k] || k;
      pSel.appendChild(o);
    });
    if (pp) pSel.value = pp;
  }
}

// ── MODE BASELINE / PENGGUNAAN ───────────────────────────

function _logAmunisiModeChange() {
  var base = _v('lga-mode') === 'BASELINE';
  var sg = document.getElementById('lga-stok-grp');
  var pg = document.getElementById('lga-penggunaan-grp');
  if (sg) sg.style.display = base ? 'block' : 'none';
  if (pg) pg.style.display = base ? 'none' : 'block';
  var lbl = document.getElementById('lga-form-toggle-label');
  if (lbl) lbl.textContent = base ? 'Input Stok Awal Tahun (baseline)' : 'Input Penggunaan Amunisi';
}

function _logBbmModeChange() {
  var base = _v('lgb-mode') === 'BASELINE';
  var pg = document.getElementById('lgb-pagu-grp');
  var rg = document.getElementById('lgb-realisasi-grp');
  var ig = document.getElementById('lgb-info-grp');
  if (pg) pg.style.display = base ? 'block' : 'none';
  if (rg) rg.style.display = base ? 'none' : 'block';
  if (ig) ig.style.display = base ? 'none' : 'grid';
  var lbl = document.getElementById('lgb-form-toggle-label');
  if (lbl) lbl.textContent = base ? 'Input Pagu Tahun (baseline)' : 'Input Realisasi BBM';
}

// ── KPI ───────────────────────────────────────────────────

function _logLoadKPI() {
  var strip = document.getElementById('log-kpi-strip');
  if (strip) strip.innerHTML = _kpiSkeleton(4);

  google.script.run
    .withSuccessHandler(function (res) {
      if (!res.success) { _msg('lga-history-msg', 'error', res.error); return; }
      _LOG.kpi = res.data;
      _logRenderKPI(res.data);
      _logBuildCharts();
      _logBuildPaneCharts();
    })
    .withFailureHandler(function () {
      var s = document.getElementById('log-kpi-strip');
      if (s) s.innerHTML = '<div class="n-msg error show">Gagal memuat KPI Logistik.</div>';
    })
    .logistik_getKPI(APP.token, APP.filter);
}

function _logRenderKPI(d) {
  var el = document.getElementById('log-kpi-strip');
  if (!el) return;
  el.innerHTML =
    '<div class="ov-kpi-row">' +
      _kpiHeadline('Stok Akhir Amunisi', _idNum(d.totalStokAkhir), 'tembakan', d.amunisi.length + ' jenis terpantau') +
      _kpiHeadline('Realisasi BBM', _idNum(d.totalBBMRealisasi), 'liter', 'Kumulatif tahun berjalan') +
      _kpiHeadline('Sisa Pagu BBM', _idNum(d.totalBBMSisa), 'liter', 'Pagu dikurangi realisasi') +
      _kpiHeadline('Logistik Personil', _rupiah(d.totalPersonil), '', 'Jumlah dalam rentang filter') +
    '</div>';
}

// ── CHARTS ────────────────────────────────────────────────

function _logDestroyPaneCharts() {
  _chartDestroy('lga-chart-donut');
  _chartDestroy('lgb-chart-pct');
  _chartDestroy('lgp-chart-komponen');
}

function _logBuildCharts() {
  var k = _LOG.kpi;
  if (!k) return;

  // Stok akhir amunisi per jenis (ranking horizontal)
  _chartBar('log-chart-stok',
    k.amunisi.map(function (x) { return x.jenis; }),
    [{ label: 'Stok Akhir', data: k.amunisi.map(function (x) { return x.stokAkhir; }), color: _CHART_COLORS.primary }],
    { horizontal: true, fmt: _chartNum, emptyMsg: 'Belum ada baseline amunisi pada tahun berjalan.' }
  );

  _logLoadTren();
}

function _logLoadTren() {
  google.script.run
    .withSuccessHandler(function (res) {
      if (!res.success) return;
      var d = res.data;
      var labels = d.months.map(function (m) { return _chartMonthLabel(m); });
      var amTot = d.months.map(function (_, i) {
        return Object.keys(d.amunisi).reduce(function (s, j) { return s + (d.amunisi[j][i] || 0); }, 0);
      });
      var bbTot = d.months.map(function (_, i) {
        return Object.keys(d.bbm).reduce(function (s, j) { return s + (d.bbm[j][i] || 0); }, 0);
      });
      _chartLine('log-chart-tren', labels, [
        { label: 'Penggunaan Amunisi', data: amTot, color: _CHART_COLORS.primary },
        { label: 'Realisasi BBM',       data: bbTot, color: _CHART_COLORS.warn }
      ], { fmt: _chartNum, emptyMsg: 'Belum ada penggunaan/realisasi pada rentang terpilih.' });
    })
    .withFailureHandler(function () {})
    .logistik_getTren(APP.token, APP.filter);
}

function _logBuildPaneCharts() {
  var k = _LOG.kpi;
  if (!k) return;

  // Donut sisa vs terpakai (semua jenis amunisi)
  var sisa = k.amunisi.reduce(function (s, x) { return s + x.stokAkhir; }, 0);
  var terpakai = k.amunisi.reduce(function (s, x) { return s + x.penggunaan; }, 0);
  _chartDonut('lga-chart-donut', ['Sisa', 'Terpakai'], [sisa, terpakai],
    [_CHART_COLORS.ok, _CHART_COLORS.warn],
    { center: _idNum(sisa), centerSub: 'Sisa Stok', emptyMsg: 'Belum ada baseline amunisi.' });

  // Bar % realisasi terhadap pagu per jenis BBM
  _chartBar('lgb-chart-pct',
    k.bbm.map(function (x) { return x.jenis; }),
    [{ label: 'Realisasi % Pagu', data: k.bbm.map(function (x) { return x.pct; }), color: _CHART_COLORS.primary }],
    { horizontal: false, fmt: function (v) { return v + '%'; }, emptyMsg: 'Belum ada pagu BBM tahun berjalan.' }
  );

  // Bar nilai personil per komponen
  _chartBar('lgp-chart-komponen',
    k.personil.map(function (x) { return _LOG_KOM_LABEL[x.komponen] || x.komponen; }),
    [{ label: 'Nilai', data: k.personil.map(function (x) { return x.total; }), color: _CHART_COLORS.primary }],
    { horizontal: true, fmt: _rupiah, emptyMsg: 'Belum ada nilai logistik personil pada periode ini.' }
  );
}

// ── HISTORY ───────────────────────────────────────────────

function _logFetchHistory(jenis) {
  var prefix = _LOG_PREFIX[jenis];
  var wrap = document.getElementById(prefix + '-history-wrap');
  if (wrap) wrap.innerHTML = _loadingInline('Memuat riwayat\u2026');

  var runner = google.script.run
    .withSuccessHandler(function (res) {
      if (!res.success) {
        _msg(prefix + '-history-msg', 'error', res.error);
        if (wrap) wrap.innerHTML = '';
        return;
      }
      _LOG.history[jenis] = res.data;
      _logRenderHistory(jenis, res.data);
    })
    .withFailureHandler(function () {
      _msg(prefix + '-history-msg', 'error', 'Gagal memuat riwayat.');
    });

  if (jenis === 'amunisi')  runner.logistik_getAmunisi(APP.token, APP.filter);
  else if (jenis === 'bbm') runner.logistik_getBBM(APP.token, APP.filter);
  else                      runner.logistik_getPersonil(APP.token, APP.filter);
}

function _logModeBadge(mode) {
  if (mode === 'BASELINE') return '<span class="status-badge" style="background:#fef3c7;color:#92400e;">BASELINE</span>';
  return '<span class="status-badge" style="background:#f1f5f9;color:#475569;">PENGGUNAAN</span>';
}

function _logRenderHistory(jenis, items) {
  var prefix = _LOG_PREFIX[jenis];
  var wrap = document.getElementById(prefix + '-history-wrap');
  if (!wrap) return;
  _hdReset();

  var canRevisi = _logCanWrite();
  var canAnulir = _logCanAnulir();

  if (!items || items.length === 0) {
    wrap.innerHTML = '<div style="padding:20px 24px;color:var(--n-text-muted);font-size:.875rem;">Belum ada laporan untuk periode ini.</div>';
    return;
  }

  var cols = _logColumns(jenis);
  var t = '<table class="n-table"><thead><tr>';
  cols.forEach(function (c) { t += '<th>' + c + '</th>'; });
  t += '<th>Tanggal</th><th>Status</th><th>Aksi</th></tr></thead><tbody>';

  items.forEach(function (r) {
    var st = '<span class="status-badge" style="background:#f3f4f6;color:#374151;">DITIMPA</span>';
    if (r.status === 'ACTIVE') st = '<span class="status-badge" style="background:var(--n-primary-light);color:var(--n-primary);">AKTIF</span>';
    else if (r.status === 'VOID') st = '<span class="status-badge" style="background:#fee2e2;color:var(--n-status-critical);">DIANULIR</span>';

    var bRev = (r.status === 'ACTIVE' && canRevisi) ? '<button class="btn-mini" onclick="_logOpenRevisi(\'' + jenis + '\',\'' + _esc(r.rowId) + '\')">Revisi</button>' : '';
    var bAn  = (r.status === 'ACTIVE' && canAnulir) ? '<button class="btn-mini" style="color:var(--n-status-critical);border-color:var(--n-status-critical);" onclick="_logOpenAnulir(\'' + jenis + '\',\'' + _esc(r.rowId) + '\')">Anulir</button>' : '';

    var detailFields = [['Periode', _esc(r.periode)], ['Dikirim', _esc(r.timestamp ? new Date(r.timestamp).toLocaleString('id-ID') : '—')], ['Status', _esc(r.status)]];
    if (jenis === 'amunisi') {
      detailFields = [
        ['Periode', _esc(r.periode)],
        ['Jenis', _esc(r.jenis)],
        ['Mode', _esc(r.mode)],
        ['Stok Awal', r.mode === 'BASELINE' ? _idNum(r.stokAwal) : '—'],
        ['Penggunaan Minggu Ini', r.mode === 'PENGGUNAAN' ? _idNum(r.penggunaan) : '—'],
        ['Dikirim', _esc(r.timestamp ? new Date(r.timestamp).toLocaleString('id-ID') : '—')],
        ['Status', _esc(r.status)]
      ];
    } else if (jenis === 'bbm') {
      detailFields = [
        ['Periode', _esc(r.periode)],
        ['Jenis', _esc(r.jenis)],
        ['Mode', _esc(r.mode)],
        ['Pagu', r.mode === 'BASELINE' ? _idNum(r.pagu) : '—'],
        ['Realisasi', r.mode === 'PENGGUNAAN' ? _idNum(r.realisasi) : '—'],
        ['Harga Acuan', _esc(r.hargaAcuan || '—')],
        ['Tunggakan', _esc(r.tunggakan || '—')],
        ['Dikirim', _esc(r.timestamp ? new Date(r.timestamp).toLocaleString('id-ID') : '—')],
        ['Status', _esc(r.status)]
      ];
    } else {
      detailFields = [
        ['Periode', _esc(r.periode)],
        ['Komponen', _esc(_LOG_KOM_LABEL[r.komponen] || r.komponen)],
        ['Nilai (Rp)', _rupiah(r.nilai)],
        ['Dikirim', _esc(r.timestamp ? new Date(r.timestamp).toLocaleString('id-ID') : '—')],
        ['Status', _esc(r.status)]
      ];
    }
    var bLk = '<button class="btn-mini" onclick="_hdOpen(' + _hdPush('TX_Logistik_' + (jenis === 'amunisi' ? 'Amunisi' : (jenis === 'bbm' ? 'BBM' : 'Personil')), r.rowId, _LOG_LABEL[jenis] + ' — Periode ' + r.periode, detailFields) + ')">Lihat</button>';

    var rowCls = (r.status === 'VOID') ? 'style="background:#fef2f2;"' : (r.status === 'SUPERSEDED' ? 'style="opacity:0.6;"' : '');
    var tgl = r.timestamp ? new Date(r.timestamp).toLocaleDateString('id-ID') : '—';

    t += '<tr ' + rowCls + '>';
    _logCells(jenis, r).forEach(function (cell) { t += '<td>' + cell + '</td>'; });
    t += '<td>' + tgl + '</td>';
    t += '<td>' + st + '</td>';
    t += '<td><div style="display:flex;gap:6px;flex-wrap:wrap;">' + bLk + bRev + bAn + '</div></td>';
    t += '</tr>';

    if (r.status === 'VOID' && r.voidReason) {
      t += '<tr style="background:#fef2f2;"><td colspan="' + (cols.length + 3) + '" style="padding-top:0;border-bottom:1px solid #fee2e2;color:var(--n-status-critical);font-size:13px;">' +
        '<strong>Alasan Anulir:</strong> ' + _esc(r.voidReason) + (r.voidedBy ? ' (oleh ' + _esc(r.voidedBy) + ')' : '') +
        '</td></tr>';
    }
  });

  t += '</tbody></table>';
  wrap.innerHTML = t;
}

function _logColumns(jenis) {
  if (jenis === 'amunisi')  return ['Periode', 'Jenis', 'Mode', 'StokAwal', 'Penggunaan Minggu'];
  if (jenis === 'bbm')      return ['Periode', 'Jenis', 'Mode', 'Pagu', 'Realisasi', 'Harga Acuan', 'Tunggakan'];
  return ['Periode', 'Komponen', 'Nilai (Rp)'];
}

function _logCells(jenis, r) {
  if (jenis === 'amunisi') {
    return [
      _esc(r.periode),
      _esc(r.jenis),
      _logModeBadge(r.mode),
      r.mode === 'BASELINE' ? _idNum(r.stokAwal) : '—',
      r.mode === 'PENGGUNAAN' ? _idNum(r.penggunaan) : '—'
    ];
  }
  if (jenis === 'bbm') {
    return [
      _esc(r.periode),
      _esc(r.jenis),
      _logModeBadge(r.mode),
      r.mode === 'BASELINE' ? _idNum(r.pagu) : '—',
      r.mode === 'PENGGUNAAN' ? _idNum(r.realisasi) : '—',
      _esc(r.hargaAcuan || '—'),
      _esc(r.tunggakan || '—')
    ];
  }
  return [
    _esc(r.periode),
    _esc(_LOG_KOM_LABEL[r.komponen] || r.komponen),
    _rupiah(r.nilai)
  ];
}

  var m = row.mode || 'PENGGUNAAN';

    }
    return '<div class="form-grp"><label>Jenis Amunisi</label>' +
      '<input type="text" value="' + _esc(row.jenis) + '" disabled></div>' +
      '<div class="form-grp"><label>Penggunaan Minggu Ini</label>' +
      '<input type="number" id="rv-lga-penggunaan" min="0" step="1" value="' + (row.penggunaan || 0) + '"></div>';
  }
  if (jenis === 'bbm') {
    if (m === 'BASELINE') {
      return '<div class="form-grp"><label>Jenis BBM</label>' +
        '<input type="text" value="' + _esc(row.jenis) + '" disabled></div>' +
        '<div class="form-grp"><label>Pagu Tahun</label>' +
        '<input type="number" id="rv-lgb-pagu" min="0" step="1" value="' + (row.pagu || 0) + '"></div>';

        '<input type="number" id="rv-lgb-realisasi" min="0" step="1" value="' + (row.realisasi || 0) + '"></div>' +
        '<div class="form-grp"><label>Harga Acuan</label>' +
        '<input type="number" id="rv-lgb-harga" min="0" step="1" value="' + _esc(row.hargaAcuan || '') + '"></div>' +
      '</div>' +
      '<div class="form-grp"><label>Status Tunggakan</label>' +
      '<input type="text" id="rv-lgb-tunggakan" value="' + _esc(row.tunggakan || '') + '"></div>';

    '<input type="text" value="' + _esc(_LOG_KOM_LABEL[row.komponen] || row.komponen) + '" disabled></div>' +

function _logRevisiConfirm() {
  var jenis = _LOG.revisi.jenis;
  var btn = document.getElementById('log-btn-revisi-save');
  var alasan = _v('log-revisi-alasan');
  _msg('log-revisi-msg', null);
  if (!alasan.trim()) { _msg('log-revisi-msg', 'error', 'Alasan revisi wajib diisi.'); return; }
  _setLoading(btn, true);

  var params = { targetRowId: _LOG.revisi.rowId, alasanRevisi: alasan };
  if (jenis === 'amunisi') {
    if (_LOG.revisi.mode === 'BASELINE') params.stokAwal = _v('rv-lga-stok');
    else params.penggunaan = _v('rv-lga-penggunaan');
  } else if (jenis === 'bbm') {
    if (_LOG.revisi.mode === 'BASELINE') params.pagu = _v('rv-lgb-pagu');
    else {
      params.realisasi = _v('rv-lgb-realisasi');
      params.hargaAcuan = _v('rv-lgb-harga');
      params.tunggakanStatus = _v('rv-lgb-tunggakan');
    }
  } else {
    params.nilai = _v('rv-lgp-nilai');
  }

  var runner = google.script.run
    .withSuccessHandler(function (res) {
      _setLoading(btn, false);
      _logCloseRevisi();
      if (!res.success) { _msg(_LOG_PREFIX[jenis] + '-history-msg', 'error', res.error); return; }
      _msg(_LOG_PREFIX[jenis] + '-history-msg', 'success', res.data.message);
      (res.data.warnings || []).forEach(function (w) { _msg(_LOG_PREFIX[jenis] + '-history-msg', 'warn', w); });
      _attachCarry('TX_Logistik_' + (
        jenis === 'amunisi' ? 'Amunisi' : (jenis === 'bbm' ? 'BBM' : 'Personil')
      ), params.targetRowId, res.data.rowId);
      _logLoadKPI();
      _logFetchHistory(jenis);
    })
    .withFailureHandler(function () {
      _setLoading(btn, false);
      _msg('log-revisi-msg', 'error', 'Terjadi kesalahan. Coba lagi.');
    });

  if (jenis === 'amunisi')  runner.logistik_revisiAmunisi(APP.token, params);
  else if (jenis === 'bbm') runner.logistik_revisiBBM(APP.token, params);
  else                      runner.logistik_revisiPersonil(APP.token, params);

function _logCloseRevisi() {
  _LOG.revisi = { jenis: null, rowId: null, mode: null };
  closeModal('modal-log-revisi');
}

  options: null,
  kpi: null,
  history: { akn: [], kegiatan: [] },
