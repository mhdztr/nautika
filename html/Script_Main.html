var _RAWAT = {
  tab: 'kesiapan',
  options: null,                                   // {kapal:[], docking:[]}
  kpi: null,
  history: { kesiapan: [], docking: [], item: [] },
  revisi:   { jenis: null, rowId: null },
  anulir:   { jenis: null, rowId: null },
  evidence: { refSheet: null, refRowId: null }
};

var _RAWAT_SHEET  = { kesiapan: 'TX_Perawatan_Kesiapan', docking: 'TX_Perawatan_Docking', item: 'TX_Perawatan_Item' };
var _RAWAT_LABEL  = { kesiapan: 'Kesiapan Kapal', docking: 'Docking', item: 'Item Pekerjaan' };
var _RAWAT_PREFIX = { kesiapan: 'rawk', docking: 'rawd', item: 'rawi' };

// Peta token -> teks tampilan & daftar pilihan semuanya berasal dari sheet
// `Opsi` (server: perawatan_getOptions) — bukan lagi peta hardcoded di frontend.
function _rawatLbl(map, token) {
  var t = String(token || '');
  return ((_RAWAT.options || {})[map] || {})[t] || t;
}
// Daftar token aktif sebuah grup Opsi (dari server), untuk mengisi <select> &
// membangunkunci chart. Selalu berupa array (kosong sebelum opsi termuat).
function _rawatOpsi(grup) {
  var items = (_RAWAT.options || {})[grup] || [];
  return items.map(function (it) { return typeof it === 'string' ? it : it.value; });
}
function _rawatLokasiLbl(t)   { return _rawatLbl('labelLokasi', t); }
function _rawatTahapLbl(t)    { return _rawatLbl('labelTahap', t); }
function _rawatKategoriLbl(t) { return _rawatLbl('labelKategori', t); }

// ── RENDER UTAMA ──────────────────────────────────────────

function _renderPerawatan(el) {
  var tpl = document.getElementById('view-tpl-perawatan');
  if (!tpl) { el.innerHTML = _moduleStub('Perawatan'); return; }
  el.innerHTML = tpl.innerHTML;

  _RAWAT.tab = 'kesiapan';
  _rawatSetTab('kesiapan');

  _rawatLoadOptions();
  _rawatLoadKPI();
}

function _rawatSyncTabState() {
  var tabs = document.querySelectorAll('#rawat-tabs .n-tab');
  tabs.forEach(function (t) {
    t.classList.toggle('active', t.getAttribute('data-rawat-tab') === _RAWAT.tab);
  });
}

function _rawatSetTab(name) {
  if (name !== 'kesiapan' && name !== 'docking' && name !== 'item') return;
  _RAWAT.tab = name;
  _rawatSyncTabState();

  // Chart pane lama dibersihkan sebelum DOM pane di-rebuild
  _chartDestroy('rawd-chart-tahap');
  _chartDestroy('rawi-chart-kategori');

  var pane = document.getElementById('rawat-tab-pane');
  if (!pane) return;
  var tpl = document.getElementById('view-tpl-rawat-' + name);
  pane.innerHTML = tpl ? tpl.innerHTML : '';
  _rawatInitPane(name);
}

// RBAC UI mengikuti server: write = SUPERADMIN atau (KADIV/STAF DIV-RAWAT);
// anulir = SUPERADMIN/DIREKTUR atau KADIV DIV-RAWAT.
function _rawatCanWrite() {
  var u = APP.user || {};
  return u.role === 'SUPERADMIN' || (u.divisiId === 'DIV-RAWAT' && (u.role === 'STAF' || u.role === 'KADIV'));
}

function _rawatCanAnulir() {
  var u = APP.user || {};
  return u.role === 'SUPERADMIN' || u.role === 'DIREKTUR' || (u.divisiId === 'DIV-RAWAT' && u.role === 'KADIV');
}

function _rawatInitPane(name) {
  var prefix = _RAWAT_PREFIX[name] + '-';

  var formSection = document.getElementById(prefix + '-form-section');
  if (formSection) formSection.style.display = _rawatCanWrite() ? '' : 'none';

  _attachInit(name === 'kesiapan' ? 'rawk' : (name === 'docking' ? 'rawd' : 'rawi'), {
    refSheet: 'TX_Perawatan_' + (name === 'kesiapan' ? 'Kesiapan' : (name === 'docking' ? 'Docking' : 'Item'))
  });

  _opsInitPeriodeUi(prefix);
  ['tahun', 'bulan', 'minggu'].forEach(function (k) {
    var sel = document.getElementById(prefix + 'periode-' + k);
    if (sel) sel.onchange = function () { _rawatUpdatePeriodeHint(name); };
  });
  _rawatUpdatePeriodeHint(name);

  _rawatPopulateOptions();
  _rawatFetchHistory(name);
  _rawatBuildPaneCharts();

  if (name === 'kesiapan') _rawatKesiapanStatusChange();
}

function _rawatUpdatePeriodeHint(name) {
  var hint = document.getElementById(_RAWAT_PREFIX[name] + '-periode-hint');
  if (hint) hint.textContent = _composePeriode(_RAWAT_PREFIX[name] + '-') || '—';
}

// Form popup: reset field + attach, lalu tampilkan modal (Backlog A)
function _rawatOpenForm(name) {
  var prefix = _RAWAT_PREFIX[name];
  var key = name === 'kesiapan' ? 'rawk' : (name === 'docking' ? 'rawd' : 'rawi');

  if (name === 'kesiapan') {
    var status = document.getElementById('rawk-status');
    if (status) { status.value = 'true'; _rawatKesiapanStatusChange(); }
    var penyebab = document.getElementById('rawk-penyebab');
    if (penyebab) penyebab.value = '';
  } else if (name === 'docking') {
    var nilaiD = document.getElementById('rawd-nilai');
    if (nilaiD) nilaiD.value = '';
    var kontraktor = document.getElementById('rawd-kontraktor');
    if (kontraktor) kontraktor.value = '';
    var lokasi = document.getElementById('rawd-lokasi');
    if (lokasi) lokasi.selectedIndex = 0;
    var tahap = document.getElementById('rawd-tahap');
    if (tahap) tahap.selectedIndex = 0;
  } else {
    var nama = document.getElementById('rawi-nama');
    if (nama) nama.value = '';
    var nilai = document.getElementById('rawi-nilai');
    if (nilai) nilai.value = '';
    var kategori = document.getElementById('rawi-kategori');
    if (kategori) kategori.selectedIndex = 0;
    var dock = document.getElementById('rawi-docking');
    if (dock) dock.value = '';
  }

  _msg(prefix + '-form-msg', '', '');
  _attachInit(key, { refSheet: _RAWAT_SHEET[name] });
  var m = document.getElementById('modal-' + prefix + '-form');
  if (m) m.classList.remove('n-hidden');
}

// ── OPTIONS ───────────────────────────────────────────────

function _rawatLoadOptions() {
  if (_RAWAT.options) { _rawatPopulateOptions(); return; }
  google.script.run
    .withSuccessHandler(function (res) {
      if (!res.success) return;
      _RAWAT.options = res.data;
      _rawatPopulateOptions();
    })
    .withFailureHandler(function () {})
    .perawatan_getOptions(APP.token);
}

function _rawatPopulateOptions() {
  if (!_RAWAT.options) return;
  var kapal = _RAWAT.options.kapal || [];

  ['rawk-kapal', 'rawd-kapal'].forEach(function (id) {
    var sel = document.getElementById(id);
    if (!sel) return;
    var prev = sel.value;
    sel.innerHTML = '<option value="">(Pilih Kapal)</option>';
    kapal.forEach(function (k) {
      var o = document.createElement('option');
      o.value = k.kapalId;
      o.textContent = k.nama + (k.aktif ? '' : ' (non-aktif)');
      sel.appendChild(o);
    });
    if (prev) sel.value = prev;
  });

  var dSel = document.getElementById('rawi-docking');
  if (dSel) {
    var pd = dSel.value;
    dSel.innerHTML = '<option value="">— Tidak terkait baris docking —</option>';
    (_RAWAT.options.docking || []).forEach(function (d) {
      var o = document.createElement('option');
      o.value = d.rowId;
      o.textContent = d.label;
      dSel.appendChild(o);
    });
    if (pd) dSel.value = pd;
  }

  // Select enum Perawatannya diisi dari sheet `Opsi` (isi & urutanIkut server).
  [
    { id: 'rawd-lokasi',    items: _RAWAT.options.lokasi },
    { id: 'rawd-tahap',     items: _RAWAT.options.tahap },
    { id: 'rawi-kategori',  items: _RAWAT.options.kategori }
  ].forEach(function (cfg) {
    var sel = document.getElementById(cfg.id);
    if (!sel) return;
    var prev = sel.value;
    sel.innerHTML = '';
    (cfg.items || []).forEach(function (it) {
      var o = document.createElement('option');
      o.value = it.value;
      o.textContent = it.label;
      sel.appendChild(o);
    });
    // Pertahankan pilihan lama bila masih ada; selain itu ambil yang pertama.
    if (prev && sel.querySelector('option[value="' + prev + '"]')) sel.value = prev;
    else if (sel.options.length) sel.selectedIndex = 0;
  });
}

// ── KPI ───────────────────────────────────────────────────

function _rawatLoadKPI(silent) {
  var strip = document.getElementById('rawat-kpi-strip');
  if (strip && !silent) strip.innerHTML = _kpiSkeleton(4);

  google.script.run
    .withSuccessHandler(function (res) {
      if (!res.success) { _msg('rawk-history-msg', 'error', res.error); return; }
      _RAWAT.kpi = res.data;
      _rawatRenderKPI(res.data);
      _rawatBuildCharts();
      _rawatBuildPaneCharts();
    })
    .withFailureHandler(function () {
      var s = document.getElementById('rawat-kpi-strip');
      if (s) s.innerHTML = '<div class="n-msg error show">Gagal memuat KPI Perawatan.</div>';
    })
    .perawatan_getKPI(APP.token, APP.filter);
}

function _rawatRenderKPI(d) {
  var el = document.getElementById('rawat-kpi-strip');
  if (!el) return;
  var k = d.kesiapan, dk = d.docking, it = d.item;

  var dockingAktif = 0;
  Object.keys(dk.byTahap).forEach(function (t) { if (t !== 'SELESAI') dockingAktif += dk.byTahap[t]; });

  el.innerHTML =
    '<div class="ov-kpi-row">' +
      _kpiHeadline('Armada Siap Operasi', k.siap, 'kapal', k.pctSiap + '% dari ' + k.totalArmada + ' armada aktif') +
      _kpiHeadline('Kapal Tidak Siap', k.tidakSiap, 'kapal', k.tidakSiap > 0 ? 'Perlu perhatian' : 'Seluruh armada siap') +
      _kpiHeadline('Docking Berjalan', dockingAktif, 'kapal', dk.total + ' kapal terdokumentasi') +
      _kpiHeadline('Nilai Item Pekerjaan', _rupiah(it.totalNilai), '', it.total + ' item tercatat') +
    '</div>';
}

// ── CHARTS ────────────────────────────────────────────────

function _rawatBuildCharts() {
  var k = (_RAWAT.kpi || {}).kesiapan;
  if (k) {
    _chartDonut('rawat-chart-kesiapan', ['Siap', 'Tidak Siap'], [k.siap, k.tidakSiap],
      [_CHART_COLORS.ok, _CHART_COLORS.crit],
      { center: k.pctSiap + '%', centerSub: 'Siap Operasi', emptyMsg: 'Belum ada status kesiapan pada periode ini.' });
  }
  _rawatLoadTren();
}

function _rawatLoadTren() {
  google.script.run
    .withSuccessHandler(function (res) {
      if (!res.success) return;
      var d = res.data;
      var labels = d.months.map(function (m) { return _chartMonthLabel(m); });
      _chartLine('rawat-chart-tren', labels, [
        { label: 'Siap',        data: d.siap,      color: _CHART_COLORS.ok },
        { label: 'Tidak Siap',  data: d.tidakSiap, color: _CHART_COLORS.crit }
      ], { fmt: _chartNum, emptyMsg: 'Belum ada status kesiapan pada rentang terpilih.' });
    })
    .withFailureHandler(function () {})
    .perawatan_getTren(APP.token, APP.filter);
}

function _rawatBuildPaneCharts() {
  var kpi = _RAWAT.kpi;
  if (!kpi) return;

  var dk = kpi.docking;
  var tahapKeys = _rawatOpsi('tahap');
  _chartBar('rawd-chart-tahap',
    tahapKeys.map(function (t) { return _rawatTahapLbl(t); }),
    [{ label: 'Kapal', data: tahapKeys.map(function (t) { return dk.byTahap[t] || 0; }), color: _CHART_COLORS.primary }],
    { horizontal: true, fmt: _chartNum, emptyMsg: 'Belum ada progres docking pada periode ini.' }
  );

  var it = kpi.item;
  var katKeys = _rawatOpsi('kategori');
  _chartDonut('rawi-chart-kategori',
    katKeys.map(function (k) { return _rawatKategoriLbl(k); }),
    katKeys.map(function (k) { return (it.byKategori[k] || {}).count || 0; }),
    [_CHART_COLORS.primary, _CHART_COLORS.warn, _CHART_COLORS.ok],
    { center: it.total, centerSub: 'Item', emptyMsg: 'Belum ada item pekerjaan pada periode ini.' }
  );
}

// ── HISTORY ───────────────────────────────────────────────

// Endpoint getter per jenis (ditulis eksplisit agar google.script.run aman)
function _rawatFetchHistory(jenis, silent) {
  var prefix = _RAWAT_PREFIX[jenis];
  var wrap = document.getElementById(prefix + '-history-wrap');
  if (wrap && !silent) wrap.innerHTML = _loadingInline('Memuat riwayat\u2026');

  var runner = google.script.run
    .withSuccessHandler(function (res) {
      if (!res.success) {
        _msg(prefix + '-history-msg', 'error', res.error);
        if (wrap) wrap.innerHTML = '';
        return;
      }
      _RAWAT.history[jenis] = res.data;
      _rawatRenderHistory(jenis, res.data);
    })
    .withFailureHandler(function () {
      _msg(prefix + '-history-msg', 'error', 'Gagal memuat riwayat.');
    });

  if (jenis === 'kesiapan')      runner.perawatan_getKesiapan(APP.token, APP.filter);
  else if (jenis === 'docking')  runner.perawatan_getDocking(APP.token, APP.filter);
  else                           runner.perawatan_getItem(APP.token, APP.filter);
}

function _rawatRenderHistory(jenis, items) {
  var prefix = _RAWAT_PREFIX[jenis];
  var sheet = _RAWAT_SHEET[jenis];
  var label = _RAWAT_LABEL[jenis];

  _histRender(prefix + '-history-wrap', {
    columns: _rawatColumns(jenis),
    cells: function (r) { return _rawatCells(jenis, r); },
    refSheet: sheet,
    title: function (r) { return label + ' — Periode ' + r.periode; },
    detail: function (r) { return _rawatDetailFields(jenis, r); },
    // Tombol "Lampiran" dihapus dari baris tabel; kelola lampiran dipindah ke
    // bagian "Lampiran" di dalam modal Lihat (bentuk baris seragam semua modul).
    manage: function (r) { return "_rawatOpenEvidence('" + jenis + "','" + _esc(r.rowId) + "')"; },
    revisi: _rawatCanWrite() ? function (r) { return "_rawatOpenRevisi('" + jenis + "','" + _esc(r.rowId) + "')"; } : null,
    anulir: _rawatCanAnulir() ? function (r) { return "_rawatOpenAnulir('" + jenis + "','" + _esc(r.rowId) + "')"; } : null,
    empty: 'Belum ada laporan untuk periode ini.'
  }, items);
}

// Field modal Lihat — dipakai bersama tabel riwayat dan modal revisi.
function _rawatDetailFields(jenis, r) {
  if (jenis === 'kesiapan') {
    return [
      ['Periode', _esc(r.periode)],
      ['Kapal', _esc(r.kapalNama)],
      ['Status Kapal', _rawatBadgeSiap(r.statusSiap)],
      ['Penyebab Ketidaksiapan', _esc(r.penyebab || '—')],
      ['Dikirim', _esc(r.timestamp ? new Date(r.timestamp).toLocaleString('id-ID') : '—')],
      ['Status', _esc(r.status)]
    ];
  }
  if (jenis === 'docking') {
    return [
      ['Periode', _esc(r.periode)],
      ['Kapal', _esc(r.kapalNama)],
      ['Lokasi', _esc(_rawatLokasiLbl(r.lokasi))],
      ['Tahap', _esc(_rawatTahapLbl(r.tahap))],
      ['Nilai Kontrak', _rupiah(r.nilaiKontrak)],
      ['Kontraktor', _esc(r.kontraktor || '—')],
      ['Dikirim', _esc(r.timestamp ? new Date(r.timestamp).toLocaleString('id-ID') : '—')],
      ['Status', _esc(r.status)]
    ];
  }
  return [
    ['Periode', _esc(r.periode)],
    ['Nama Pekerjaan', _esc(r.namaPekerjaan)],
    ['Kategori', _esc(_rawatKategoriLbl(r.kategori))],
    ['Nilai', _rupiah(r.nilai)],
    ['Terkait Docking', _esc(r.dockingLabel || '—')],
    ['Dikirim', _esc(r.timestamp ? new Date(r.timestamp).toLocaleString('id-ID') : '—')],
    ['Status', _esc(r.status)]
  ];
}

function _rawatBadgeSiap(siap) {
  return siap ? _histBadgeTone('SIAP', 'siap') : _histBadgeTone('TIDAK SIAP', 'tidak-siap');
}

function _rawatColumns(jenis) {
  if (jenis === 'kesiapan') return ['Periode', 'Kapal', 'Status', 'Penyebab'];
  if (jenis === 'docking')  return ['Periode', 'Kapal', 'Lokasi', 'Tahap', 'Nilai Kontrak', 'Kontraktor'];
  return ['Periode', 'Nama Pekerjaan', 'Kategori', 'Nilai', 'Terkait Docking'];
}

function _rawatCells(jenis, r) {
  if (jenis === 'kesiapan') {
    return [_esc(r.periode), _esc(r.kapalNama), _rawatBadgeSiap(r.statusSiap), _esc(r.penyebab || '—')];
  }
  if (jenis === 'docking') {
    return [
      _esc(r.periode),
      _esc(r.kapalNama),
      _esc(_rawatLokasiLbl(r.lokasi)),
      _esc(_rawatTahapLbl(r.tahap)),
      _rupiah(r.nilaiKontrak),
      _esc(r.kontraktor || '—')
    ];
  }
  return [
    _esc(r.periode),
    _esc(r.namaPekerjaan),
    _esc(_rawatKategoriLbl(r.kategori)),
    _rupiah(r.nilai),
    _esc(r.dockingLabel || '—')
  ];
}

function _rawatOpenRevisi(jenis, rowId) {
  var row = (_RAWAT.history[jenis] || []).filter(function (r) { return r.rowId === rowId; })[0];
  if (!row) return;
  _RAWAT.revisi = { jenis: jenis, rowId: rowId };

  var info = document.getElementById('rawat-revisi-info');
  if (info) info.textContent = 'Merevisi ' + _RAWAT_LABEL[jenis] + ' periode ' + row.periode + '.';

  var fields = document.getElementById('rawat-revisi-fields');
  fields.innerHTML = _rawatRevisiFieldsHtml(jenis, row);

  document.getElementById('rawat-revisi-alasan').value = '';
  _attachInit('rawat-revisi', { refSheet: _RAWAT_SHEET[jenis] });
  _msg('rawat-revisi-msg', null);
  document.getElementById('modal-rawat-revisi').classList.remove('n-hidden');
}

function _rawatRevisiFieldsHtml(jenis, row) {
  if (jenis === 'kesiapan') {
    return '<div class="form-grp"><label>Kapal</label>' +
      '<input type="text" value="' + _esc(row.kapalNama) + '" disabled></div>' +
      '<div style="display:grid;grid-template-columns:1fr 1fr;gap:14px;">' +
        '<div class="form-grp"><label>Status</label>' +
          '<select id="rv-rawk-status">' +
            '<option value="true"' + (row.statusSiap ? ' selected' : '') + '>Siap Operasi</option>' +
            '<option value="false"' + (row.statusSiap ? '' : ' selected') + '>Tidak Siap</option>' +
          '</select></div>' +
        '<div class="form-grp"><label>Penyebab (jika tidak siap)</label>' +
          '<input type="text" id="rv-rawk-penyebab" value="' + _esc(row.penyebab || '') + '"></div>' +
      '</div>';
  }
  if (jenis === 'docking') {
    var lok = _rawatOpsi('lokasi').map(function (v) {
      return '<option value="' + v + '"' + (row.lokasi === v ? ' selected' : '') + '>' + _rawatLokasiLbl(v) + '</option>';
    }).join('');
    var tah = _rawatOpsi('tahap').map(function (v) {
      return '<option value="' + v + '"' + (row.tahap === v ? ' selected' : '') + '>' + _rawatTahapLbl(v) + '</option>';
    }).join('');
    return '<div class="form-grp"><label>Kapal</label>' +
      '<input type="text" value="' + _esc(row.kapalNama) + '" disabled></div>' +
      '<div style="display:grid;grid-template-columns:1fr 1fr;gap:14px;">' +
        '<div class="form-grp"><label>Lokasi</label><select id="rv-rawd-lokasi">' + lok + '</select></div>' +
        '<div class="form-grp"><label>Tahap</label><select id="rv-rawd-tahap">' + tah + '</select></div>' +
      '</div>' +
      '<div style="display:grid;grid-template-columns:1fr 1fr;gap:14px;">' +
        '<div class="form-grp"><label>Nilai Kontrak (Rp)</label><input type="number" id="rv-rawd-nilai" min="0" value="' + (row.nilaiKontrak || 0) + '"></div>' +
        '<div class="form-grp"><label>Kontraktor</label><input type="text" id="rv-rawd-kontraktor" value="' + _esc(row.kontraktor || '') + '"></div>' +
      '</div>';
  }
  var kat = _rawatOpsi('kategori').map(function (v) {
    return '<option value="' + v + '"' + (row.kategori === v ? ' selected' : '') + '>' + _rawatKategoriLbl(v) + '</option>';
  }).join('');
  var dockOpts = '<option value="">— Tidak terkait —</option>' +
    ((_RAWAT.options && _RAWAT.options.docking) || []).map(function (d) {
      return '<option value="' + _esc(d.rowId) + '"' + (row.dockingRowId === d.rowId ? ' selected' : '') + '>' + _esc(d.label) + '</option>';
    }).join('');
  return '<div class="form-grp"><label>Nama Pekerjaan</label>' +
    '<input type="text" id="rv-rawi-nama" value="' + _esc(row.namaPekerjaan) + '"></div>' +
    '<div style="display:grid;grid-template-columns:1fr 1fr;gap:14px;">' +
      '<div class="form-grp"><label>Kategori</label><select id="rv-rawi-kategori">' + kat + '</select></div>' +
      '<div class="form-grp"><label>Nilai (Rp)</label><input type="number" id="rv-rawi-nilai" min="0" value="' + (row.nilai || 0) + '"></div>' +
    '</div>' +
    '<div class="form-grp"><label>Terkait Docking</label><select id="rv-rawi-docking">' + dockOpts + '</select></div>';
}

function _rawatRevisiConfirm() {
  var jenis = _RAWAT.revisi.jenis;
  var btn = document.getElementById('rawat-btn-revisi-save');
  var alasan = _v('rawat-revisi-alasan');
  _msg('rawat-revisi-msg', null);
  if (!alasan.trim()) { _msg('rawat-revisi-msg', 'error', 'Alasan revisi wajib diisi.'); return; }
  _setLoading(btn, true);

  var params = { targetRowId: _RAWAT.revisi.rowId, alasanRevisi: alasan };
  if (jenis === 'kesiapan') {
    params.statusSiap = _v('rv-rawk-status') === 'true';
    params.penyebab   = _v('rv-rawk-penyebab');
  } else if (jenis === 'docking') {
    params.lokasi = _v('rv-rawd-lokasi');
    params.tahap = _v('rv-rawd-tahap');
    params.nilaiKontrak = _v('rv-rawd-nilai');
    params.kontraktor = _v('rv-rawd-kontraktor');
  } else {
    params.namaPekerjaan = _v('rv-rawi-nama');
    params.kategori = _v('rv-rawi-kategori');
    params.nilai = _v('rv-rawi-nilai');
    params.dockingRowId = _v('rv-rawi-docking');
  }

  var runner = google.script.run
    .withSuccessHandler(function (res) {
      _setLoading(btn, false);
      if (!res.success) { _msg('rawat-revisi-msg', 'error', res.error); return; }
      _attachCarry('TX_Perawatan_' + (
        jenis === 'kesiapan' ? 'Kesiapan' : (jenis === 'docking' ? 'Docking' : 'Item')
      ), params.targetRowId, res.data.rowId);
      _attachUploadAll('rawat-revisi', [res.data.rowId], function () {
        _rawatCloseRevisi();
        _msg(_RAWAT_PREFIX[jenis] + '-history-msg', 'success', res.data.message);
        _rawatLoadKPI();
        _rawatFetchHistory(jenis);
      });
    })
    .withFailureHandler(function () {
      _setLoading(btn, false);
      _msg('rawat-revisi-msg', 'error', 'Terjadi kesalahan. Coba lagi.');
    });

  if (jenis === 'kesiapan')      runner.perawatan_revisiKesiapan(APP.token, params);
  else if (jenis === 'docking')  runner.perawatan_revisiDocking(APP.token, params);
  else                           runner.perawatan_revisiItem(APP.token, params);
}

function _rawatCloseRevisi() {
  _RAWAT.revisi = { jenis: null, rowId: null };
  closeModal('modal-rawat-revisi');
}

    .withFailureHandler(function () {
      _setLoading(btn, false);
      _msg('rawat-anulir-msg', 'error', 'Terjadi kesalahan. Coba lagi.');
    })
    .perawatan_anulir(APP.token, {
      jenis: jenis.toUpperCase(),
      targetRowId: _RAWAT.anulir.rowId,
      voidReason: alasan
    });
}

function _rawatCloseAnulir() {
  _RAWAT.anulir = { jenis: null, rowId: null };
  closeModal('modal-rawat-anulir');
}

// ── EVIDENCE ──────────────────────────────────────────────

function _rawatOpenEvidence(jenis, rowId) {
  _RAWAT.evidence = { refSheet: _RAWAT_SHEET[jenis], refRowId: rowId };
  var info = document.getElementById('rawat-evidence-info');
  if (info) info.textContent = 'Lampiran untuk ' + _RAWAT_LABEL[jenis] + ' (RowID: ' + rowId + ').';
  _msg('rawat-evidence-msg', null);
  var f = document.getElementById('rawat-evidence-file');
  if (f) f.value = '';
  var l = document.getElementById('rawat-evidence-link');
  if (l) l.value = '';
  _rawatLoadEvidence();
  document.getElementById('modal-rawat-evidence').classList.remove('n-hidden');
}

function _rawatCloseEvidence() {
  _RAWAT.evidence = { refSheet: null, refRowId: null };
  closeModal('modal-rawat-evidence');
}

function _rawatLoadEvidence() {
  var ev = _RAWAT.evidence;
  var list = document.getElementById('rawat-evidence-list');
  if (!ev.refSheet || !list) return;
  list.innerHTML = _loadingInline('Memuat lampiran\u2026');

  google.script.run
    .withSuccessHandler(function (res) {
      if (!res.success) { list.innerHTML = '<div class="n-msg error show">' + _esc(res.error) + '</div>'; return; }
      if (!res.data.length) { list.innerHTML = '<div style="color:var(--n-text-muted);font-size:.85rem;">Belum ada lampiran.</div>'; return; }
      list.innerHTML = res.data.map(function (e) {
        var tgl = e.uploadedAt ? new Date(e.uploadedAt).toLocaleString('id-ID') : '';
        return '<div style="display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--n-border-subtle);">' +
          '<a href="' + _esc(e.viewUrl) + '" target="_blank" style="color:var(--n-primary);font-size:.85rem;">' + _esc(e.fileName) + '</a>' +
          '<span style="font-size:.75rem;color:var(--n-text-muted);">' + _esc(e.sourceMode) + ' · ' + tgl + '</span>' +
        '</div>';
      }).join('');
    })
    .withFailureHandler(function () { list.innerHTML = '<div class="n-msg error show">Gagal memuat lampiran.</div>'; })
    .evidence_list(APP.token, ev.refSheet, ev.refRowId);
}

function _rawatEvidenceUploadFile() {
  var ev = _RAWAT.evidence;
  var fileEl = document.getElementById('rawat-evidence-file');
  var btn = document.getElementById('rawat-btn-evidence-upload');
  _msg('rawat-evidence-msg', null);
  if (!fileEl || !fileEl.files || !fileEl.files.length) {
    _msg('rawat-evidence-msg', 'error', 'Pilih file terlebih dahulu.');
    return;
  }
  var file = fileEl.files[0];
  var isVideo = /^video\//i.test(file.type);
  var limit = isVideo ? 50 * 1024 * 1024 : 15 * 1024 * 1024;
  if (file.size > limit) {
    _msg('rawat-evidence-msg', 'error', isVideo
      ? 'Ukuran video melebihi 50MB. Kompres terlebih dahulu.'
      : 'Ukuran file melebihi 15MB. Pilih file yang lebih kecil.');
    return;
  }

  _setLoading(btn, true);
  var reader = new FileReader();
  reader.onload = function () {
    var base64 = String(reader.result).split(',')[1] || '';
    google.script.run
      .withSuccessHandler(function (res) {
        _setLoading(btn, false);
        if (!res.success) { _msg('rawat-evidence-msg', 'error', res.error); return; }
        _msg('rawat-evidence-msg', 'success', res.data.message);
        fileEl.value = '';
        _rawatLoadEvidence();
        _hdRefreshEvidenceIfCurrent(ev.refSheet, ev.refRowId);
      })
      .withFailureHandler(function () { _setLoading(btn, false); _msg('rawat-evidence-msg', 'error', 'Gagal mengunggah file. Coba lagi.'); })
      .evidence_upload(APP.token, {
        refSheet: ev.refSheet,
        refRowId: ev.refRowId,
        fileName: file.name,
        mimeType: file.type || 'application/octet-stream',
        dataBase64: base64
      });
  };
  reader.onerror = function () { _setLoading(btn, false); _msg('rawat-evidence-msg', 'error', 'Gagal membaca file.'); };
  reader.readAsDataURL(file);
}

function _rawatEvidenceUploadLink() {
  var ev = _RAWAT.evidence;
  var btn = document.getElementById('rawat-btn-evidence-link');
  var url = _v('rawat-evidence-link');
  _msg('rawat-evidence-msg', null);
  if (!url.trim()) { _msg('rawat-evidence-msg', 'error', 'Tempel link Google Drive terlebih dahulu.'); return; }
  _setLoading(btn, true);

  google.script.run
    .withSuccessHandler(function (res) {
      _setLoading(btn, false);
      if (!res.success) { _msg('rawat-evidence-msg', 'error', res.error); return; }
      _msg('rawat-evidence-msg', 'success', res.data.message);
      document.getElementById('rawat-evidence-link').value = '';
      _rawatLoadEvidence();
      _hdRefreshEvidenceIfCurrent(ev.refSheet, ev.refRowId);
    })
    .withFailureHandler(function () { _setLoading(btn, false); _msg('rawat-evidence-msg', 'error', 'Gagal menyalin file. Coba lagi.'); })
    .evidence_uploadFromLink(APP.token, { refSheet: ev.refSheet, refRowId: ev.refRowId, url: url });
}

// ============================================================
// MODUL LOGISTIK (Fase 10) — DIV-LOG
// Amunisi / BBM / Logistik Personil (mingguan + baseline tahunan)
// ============================================================

var _LOG = {
  tab: 'amunisi',
  options: null,
  kpi: null,
  history: { amunisi: [], bbm: [], personil: [] },
  revisi: { jenis: null, rowId: null, mode: null },
  anulir: { jenis: null, rowId: null }
};
var _LOG_LABEL  = { amunisi: 'Amunisi', bbm: 'BBM', personil: 'Logistik Personil' };
var _LOG_PREFIX = { amunisi: 'lga', bbm: 'lgb', personil: 'lgp' };
var _LOG_MODE_LABEL = { BASELINE: 'Baseline', PENGGUNAAN: 'Penggunaan' };

// Peta token -> teks tampilan. Diisi dari sheet `Opsi` (server) via
// logistik_getOptions; bukan lagi peta hardcoded.
function _logLabel(group, token) {
  var opts = _LOG.options || {};
  var map = group === 'amunisi' ? opts.labelAmunisi
          : group === 'bbm'     ? opts.labelBbm
          : group === 'personil'? opts.labelPersonil
          : null;
  var t = String(token || '');
  return (map && map[t]) || t;
}

function _idNum(v) {
  var n = Number(v);
  return isNaN(n) ? '0' : n.toLocaleString('id-ID');
}

// ── RENDER UTAMA ────────────────────────────────────────

function _renderLogistik(el) {
  var tpl = document.getElementById('view-tpl-logistik');
  if (!tpl) { el.innerHTML = _moduleStub('Logistik'); return; }
  el.innerHTML = tpl.innerHTML;

  _LOG.tab = 'amunisi';
  _logSetTab('amunisi');

  _logLoadOptions();
  _logLoadKPI();
}

function _logSyncTabState() {
  var tabs = document.querySelectorAll('#log-tabs .n-tab');
  tabs.forEach(function (t) {
    t.classList.toggle('active', t.getAttribute('data-log-tab') === _LOG.tab);
  });
}

function _logSetTab(name) {
  if (!_LOG_LABEL[name]) return;
  _LOG.tab = name;
  _logSyncTabState();

  _logDestroyPaneCharts();

  var pane = document.getElementById('log-tab-pane');
  if (!pane) return;
  var tpl = document.getElementById('view-tpl-log-' + name);
  pane.innerHTML = tpl ? tpl.innerHTML : '';
  _logInitPane(name);
}

// RBAC UI mengikuti server: write = SUPERADMIN atau (KADIV/STAF DIV-LOG);
// anulir = SUPERADMIN/DIREKTUR atau KADIV DIV-LOG.
function _logCanWrite() {
  var u = APP.user || {};
  return u.role === 'SUPERADMIN' || (u.divisiId === 'DIV-LOG' && (u.role === 'STAF' || u.role === 'KADIV'));
}

function _logCanAnulir() {
  var u = APP.user || {};
  return u.role === 'SUPERADMIN' || u.role === 'DIREKTUR' || (u.divisiId === 'DIV-LOG' && u.role === 'KADIV');
}

function _logInitPane(name) {
  var prefix = _LOG_PREFIX[name] + '-';

  var formSection = document.getElementById(prefix + 'form-section');
  if (formSection) formSection.style.display = _logCanWrite() ? '' : 'none';

  _opsInitPeriodeUi(prefix);
  ['tahun', 'bulan', 'minggu'].forEach(function (k) {
    var sel = document.getElementById(prefix + 'periode-' + k);
    if (sel) sel.onchange = function () { _logUpdatePeriodeHint(name); };
  });
  _logUpdatePeriodeHint(name);

  _attachInit(name === 'amunisi' ? 'lga' : (name === 'bbm' ? 'lgb' : 'lgp'), {
    refSheet: 'TX_Logistik_' + (name === 'amunisi' ? 'Amunisi' : (name === 'bbm' ? 'BBM' : 'Personil'))
  });

  _logPopulateOptions();
  if (name === 'amunisi') _logAmunisiModeChange();
  if (name === 'bbm')     _logBbmModeChange();

  _logFetchHistory(name);
  _logBuildPaneCharts();
}

function _logUpdatePeriodeHint(name) {
  var hint = document.getElementById(_LOG_PREFIX[name] + '-periode-hint');
  if (hint) hint.textContent = _composePeriode(_LOG_PREFIX[name] + '-') || '—';
}

// Form popup: reset field + attach + tampilkan modal (Backlog A)
function _logOpenForm(name) {
  var prefix = _LOG_PREFIX[name];

  if (name === 'amunisi') {
    _kapalInit('lga-kapal');
    _kdlReset('lga-kapal');
    var mode = document.getElementById('lga-mode');
    if (mode) mode.value = 'PENGGUNAAN';
    _logAmunisiModeChange();
    var stok = document.getElementById('lga-stok');
    if (stok) stok.value = '';
    var pakai = document.getElementById('lga-penggunaan');
    if (pakai) pakai.value = '';
    var selA = document.getElementById('lga-jenis');
    if (selA) selA.selectedIndex = 0;
  } else if (name === 'bbm') {
    _kapalInit('lgb-kapal');
    _kdlReset('lgb-kapal');
    var modeB = document.getElementById('lgb-mode');
    if (modeB) modeB.value = 'PENGGUNAAN';
    _logBbmModeChange();
    ['lgb-pagu','lgb-realisasi','lgb-harga','lgb-tunggakan'].forEach(function(id) {
      var el = document.getElementById(id);
      if (el) el.value = '';
    });
    var selB = document.getElementById('lgb-jenis');
    if (selB) selB.selectedIndex = 0;
  } else {
    var nilai = document.getElementById('lgp-nilai');
    if (nilai) nilai.value = '';
    var selP = document.getElementById('lgp-komponen');
    if (selP) selP.selectedIndex = 0;
  }

  _logFillFormContext(name);
  _msg(prefix + '-form-msg', '', '');
  _attachInit(name === 'amunisi' ? 'lga' : (name === 'bbm' ? 'lgb' : 'lgp'), {
    refSheet: 'TX_Logistik_' + (name === 'amunisi' ? 'Amunisi' : (name === 'bbm' ? 'BBM' : 'Personil'))
  });
  var m = document.getElementById('modal-' + prefix + '-form');
  if (m) m.classList.remove('n-hidden');
}

// Konteks di dalam modal: data penting satu baris (Backlog A)
function _logFillFormContext(name) {
  var k = _LOG.kpi || {};
  if (name === 'amunisi') {
    var vA = document.getElementById('lga-form-context-value');
    if (vA) vA.textContent = (k.totalStokAkhir !== undefined && k.totalStokAkhir !== null)
      ? _idNum(k.totalStokAkhir) + ' tembakan' : '—';
  } else if (name === 'bbm') {
    var vB = document.getElementById('lgb-form-context-value');
    if (vB) vB.textContent = (k.totalBBMSisa !== undefined && k.totalBBMSisa !== null)
      ? _idNum(k.totalBBMSisa) + ' liter' : '—';
  } else {
    var vP = document.getElementById('lgp-form-context-value');
    if (vP) vP.textContent = (k.totalPersonil !== undefined && k.totalPersonil !== null)
      ? _rupiah(k.totalPersonil) : '—';
  }
}

// ── OPTIONS ───────────────────────────────────────────────

function _logLoadOptions() {
  if (_LOG.options) { _logPopulateOptions(); return; }
  google.script.run
    .withSuccessHandler(function (res) {
      if (!res.success) return;
      _LOG.options = res.data;
      _logPopulateOptions();
    })
    .withFailureHandler(function () {})
    .logistik_getOptions(APP.token);
}

function _logPopulateOptions() {
  if (!_LOG.options) return;
  _fillOpsiSelect('lga-jenis', _LOG.options.amunisi, '(Pilih Jenis)');
  _fillOpsiSelect('lgb-jenis', _LOG.options.bbm, '(Pilih Jenis)');
  _fillOpsiSelect('lgp-komponen', _LOG.options.personil, '(Pilih Komponen)');
}

// ── MODE BASELINE / PENGGUNAAN ───────────────────────────

function _logAmunisiModeChange() {
  var base = _v('lga-mode') === 'BASELINE';
  var sg = document.getElementById('lga-stok-grp');
  var pg = document.getElementById('lga-penggunaan-grp');
  if (sg) sg.style.display = base ? 'block' : 'none';
  if (pg) pg.style.display = base ? 'none' : 'block';
  var lbl = document.getElementById('lga-form-modal-title');
  if (lbl) lbl.textContent = base ? 'Input Stok Awal Tahun (baseline)' : 'Input Penggunaan Amunisi';
}

function _logBbmModeChange() {
  var base = _v('lgb-mode') === 'BASELINE';
  var pg = document.getElementById('lgb-pagu-grp');
  var rg = document.getElementById('lgb-realisasi-grp');
  var ig = document.getElementById('lgb-info-grp');
  if (pg) pg.style.display = base ? 'block' : 'none';
  if (rg) rg.style.display = base ? 'none' : 'block';
  if (ig) ig.style.display = base ? 'none' : 'grid';
  var lbl = document.getElementById('lgb-form-modal-title');
  if (lbl) lbl.textContent = base ? 'Input Pagu Tahun (baseline)' : 'Input Realisasi BBM';
}

// ── KPI ───────────────────────────────────────────────────

function _logLoadKPI(silent) {
  var strip = document.getElementById('log-kpi-strip');
  if (strip && !silent) strip.innerHTML = _kpiSkeleton(4);

  google.script.run
    .withSuccessHandler(function (res) {
      if (!res.success) { _msg('lga-history-msg', 'error', res.error); return; }
      _LOG.kpi = res.data;
      _logRenderKPI(res.data);
      _logBuildCharts();
      _logBuildPaneCharts();
    })
    .withFailureHandler(function () {
      var s = document.getElementById('log-kpi-strip');
      if (s) s.innerHTML = '<div class="n-msg error show">Gagal memuat KPI Logistik.</div>';
    })
    .logistik_getKPI(APP.token, APP.filter);
}

function _logRenderKPI(d) {
  var el = document.getElementById('log-kpi-strip');
  if (!el) return;
  el.innerHTML =
    '<div class="ov-kpi-row">' +
      _kpiHeadline('Stok Akhir Amunisi', _idNum(d.totalStokAkhir), 'tembakan', d.amunisi.length + ' jenis terpantau') +
      _kpiHeadline('Realisasi BBM', _idNum(d.totalBBMRealisasi), 'liter', 'Kumulatif tahun berjalan') +
      _kpiHeadline('Sisa Pagu BBM', _idNum(d.totalBBMSisa), 'liter', 'Pagu dikurangi realisasi') +
      _kpiHeadline('Logistik Personil', _rupiah(d.totalPersonil), '', 'Jumlah dalam rentang filter') +
    '</div>';
}

// ── CHARTS ────────────────────────────────────────────────

function _logDestroyPaneCharts() {
  _chartDestroy('lga-chart-donut');
  _chartDestroy('lgb-chart-pct');
  _chartDestroy('lgp-chart-komponen');
}

function _logBuildCharts() {
  var k = _LOG.kpi;
  if (!k) return;

  // Stok akhir amunisi per jenis (ranking horizontal)
  _chartBar('log-chart-stok',
    k.amunisi.map(function (x) { return x.jenis; }),
    [{ label: 'Stok Akhir', data: k.amunisi.map(function (x) { return x.stokAkhir; }), color: _CHART_COLORS.primary }],
    { horizontal: true, fmt: _chartNum, emptyMsg: 'Belum ada baseline amunisi pada tahun berjalan.' }
  );

  _logLoadTren();
}

function _logLoadTren() {
  google.script.run
    .withSuccessHandler(function (res) {
      if (!res.success) return;
      var d = res.data;
      var labels = d.months.map(function (m) { return _chartMonthLabel(m); });
      var amTot = d.months.map(function (_, i) {
        return Object.keys(d.amunisi).reduce(function (s, j) { return s + (d.amunisi[j][i] || 0); }, 0);
      });
      var bbTot = d.months.map(function (_, i) {
        return Object.keys(d.bbm).reduce(function (s, j) { return s + (d.bbm[j][i] || 0); }, 0);
      });
      _chartLine('log-chart-tren', labels, [
        { label: 'Penggunaan Amunisi', data: amTot, color: _CHART_COLORS.primary },
        { label: 'Realisasi BBM',       data: bbTot, color: _CHART_COLORS.warn }
      ], { fmt: _chartNum, emptyMsg: 'Belum ada penggunaan/realisasi pada rentang terpilih.' });
    })
    .withFailureHandler(function () {})
    .logistik_getTren(APP.token, APP.filter);
}

function _logBuildPaneCharts() {
  var k = _LOG.kpi;
  if (!k) return;

  // Donut sisa vs terpakai (semua jenis amunisi)
  var sisa = k.amunisi.reduce(function (s, x) { return s + x.stokAkhir; }, 0);
  var terpakai = k.amunisi.reduce(function (s, x) { return s + x.penggunaan; }, 0);
  _chartDonut('lga-chart-donut', ['Sisa', 'Terpakai'], [sisa, terpakai],
    [_CHART_COLORS.ok, _CHART_COLORS.warn],
    { center: _idNum(sisa), centerSub: 'Sisa Stok', emptyMsg: 'Belum ada baseline amunisi.' });

  // Bar % realisasi terhadap pagu per jenis BBM
  _chartBar('lgb-chart-pct',
    k.bbm.map(function (x) { return x.jenis; }),
    [{ label: 'Realisasi % Pagu', data: k.bbm.map(function (x) { return x.pct; }), color: _CHART_COLORS.primary }],
    { horizontal: false, fmt: function (v) { return v + '%'; }, emptyMsg: 'Belum ada pagu BBM tahun berjalan.' }
  );

  // Bar nilai personil per komponen
  _chartBar('lgp-chart-komponen',
    k.personil.map(function (x) { return _logLabel('personil', x.komponen); }),
    [{ label: 'Nilai', data: k.personil.map(function (x) { return x.total; }), color: _CHART_COLORS.primary }],
    { horizontal: true, fmt: _rupiah, emptyMsg: 'Belum ada nilai logistik personil pada periode ini.' }
  );
}

// ── HISTORY ───────────────────────────────────────────────

function _logFetchHistory(jenis, silent) {
  var prefix = _LOG_PREFIX[jenis];
  var wrap = document.getElementById(prefix + '-history-wrap');
  if (wrap && !silent) wrap.innerHTML = _loadingInline('Memuat riwayat\u2026');

  var runner = google.script.run
    .withSuccessHandler(function (res) {
      if (!res.success) {
        _msg(prefix + '-history-msg', 'error', res.error);
        if (wrap) wrap.innerHTML = '';
        return;
      }
      _LOG.history[jenis] = res.data;
      _logRenderHistory(jenis, res.data);
    })
    .withFailureHandler(function () {
      _msg(prefix + '-history-msg', 'error', 'Gagal memuat riwayat.');
    });

  if (jenis === 'amunisi')  runner.logistik_getAmunisi(APP.token, APP.filter);
  else if (jenis === 'bbm') runner.logistik_getBBM(APP.token, APP.filter);
  else                      runner.logistik_getPersonil(APP.token, APP.filter);
}

function _logModeBadge(mode) {
  if (mode === 'BASELINE') return _histBadgeTone('BASELINE', 'baseline');
  return _histBadgeTone('PENGGUNAAN', 'ditimpa');
}

function _logRenderHistory(jenis, items) {
  var sheet = 'TX_Logistik_' + (jenis === 'amunisi' ? 'Amunisi' : (jenis === 'bbm' ? 'BBM' : 'Personil'));
  var label = _LOG_LABEL[jenis];

  _histRender(_LOG_PREFIX[jenis] + '-history-wrap', {
    columns: _logColumns(jenis),
    cells: function (r) { return _logCells(jenis, r); },
    refSheet: sheet,
    title: function (r) { return label + ' — Periode ' + r.periode; },
    detail: function (r) { return _logDetailFields(jenis, r); },
    revisi: _logCanWrite() ? function (r) { return "_logOpenRevisi('" + jenis + "','" + _esc(r.rowId) + "')"; } : null,
    anulir: _logCanAnulir() ? function (r) { return "_logOpenAnulir('" + jenis + "','" + _esc(r.rowId) + "')"; } : null,
    empty: 'Belum ada laporan untuk periode ini.'
  }, items);
}

// Field modal Lihat — dipakai bersama tabel riwayat dan modal revisi.
function _logDetailFields(jenis, r) {
  var dikirim = ['Dikirim', _esc(r.timestamp ? new Date(r.timestamp).toLocaleString('id-ID') : '—')];
  if (jenis === 'amunisi') {
    return [
      ['Periode', _esc(r.periode)],
      ['Kapal', _esc(_kapalName(r.kapalId))],
      ['Jenis', _esc(_logLabel('amunisi', r.jenis))],
      ['Mode', _esc(r.mode)],
      ['Stok Awal', r.mode === 'BASELINE' ? _idNum(r.stokAwal) : '—'],
      ['Penggunaan Minggu Ini', r.mode === 'PENGGUNAAN' ? _idNum(r.penggunaan) : '—']
    ].concat(dikirim, [['Status', _esc(r.status)]]);
  }
  if (jenis === 'bbm') {
    return [
      ['Periode', _esc(r.periode)],
      ['Kapal', _esc(_kapalName(r.kapalId))],
      ['Jenis', _esc(_logLabel('bbm', r.jenis))],
      ['Mode', _esc(r.mode)],
      ['Pagu', r.mode === 'BASELINE' ? _idNum(r.pagu) : '—'],
      ['Realisasi', r.mode === 'PENGGUNAAN' ? _idNum(r.realisasi) : '—'],
      ['Harga Acuan', _esc(r.hargaAcuan || '—')],
      ['Tunggakan', _esc(r.tunggakan || '—')]
    ].concat(dikirim, [['Status', _esc(r.status)]]);
  }
  return [
    ['Periode', _esc(r.periode)],
    ['Komponen', _esc(_logLabel('personil', r.komponen))],
    ['Nilai (Rp)', _rupiah(r.nilai)]
  ].concat(dikirim, [['Status', _esc(r.status)]]);
}

function _logColumns(jenis) {
  if (jenis === 'amunisi')  return ['Periode', 'Kapal', 'Jenis', 'Mode', 'StokAwal', 'Penggunaan Minggu'];
  if (jenis === 'bbm')      return ['Periode', 'Kapal', 'Jenis', 'Mode', 'Pagu', 'Realisasi', 'Harga Acuan', 'Tunggakan'];
  return ['Periode', 'Komponen', 'Nilai (Rp)'];
}

function _logCells(jenis, r) {
  if (jenis === 'amunisi') {
    return [
      _esc(r.periode),
      _kapalCellPlain(r.kapalId),
      _esc(_logLabel('amunisi', r.jenis)),
      _logModeBadge(r.mode),
      r.mode === 'BASELINE' ? _idNum(r.stokAwal) : '—',
      r.mode === 'PENGGUNAAN' ? _idNum(r.penggunaan) : '—'
    ];
  }
  if (jenis === 'bbm') {
    return [
      _esc(r.periode),
      _kapalCellPlain(r.kapalId),
      _esc(_logLabel('bbm', r.jenis)),
      _logModeBadge(r.mode),
      r.mode === 'BASELINE' ? _idNum(r.pagu) : '—',
      r.mode === 'PENGGUNAAN' ? _idNum(r.realisasi) : '—',
      _esc(r.hargaAcuan || '—'),
      _esc(r.tunggakan || '—')
    ];
  }
  return [
    _esc(r.periode),
    _esc(_logLabel('personil', r.komponen)),
    _rupiah(r.nilai)
  ];
}

function _logOpenRevisi(jenis, rowId) {
  var row = (_LOG.history[jenis] || []).filter(function (r) { return r.rowId === rowId; })[0];
  if (!row) return;
  _LOG.revisi = { jenis: jenis, rowId: rowId, mode: row.mode || 'PENGGUNAAN' };

  var info = document.getElementById('log-revisi-info');
  if (info) info.textContent = 'Merevisi ' + _LOG_LABEL[jenis] + ' periode ' + row.periode +
    ' (' + (_LOG_MODE_LABEL[_LOG.revisi.mode] || _LOG.revisi.mode) + ').';

  var fields = document.getElementById('log-revisi-fields');
  fields.innerHTML = _logRevisiFieldsHtml(jenis, row);

function _logRevisiFieldsHtml(jenis, row) {
  var m = row.mode || 'PENGGUNAAN';
  if (jenis === 'amunisi') {
    if (m === 'BASELINE') {
      return '<div class="form-grp"><label>Jenis Amunisi</label>' +
        '<input type="text" value="' + _esc(_logLabel('amunisi', row.jenis)) + '" disabled></div>' +
        '<div class="form-grp"><label>Stok Awal Tahun</label>' +
        '<input type="number" id="rv-lga-stok" min="0" step="1" value="' + (row.stokAwal || 0) + '"></div>';
    }
    return '<div class="form-grp"><label>Jenis Amunisi</label>' +
      '<input type="text" value="' + _esc(_logLabel('amunisi', row.jenis)) + '" disabled></div>' +
      '<div class="form-grp"><label>Penggunaan Minggu Ini</label>' +
      '<input type="number" id="rv-lga-penggunaan" min="0" step="1" value="' + (row.penggunaan || 0) + '"></div>';
  }
  if (jenis === 'bbm') {
    if (m === 'BASELINE') {
      return '<div class="form-grp"><label>Jenis BBM</label>' +
        '<input type="text" value="' + _esc(_logLabel('bbm', row.jenis)) + '" disabled></div>' +
        '<div class="form-grp"><label>Pagu Tahun</label>' +
        '<input type="number" id="rv-lgb-pagu" min="0" step="1" value="' + (row.pagu || 0) + '"></div>';
    }
    return '<div class="form-grp"><label>Jenis BBM</label>' +
      '<input type="text" value="' + _esc(_logLabel('bbm', row.jenis)) + '" disabled></div>' +
      '<div style="display:grid;grid-template-columns:1fr 1fr;gap:14px;">' +
        '<div class="form-grp"><label>Realisasi</label>' +
        '<input type="number" id="rv-lgb-realisasi" min="0" step="1" value="' + (row.realisasi || 0) + '"></div>' +
        '<div class="form-grp"><label>Harga Acuan</label>' +
        '<input type="number" id="rv-lgb-harga" min="0" step="1" value="' + _esc(row.hargaAcuan || '') + '"></div>' +
      '</div>' +
      '<div class="form-grp"><label>Status Tunggakan</label>' +
      '<input type="text" id="rv-lgb-tunggakan" value="' + _esc(row.tunggakan || '') + '"></div>';
  }
  return '<div class="form-grp"><label>Komponen</label>' +
    '<input type="text" value="' + _esc(_logLabel('personil', row.komponen)) + '" disabled></div>' +
    '<div class="form-grp"><label>Nilai (Rp)</label>' +
    '<input type="number" id="rv-lgp-nilai" min="0" step="1" value="' + (row.nilai || 0) + '"></div>';

function _logRevisiConfirm() {
  var jenis = _LOG.revisi.jenis;
  var btn = document.getElementById('log-btn-revisi-save');
  var alasan = _v('log-revisi-alasan');
  _msg('log-revisi-msg', null);
  if (!alasan.trim()) { _msg('log-revisi-msg', 'error', 'Alasan revisi wajib diisi.'); return; }
  _setLoading(btn, true);

  var params = { targetRowId: _LOG.revisi.rowId, alasanRevisi: alasan };
  if (jenis === 'amunisi') {
    if (_LOG.revisi.mode === 'BASELINE') params.stokAwal = _v('rv-lga-stok');
    else params.penggunaan = _v('rv-lga-penggunaan');
  } else if (jenis === 'bbm') {
    if (_LOG.revisi.mode === 'BASELINE') params.pagu = _v('rv-lgb-pagu');
    else {
      params.realisasi = _v('rv-lgb-realisasi');
      params.hargaAcuan = _v('rv-lgb-harga');
      params.tunggakanStatus = _v('rv-lgb-tunggakan');
    }
  } else {
    params.nilai = _v('rv-lgp-nilai');
  }

  var runner = google.script.run
    .withSuccessHandler(function (res) {
      _setLoading(btn, false);
      if (!res.success) { _msg('log-revisi-msg', 'error', res.error); return; }
      _attachCarry('TX_Logistik_' + (
        jenis === 'amunisi' ? 'Amunisi' : (jenis === 'bbm' ? 'BBM' : 'Personil')
      ), params.targetRowId, res.data.rowId);
      _attachUploadAll('log-revisi', [res.data.rowId], function () {
        _logCloseRevisi();
        _msg(_LOG_PREFIX[jenis] + '-history-msg', 'success', res.data.message);
        (res.data.warnings || []).forEach(function (w) { _msg(_LOG_PREFIX[jenis] + '-history-msg', 'warn', w); });
        _logLoadKPI();
        _logFetchHistory(jenis);
      });
    })
    .withFailureHandler(function () {
      _setLoading(btn, false);
      _msg('log-revisi-msg', 'error', 'Terjadi kesalahan. Coba lagi.');
    });

  if (jenis === 'amunisi')  runner.logistik_revisiAmunisi(APP.token, params);
  else if (jenis === 'bbm') runner.logistik_revisiBBM(APP.token, params);
  else                      runner.logistik_revisiPersonil(APP.token, params);
}

function _logCloseRevisi() {
  _LOG.revisi = { jenis: null, rowId: null, mode: null };
  closeModal('modal-log-revisi');
}

// ============================================================
// MODUL PENGAWAKAN (Fase 10) — DIV-AWAK
// Komposisi AKN (snapshot total) / Kegiatan Personel
// ============================================================

var _AWK = {
  tab: 'akn',
  options: null,
  kpi: null,
  history: { akn: [], kegiatan: [] },
  revisi: { jenis: null, rowId: null },
  anulir: { jenis: null, rowId: null }
};
var _AWK_LABEL  = { akn: 'Komposisi AKN', kegiatan: 'Kegiatan Personel' };
var _AWK_PREFIX = { akn: 'akn', kegiatan: 'akk' };
// Label & urutan token AKN berasal dari sheet `Opsi` (server: awak_getOptions).
function _awkLbl(map, token) {
  var t = String(token || '');
  return ((_AWK.options || {})[map] || {})[t] || t;
}
function _awkScopeLbl(t) { return _awkLbl('labelScope', t); }
function _awkKatLbl(t)   { return _awkLbl('labelKategori', t); }
function _awkKatOrder()  { return ((_AWK.options || {}).kategori || []).map(function (it) { return it.value; }); }
function _awkScopeOrder(){ return ((_AWK.options || {}).scopes || []).map(function (it) { return it.value; }); }
// Palet seri untuk chart multi-scope;(netral, lalu warna aksen)
var _AWK_SCOPE_COLORS = [_CHART_COLORS.neutral, _CHART_COLORS.primary, _CHART_COLORS.warn, _CHART_COLORS.ok, _CHART_COLORS.primarySoft, _CHART_COLORS.primaryAlpha];
function _awkScopeColor(i) { return _AWK_SCOPE_COLORS[i % _AWK_SCOPE_COLORS.length]; }

// ── RENDER UTAMA ────────────────────────────────────────

function _renderPengawakan(el) {
  var tpl = document.getElementById('view-tpl-pengawakan');
  if (!tpl) { el.innerHTML = _moduleStub('Pengawakan'); return; }
  el.innerHTML = tpl.innerHTML;

  _AWK.tab = 'akn';
  _awkSetTab('akn');

  _awkLoadOptions();
  _awkLoadKPI();
}

function _awkSyncTabState() {
  var tabs = document.querySelectorAll('#awak-tabs .n-tab');
  tabs.forEach(function (t) {
    t.classList.toggle('active', t.getAttribute('data-awak-tab') === _AWK.tab);
  });
}

function _awkSetTab(name) {
  if (!_AWK_LABEL[name]) return;
  _AWK.tab = name;
  _awkSyncTabState();

  var pane = document.getElementById('awak-tab-pane');
  if (!pane) return;
  var tpl = document.getElementById('view-tpl-awak-' + name);
  pane.innerHTML = tpl ? tpl.innerHTML : '';
  _awkInitPane(name);
}

// RBAC UI mengikuti server: write = SUPERADMIN atau (KADIV/STAF DIV-AWAK);
// anulir = SUPERADMIN/DIREKTUR atau KADIV DIV-AWAK.
function _awkCanWrite() {
  var u = APP.user || {};
  return u.role === 'SUPERADMIN' || (u.divisiId === 'DIV-AWAK' && (u.role === 'STAF' || u.role === 'KADIV'));
}

function _awkCanAnulir() {
  var u = APP.user || {};
  return u.role === 'SUPERADMIN' || u.role === 'DIREKTUR' || (u.divisiId === 'DIV-AWAK' && u.role === 'KADIV');
}

function _awkInitPane(name) {
  var prefix = _AWK_PREFIX[name] + '-';

  var formSection = document.getElementById(prefix + 'form-section');
  if (formSection) formSection.style.display = _awkCanWrite() ? '' : 'none';

  _opsInitPeriodeUi(prefix);
  ['tahun', 'bulan', 'minggu'].forEach(function (k) {
    var sel = document.getElementById(prefix + 'periode-' + k);
    if (sel) sel.onchange = function () { _awkUpdatePeriodeHint(name); };
  });
  _awkUpdatePeriodeHint(name);

  _attachInit(name === 'akn' ? 'awkakn' : 'awkkeg', {
    refSheet: 'TX_Pengawakan_' + (name === 'akn' ? 'AKN' : 'Kegiatan')
  });

  _awkPopulateOptions();
  _awkRenderKomposisi(_AWK.kpi);

  _awkFetchHistory(name);
}

function _awkUpdatePeriodeHint(name) {
  var hint = document.getElementById(_AWK_PREFIX[name] + '-periode-hint');
  if (hint) hint.textContent = _composePeriode(_AWK_PREFIX[name] + '-') || '—';
}

// Form popup: reset field + attach + tampilkan modal (Backlog A)
function _awkOpenForm(name) {
  var prefix = _AWK_PREFIX[name];

  if (name === 'akn') {
    ['akn-jumlah'].forEach(function (id) {
      var el = document.getElementById(id);
      if (el) el.value = '';
    });
    var scope = document.getElementById('akn-scope');
    if (scope && scope.options.length) scope.selectedIndex = 0; // scope pertama dari `Opsi`
    var kat = document.getElementById('akn-kategori');
    if (kat) kat.selectedIndex = 0; // placeholder "(Pilih Kategori)" dari `Opsi`
  } else {
    ['akk-judul','akk-tglmulai','akk-tglselesai','akk-wilayah','akk-peserta','akk-deskripsi'].forEach(function (id) {
      var el = document.getElementById(id);
      if (el) el.value = '';
    });
  }

  _msg(prefix + '-form-msg', '', '');
  _attachInit(name === 'akn' ? 'awkakn' : 'awkkeg', {
    refSheet: 'TX_Pengawakan_' + (name === 'akn' ? 'AKN' : 'Kegiatan')
  });
  var m = document.getElementById('modal-' + prefix + '-form');
  if (m) m.classList.remove('n-hidden');
}

// ── OPTIONS ───────────────────────────────────────────────

function _awkLoadOptions() {
  if (_AWK.options) { _awkPopulateOptions(); return; }
  google.script.run
    .withSuccessHandler(function (res) {
      if (!res.success) return;
      _AWK.options = res.data;
      _awkPopulateOptions();
    })
    .withFailureHandler(function () {})
    .awak_getOptions(APP.token);
}

function _awkPopulateOptions() {
  if (!_AWK.options) return;
  _fillOpsiSelect('akn-kategori', _AWK.options.kategori, '(Pilih Kategori)');
  _fillOpsiSelect('akn-scope', _AWK.options.scopes);
}

// ── KPI ───────────────────────────────────────────────────

function _awkLoadKPI(silent) {
  var strip = document.getElementById('awak-kpi-strip');
  if (strip && !silent) strip.innerHTML = _kpiSkeleton(4);

  google.script.run
    .withSuccessHandler(function (res) {
      if (!res.success) { _msg('akn-history-msg', 'error', res.error); return; }
      _AWK.kpi = res.data;
      _awkRenderKPI(res.data);
      _awkBuildCharts();
      _awkRenderKomposisi(res.data);
    })
    .withFailureHandler(function () {
      var s = document.getElementById('awak-kpi-strip');
      if (s) s.innerHTML = '<div class="n-msg error show">Gagal memuat KPI Pengawakan.</div>';
    })
    .awak_getKPI(APP.token, APP.filter);
}

function _awkRenderKPI(d) {
  var el = document.getElementById('awak-kpi-strip');
  if (!el) return;
  // Satu kartu KPI per scope; label & urutan dari sheet `Opsi`.
  var scopeCards = _awkScopeOrder().map(function (sc) {
    return _kpiHeadline('Total AKN ' + _awkScopeLbl(sc), _idNum((d.akn.totalPerScope || {})[sc] || 0), 'orang', 'Komposisi tahun berjalan');
  }).join('');
  el.innerHTML =
    '<div class="ov-kpi-row">' +
      scopeCards +
      _kpiHeadline('Kegiatan Personel', _idNum(d.kegiatan.count), 'kegiatan', 'Dalam rentang filter') +
      _kpiHeadline('Total Peserta Kegiatan', _idNum(d.kegiatan.totalPeserta), 'peserta', 'Dalam rentang filter') +
    '</div>';
}

// ── CHARTS & KOMPOSISI ───────────────────────────────────

function _awkBuildCharts() {
  var k = _AWK.kpi;
  if (!k) return;

  var kat = _awkKatOrder();
  var kes = k.akn.perKategori;
  _chartBar('awak-chart-komposisi',
    kat.map(function (x) { return _awkKatLbl(x); }),
    // Satu seri per scope, label & warna mengikuti sheet `Opsi`.
    _awkScopeOrder().map(function (sc, i) {
      return {
        label: _awkScopeLbl(sc),
        data:  kat.map(function (x) { return (kes[x] || {})[sc] || 0; }),
        color: _awkScopeColor(i)
      };
    }),
    { horizontal: true, fmt: _chartNum, emptyMsg: 'Belum ada komposisi AKN tahun berjalan.' }
  );

  _awkLoadTren();
}

function _awkLoadTren() {
  google.script.run
    .withSuccessHandler(function (res) {
      if (!res.success) return;
      var d = res.data;
      var labels = d.months.map(function (m) { return _chartMonthLabel(m); });
      // Satu seri per scope; label dari sheet `Opsi` (server: aknScopeLabels).
      _chartLine('awak-chart-tren', labels,
        _awkScopeOrder().map(function (sc, i) {
          return { label: (d.aknScopeLabels || {})[sc] || _awkScopeLbl(sc),
                   data: (d.aknPerScope || {})[sc] || [], color: _awkScopeColor(i) };
        }),
        { fmt: _chartNum, emptyMsg: 'Belum ada komposisi AKN pada rentang terpilih.' });
    })
    .withFailureHandler(function () {})
    .awak_getTren(APP.token, APP.filter);
}

function _awkRenderKomposisi(d) {
  var el = document.getElementById('akn-komposisi-wrap');
  if (!el) return;
  if (!d) { el.innerHTML = '<div style="padding:20px 24px;color:var(--n-text-muted);font-size:.875rem;">Memuat komposisi…</div>'; return; }
  var rows = d.akn.rows || [];
  if (!rows.length) {
    el.innerHTML = '<div style="padding:20px 24px;color:var(--n-text-muted);font-size:.875rem;">Belum ada komposisi AKN tercatat untuk tahun berjalan.</div>';
    return;
  }
  rows.sort(function (a, b) {
    // Urutan mengikuti sheet `Opsi`, bukan nama scope tertentu.
    var so = _awkScopeOrder();
    var dso = so.indexOf(a.scope) - so.indexOf(b.scope);
    if (dso !== 0) return dso;
    var ord = _awkKatOrder();
    return ord.indexOf(a.kategori) - ord.indexOf(b.kategori);
  });
  var t = '<table class="n-table"><thead><tr><th>Scope</th><th>Kategori</th><th>Jumlah</th><th>Periode Terakhir</th></tr></thead><tbody>';
  rows.forEach(function (r) {
    t += '<tr><td>' + _esc(_awkScopeLbl(r.scope)) + '</td>' +
      '<td>' + _esc(_awkKatLbl(r.kategori)) + '</td>' +
      '<td>' + _idNum(r.jumlah) + '</td>' +
      '<td>' + _esc(r.periode) + '</td></tr>';
  });
  t += '</tbody></table>';
  el.innerHTML = t;
}

// ── HISTORY ───────────────────────────────────────────────

function _awkFetchHistory(jenis, silent) {
  var prefix = _AWK_PREFIX[jenis];
  var wrap = document.getElementById(prefix + '-history-wrap');
  if (wrap && !silent) wrap.innerHTML = _loadingInline('Memuat riwayat\u2026');

  var runner = google.script.run
    .withSuccessHandler(function (res) {
      if (!res.success) {
        _msg(prefix + '-history-msg', 'error', res.error);
        if (wrap) wrap.innerHTML = '';
        return;
      }
      _AWK.history[jenis] = res.data;
      _awkRenderHistory(jenis, res.data);
    })
    .withFailureHandler(function () {
      _msg(prefix + '-history-msg', 'error', 'Gagal memuat riwayat.');
    });

  if (jenis === 'akn')       runner.awak_getAKN(APP.token, APP.filter);
  else                       runner.awak_getKegiatan(APP.token, APP.filter);
}

function _awkRenderHistory(jenis, items) {
  var sheet = 'TX_Pengawakan_' + (jenis === 'akn' ? 'AKN' : 'Kegiatan');
  var label = _AWK_LABEL[jenis];

  _histRender(_AWK_PREFIX[jenis] + '-history-wrap', {
    columns: _awkColumns(jenis),
    cells: function (r) { return _awkCells(jenis, r); },
    refSheet: sheet,
    title: function (r) { return label + ' — Periode ' + r.periode; },
    detail: function (r) { return _awkDetailFields(jenis, r); },
    revisi: _awkCanWrite() ? function (r) { return "_awkOpenRevisi('" + jenis + "','" + _esc(r.rowId) + "')"; } : null,
    anulir: _awkCanAnulir() ? function (r) { return "_awkOpenAnulir('" + jenis + "','" + _esc(r.rowId) + "')"; } : null,
    empty: 'Belum ada laporan untuk periode ini.'
  }, items);
}

// Field modal Lihat — dipakai bersama tabel riwayat dan modal revisi.
function _awkDetailFields(jenis, r) {
  var dikirim = ['Dikirim', _esc(r.timestamp ? new Date(r.timestamp).toLocaleString('id-ID') : '—')];
  if (jenis === 'akn') {
    return [
      ['Periode', _esc(r.periode)],
      ['Scope', _esc(_awkScopeLbl(r.scope))],
      ['Kategori', _esc(_awkKatLbl(r.kategori))],
      ['Jumlah', _idNum(r.jumlah)]
    ].concat(dikirim, [['Status', _esc(r.status)]]);
  }
  return [
    ['Periode', _esc(r.periode)],
    ['Judul Kegiatan', _esc(r.judul || '—')],
    ['Mulai', r.tanggalMulai ? new Date(r.tanggalMulai).toLocaleDateString('id-ID') : '—'],
    ['Selesai', r.tanggalSelesai ? new Date(r.tanggalSelesai).toLocaleDateString('id-ID') : '—'],
    ['Wilayah', _esc(r.wilayah || '—')],
    ['Jumlah Peserta', _idNum(r.jumlahPeserta)]
  ].concat(dikirim, [['Status', _esc(r.status)]]);
}

function _awkColumns(jenis) {
  if (jenis === 'akn') return ['Periode', 'Scope', 'Kategori', 'Jumlah'];
  return ['Periode', 'Judul Kegiatan', 'Mulai', 'Selesai', 'Wilayah', 'Peserta'];
}

function _awkCells(jenis, r) {
  if (jenis === 'akn') {
    return [
      _esc(r.periode),
      _esc(_awkScopeLbl(r.scope)),
      _esc(_awkKatLbl(r.kategori)),
      _idNum(r.jumlah)
    ];
  }
  return [
    _esc(r.periode),
    _esc(r.judul || '—'),
    r.tanggalMulai ? new Date(r.tanggalMulai).toLocaleDateString('id-ID') : '—',
    r.tanggalSelesai ? new Date(r.tanggalSelesai).toLocaleDateString('id-ID') : '—',
    _esc(r.wilayah || '—'),
    _idNum(r.jumlahPeserta)
  ];
}

// ── SUBMIT ────────────────────────────────────────────────

function _awkSubmitAkn() {
  var btn = document.getElementById('akn-btn-submit');
  _msg('akn-form-msg', null);
  var attachErr = _attachValidate('awkakn');
  if (attachErr) { _msg('akn-form-msg', 'error', attachErr); return; }
  _setLoading(btn, true);
  var params = {
    periode:  _composePeriode('akn-'),
    scope:    _v('akn-scope'),
    kategori: _v('akn-kategori'),
    jumlah:   _v('akn-jumlah')
  };
  google.script.run
    .withSuccessHandler(function (res) {
      _setLoading(btn, false);
      if (!res.success) { _msg('akn-form-msg', 'error', res.error); return; }
      _msg('akn-form-msg', 'success', res.data.message);
      document.getElementById('akn-jumlah').value = '';
      _attachUploadAll('awkakn', [res.data.rowId], function(ok) {
        _formSubmitDone('modal-akn-form', 'Perubahan komposisi AKN tersimpan.', function () {
          _awkLoadKPI();
          _awkFetchHistory('akn');
        }, ok);
      });
    })
    .withFailureHandler(function () { _setLoading(btn, false); _msg('akn-form-msg', 'error', 'Terjadi kesalahan koneksi. Coba lagi.'); })
    .awak_submitAKN(APP.token, params);
}

function _awkSubmitKegiatan() {
  var btn = document.getElementById('akk-btn-submit');
  _msg('akk-form-msg', null);
  var attachErr = _attachValidate('awkkeg');
  if (attachErr) { _msg('akk-form-msg', 'error', attachErr); return; }
  _setLoading(btn, true);
  var params = {
    periode:        _composePeriode('akk-'),
    judul:          _v('akk-judul'),
    tanggalMulai:   _v('akk-tglmulai'),
    tanggalSelesai: _v('akk-tglselesai'),
    wilayah:        _v('akk-wilayah'),
    jumlahPeserta:  _v('akk-peserta'),
    deskripsi:      _v('akk-deskripsi')
  };
  google.script.run
    .withSuccessHandler(function (res) {
      _setLoading(btn, false);
      if (!res.success) { _msg('akk-form-msg', 'error', res.error); return; }
      _msg('akk-form-msg', 'success', res.data.message);
      document.getElementById('akk-judul').value = '';
      document.getElementById('akk-wilayah').value = '';
      document.getElementById('akk-peserta').value = '';
      _attachUploadAll('awkkeg', [res.data.rowId], function(ok) {
        _formSubmitDone('modal-akk-form', 'Log kegiatan personel tersimpan.', function () {
          _awkLoadKPI();
          _awkFetchHistory('kegiatan');
        }, ok);
      });
    })
    .withFailureHandler(function () { _setLoading(btn, false); _msg('akk-form-msg', 'error', 'Terjadi kesalahan koneksi. Coba lagi.'); })
    .awak_submitKegiatan(APP.token, params);
}

// ── REVISI ────────────────────────────────────────────────

function _awkOpenRevisi(jenis, rowId) {
  var row = (_AWK.history[jenis] || []).filter(function (r) { return r.rowId === rowId; })[0];
  if (!row) return;
  _AWK.revisi = { jenis: jenis, rowId: rowId };

  var info = document.getElementById('awak-revisi-info');
  if (info) info.textContent = 'Merevisi ' + _AWK_LABEL[jenis] + ' periode ' + row.periode + '.';

  var fields = document.getElementById('awak-revisi-fields');
  fields.innerHTML = _awkRevisiFieldsHtml(jenis, row);

  document.getElementById('awak-revisi-alasan').value = '';
  var refSheet = 'TX_Pengawakan_' + (jenis === 'akn' ? 'AKN' : 'Kegiatan');
  _attachInit('awak-revisi', { refSheet: refSheet });
  _msg('awak-revisi-msg', null);
  document.getElementById('modal-awak-revisi').classList.remove('n-hidden');
}

function _awkRevisiFieldsHtml(jenis, row) {
  if (jenis === 'akn') {
    return '<div style="display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px;">' +
        '<div class="form-grp"><label>Scope</label>' +
        '<input type="text" value="' + _esc(_awkScopeLbl(row.scope)) + '" disabled></div>' +
        '<div class="form-grp"><label>Kategori</label>' +
        '<input type="text" value="' + _esc(_awkKatLbl(row.kategori)) + '" disabled></div>' +
      '</div>' +
      '<div class="form-grp"><label>Jumlah (Total Terbaru)</label>' +
      '<input type="number" id="rv-akn-jumlah" min="0" step="1" value="' + (row.jumlah || 0) + '"></div>';
  }
  return '<div class="form-grp"><label>Judul Kegiatan</label>' +
    '<input type="text" id="rv-akk-judul" value="' + _esc(row.judul || '') + '"></div>' +
    '<div style="display:grid;grid-template-columns:1fr 1fr;gap:14px;">' +
      '<div class="form-grp"><label>Tanggal Mulai</label>' +
      '<input type="date" id="rv-akk-tglmulai" value="' + (row.tanggalMulai ? row.tanggalMulai.substring(0, 10) : '') + '"></div>' +
      '<div class="form-grp"><label>Tanggal Selesai</label>' +
      '<input type="date" id="rv-akk-tglselesai" value="' + (row.tanggalSelesai ? row.tanggalSelesai.substring(0, 10) : '') + '"></div>' +
    '</div>' +
    '<div style="display:grid;grid-template-columns:1fr 1fr;gap:14px;">' +
      '<div class="form-grp"><label>Wilayah</label>' +
      '<input type="text" id="rv-akk-wilayah" value="' + _esc(row.wilayah || '') + '"></div>' +
      '<div class="form-grp"><label>Jumlah Peserta</label>' +
      '<input type="number" id="rv-akk-peserta" min="0" step="1" value="' + (row.jumlahPeserta || 0) + '"></div>' +
    '</div>' +
    '<div class="form-grp"><label>Deskripsi</label>' +
    '<textarea id="rv-akk-deskripsi" rows="3">' + _esc(row.deskripsi || '') + '</textarea></div>';
}

function _awkRevisiConfirm() {
  var jenis = _AWK.revisi.jenis;
  var btn = document.getElementById('awak-btn-revisi-save');
  var alasan = _v('awak-revisi-alasan');
  _msg('awak-revisi-msg', null);
  if (!alasan.trim()) { _msg('awak-revisi-msg', 'error', 'Alasan revisi wajib diisi.'); return; }
  _setLoading(btn, true);

  var params = { targetRowId: _AWK.revisi.rowId, alasanRevisi: alasan };
  if (jenis === 'akn') {
    params.jumlah = _v('rv-akn-jumlah');
  } else {
    params.judul = _v('rv-akk-judul');
    params.tanggalMulai = _v('rv-akk-tglmulai');
    params.tanggalSelesai = _v('rv-akk-tglselesai');
    params.wilayah = _v('rv-akk-wilayah');
    params.jumlahPeserta = _v('rv-akk-peserta');
    params.deskripsi = _v('rv-akk-deskripsi');
  }

  var runner = google.script.run
    .withSuccessHandler(function (res) {
      _setLoading(btn, false);
      if (!res.success) { _msg('awak-revisi-msg', 'error', res.error); return; }
      _attachCarry('TX_Pengawakan_' + (jenis === 'akn' ? 'AKN' : 'Kegiatan'), params.targetRowId, res.data.rowId);
      _attachUploadAll('awak-revisi', [res.data.rowId], function () {
        _awkCloseRevisi();
        _msg(_AWK_PREFIX[jenis] + '-history-msg', 'success', res.data.message);
        _awkLoadKPI();
        _awkFetchHistory(jenis);
      });
    })
    .withFailureHandler(function () {
      _setLoading(btn, false);
      _msg('awak-revisi-msg', 'error', 'Terjadi kesalahan. Coba lagi.');
    });

  if (jenis === 'akn') runner.awak_revisiAKN(APP.token, params);
  else                 runner.awak_revisiKegiatan(APP.token, params);
}

function _awkCloseRevisi() {
  _AWK.revisi = { jenis: null, rowId: null };
  closeModal('modal-awak-revisi');
}

// ── ANULIR ────────────────────────────────────────────────

function _awkOpenAnulir(jenis, rowId) {
  var row = (_AWK.history[jenis] || []).filter(function (r) { return r.rowId === rowId; })[0];
  if (!row) return;
  _AWK.anulir = { jenis: jenis, rowId: rowId };
  var info = document.getElementById('awak-anulir-info');
  if (info) info.textContent = 'Akan menganulir laporan ' + _AWK_LABEL[jenis] + ' periode ' + row.periode + ' (ID: ' + rowId + ').';
  document.getElementById('awak-anulir-alasan').value = '';
  _msg('awak-anulir-msg', null);
  document.getElementById('modal-awak-anulir').classList.remove('n-hidden');
}

function _awkAnulirConfirm() {
  var jenis = _AWK.anulir.jenis;
  var btn = document.getElementById('awak-btn-anulir-save');
  var alasan = _v('awak-anulir-alasan');
  _msg('awak-anulir-msg', null);
  if (!alasan.trim()) { _msg('awak-anulir-msg', 'error', 'Komentar anulir wajib diisi.'); return; }
  _setLoading(btn, true);

  google.script.run
    .withSuccessHandler(function (res) {
      _setLoading(btn, false);
      _awkCloseAnulir();
      if (!res.success) { _msg(_AWK_PREFIX[jenis] + '-history-msg', 'error', res.error); return; }
      _msg(_AWK_PREFIX[jenis] + '-history-msg', 'success', res.data.message);
      _awkLoadKPI();
      _awkFetchHistory(jenis);
    })
    .withFailureHandler(function () {
      _setLoading(btn, false);
      _msg('awak-anulir-msg', 'error', 'Terjadi kesalahan. Coba lagi.');
    })
    .awak_anulir(APP.token, {
      jenis: jenis.toUpperCase(),
      targetRowId: _AWK.anulir.rowId,
      voidReason: alasan
    });
}

function _awkCloseAnulir() {
  _AWK.anulir = { jenis: null, rowId: null };
  closeModal('modal-awak-anulir');
}

/**
 * _uiAudit() — Runtime Layout & Geometry Probe (DESIGN.md §5.5.6 & ARCHITECTURE.md §17.2)
 * Memindai seluruh kontainer kontrol interaktif di DOM aktif.
 * Memverifikasi bahwa seluruh kontrol berdampingan memiliki getBoundingClientRect().height identik.
 */
function _uiAudit() {
  var rows = document.querySelectorAll('.ctl-row, .hist-actions, .filter-box, .n-seg, [class*="ctl-"]');
  var results = [];
  var totalChecked = 0;
  var violations = 0;

  rows.forEach(function (container) {
    if (container.offsetParent === null) return; // skip hidden
    var items = Array.from(container.children).filter(function (el) {
      var tag = el.tagName.toLowerCase();
      return (tag === 'button' || tag === 'select' || (tag === 'input' && el.type !== 'hidden') || el.classList.contains('n-seg') || el.classList.contains('btn'));
    });
    if (items.length < 2) return;
    totalChecked++;

    var heights = items.map(function (el) {
      return { el: el, h: Math.round(el.getBoundingClientRect().height * 10) / 10 };
    });
    var baseH = heights[0].h;
    var mismatched = heights.filter(function (it) {
      return Math.abs(it.h - baseH) > 1.5;
    });

    if (mismatched.length > 0) {
      violations++;
      results.push({
        container: container,
        expectedHeight: baseH,
        mismatched: mismatched
      });
      console.warn('[UI COHESION AUDIT VIOLATION]', container, heights);
    }
  });

  var summary = {
    pass: violations === 0,
    containersChecked: totalChecked,
    violations: violations,
    details: results
  };
  if (violations === 0) {
    console.info('[UI COHESION AUDIT PASS] Seluruh ' + totalChecked + ' kontainer kontrol berbaris memiliki tinggi identik.');
  } else {
    console.error('[UI COHESION AUDIT FAIL] Ditemukan ' + violations + ' kontainer dengan tinggi kontrol bertabrakan!');
  }
  return summary;
}
window._uiAudit = _uiAudit;
