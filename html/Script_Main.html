function _tuSwitchTab(tabName) {
  _TU.activeTab = tabName || 'anggaran';

  // Toggle active class on tab buttons
  var btns = document.querySelectorAll('.tu-subnav-btn');
  btns.forEach(function (b) {
    if (b.getAttribute('data-tu-tab') === _TU.activeTab) {
      b.classList.add('active');
    } else {
      b.classList.remove('active');
    }
  });

  // Toggle visible pane
  var panes = ['anggaran', 'pegawai', 'bmn'];
  panes.forEach(function (p) {
    var paneEl = document.getElementById('tu-pane-' + p);
    if (!paneEl) return;
    if (p === _TU.activeTab) {
      paneEl.classList.remove('n-hidden');
    } else {
      paneEl.classList.add('n-hidden');
    }
  });

  // Load data for selected tab
  if (_TU.activeTab === 'anggaran') {
    if (!_TU.kpi) _tuLoadKPI();
  } else if (_TU.activeTab === 'pegawai') {
    _tuLoadPegawai();
  } else if (_TU.activeTab === 'bmn') {
    _tuLoadBMN();
    setTimeout(function () {
      if (typeof _BMN_MAP !== 'undefined' && _BMN_MAP.map) {
        try { _BMN_MAP.map.invalidateSize(); } catch (e) {}
      }
    }, 150);
  }
}

function _tuLoadPegawai(force) {
  var strip = document.getElementById('tu-pegawai-kpi-strip');
  if (strip && (force || !_TU.pegawaiData)) {
    strip.innerHTML = '<div class="n-card kpi-card"><div class="kpi-label">Memuat Ringkasan Kepegawaian...</div></div>';
  }

  google.script.run
    .withSuccessHandler(function (res) {
      if (!res || !res.success) {
        _msg('tu-pegawai-hist-msg', 'error', (res && res.error) || 'Gagal memuat data kepegawaian.');
        return;
      }
      _TU.pegawaiData = res.data;
      _tuRenderPegawaiKPI(res.data);
      _tuFillPegawaiForm(res.data.counts || {});
      _tuRenderPegawaiChart(res.data);
      _tuRenderPegawaiHistory(res.data.history || []);
    })
    .withFailureHandler(function (err) {
      _msg('tu-pegawai-hist-msg', 'error', 'Koneksi gagal saat memuat data kepegawaian.');
    })
    .tataUsaha_getPegawai(APP.token, APP.filter);
}

function _tuFillPegawaiForm(counts) {
  counts = counts || {};
  var pnsInput    = document.getElementById('tu-peg-pns');
  var p3kInput    = document.getElementById('tu-peg-p3k');
  var p3kPwInput  = document.getElementById('tu-peg-p3k-pw');
  var pjlpInput   = document.getElementById('tu-peg-pjlp');
  var magangInput = document.getElementById('tu-peg-magang');

  if (pnsInput)    pnsInput.value    = counts.PNS !== undefined ? counts.PNS : '';
  if (p3kInput)    p3kInput.value    = counts.P3K !== undefined ? counts.P3K : '';
  if (p3kPwInput)  p3kPwInput.value  = counts.P3K_PARUH_WAKTU !== undefined ? counts.P3K_PARUH_WAKTU : '';
  if (pjlpInput)   pjlpInput.value   = counts.PJLP !== undefined ? counts.PJLP : '';
  if (magangInput) magangInput.value = counts.MAGANG !== undefined ? counts.MAGANG : '';
}

function _tuRenderPegawaiKPI(d) {
  var el = document.getElementById('tu-pegawai-kpi-strip');
  if (!el) return;

  var b = d.breakdown || {};
  var pns   = b.PNS || { count: 0, percentage: 0 };
  var p3k   = b.P3K || { count: 0, percentage: 0 };
  var p3kPw = b.P3K_PARUH_WAKTU || { count: 0, percentage: 0 };
  var pjlp  = b.PJLP || { count: 0, percentage: 0 };
  var mag   = b.MAGANG || { count: 0, percentage: 0 };

  var html = '';
  // Card 1: Total Personil
  html += '<div class="n-card kpi-card">' +
            '<div class="kpi-label" title="Total Personil Aktif">Total Personil</div>' +
            '<div class="kpi-value tnum">' + (d.totalPegawai || 0) + '</div>' +
          '</div>';

  // Card 2: PNS
  html += '<div class="n-card kpi-card">' +
            '<div class="kpi-label" title="Pegawai Negeri Sipil">PNS</div>' +
            '<div class="kpi-value tnum">' + pns.count + '<span class="tu-kpi-pct">' + pns.percentage + '%</span></div>' +
          '</div>';

  // Card 3: P3K Penuh Waktu
  html += '<div class="n-card kpi-card">' +
            '<div class="kpi-label" title="P3K Penuh Waktu">P3K Penuh Waktu</div>' +
            '<div class="kpi-value tnum">' + p3k.count + '<span class="tu-kpi-pct">' + p3k.percentage + '%</span></div>' +
          '</div>';

  // Card 4: P3K Paruh Waktu
  html += '<div class="n-card kpi-card">' +
            '<div class="kpi-label" title="P3K Paruh Waktu">P3K Paruh Waktu</div>' +
            '<div class="kpi-value tnum">' + p3kPw.count + '<span class="tu-kpi-pct">' + p3kPw.percentage + '%</span></div>' +
          '</div>';

  // Card 5: PJLP / Kontrak
  html += '<div class="n-card kpi-card">' +
            '<div class="kpi-label" title="PJLP / Tenaga Kontrak">PJLP / Kontrak</div>' +
            '<div class="kpi-value tnum">' + pjlp.count + '<span class="tu-kpi-pct">' + pjlp.percentage + '%</span></div>' +
          '</div>';

  // Card 6: Magang / PKL
  html += '<div class="n-card kpi-card">' +
            '<div class="kpi-label" title="Magang / Siswa PKL">Magang / PKL</div>' +
            '<div class="kpi-value tnum">' + mag.count + '<span class="tu-kpi-pct">' + mag.percentage + '%</span></div>' +
          '</div>';

  el.innerHTML = html;
}

function _tuOpenPegawaiModal() {
  var counts = (_TU.pegawaiData && _TU.pegawaiData.counts) || {};
  _tuFillPegawaiForm(counts);
  var ketEl = document.getElementById('tu-peg-keterangan');
  if (ketEl) ketEl.value = '';
  _msg('tu-pegawai-form-msg', null);

  if (m) m.classList.remove('n-hidden');
}

function _tuRenderPegawaiChart(d) {
  var canvasId = 'tu-chart-pegawai';
  var canvas = document.getElementById(canvasId);
  if (!canvas) return;

  var b = d.breakdown || {};
  var labels = ['PNS', 'P3K', 'P3K Paruh Waktu', 'PJLP', 'Magang'];
  var counts = [
    (b.PNS && b.PNS.count) || 0,
    (b.P3K && b.P3K.count) || 0,
    (b.P3K_PARUH_WAKTU && b.P3K_PARUH_WAKTU.count) || 0,
    (b.PJLP && b.PJLP.count) || 0,
    (b.MAGANG && b.MAGANG.count) || 0
  ];

  _chartBar(canvasId, labels, [{
    label: 'Personil',
    data: counts,
    color: '#2B3674'
  }], {
    horizontal: true,
    emptyMsg: 'Belum ada data personil.',
    fmt: function (v) { return v + ' orang'; }
  });
}

function _tuSubmitPegawai() {
  var btn = document.getElementById('tu-peg-btn-save');
  var msgElId = 'tu-pegawai-form-msg';
  _msg(msgElId, null);

  try {
    var pns    = Number((document.getElementById('tu-peg-pns') || {}).value) || 0;
    var p3k    = Number((document.getElementById('tu-peg-p3k') || {}).value) || 0;
    var p3kPw  = Number((document.getElementById('tu-peg-p3k-pw') || {}).value) || 0;
    var pjlp   = Number((document.getElementById('tu-peg-pjlp') || {}).value) || 0;
    var magang = Number((document.getElementById('tu-peg-magang') || {}).value) || 0;
    var ket    = ((document.getElementById('tu-peg-keterangan') || {}).value || '').trim();

    _setLoading(btn, true);

    google.script.run
      .withSuccessHandler(function (res) {
        _setLoading(btn, false);
        if (!res.success) {
          _msg(msgElId, 'error', res.error || 'Gagal menyimpan pembaruan.');
          return;
        }
        closeModal('modal-tu-pegawai-form');
        _msg('tu-pegawai-hist-msg', 'success', res.message || 'Pembaruan kepegawaian berhasil disimpan.');
        var ketEl = document.getElementById('tu-peg-keterangan');
        if (ketEl) ketEl.value = '';
        _tuLoadPegawai(true);
      })
      .withFailureHandler(function (err) {
        _setLoading(btn, false);
        _msg(msgElId, 'error', 'Terjadi kesalahan sistem saat menyimpan.');
      })
      .tataUsaha_submitPegawai(APP.token, {
        counts: {
          PNS: pns,
          P3K: p3k,
          P3K_PARUH_WAKTU: p3kPw,
          PJLP: pjlp,
          MAGANG: magang
        },
        keterangan: ket
      });
  } catch (ex) {
    _setLoading(btn, false);
    _msg(msgElId, 'error', 'Gagal memproses form: ' + ex.message);
  }
}

function _tuRenderPegawaiHistory(items) {
  var wrap = document.getElementById('tu-pegawai-history-wrap');
  if (!wrap) return;

  if (!items || items.length === 0) {
    wrap.innerHTML = '<div style="padding:24px; color:var(--n-text-muted); font-size:.875rem; text-align:center;">Belum ada riwayat mutasi kepegawaian tercatat.</div>';
    return;
  }

  var isAuthorizedAnulir = APP.user && (
    APP.user.role === 'SUPERADMIN' ||
    APP.user.role === 'DIREKTUR' ||
    (APP.user.role === 'KADIV' && APP.user.divisiId === 'DIV-TU')
  );

  var html = '<table class="n-table" style="width:100%;">';
  html += '<thead><tr>' +
            '<th style="width:140px;">Waktu</th>' +
            '<th style="width:100px;">Periode</th>' +
            '<th>Kategori</th>' +
            '<th style="text-align:right;width:90px;">Jumlah</th>' +
            '<th>Keterangan</th>' +
            '<th style="width:120px;">Dicatat Oleh</th>' +
            '<th style="width:90px;">Status</th>' +
            '<th style="width:80px;text-align:center;">Aksi</th>' +
          '</tr></thead><tbody>';

  items.forEach(function (r) {
    var isVoid = r.status === 'VOID';
    var statusBadge = isVoid
      ? '<span class="badge" style="background:#FEE2E2;color:#DC2626;">Dianulir</span>'
      : '<span class="badge" style="background:#DEF7EC;color:#03543F;">Aktif</span>';

    var katLabel = r.kategori;
    if (r.kategori === 'P3K_PARUH_WAKTU') katLabel = 'P3K Paruh Waktu';

    var waktuStr = r.timestamp ? _formatDate(r.timestamp) : '—';

    html += '<tr style="' + (isVoid ? 'opacity:0.6;background:#F9FAFB;' : '') + '">' +
              '<td style="font-size:.8125rem;">' + waktuStr + '</td>' +
              '<td style="font-size:.8125rem;" class="tnum">' + _esc(r.periode || '—') + '</td>' +
              '<td><strong>' + _esc(katLabel) + '</strong></td>' +
              '<td style="text-align:right;font-weight:600;" class="tnum">' + r.jumlah + '</td>' +
              '<td style="font-size:.8125rem;color:var(--n-text-secondary);">' +
                _esc(r.keterangan || '—') +
                (isVoid && r.voidReason ? '<div style="color:var(--n-crit);font-size:.75rem;margin-top:2px;">Alasan anulir: ' + _esc(r.voidReason) + '</div>' : '') +
              '</td>' +
              '<td style="font-size:.8125rem;">' + _esc(r.submittedBy || '—') + '</td>' +
              '<td>' + statusBadge + '</td>' +
              '<td style="text-align:center;">' +
                (!isVoid && isAuthorizedAnulir
                  ? '<button type="button" class="btn-mini btn-danger" onclick="_tuOpenAnulirPegawaiModal(\'' + _esc(r.rowId) + '\', \'' + _esc(katLabel) + '\', ' + r.jumlah + ')">Anulir</button>'
                  : '—') +
              '</td>' +
            '</tr>';
  });

  html += '</tbody></table>';
  wrap.innerHTML = html;
}

var _BMN = {
  view: 'list', // 'list' | 'form'
  page: 1,
  pageSize: 25,
  pencatatan: 'ALL',
  kondisi: 'ALL',
  lokasiId: 'ALL',
  q: '',
  searchTimer: null,
  masters: null,
  summary: null,
  listData: null,
  pendingRowId: null,
  pendingAsetId: null,
  currentPhoto: null
};

var _BMN_MAP = {
  map: null,
  layerGroup: null,
  data: null
};

function _tuLoadBMN(force) {
  _bmnLoadMasters(function () {
    _bmnInitMap();
    _bmnLoadSummary(force);
    _bmnLoadAsetList(force);
  });
}

function _bmnInitMap() {
  var host = document.getElementById('bmn-upt-map');
  if (!host) return;
  if (_BMN_MAP.map) {
    try { _BMN_MAP.map.invalidateSize(); } catch (e) {}
    return;
  }
  if (typeof L === 'undefined' || !L.map) return;

  if (host._leaflet_id && !_BMN_MAP.map) {
    try { delete host._leaflet_id; } catch (e) {}
  }

  _BMN_MAP.map = L.map('bmn-upt-map', {
    zoomControl: true,
    scrollWheelZoom: false,
    center: [-2.5489, 118.0149],
    zoom: 5
  });

  _ensureCartoKey(function (key) {
    if (!_BMN_MAP.map) return;
    L.tileLayer(_cartoTileUrl(key), {
      attribution: '&copy; OpenStreetMap contributors &copy; CARTO',
      subdomains: 'abcd',
      maxZoom: 20
    }).addTo(_BMN_MAP.map);
  });

  _BMN_MAP.layerGroup = L.layerGroup().addTo(_BMN_MAP.map);

  setTimeout(function () {
    if (_BMN_MAP.map) {
      try { _BMN_MAP.map.invalidateSize(); } catch (e) {}
    }
  }, 200);

  if (_BMN_MAP.data) {
    _bmnRenderMapMarkers(_BMN_MAP.data);
  }
}

function _bmnResetMapFocus() {
  if (_BMN_MAP.map) {
    _BMN_MAP.map.setView([-2.5489, 118.0149], 5);
  }
}

function _bmnRenderMapMarkers(uptList) {
  _BMN_MAP.data = uptList;
  if (!_BMN_MAP.map || !_BMN_MAP.layerGroup || !Array.isArray(uptList)) return;

  _BMN_MAP.layerGroup.clearLayers();

  uptList.forEach(function (u) {
    if (u.latitude == null || u.longitude == null || isNaN(u.latitude) || isNaN(u.longitude)) return;

    var hasRb = (u.rusakBerat > 0);
    var cleanName = (u.namaLokasi || '')
      .replace('Pangkalan PSDKP ', '')
      .replace('Stasiun PSDKP ', '')
      .replace('Direktorat ', '');

    var iconHtml =
      '<div class="bmn-upt-marker' + (hasRb ? ' has-rusak-berat' : '') + '">' +
        '<span class="bmn-upt-marker-count">' + (u.total || 0) + '</span>' +
        '<span class="bmn-upt-marker-name">' + _esc(cleanName) + '</span>' +
      '</div>';

    var icon = L.divIcon({
      className: 'bmn-upt-marker-wrap',
      html: iconHtml,
      iconSize: [120, 26],
      iconAnchor: [20, 13]
    });

    var marker = L.marker([u.latitude, u.longitude], { icon: icon });

    var popupHtml =
      '<div class="bmn-popover">' +
        '<div class="bmn-popover-title">' + _esc(u.namaLokasi) + '</div>' +
        '<div class="bmn-popover-sub">' + _esc(u.jenis || 'UPT') + ' &bull; ' + _esc(u.wilayah || 'Indonesia') + '</div>' +
        '<div style="display:grid; grid-template-columns:1fr 1fr; gap:6px; font-size:0.75rem; background:var(--n-surface-2); padding:8px; border-radius:6px; margin-bottom:8px;">' +
          '<div>Total: <strong class="tnum">' + (u.total || 0) + ' unit</strong></div>' +
          '<div>Nilai Buku: <strong class="tnum">' + _rupiah(u.nilaiBuku || 0) + '</strong></div>' +
        '</div>' +
        '<div style="font-size:0.75rem; margin-bottom:10px;">' +
          '<div style="display:flex; justify-content:space-between; margin-bottom:3px;">' +
            '<span style="color:#059669;font-weight:600;">Baik: ' + (u.baik || 0) + '</span>' +
            '<span style="color:#D97706;font-weight:600;">R. Ringan: ' + (u.rusakRingan || 0) + '</span>' +
            '<span style="color:#DC2626;font-weight:600;">R. Berat: ' + (u.rusakBerat || 0) + '</span>' +
          '</div>' +
        '</div>' +
        '<div class="ctl-row ctl-sm">' +
          '<button type="button" class="btn-primary" onclick="_bmnFilterByUpt(\'' + _esc(u.lokasiId) + '\')">' +
            'Tampilkan Aset UPT Ini &rarr;' +
          '</button>' +
        '</div>' +
      '</div>';

    marker.bindPopup(popupHtml, { maxWidth: 280, minWidth: 220 });
    _BMN_MAP.layerGroup.addLayer(marker);

function _bmnRenderTable(data) {
  var wrap = document.getElementById('bmn-table-wrap');
  if (!wrap) return;

  var items = data.items || [];
  if (items.length === 0) {
    wrap.innerHTML = '<div style="padding:32px; text-align:center; color:var(--n-text-muted); font-size:.875rem;">' +
      'Tidak ada data aset BMN yang sesuai dengan filter pencarian.' +
      '</div>';
    _bmnUpdatePagination(data);
    return;
  }

  var isAuthorizedAnulir = APP.user && (
    APP.user.role === 'SUPERADMIN' ||
    APP.user.role === 'DIREKTUR' ||
    (APP.user.role === 'KADIV' && APP.user.divisiId === 'DIV-TU')
  );

  var html = '<table class="n-table" style="width:100%;">';
  html += '<thead><tr>' +
            '<th style="width:125px;">Kode &amp; NUP</th>' +
            '<th>Nama Barang &amp; Spesifikasi</th>' +
            '<th style="width:105px;">Klasifikasi</th>' +
            '<th>Penempatan &amp; Ruangan</th>' +
            '<th style="width:125px;">Tgl &amp; Umur</th>' +
            '<th style="width:105px;">Kondisi</th>' +
            '<th style="text-align:right;width:135px;">Valuasi (Rp)</th>' +
            '<th style="width:120px;text-align:center;">Aksi</th>' +
          '</tr></thead><tbody>';

  items.forEach(function (a) {
    // Kondisi Badge
    var kBadge = '';
    if (a.kondisi === 'BAIK') {
      kBadge = '<span class="badge" style="background:#DEF7EC;color:#03543F;">Baik</span>';
    } else if (a.kondisi === 'RUSAK_RINGAN') {
      kBadge = '<span class="badge" style="background:#FEF08A;color:#854D0E;">Rusak Ringan</span>';
    } else {
      kBadge = '<span class="badge" style="background:#FEE2E2;color:#DC2626;">Rusak Berat</span>';
    }

    // Klasifikasi Badge
    var pBadge = a.kategoriPencatatan === 'BUKU'
      ? '<span class="badge" style="background:rgba(43,54,116,0.08);color:var(--n-primary);font-size:.7rem;">Buku (53)</span>'
      : '<span class="badge" style="background:#F1F5F9;color:#475569;font-size:.7rem;">Reguler (52)</span>';

    // Umur & Masa Manfaat
    var umurStr = a.umurTahun + ' thn ' + a.umurBulan + ' bln';
    if (a.isExpired) {
      umurStr += '<div style="color:var(--n-crit);font-size:.7rem;font-weight:600;">(Kadaluwarsa)</div>';
    }

    // Lokasi & Jarak (hanya tampil jika valid numeric)
    var distStr = '';
    if (typeof a.jarakKeUptKm === 'number' && !isNaN(a.jarakKeUptKm) && a.jarakKeUptKm >= 0) {
      distStr = ' <span style="font-size:.72rem;color:var(--n-text-muted);">(' + a.jarakKeUptKm + ' km)</span>';
    }
    var lokText = _esc(a.lokasiId) + distStr;
    if (a.lokasiDetailRuangan) {
      lokText += '<div style="font-size:.75rem;color:var(--n-text-muted);">' + _esc(a.lokasiDetailRuangan) + '</div>';
    }

    var tglStr = a.tanggalPerolehan || '—';

    html += '<tr>' +
              '<td>' +
                '<strong class="tnum">' + _esc(a.kodeBarang) + '</strong>' +
                '<div style="font-size:.75rem;color:var(--n-text-muted);">NUP: ' + _esc(a.nup) + '</div>' +
              '</td>' +
              '<td>' +
                '<div style="font-weight:600;color:var(--n-text-primary);">' + _esc(a.namaBarang) + '</div>' +
                (a.merekTipe ? '<div style="font-size:.75rem;color:var(--n-text-secondary);">' + _esc(a.merekTipe) + '</div>' : '') +
              '</td>' +
              '<td>' + pBadge + '</td>' +
              '<td>' + lokText + '</td>' +
              '<td style="font-size:.8125rem;">' +
                '<span class="tnum">' + tglStr + '</span>' +
                '<div style="font-size:.75rem;color:var(--n-text-muted);">' + umurStr + '</div>' +
              '</td>' +
              '<td>' + kBadge + '</td>' +
              '<td style="text-align:right;" class="tnum">' +
                '<div style="font-weight:600;">' + _rupiah(a.nilaiBuku) + '</div>' +
                '<div style="font-size:.72rem;color:var(--n-text-muted);">Beli: ' + _rupiah(a.nilaiPerolehan) + '</div>' +
              '</td>' +
              '<td style="text-align:center;">' +
                '<div class="ctl-row ctl-sm ctl-nowrap" style="justify-content:center;">' +
                  '<button type="button" class="btn-outline" onclick="_bmnEditAset(\'' + _esc(a.asetId) + '\')">Edit</button>' +
                  (isAuthorizedAnulir
                    ? '<button type="button" class="btn-danger" onclick="_bmnOpenAnulirModal(\'' + _esc(a.rowId) + '\', \'' + _esc(a.kodeBarang) + '\', \'' + _esc(a.nup) + '\', \'' + _esc(a.namaBarang) + '\')">Anulir</button>'
                    : '') +
                '</div>' +
              '</td>' +
            '</tr>';
  });

  html += '</tbody></table>';
  wrap.innerHTML = html;
  _bmnUpdatePagination(data);
}

function _bmnUpdatePagination(data) {
  var infoEl = document.getElementById('bmn-page-info');
  var numEl  = document.getElementById('bmn-page-num');
  var btnP   = document.getElementById('bmn-btn-prev');
  var btnN   = document.getElementById('bmn-btn-next');

  var total = data.totalCount || 0;
  var page  = data.page || 1;
  var size  = data.pageSize || 25;
  var totalPages = data.totalPages || 1;

  var start = total === 0 ? 0 : (page - 1) * size + 1;
  var end   = Math.min(page * size, total);

  if (infoEl) infoEl.textContent = 'Menampilkan ' + start + ' - ' + end + ' dari ' + total + ' aset';
  if (numEl)  numEl.textContent = 'Halaman ' + page + ' / ' + totalPages;
  if (btnP)   btnP.disabled = (page <= 1);
  if (btnN)   btnN.disabled = (page >= totalPages);
}

function _bmnParseCoordinatesFromText(text) {
  if (!text || typeof text !== 'string') return null;

  // 1. Format desimal dengan label Lat & Long / Lon / LS / LU / BT / BB
  // Mis. "Lat -6.178949° Long 106.834359°" atau "Latitude: -6.178949, Longitude: 106.834359"
  var latMatch = text.match(/(?:Lat(?:itude)?|LS|LU)\s*[:\s]*([+-]?\d+(?:\.\d+)?)/i);
  var lonMatch = text.match(/(?:Long?(?:itude)?|BT|BB)\s*[:\s]*([+-]?\d+(?:\.\d+)?)/i);

  if (latMatch && lonMatch) {
    var lat = parseFloat(latMatch[1]);
    var lon = parseFloat(lonMatch[1]);
    if (/LS/i.test(latMatch[0]) && lat > 0) lat = -lat;
    if (!isNaN(lat) && !isNaN(lon) && lat >= -90 && lat <= 90 && lon >= -180 && lon <= 180) {
      return { latitude: lat, longitude: lon, raw: latMatch[0] + ' ' + lonMatch[0] };
    }
  }

  // 2. Format DMS (Degrees Minutes Seconds): mis. 6°10'44.2"S 106°50'03.7"E
  var dmsRegex = /(\d+)[°\s]+(\d+)['`\s]+([\d.]+)?["\s]*([NSEW])/gi;
  var dmsMatches = [];
  var m;
  while ((m = dmsRegex.exec(text)) !== null) {
    var deg = parseFloat(m[1]) || 0;
    var min = parseFloat(m[2]) || 0;
    var sec = parseFloat(m[3]) || 0;
    var dir = m[4].toUpperCase();
    var dd = deg + (min / 60) + (sec / 3600);
    if (dir === 'S' || dir === 'W') dd = -dd;
    dmsMatches.push({ dd: dd, dir: dir });
  }
  if (dmsMatches.length >= 2) {
    var latObj = dmsMatches.find(function(x) { return x.dir === 'N' || x.dir === 'S'; });
    var lonObj = dmsMatches.find(function(x) { return x.dir === 'E' || x.dir === 'W'; });
    if (latObj && lonObj) {
      return { latitude: latObj.dd, longitude: lonObj.dd, raw: 'DMS' };
    }
  }

  // 3. Fallback pasangan angka desimal koordinat Indonesia (Lat berkisar -15 s.d. 10, Lon 90 s.d. 145)
  var genericRegex = /([+-]?\d{1,2}\.\d{4,8})[^\d\w\r\n]+([+-]?\d{2,3}\.\d{4,8})/;
  var genMatch = text.match(genericRegex);
  if (genMatch) {
    var gLat = parseFloat(genMatch[1]);
    var gLon = parseFloat(genMatch[2]);
    if (!isNaN(gLat) && !isNaN(gLon) && gLat >= -15 && gLat <= 10 && gLon >= 90 && gLon <= 145) {
      return { latitude: gLat, longitude: gLon, raw: genMatch[0] };
    }
  }

  return null;
}

function _bmnScanWatermarkOcr(file, cb) {
  if (!file || !window.FileReader) {
    if (cb) cb(null);
    return;
  }

  var reader = new FileReader();
  reader.onload = function(ev) {
    var img = new Image();
    img.onload = function() {
      try {
        var origW = img.naturalWidth || img.width;
        var origH = img.naturalHeight || img.height;

        // Potong hanya 35% area bawah tempat watermark GPS Map Camera berada untuk efisiensi komputasi
        var cropHeightRatio = 0.35;
        var srcY = Math.round(origH * (1 - cropHeightRatio));
        var srcH = Math.round(origH * cropHeightRatio);

        var scale = Math.min(1, 1400 / origW);
        var canvas = document.createElement('canvas');
        canvas.width = Math.round(origW * scale);
        canvas.height = Math.round(srcH * scale);

        var ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, srcY, origW, srcH, 0, 0, canvas.width, canvas.height);

        _loadTesseract(function() {
          if (!window.Tesseract || typeof window.Tesseract.recognize !== 'function') {
            if (cb) cb(null);
            return;
          }
          window.Tesseract.recognize(canvas, 'eng')
            .then(function(result) {
              var text = (result && result.data && result.data.text) || '';
              var coords = _bmnParseCoordinatesFromText(text);
              if (cb) cb(coords, text);
            })
            .catch(function(err) {
              console.warn('[OCR Watermark] Gagal proses recognize:', err);
              if (cb) cb(null);
            });
        });
      } catch (err) {
        console.warn('[OCR Watermark] Gagal crop canvas:', err);
        if (cb) cb(null);
      }
    };
    img.onerror = function() {
      if (cb) cb(null);
    };
    img.src = ev.target.result;
  };
  reader.onerror = function() {
    if (cb) cb(null);
  };
  reader.readAsDataURL(file);
}

function _bmnClientHaversineKm(lat1, lon1, lat2, lon2) {
  var R = 6371; // Radius bumi dalam km
  var dLat = (lat2 - lat1) * Math.PI / 180;
  var dLon = (lon2 - lon1) * Math.PI / 180;
  var a =
    Math.sin(dLat / 2) * Math.sin(dLat / 2) +
    Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
    Math.sin(dLon / 2) * Math.sin(dLon / 2);
  var c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
  return Math.round(R * c * 10) / 10;
}

function _bmnClientMatchNearestUpt(lat, lon, uptList) {
  if (!lat || !lon || isNaN(lat) || isNaN(lon) || !uptList || !uptList.length) {
    return null;
  }
  var nearest = null;
  var minDistance = Infinity;

  for (var i = 0; i < uptList.length; i++) {
    var u = uptList[i];
    var uLat = parseFloat(u.latitude);
    var uLon = parseFloat(u.longitude);
    if (isNaN(uLat) || isNaN(uLon)) continue;

    var dist = _bmnClientHaversineKm(lat, lon, uLat, uLon);
    if (dist < minDistance) {
      minDistance = dist;
      nearest = u;
    }
  }

  if (!nearest) return null;
  var radiusLimit = nearest.radiusVerifikasiKm || 25;
  return {
    nearestUpt: nearest,
    minDistance: minDistance,
    isWithinRadius: minDistance <= radiusLimit
  };
}

function _bmnApplyCoordinates(lat, lon, source, silent) {
  lat = parseFloat(lat);
  lon = parseFloat(lon);
  if (isNaN(lat) || isNaN(lon)) return;

  source = source || 'MANUAL';

  var inLat = document.getElementById('bmn-form-lat');
  var inLon = document.getElementById('bmn-form-lon');
  var inSrc = document.getElementById('bmn-form-sumber-lokasi');
  var inDst = document.getElementById('bmn-form-jarak-upt');

  if (inLat) inLat.value = lat.toFixed(6);
  if (inLon) inLon.value = lon.toFixed(6);
  if (inSrc) inSrc.value = source;

  var uptList = (_BMN.masters && _BMN.masters.uptList) || [];
  var match = _bmnClientMatchNearestUpt(lat, lon, uptList);

  if (match) {
    if (inDst) inDst.value = match.minDistance;
    // Jika berada dalam radius 25 km, otomatis set dropdown UPT
    if (match.isWithinRadius) {
      var selUpt = document.getElementById('bmn-form-upt');
      if (selUpt && (!selUpt.value || selUpt.value === 'UPT-PUSAT-POA' || source === 'EXIF_FOTO' || source === 'OCR_STEMPEL' || source === 'GPS_PERANGKAT')) {
        selUpt.value = match.nearestUpt.lokasiId;
      }
    }
  } else {
    if (inDst) inDst.value = '';
  }

  _bmnRenderGeotagStatus(lat, lon, source, match);
}

function _bmnRenderGeotagStatus(lat, lon, source, match) {
  var emptyEl  = document.getElementById('bmn-geotag-empty-state');
  var activeEl = document.getElementById('bmn-geotag-active-state');
  var resetBtn = document.getElementById('bmn-btn-reset-gps');
  var textEl   = document.getElementById('bmn-geotag-coords-text');
  var badgeEl  = document.getElementById('bmn-geotag-source-badge');
  var bannerEl = document.getElementById('bmn-geotag-haversine-banner');

  if (emptyEl)  emptyEl.style.display = 'none';
  if (activeEl) activeEl.style.display = 'flex';
  if (resetBtn) resetBtn.style.display = 'inline-block';

  if (textEl) {
    textEl.textContent = 'Lat: ' + lat.toFixed(5) + ' · Lon: ' + lon.toFixed(5);
  }

  if (badgeEl) {
    if (source === 'EXIF_FOTO') {
      badgeEl.textContent = 'Metadata EXIF Foto';
      badgeEl.style.background = '#DEF7EC';
      badgeEl.style.color = '#03543F';
    } else if (source === 'OCR_STEMPEL') {
      badgeEl.textContent = 'Stempel Kamera GPS (OCR)';
      badgeEl.style.background = '#D1FAE5';
      badgeEl.style.color = '#065F46';
    } else if (source === 'GPS_PERANGKAT') {
      badgeEl.textContent = 'GPS Perangkat';
      badgeEl.style.background = '#E0E7FF';
      badgeEl.style.color = '#3730A3';
    } else if (source === 'PROFIL_AKUN') {
      badgeEl.textContent = 'Homebase Satker';
      badgeEl.style.background = '#FEF3C7';
      badgeEl.style.color = '#92400E';
    } else {
      badgeEl.textContent = source;
      badgeEl.style.background = '#F1F5F9';
      badgeEl.style.color = '#475569';
    }
  }

  if (bannerEl) {
    if (match && match.nearestUpt) {
      if (match.isWithinRadius) {
        bannerEl.style.background = '#ECFDF5';
        bannerEl.style.border = '1px solid #10B981';
        bannerEl.style.color = '#065F46';
        bannerEl.innerHTML =
          '<strong>Terverifikasi di radius UPT:</strong> ' + _esc(match.nearestUpt.namaLokasi) +
          ' (' + match.minDistance + ' km dari koordinat fisik). Dropdown UPT diselaraskan otomatis.';
      } else {
        bannerEl.style.background = '#FFFBEB';
        bannerEl.style.border = '1px solid #F59E0B';
        bannerEl.style.color = '#92400E';
        bannerEl.innerHTML =
          '<strong>Peringatan Toleransi Jarak:</strong> UPT terdekat adalah ' + _esc(match.nearestUpt.namaLokasi) +
          ' (' + match.minDistance + ' km \u2014 melebihi radius standar 25 km). Pastikan pilihan UPT sesuai dengan penempatan fisik.';
      }
    } else {
      bannerEl.style.background = 'var(--n-surface-2)';
      bannerEl.style.border = '1px solid var(--n-border)';
      bannerEl.style.color = 'var(--n-text-secondary)';
      bannerEl.innerHTML = 'Koordinat GPS tersimpan (' + lat.toFixed(5) + ', ' + lon.toFixed(5) + ').';
    }
  }
}

function _bmnHandlePhotoFile(e) {
  var file = e.target.files && e.target.files[0];
  if (!file) return;

  _msg('bmn-form-msg', null);

  // Kompresi kanvas (max-width 1600px, JPEG 0.8) untuk payload & pratinjau thumbnail
  _compressImageCanvas(file, 1600, 0.8, function (res) {
    if (res && res.b64) {
      _BMN.currentPhoto = {
        dataBase64: res.b64,
        fileName: res.name,
        mimeType: res.mime
      };
      var img = document.getElementById('bmn-photo-preview-img');
      var ph  = document.getElementById('bmn-photo-placeholder');
      var clr = document.getElementById('bmn-photo-clear-btn');
      if (img) {
        img.src = 'data:' + res.mime + ';base64,' + res.b64;
        img.style.display = 'block';
      }
      if (ph) ph.style.display = 'none';
      if (clr) clr.style.display = 'block';
    }
  });

  // OPSI 1: Ekstraksi koordinat GPS dari raw file via exifr sebelum kompresi kanvas
  _loadExifr(function () {
    if (window.exifr && typeof window.exifr.gps === 'function') {
      window.exifr.gps(file)
        .then(function (gps) {
          if (gps && typeof gps.latitude === 'number' && typeof gps.longitude === 'number' && !isNaN(gps.latitude) && !isNaN(gps.longitude)) {
            _bmnApplyCoordinates(gps.latitude, gps.longitude, 'EXIF_FOTO');
            _msg('bmn-form-msg', 'success', 'Koordinat GPS (' + gps.latitude.toFixed(5) + ', ' + gps.longitude.toFixed(5) + ') berhasil diekstraksi dari metadata EXIF foto.');
          } else {
            _bmnHandleNoExifGps(file);
          }
        })
        .catch(function (err) {
          console.warn('[exifr.gps] Gagal membaca EXIF:', err);
          _bmnHandleNoExifGps(file);
        });
    } else {
      _bmnHandleNoExifGps(file);
    }
  });
}

function _bmnHandleNoExifGps(file) {
  var curLat = (document.getElementById('bmn-form-lat') || {}).value;
  var curLon = (document.getElementById('bmn-form-lon') || {}).value;
  if (curLat && curLon && !isNaN(parseFloat(curLat))) {
    return;
  }

  // OPSI 1B: Fallback pemindaian visual watermark koordinat (OCR) jika EXIF GPS tidak tersedia
  if (file) {
    _msg('bmn-form-msg', 'info', 'Metadata EXIF tidak ditemukan. Memindai stempel visual koordinat pada foto (OCR)...');
    _bmnScanWatermarkOcr(file, function(coords) {
      if (coords && typeof coords.latitude === 'number' && typeof coords.longitude === 'number' && !isNaN(coords.latitude) && !isNaN(coords.longitude)) {
        _bmnApplyCoordinates(coords.latitude, coords.longitude, 'OCR_STEMPEL');
        _msg('bmn-form-msg', 'success', 'Koordinat GPS (' + coords.latitude.toFixed(5) + ', ' + coords.longitude.toFixed(5) + ') berhasil diekstraksi dari stempel visual kamera (OCR).');
      } else {
        _msg('bmn-form-msg', 'warning', 'Stempel koordinat tidak terdeteksi pada foto. Mengambil lokasi perangkat...');
        _bmnTriggerDeviceGeolocation(true);
      }
    });
  } else {
    _msg('bmn-form-msg', 'warning', 'Foto tidak mengandung metadata GPS EXIF. Mengambil lokasi perangkat...');
    _bmnTriggerDeviceGeolocation(true);
  }
}

function _bmnTriggerDeviceGeolocation(isAutoFallback) {
  var btn = document.getElementById('bmn-btn-device-gps');
  if (btn) btn.disabled = true;

  if (!navigator.geolocation) {
    if (btn) btn.disabled = false;
    _bmnApplyHomebaseFallback('Browser tidak mendukung geolokasi');
    return;
  }

  navigator.geolocation.getCurrentPosition(
    function (pos) {
      if (btn) btn.disabled = false;
      var lat = pos.coords.latitude;
      var lon = pos.coords.longitude;
      _bmnApplyCoordinates(lat, lon, 'GPS_PERANGKAT');
      _msg('bmn-form-msg', 'success', 'Koordinat GPS (' + lat.toFixed(5) + ', ' + lon.toFixed(5) + ') berhasil diambil dari perangkat pengunggah.');
    },
    function (err) {
      if (btn) btn.disabled = false;
      var reason = 'Sinyal GPS perangkat tidak terdeteksi';
      if (err.code === 1) reason = 'Izin akses GPS perangkat ditolak';
      else if (err.code === 2) reason = 'Posisi perangkat tidak tersedia';
      else if (err.code === 3) reason = 'Waktu permintaan lokasi habis (timeout)';

      _bmnApplyHomebaseFallback(reason);
    },
    { enableHighAccuracy: true, timeout: 8000, maximumAge: 0 }
  );
}

function _bmnApplyHomebaseFallback(reason) {
  var uptList = (_BMN.masters && _BMN.masters.uptList) || [];
  if (!uptList.length) return;

  var selUptId = (document.getElementById('bmn-form-upt') || {}).value;
  var targetUpt = null;

  if (selUptId) {
    for (var i = 0; i < uptList.length; i++) {
      if (uptList[i].lokasiId === selUptId && uptList[i].latitude !== null && uptList[i].longitude !== null) {
        targetUpt = uptList[i];
        break;
      }
    }
  }

  if (!targetUpt) {
    for (var j = 0; j < uptList.length; j++) {
      if (uptList[j].lokasiId === 'UPT-PUSAT-POA') {
        targetUpt = uptList[j];
        break;
      }
    }
  }
  if (!targetUpt) targetUpt = uptList[0];

  if (targetUpt && targetUpt.latitude !== null && targetUpt.longitude !== null) {
    _bmnApplyCoordinates(targetUpt.latitude, targetUpt.longitude, 'PROFIL_AKUN');
    _msg('bmn-form-msg', 'warning', 'Fallback Lokasi: ' + reason + '. Menggunakan koordinat referensi homebase ' + targetUpt.namaLokasi + '.');
  }
}

    (document.getElementById('bmn-form-nb') || {}).value = a.nilaiBuku !== undefined ? a.nilaiBuku : '';
    (document.getElementById('bmn-form-upt') || {}).value = a.lokasiId || '';
    (document.getElementById('bmn-form-ruangan') || {}).value = a.lokasiDetailRuangan || '';
    (document.getElementById('bmn-form-kapal') || {}).value = a.kapalId || '';
    (document.getElementById('bmn-form-ket') || {}).value = a.keterangan || '';

    // Pulihkan koordinat jika aset memiliki data geotag
    if (a.latitude !== null && a.longitude !== null && !isNaN(a.latitude) && !isNaN(a.longitude)) {
      _bmnApplyCoordinates(a.latitude, a.longitude, a.sumberLokasi || 'MANUAL', true);
    }
    // Pulihkan tanda foto jika aset memiliki lampiran foto
    if (a.fotoEvidenceId) {
      (document.getElementById('bmn-form-foto-evidence-id') || {}).value = a.fotoEvidenceId;
      var ph = document.getElementById('bmn-photo-placeholder');
      if (ph) {
        ph.innerHTML = 'Foto tersimpan di Drive<br><span style="font-size:.7rem;color:var(--n-primary);">(' + _esc(a.fotoEvidenceId) + ')</span>';
      }
    }
  } else {
    // Mode Tambah Baru
    if (titleEl) titleEl.textContent = 'Tambah Unit Aset BMN';
    if (asetIdEl) asetIdEl.value = '';
    var form = document.getElementById('bmn-asset-form');
    if (form) form.reset();
  }
}

    .bmn_submitAset(APP.token, {

      namaBarang: nama,

      lokasiId: upt,

var _SHEETJS_LOADED = false;
var _sheetjsQueue   = [];

function _loadSheetJS(cb) {
  if (typeof XLSX !== 'undefined' || _SHEETJS_LOADED) {
    if (cb) { try { cb(); } catch (e) { console.error(e); } }
    return;
  }
  if (cb) _sheetjsQueue.push(cb);
  if (document.getElementById('sheetjs-cdn')) return;

  var script = document.createElement('script');
  script.id  = 'sheetjs-cdn';
  script.src = 'https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js';
  script.onload = function () {
    _SHEETJS_LOADED = true;
    var q = _sheetjsQueue.slice();
    _sheetjsQueue = [];
    q.forEach(function (fn) { try { fn(); } catch (e) { console.error(e); } });
  };
  script.onerror = function () {
    console.warn('Gagal memuat SheetJS dari cdn.sheetjs.com, mencoba fallback unpkg...');
    var fallback = document.createElement('script');
    fallback.id  = 'sheetjs-cdn-fallback';
    fallback.src = 'https://unpkg.com/xlsx@0.18.5/dist/xlsx.full.min.js';
    fallback.onload = function () {
      _SHEETJS_LOADED = true;
      var q = _sheetjsQueue.slice();
      _sheetjsQueue = [];
      q.forEach(function (fn) { try { fn(); } catch (e) { console.error(e); } });
    };
    fallback.onerror = function () {
      console.error('Gagal memuat SheetJS dari seluruh CDN.');
      _sheetjsQueue = [];
    };
    document.head.appendChild(fallback);
  };
  document.head.appendChild(script);
}

function _bmnOpenImportModal() {
  _BMN_IMPORT.mode = 'file';
  _BMN_IMPORT.file = null;
  _BMN_IMPORT.validRows = [];
  _BMN_IMPORT.invalidRows = [];
  _BMN_IMPORT.totalGross = 0;
  _BMN_IMPORT.totalNet = 0;
  _BMN_IMPORT.isProcessing = false;

  var fileInp = document.getElementById('bmn-import-file-input');
  if (fileInp) fileInp.value = '';
  var fileInfo = document.getElementById('bmn-file-info');
  if (fileInfo) { fileInfo.textContent = ''; fileInfo.style.display = 'none'; }
  var pasteInp = document.getElementById('bmn-paste-input');
  if (pasteInp) pasteInp.value = '';

  _msg('bmn-import-msg', null);
  var reportEl = document.getElementById('bmn-dryrun-report');
  if (reportEl) reportEl.classList.add('n-hidden');
  var progWrap = document.getElementById('bmn-import-progress-wrap');
  if (progWrap) progWrap.classList.add('n-hidden');

  var btnCommit = document.getElementById('bmn-btn-commit-import');
  if (btnCommit) {
    btnCommit.disabled = true;
    btnCommit.textContent = 'Simpan Aset ke Database';
  }

  _bmnSwitchImportMode('file');

  var modal = document.getElementById('modal-bmn-import');
  if (modal) modal.classList.remove('n-hidden');

  // Bind drag & drop handlers if not yet bound
  var dropzone = document.getElementById('bmn-import-dropzone');
  if (dropzone && !dropzone._dndBound) {
    dropzone._dndBound = true;
    ['dragenter', 'dragover'].forEach(function (ev) {
      dropzone.addEventListener(ev, function (e) {
        e.preventDefault();
        e.stopPropagation();
        dropzone.classList.add('dragover');
      }, false);
    });
    ['dragleave', 'drop'].forEach(function (ev) {
      dropzone.addEventListener(ev, function (e) {
        e.preventDefault();
        e.stopPropagation();
        dropzone.classList.remove('dragover');
      }, false);
    });
    dropzone.addEventListener('drop', function (e) {
      var dt = e.dataTransfer;
      if (dt && dt.files && dt.files.length) {
        _bmnHandleFile(dt.files[0]);
      }
    }, false);
  }

  // Pre-load SheetJS silently
  _loadSheetJS();
}

function _bmnSwitchImportMode(mode) {
  _BMN_IMPORT.mode = mode;
  var btnFile   = document.getElementById('bmn-import-tab-file');
  var btnPaste  = document.getElementById('bmn-import-tab-paste');
  var paneFile  = document.getElementById('bmn-import-pane-file');
  var panePaste = document.getElementById('bmn-import-pane-paste');

  if (mode === 'file') {
    if (btnFile) btnFile.classList.add('active');
    if (btnPaste) btnPaste.classList.remove('active');
    if (paneFile) paneFile.classList.remove('n-hidden');
    if (panePaste) panePaste.classList.add('n-hidden');
  } else {
    if (btnFile) btnFile.classList.remove('active');
    if (btnPaste) btnPaste.classList.add('active');
    if (paneFile) paneFile.classList.add('n-hidden');
    if (panePaste) panePaste.classList.remove('n-hidden');
  }
}

function _bmnHandleFileSelect(e) {

function _bmnExecuteDryRun() {
  _msg('bmn-import-msg', null);
  var btn = document.getElementById('bmn-btn-dryrun');

  if (_BMN_IMPORT.mode === 'file') {
    if (!_BMN_IMPORT.file) {
      _msg('bmn-import-msg', 'error', 'Pilih atau unggah berkas Excel / CSV terlebih dahulu.');
      return;
    }

    _setLoading(btn, true);
    _loadSheetJS(function () {
      var reader = new FileReader();
      reader.onload = function (e) {
        try {
          var data = new Uint8Array(e.target.result);
          var wb = XLSX.read(data, { type: 'array', cellDates: true });
          var firstSheetName = wb.SheetNames[0];
          var ws = wb.Sheets[firstSheetName];
          var grid = XLSX.utils.sheet_to_json(ws, { header: 1, defval: '' });
          _setLoading(btn, false);
          _bmnProcessGridData(grid);
        } catch (ex) {
          _setLoading(btn, false);
          _msg('bmn-import-msg', 'error', 'Gagal membaca berkas Excel: ' + ex.message);
        }
      };
      reader.onerror = function () {
        _setLoading(btn, false);
        _msg('bmn-import-msg', 'error', 'Gagal membaca file dari disk.');
      };
      reader.readAsArrayBuffer(_BMN_IMPORT.file);
    });
  } else {
    // Mode Paste Grid
    var text = ((document.getElementById('bmn-paste-input') || {}).value || '').trim();
    if (!text) {
      _msg('bmn-import-msg', 'error', 'Tempel data teks dari spreadsheet SAKTI terlebih dahulu.');
      return;
    }

    _setLoading(btn, true);
    setTimeout(function () {
      var lines = text.split(/\r?\n/);
      var grid = lines.map(function (line) {
        return line.split('\t').map(function (c) { return c.trim(); });
      });
      _setLoading(btn, false);
      _bmnProcessGridData(grid);
    }, 50);
  }
}

function _bmnProcessGridData(grid) {
  if (!grid || grid.length < 2) {
    _msg('bmn-import-msg', 'error', 'Data tidak mencukupi (minimal harus ada 1 baris header dan 1 baris data).');
    return;
  }

  // 1. Deteksi Baris Header (Pindai s/d 10 baris pertama)
  var headerRowIdx = -1;
  var maxMatch = 0;
  var scanLimit = Math.min(10, grid.length);

  for (var r = 0; r < scanLimit; r++) {
    var row = grid[r] || [];
    var matchCount = 0;
    for (var c = 0; c < row.length; c++) {
      var txt = String(row[c] || '').toLowerCase();
      if (/kode|kd.*brg|nup|nama.*brg|uraian|barang|kondisi|nilai|perolehan|buku/i.test(txt)) {
        matchCount++;
      }
    }
    if (matchCount > maxMatch) {
      maxMatch = matchCount;
      headerRowIdx = r;
    }
  }

  if (headerRowIdx === -1 || maxMatch < 2) {
    _msg('bmn-import-msg', 'error', 'Baris header tidak terdeteksi. Pastikan terdapat kolom Kode Barang, NUP, atau Nama Barang.');
    return;
  }

  var rawHeaders = grid[headerRowIdx] || [];
  var colMap = {};

  // 2. Pemetaan Sinonim Kolom (Fuzzy Matching)
  rawHeaders.forEach(function (h, idx) {
    var txt = String(h || '').toLowerCase().replace(/[^a-z0-9]/g, '');
    if (!txt) return;

    if (!colMap.kodeBarang && (txt.indexOf('kodebarang') !== -1 || txt === 'kdbrg' || txt === 'kode' || txt === 'kodebrg')) {
      colMap.kodeBarang = idx;
    } else if (!colMap.nup && (txt === 'nup' || txt.indexOf('nourut') !== -1 || txt === 'no' || txt === 'nourutpendaftaran')) {
      colMap.nup = idx;
    } else if (!colMap.namaBarang && (txt.indexOf('namabarang') !== -1 || txt.indexOf('uraian') !== -1 || txt === 'nama' || txt === 'deskripsi')) {
      colMap.namaBarang = idx;
    } else if (!colMap.merekTipe && (txt.indexOf('merek') !== -1 || txt.indexOf('merk') !== -1 || txt.indexOf('tipe') !== -1 || txt.indexOf('spesifikasi') !== -1)) {
      colMap.merekTipe = idx;
    } else if (!colMap.kategoriPencatatan && (txt.indexOf('pencatatan') !== -1 || txt.indexOf('akun') !== -1 || txt.indexOf('intra') !== -1 || txt.indexOf('ekstra') !== -1)) {
      colMap.kategoriPencatatan = idx;
    } else if (!colMap.kodeKategori && (txt.indexOf('kategori') !== -1 || txt.indexOf('klasifikasi') !== -1 || txt.indexOf('golongan') !== -1)) {
      colMap.kodeKategori = idx;
    } else if (!colMap.tanggalPerolehan && (txt.indexOf('tanggal') !== -1 || txt.indexOf('tgl') !== -1 || txt.indexOf('tahun') !== -1)) {
      colMap.tanggalPerolehan = idx;
    } else if (!colMap.nilaiPerolehan && (txt.indexOf('perolehan') !== -1 || txt.indexOf('hargabeli') !== -1 || txt.indexOf('nilaibeli') !== -1)) {
      colMap.nilaiPerolehan = idx;
    } else if (!colMap.nilaiBuku && (txt.indexOf('nilaibuku') !== -1 || txt === 'buku' || txt.indexOf('nilaisisa') !== -1)) {
      colMap.nilaiBuku = idx;
    } else if (!colMap.kondisi && (txt.indexOf('kondisi') !== -1 || txt.indexOf('keadaan') !== -1)) {
      colMap.kondisi = idx;
    } else if (!colMap.lokasiId && (txt.indexOf('lokasi') !== -1 || txt.indexOf('upt') !== -1 || txt.indexOf('pangkalan') !== -1 || txt.indexOf('satker') !== -1)) {
      colMap.lokasiId = idx;
    } else if (!colMap.lokasiDetailRuangan && (txt.indexOf('ruang') !== -1 || txt.indexOf('detail') !== -1)) {
      colMap.lokasiDetailRuangan = idx;
    } else if (!colMap.keterangan && (txt.indexOf('keterangan') !== -1 || txt.indexOf('catatan') !== -1 || txt === 'ket')) {
      colMap.keterangan = idx;
    }
  });

  if (colMap.kodeBarang === undefined && colMap.namaBarang === undefined) {
    _msg('bmn-import-msg', 'error', 'Kolom Kode Barang atau Nama Barang tidak berhasil dikenali.');
    return;
  }

  // 3. Iterasi dan Validasi Tiap Baris Data
  var validRows = [];
  var invalidRows = [];
  var totalGross = 0;
  var totalNet = 0;

  var uptMasters = (_BMN.masters && _BMN.masters.uptList) || [];
  var katMasters = (_BMN.masters && _BMN.masters.kategoriList) || [];

  for (var i = headerRowIdx + 1; i < grid.length; i++) {
    var r = grid[i];
    if (!r || r.length === 0) continue;

    // Cek apakah baris kosong total
    var isAllEmpty = true;
    for (var k = 0; k < r.length; k++) {
      if (String(r[k] || '').trim()) { isAllEmpty = false; break; }
    }
    if (isAllEmpty) continue;

    var rowNum = i + 1;
    var kode = colMap.kodeBarang !== undefined ? String(r[colMap.kodeBarang] || '').trim() : '';
    var nup  = colMap.nup !== undefined ? String(r[colMap.nup] || '').trim() : '';
    var nama = colMap.namaBarang !== undefined ? String(r[colMap.namaBarang] || '').trim() : '';
    var merek = colMap.merekTipe !== undefined ? String(r[colMap.merekTipe] || '').trim() : '';
    var pencRaw = colMap.kategoriPencatatan !== undefined ? String(r[colMap.kategoriPencatatan] || '').toUpperCase() : '';
    var katRaw = colMap.kodeKategori !== undefined ? String(r[colMap.kodeKategori] || '').trim() : '';
    var tglRaw = colMap.tanggalPerolehan !== undefined ? r[colMap.tanggalPerolehan] : null;
    var npRaw = colMap.nilaiPerolehan !== undefined ? r[colMap.nilaiPerolehan] : 0;
    var nbRaw = colMap.nilaiBuku !== undefined ? r[colMap.nilaiBuku] : 0;
    var kondRaw = colMap.kondisi !== undefined ? String(r[colMap.kondisi] || '').toUpperCase() : '';
    var uptRaw = colMap.lokasiId !== undefined ? String(r[colMap.lokasiId] || '').trim() : '';
    var ruang = colMap.lokasiDetailRuangan !== undefined ? String(r[colMap.lokasiDetailRuangan] || '').trim() : '';
    var ket = colMap.keterangan !== undefined ? String(r[colMap.keterangan] || '').trim() : '';

    var errors = [];
    if (!kode) errors.push('Kode Barang kosong');
    if (!nup) errors.push('NUP kosong');
    if (!nama) errors.push('Nama Barang kosong');

    // Parse Rupiah
    var np = _bmnParseRupiah(npRaw);
    var nb = _bmnParseRupiah(nbRaw);

    // Normalisasi Pencatatan (BUKU vs REGULER)
    var penc = 'BUKU';
    if (pencRaw.indexOf('REGULER') !== -1 || pencRaw.indexOf('52') !== -1 || pencRaw.indexOf('EKSTRA') !== -1) {
      penc = 'REGULER';
    }

    // Normalisasi Kondisi (BAIK, RUSAK_RINGAN, RUSAK_BERAT)
    var kond = 'BAIK';
    if (kondRaw === 'RB' || kondRaw.indexOf('BERAT') !== -1) {
      kond = 'RUSAK_BERAT';
    } else if (kondRaw === 'RR' || kondRaw.indexOf('RINGAN') !== -1) {
      kond = 'RUSAK_RINGAN';
    }

    // Normalisasi Kategori
    var kodeKategori = 'KAT-ALAT_KANTOR';
    if (katRaw && katMasters.length) {
      for (var km = 0; km < katMasters.length; km++) {
        var mItem = katMasters[km];
        if (mItem.kodeKategori.toLowerCase() === katRaw.toLowerCase() ||
            mItem.namaKategori.toLowerCase().indexOf(katRaw.toLowerCase()) !== -1 ||
            katRaw.toLowerCase().indexOf(mItem.namaKategori.toLowerCase()) !== -1) {
          kodeKategori = mItem.kodeKategori;
          break;
        }
      }
    }

    // Normalisasi UPT
    var lokasiId = 'UPT-PUSAT';
    if (uptRaw && uptMasters.length) {
      for (var um = 0; um < uptMasters.length; um++) {
        var uItem = uptMasters[um];
        if (uItem.lokasiId.toLowerCase() === uptRaw.toLowerCase() ||
            uItem.namaLokasi.toLowerCase().indexOf(uptRaw.toLowerCase()) !== -1 ||
            uptRaw.toLowerCase().indexOf(uItem.namaLokasi.toLowerCase()) !== -1) {
          lokasiId = uItem.lokasiId;
          break;
        }
      }
    }

    // Parse Tanggal
    var tglIso = _bmnParseDate(tglRaw);

    var itemObj = {
      rowNum: rowNum,
      kodeBarang: kode,
      nup: nup,
      namaBarang: nama,
      merekTipe: merek,
      kategoriPencatatan: penc,
      kodeKategori: kodeKategori,
      tanggalPerolehan: tglIso,
      nilaiPerolehan: np,
      nilaiBuku: nb,
      kondisi: kond,
      lokasiId: lokasiId,
      lokasiDetailRuangan: ruang,
      keterangan: ket
    };

    if (errors.length === 0) {
      validRows.push(itemObj);
      totalGross += np;
      totalNet += nb;
    } else {
      itemObj.errors = errors;
      invalidRows.push(itemObj);
    }
  }

  _BMN_IMPORT.validRows = validRows;
  _BMN_IMPORT.invalidRows = invalidRows;
  _BMN_IMPORT.totalGross = totalGross;
  _BMN_IMPORT.totalNet = totalNet;

  // 4. Render Hasil Dry-Run
  var totalRows = validRows.length + invalidRows.length;
  var statTotal = document.getElementById('bmn-stat-total');
  var statValid = document.getElementById('bmn-stat-valid');
  var statInvalid = document.getElementById('bmn-stat-invalid');
  var statGross = document.getElementById('bmn-stat-gross');

  if (statTotal) statTotal.textContent = totalRows;
  if (statValid) statValid.textContent = validRows.length;
  if (statInvalid) statInvalid.textContent = invalidRows.length;
  if (statGross) statGross.textContent = _rupiah(totalGross);

  // Render Error Box if any
  var errBox = document.getElementById('bmn-import-error-list');
  if (errBox) {
    if (invalidRows.length > 0) {
      var errHtml = '<strong>' + invalidRows.length + ' baris dilewati karena data tidak lengkap:</strong><ul style="margin:4px 0 0 16px; padding:0;">';
      invalidRows.slice(0, 10).forEach(function (ir) {
        errHtml += '<li>Baris ' + ir.rowNum + ': ' + ir.errors.join(', ') + ' (' + _esc(ir.namaBarang || ir.kodeBarang || 'Tanpa Nama') + ')</li>';
      });
      if (invalidRows.length > 10) {
        errHtml += '<li>... dan ' + (invalidRows.length - 10) + ' baris bermasalah lainnya.</li>';
      }
      errHtml += '</ul>';
      errBox.innerHTML = errHtml;
      errBox.style.display = 'block';
    } else {
      errBox.innerHTML = '';
      errBox.style.display = 'none';
    }
  }

  // Render Preview 5 Baris
  var tbody = document.getElementById('bmn-import-preview-body');
  if (tbody) {
    var sampleRows = validRows.slice(0, 5);
    if (sampleRows.length === 0 && invalidRows.length > 0) sampleRows = invalidRows.slice(0, 5);

    tbody.innerHTML = sampleRows.map(function (s) {
      var isValid = !s.errors;
      var badge = isValid
        ? '<span class="badge" style="background:#DEF7EC;color:#03543F;">Valid</span>'
        : '<span class="badge" style="background:#FEE2E2;color:#DC2626;">Galat</span>';
      return '<tr>' +
        '<td>' + badge + '</td>' +
        '<td class="tnum font-bold">' + _esc(s.kodeBarang || '—') + '</td>' +
        '<td class="tnum">' + _esc(s.nup || '—') + '</td>' +
        '<td>' + _esc(s.namaBarang || '—') + '</td>' +
        '<td>' + _esc(s.kondisi || '—') + '</td>' +
        '<td>' + _esc(s.kategoriPencatatan || '—') + '</td>' +
        '<td style="text-align:right;" class="tnum">' + _rupiah(s.nilaiPerolehan) + '</td>' +
      '</tr>';
    }).join('');
  }

  var reportWrap = document.getElementById('bmn-dryrun-report');
  if (reportWrap) reportWrap.classList.remove('n-hidden');

  var btnCommit = document.getElementById('bmn-btn-commit-import');
  if (btnCommit) {
    if (validRows.length > 0) {
      btnCommit.disabled = false;
      btnCommit.textContent = 'Simpan ' + validRows.length + ' Unit ke Database';
    } else {
      btnCommit.disabled = true;
      btnCommit.textContent = 'Tidak Ada Baris Valid';
    }
  }
}

function _bmnParseRupiah(val) {
  if (val === null || val === undefined || val === '') return 0;
  if (typeof val === 'number') return isNaN(val) ? 0 : val;
  var s = String(val).replace(/Rp|\s/gi, '').trim();
  if (s.indexOf('.') !== -1 && s.indexOf(',') !== -1) {
    s = s.replace(/\./g, '').replace(',', '.');
  } else if (s.indexOf('.') !== -1 && s.indexOf(',') === -1) {
    var parts = s.split('.');
    if (parts.length > 2 || (parts.length === 2 && parts[1].length === 3)) {
      s = s.replace(/\./g, '');
    }
  } else if (s.indexOf(',') !== -1) {
    s = s.replace(',', '.');
  }
  var n = parseFloat(s);
  return isNaN(n) ? 0 : n;
}

function _bmnParseDate(val) {
  if (!val) return new Date().toISOString().substring(0, 10);
  if (val instanceof Date) {
    return isNaN(val.getTime()) ? new Date().toISOString().substring(0, 10) : val.toISOString().substring(0, 10);
  }
  if (typeof val === 'number') {
    // Excel serial date number
    var d = new Date(Math.round((val - 25569) * 86400 * 1000));
    return isNaN(d.getTime()) ? new Date().toISOString().substring(0, 10) : d.toISOString().substring(0, 10);
  }
  var s = String(val).trim();
  var match = s.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{4})/);
  if (match) {
    var dd = match[1].padStart(2, '0');
    var mm = match[2].padStart(2, '0');
    var yyyy = match[3];
    return yyyy + '-' + mm + '-' + dd;
  }
  var parsed = new Date(s);
  return isNaN(parsed.getTime()) ? new Date().toISOString().substring(0, 10) : parsed.toISOString().substring(0, 10);
}

function _bmnExecuteImportCommit() {
  if (_BMN_IMPORT.isProcessing) return;
  var validRows = _BMN_IMPORT.validRows || [];
  if (!validRows.length) return;

  var btn = document.getElementById('bmn-btn-commit-import');
  var progWrap = document.getElementById('bmn-import-progress-wrap');
  var progBar = document.getElementById('bmn-import-progress-bar');
  var progPct = document.getElementById('bmn-import-progress-pct');
  var progTxt = document.getElementById('bmn-import-progress-txt');

  _BMN_IMPORT.isProcessing = true;
  if (btn) btn.disabled = true;
  if (progWrap) progWrap.classList.remove('n-hidden');

  var chunkSize = 200;
  var totalChunks = Math.ceil(validRows.length / chunkSize);
  var currentChunkIdx = 0;
  var batchId = 'BATCH-BMN-' + (new Date()).toISOString().replace(/[-:T]/g, '').substring(0, 14) + '-' + Math.random().toString(36).substring(2, 8).toUpperCase();

  function sendNextChunk() {
    var start = currentChunkIdx * chunkSize;
    var chunk = validRows.slice(start, start + chunkSize);
    var pct = Math.round((currentChunkIdx / totalChunks) * 100);

    if (progBar) progBar.style.width = pct + '%';
    if (progPct) progPct.textContent = pct + '%';
    if (progTxt) progTxt.textContent = 'Menyimpan batch ' + (currentChunkIdx + 1) + ' dari ' + totalChunks + ' (' + start + ' - ' + (start + chunk.length) + ' aset)...';

    google.script.run
      .withSuccessHandler(function (res) {
        if (!res.success) {
          _BMN_IMPORT.isProcessing = false;
          if (btn) btn.disabled = false;
          _msg('bmn-import-msg', 'error', 'Galat pada batch ' + (currentChunkIdx + 1) + ': ' + (res.error || 'Gagal menyimpan.'));
          return;
        }

        currentChunkIdx++;
        if (currentChunkIdx < totalChunks) {
          sendNextChunk();
        } else {
          // Selesai seluruh batch!
          if (progBar) progBar.style.width = '100%';
          if (progPct) progPct.textContent = '100%';
          if (progTxt) progTxt.textContent = 'Selesai! ' + validRows.length + ' unit aset berhasil diimpor.';

          setTimeout(function () {
            _BMN_IMPORT.isProcessing = false;
            closeModal('modal-bmn-import');
            _msg('bmn-table-msg', 'success', 'Berhasil mengimpor ' + validRows.length + ' unit aset BMN ke register inventaris.');
            _tuLoadBMN(true);
          }, 800);
        }
      })
      .withFailureHandler(function (err) {
        _BMN_IMPORT.isProcessing = false;
        if (btn) btn.disabled = false;
        _msg('bmn-import-msg', 'error', 'Terjadi kesalahan sistem saat mengirim batch: ' + (err.message || 'Koneksi gagal.'));
      })
      .bmn_importBatchAset(APP.token, {
        items: chunk,
        batchId: batchId
      });
  }

  sendNextChunk();
}

function _bmnLoadPenghapusanList(force) {
  var wrap = document.getElementById('bmn-hps-table-wrap');
  if (wrap && (!wrap.innerHTML || force)) {
    wrap.innerHTML = '<div style="padding:32px; text-align:center; color:var(--n-text-muted); font-size:.875rem;">' +
      'Memuat berkas usulan penghapusan aset BMN...' +

  }

  google.script.run
    .withSuccessHandler(function (res) {
      if (!res.success) {

function _bmnGetTahapBadge(tahap) {
  tahap = String(tahap || '').toUpperCase();
  if (tahap === 'DRAFT_USULAN') {
    return '<span class="n-badge n-badge-subtle n-badge-neutral">Draft Usulan</span>';
  } else if (tahap === 'SURAT_USULAN') {
    return '<span class="n-badge n-badge-subtle n-badge-primary">Surat Usulan</span>';
  } else if (tahap === 'PERSETUJUAN_KEMENKEU') {
    return '<span class="n-badge n-badge-subtle n-badge-warn">Persetujuan Kemenkeu</span>';
  } else if (tahap === 'SK_PENGHAPUSAN') {
    return '<span class="n-badge n-badge-subtle n-badge-primary">SK Penghapusan</span>';
  } else if (tahap === 'BAST_SELESAI') {
    return '<span class="n-badge n-badge-subtle n-badge-ok">BAST Selesai (Dihapus)</span>';
  } else if (tahap === 'DITOLAK') {
    return '<span class="n-badge n-badge-subtle n-badge-crit">Ditolak Kemenkeu</span>';
  } else if (tahap === 'VOID') {
    return '<span class="n-badge n-badge-subtle n-badge-crit">Dianulir (Batal)</span>';
  }
  return '<span class="n-badge n-badge-subtle">' + _esc(tahap) + '</span>';
}

function _bmnGetAlasanLabel(alasan) {
  if (alasan === 'RUSAK_BERAT') return 'Rusak Berat';
  if (alasan === 'KADALUWARSA') return 'Kadaluwarsa';
  if (alasan === 'HILANG') return 'Hilang / Kahar';
  if (alasan === 'SEBAB_LAIN') return 'Sebab Lain';
  return alasan || '-';
}

function _bmnRenderPenghapusanList(list) {
  var totalCount = list.length;
  var prosesCount = 0;
  var selesaiCount = 0;
  var totalBukuSelesai = 0;

  list.forEach(function (h) {
    var th = String(h.tahap || '');
    if (th === 'BAST_SELESAI') {
      selesaiCount++;
      totalBukuSelesai += (Number(h.totalNilaiBuku) || 0);
    } else if (th !== 'DITOLAK' && th !== 'VOID') {
      prosesCount++;
    }
  });

  var elKpiTotal = document.getElementById('bmn-hps-kpi-total');
  var elKpiProses = document.getElementById('bmn-hps-kpi-proses');
  var elKpiSelesai = document.getElementById('bmn-hps-kpi-selesai');
  var elKpiBuku = document.getElementById('bmn-hps-kpi-buku');

  if (elKpiTotal) elKpiTotal.textContent = totalCount;
  if (elKpiProses) elKpiProses.textContent = prosesCount;
  if (elKpiSelesai) elKpiSelesai.textContent = selesaiCount;
  if (elKpiBuku) elKpiBuku.textContent = _rupiah(totalBukuSelesai);

  var wrap = document.getElementById('bmn-hps-table-wrap');
  if (!wrap) return;

  if (list.length === 0) {
    wrap.innerHTML = '<div style="padding:48px 24px; text-align:center; color:var(--n-text-muted); font-size:.875rem;">' +
      'Tidak ada berkas usulan penghapusan yang sesuai dengan filter.' +
      '</div>';
    return;
  }

  var isAuthorizedAnulir = APP.user && (
    APP.user.role === 'SUPERADMIN' ||
    APP.user.role === 'DIREKTUR' ||
    (APP.user.role === 'KADIV' && APP.user.divisiId === 'DIV-TU')
  );

  var html = '<table class="n-table" style="width:100%;">';
  html += '<thead><tr>' +
            '<th style="width:140px;">No. Usulan</th>' +
            '<th style="width:130px;">Alasan</th>' +
            '<th style="width:160px;">Tahap Siklus</th>' +
            '<th>Dokumen Terkait</th>' +
            '<th style="width:90px; text-align:right;">Total Aset</th>' +
            '<th style="width:140px; text-align:right;">Nilai Buku</th>' +
            '<th style="width:140px; text-align:center;">Aksi</th>' +
          '</tr></thead><tbody>';

  list.forEach(function (h) {
    var docInfo = [];
    if (h.nomorSuratUsulan) docInfo.push('Surat: ' + _esc(h.nomorSuratUsulan));
    if (h.nomorSuratPersetujuan) docInfo.push('Kemenkeu: ' + _esc(h.nomorSuratPersetujuan));
    if (h.nomorSK) docInfo.push('SK: ' + _esc(h.nomorSK));
    var docSummary = docInfo.length > 0 ? docInfo.join('<br>') : '<span style="color:var(--n-text-muted); font-size:.75rem;">Belum ada surat</span>';

    var canVoid = isAuthorizedAnulir && h.tahap !== 'BAST_SELESAI' && h.tahap !== 'VOID';

    html += '<tr>' +
              '<td>' +
                '<strong class="tnum">' + _esc(h.penghapusanId) + '</strong>' +
                '<div style="font-size:.72rem; color:var(--n-text-muted);">' + _esc(h.timestamp ? String(h.timestamp).substring(0, 10) : '') + '</div>' +
              '</td>' +
              '<td>' +
                '<div style="font-weight:600;">' + _bmnGetAlasanLabel(h.alasanPenghapusan) + '</div>' +
              '</td>' +
              '<td>' + _bmnGetTahapBadge(h.tahap) + '</td>' +
              '<td style="font-size:.8125rem;">' + docSummary + '</td>' +
              '<td style="text-align:right;" class="tnum font-bold">' + (h.totalUnit || 0) + ' unit</td>' +
              '<td style="text-align:right;" class="tnum">' +
                '<div style="font-weight:600; color:var(--n-primary);">' + _rupiah(h.totalNilaiBuku) + '</div>' +
                '<div style="font-size:.72rem; color:var(--n-text-muted);">Beli: ' + _rupiah(h.totalNilaiPerolehan) + '</div>' +
              '</td>' +
              '<td style="text-align:center;">' +
                '<div class="ctl-row ctl-sm ctl-nowrap" style="justify-content:center;">' +
                  '<button type="button" class="btn-outline" onclick="_bmnOpenDetailHapusModal(\'' + _esc(h.penghapusanId) + '\')">Detail</button>' +
                  (canVoid ? '<button type="button" class="btn-danger" onclick="_bmnPromptVoidHapus(\'' + _esc(h.penghapusanId) + '\')">Anulir</button>' : '') +
                '</div>' +
              '</td>' +
            '</tr>';
  });

  html += '</tbody></table>';
  wrap.innerHTML = html;
}

    })
    .bmn_getAsetEligibleHapus(APP.token);

function _bmnRenderEligibleTable(asets) {
  var tbody = document.getElementById('bmn-hps-eligible-tbody');
  if (!tbody) return;

  if (asets.length === 0) {
    tbody.innerHTML = '<tr><td colspan="6" style="text-align:center; padding:20px; color:var(--n-text-muted);">' +
      'Tidak ada aset yang eligible (seluruh aset dalam status non-aktif atau telah diusulkan).' +
      '</td></tr>';
    return;
  }

  var html = '';
  asets.forEach(function (a) {
    var isChecked = !!_BMN_HPS.selectedAsetIds[a.asetId];
    var kBadge = '';
    if (a.kondisi === 'RUSAK_BERAT') {
      kBadge = '<span class="badge" style="background:#FEE2E2;color:#DC2626;">Rusak Berat</span>';
    } else if (a.kondisi === 'RUSAK_RINGAN') {
      kBadge = '<span class="badge" style="background:#FEF08A;color:#854D0E;">Rusak Ringan</span>';
    } else {
      kBadge = '<span class="badge" style="background:#DEF7EC;color:#03543F;">Baik</span>';
    }

    html += '<tr>' +
              '<td style="text-align:center;">' +
                '<input type="checkbox" class="bmn-hps-item-cb" data-id="' + _esc(a.asetId) + '" ' + (isChecked ? 'checked' : '') + ' onchange="_bmnToggleItemSelect(\'' + _esc(a.asetId) + '\', this.checked)">' +
              '</td>' +
              '<td>' +
                '<strong class="tnum">' + _esc(a.kodeBarang) + '</strong>' +
                '<div style="font-size:.72rem; color:var(--n-text-muted);">NUP: ' + _esc(a.nup) + '</div>' +
              '</td>' +
              '<td>' +
                '<div style="font-weight:600;">' + _esc(a.namaBarang) + '</div>' +
                (a.merekTipe ? '<div style="font-size:.72rem; color:var(--n-text-muted);">' + _esc(a.merekTipe) + '</div>' : '') +
              '</td>' +
              '<td>' + kBadge + '</td>' +
              '<td>' + _esc(a.lokasiId) + '</td>' +
              '<td style="text-align:right;" class="tnum">' +
                '<div style="font-weight:600;">' + _rupiah(a.nilaiBuku) + '</div>' +
                '<div style="font-size:.72rem; color:var(--n-text-muted);">Beli: ' + _rupiah(a.nilaiPerolehan) + '</div>' +
              '</td>' +
            '</tr>';
  });

  tbody.innerHTML = html;
}

function _bmnFilterEligibleAsets() {
  var input = document.getElementById('bmn-hps-eligible-search');
  var q = input ? input.value.trim().toLowerCase() : '';
  if (!q) {
    _bmnRenderEligibleTable(_BMN_HPS.eligibleAsets);
    return;
  }
  var filtered = _BMN_HPS.eligibleAsets.filter(function (a) {
    return (a.kodeBarang && a.kodeBarang.toLowerCase().indexOf(q) !== -1) ||
           (a.nup && String(a.nup).toLowerCase().indexOf(q) !== -1) ||
           (a.namaBarang && a.namaBarang.toLowerCase().indexOf(q) !== -1) ||
           (a.lokasiId && a.lokasiId.toLowerCase().indexOf(q) !== -1);
  });
  _bmnRenderEligibleTable(filtered);
}

function _bmnToggleItemSelect(asetId, checked) {
  if (checked) {
    _BMN_HPS.selectedAsetIds[asetId] = true;
  } else {
    delete _BMN_HPS.selectedAsetIds[asetId];
  }
  _bmnUpdateHpsSelectionTotals();
}

function _bmnToggleAllEligibleCheckboxes(toggleEl) {
  var checked = toggleEl ? toggleEl.checked : false;
  var cbs = document.querySelectorAll('.bmn-hps-item-cb');
  cbs.forEach(function (cb) {
    cb.checked = checked;
    var id = cb.getAttribute('data-id');
    if (checked) {
      _BMN_HPS.selectedAsetIds[id] = true;
    } else {
      delete _BMN_HPS.selectedAsetIds[id];
    }
  });
  _bmnUpdateHpsSelectionTotals();
}

function _bmnSelectAllEligible(selectAll) {
  if (selectAll) {
    _BMN_HPS.eligibleAsets.forEach(function (a) {
      _BMN_HPS.selectedAsetIds[a.asetId] = true;
    });
  } else {
    _BMN_HPS.selectedAsetIds = {};
  }
  _bmnFilterEligibleAsets();
  _bmnUpdateHpsSelectionTotals();
}

function _bmnUpdateHpsSelectionTotals() {
  var selectedKeys = Object.keys(_BMN_HPS.selectedAsetIds);
  var count = selectedKeys.length;
  var totalPerolehan = 0;
  var totalBuku = 0;

  _BMN_HPS.eligibleAsets.forEach(function (a) {
    if (_BMN_HPS.selectedAsetIds[a.asetId]) {
      totalPerolehan += (Number(a.nilaiPerolehan) || 0);
      totalBuku += (Number(a.nilaiBuku) || 0);
    }
  });

  var elCount = document.getElementById('bmn-hps-sel-count');
  var elPerolehan = document.getElementById('bmn-hps-sel-perolehan');
  var elBuku = document.getElementById('bmn-hps-sel-buku');

  if (elCount) elCount.textContent = count;
  if (elPerolehan) elPerolehan.textContent = _rupiah(totalPerolehan);
  if (elBuku) elBuku.textContent = _rupiah(totalBuku);
}

function _bmnSubmitCreateHapus() {
  var elAlasan = document.getElementById('bmn-hps-alasan');
  var elNoSurat = document.getElementById('bmn-hps-no-surat');
  var elTglSurat = document.getElementById('bmn-hps-tgl-surat');
  var elLinkSurat = document.getElementById('bmn-hps-link-surat');
  var elKet = document.getElementById('bmn-hps-keterangan');
  var btn = document.getElementById('btn-submit-create-hapus');

  var alasan = elAlasan ? elAlasan.value : '';
  var keterangan = elKet ? elKet.value.trim() : '';
  var noSurat = elNoSurat ? elNoSurat.value.trim() : '';
  var tglSurat = elTglSurat ? elTglSurat.value : '';
  var linkSurat = elLinkSurat ? elLinkSurat.value.trim() : '';

  if (!alasan) {
    _msg('bmn-create-hps-msg', 'error', 'Pilih alasan penghapusan.');
    return;
  }
  if (!keterangan) {
    _msg('bmn-create-hps-msg', 'error', 'Keterangan / pertimbangan usulan wajib diisi.');
    return;
  }

  var asetIds = Object.keys(_BMN_HPS.selectedAsetIds);
  if (asetIds.length === 0) {
    _msg('bmn-create-hps-msg', 'error', 'Pilih minimal satu aset yang akan diusulkan untuk dihapus.');
    return;
  }

  if (btn) btn.disabled = true;
  _msg('bmn-create-hps-msg', 'info', 'Menyimpan berkas usulan penghapusan dan mengkarantina aset...');

  google.script.run
    .withSuccessHandler(function (res) {
      if (btn) btn.disabled = false;
      if (!res.success) {
        _msg('bmn-create-hps-msg', 'error', res.error || 'Gagal membuat usulan.');
        return;
      }
      closeModal('modal-bmn-create-hapus');
      _msg('bmn-table-msg', 'success', 'Berkas usulan penghapusan ' + res.penghapusanId + ' berhasil dibuat dengan ' + asetIds.length + ' aset dikarantina.');
      _bmnLoadPenghapusanList(true);
      _bmnLoadAsetList(true);
      _bmnLoadSummary(true);
    })
    .withFailureHandler(function (err) {
      if (btn) btn.disabled = false;
      _msg('bmn-create-hps-msg', 'error', 'Terjadi kesalahan sistem: ' + (err.message || 'Koneksi gagal.'));
    })
    .bmn_createPenghapusan(APP.token, {
      alasanPenghapusan: alasan,
      keteranganAlasan: keterangan,
      nomorSuratUsulan: noSurat,
      tanggalSuratUsulan: tglSurat,
      evidenceSuratUsulan: linkSurat,
      asetIds: asetIds
    });
}

    .withSuccessHandler(function (res) {

    })
    .withFailureHandler(function (err) {
      if (tbody) tbody.innerHTML = '<tr><td colspan="6" style="text-align:center; padding:16px; color:var(--n-crit);">Kesalahan: ' + (err.message || 'Koneksi gagal.') + '</td></tr>';
    })
    .bmn_getPenghapusanDetail(APP.token, penghapusanId);
}

function _bmnRenderDetailHapus(detail) {
  var master = detail.master || {};
  var items = detail.items || [];
  var currentTahap = String(master.tahap || 'DRAFT_USULAN').toUpperCase();

  var elBadge = document.getElementById('bmn-detail-hps-badge');
  if (elBadge) elBadge.innerHTML = _bmnGetTahapBadge(currentTahap);

  var stepOrder = ['DRAFT_USULAN', 'SURAT_USULAN', 'PERSETUJUAN_KEMENKEU', 'SK_PENGHAPUSAN', 'BAST_SELESAI'];
  var currentIdx = stepOrder.indexOf(currentTahap);

  var elStepper = document.getElementById('bmn-detail-hps-stepper');
  if (elStepper) {
    elStepper.querySelectorAll('.n-step-item').forEach(function (stepEl) {
      var stepName = stepEl.getAttribute('data-step');
      var stepIdx = stepOrder.indexOf(stepName);
      stepEl.classList.remove('active', 'completed', 'rejected');

      if (currentTahap === 'DITOLAK') {
        if (stepIdx <= 2) stepEl.classList.add('completed');
        if (stepIdx === 2) stepEl.classList.add('rejected');
      } else if (currentTahap === 'VOID') {
        stepEl.classList.add('rejected');
      } else {
        if (stepIdx < currentIdx) {
          stepEl.classList.add('completed');
        } else if (stepIdx === currentIdx) {
          stepEl.classList.add('active');
        }
      }
    });
  }

  var elAlert = document.getElementById('bmn-detail-hps-alert');
  if (elAlert) {
    if (currentTahap === 'DITOLAK') {
      elAlert.className = 'n-msg n-msg-error';
      elAlert.classList.remove('n-hidden');
      elAlert.innerHTML = '<strong>Usulan Ditolak oleh Kemenkeu</strong><br>' + _esc(master.keteranganAlasan || '');
    } else if (currentTahap === 'VOID') {
      elAlert.className = 'n-msg n-msg-error';
      elAlert.classList.remove('n-hidden');
      elAlert.innerHTML = '<strong>Berkas Usulan Telah Dianulir</strong><br>' + _esc(master.voidReason || 'Usulan dibatalkan internal.');
    } else {
      elAlert.classList.add('n-hidden');
    }
  }

  var elAlasan = document.getElementById('bmn-detail-hps-alasan');
  var elKet = document.getElementById('bmn-detail-hps-keterangan');
  var elUnit = document.getElementById('bmn-detail-hps-total-unit');
  var elPerolehan = document.getElementById('bmn-detail-hps-total-perolehan');
  var elBuku = document.getElementById('bmn-detail-hps-total-buku');

  if (elAlasan) elAlasan.textContent = _bmnGetAlasanLabel(master.alasanPenghapusan);
  if (elKet) elKet.textContent = master.keteranganAlasan || '-';
  if (elUnit) elUnit.textContent = (master.totalUnit || items.length) + ' Unit';
  if (elPerolehan) elPerolehan.textContent = _rupiah(master.totalNilaiPerolehan);
  if (elBuku) elBuku.textContent = _rupiah(master.totalNilaiBuku);

  var elDocs = document.getElementById('bmn-detail-docs-summary');
  if (elDocs) {
    var docHtml = '';
    if (master.nomorSuratUsulan) {
      docHtml += '<div style="margin-bottom:4px;"><strong>Surat Usulan:</strong> ' + _esc(master.nomorSuratUsulan);
      if (master.evidenceSuratUsulan) {
        docHtml += ' <a href="' + _esc(master.evidenceSuratUsulan) + '" target="_blank" rel="noopener" style="color:var(--n-primary); text-decoration:underline;">[Lihat Berkas]</a>';
      }
      docHtml += '</div>';
    } else {
      docHtml += '<div style="color:var(--n-text-muted); margin-bottom:4px;">Surat Usulan: Belum diterbitkan</div>';
    }

    if (master.nomorSuratPersetujuan) {
      docHtml += '<div style="margin-bottom:4px;"><strong>Persetujuan Kemenkeu:</strong> ' + _esc(master.nomorSuratPersetujuan) + ' (' + _esc(master.instansiKemenkeu || 'DJKN') + ')';
      if (master.evidenceSuratPersetujuan) {
        docHtml += ' <a href="' + _esc(master.evidenceSuratPersetujuan) + '" target="_blank" rel="noopener" style="color:var(--n-primary); text-decoration:underline;">[Lihat Berkas]</a>';
      }
      docHtml += '</div>';
    } else {
      docHtml += '<div style="color:var(--n-text-muted); margin-bottom:4px;">Persetujuan Kemenkeu: Belum ada</div>';
    }

    if (master.nomorSK) {
      docHtml += '<div style="margin-bottom:4px;"><strong>SK Penghapusan:</strong> ' + _esc(master.nomorSK);
      if (master.evidenceSK) {
        docHtml += ' <a href="' + _esc(master.evidenceSK) + '" target="_blank" rel="noopener" style="color:var(--n-primary); text-decoration:underline;">[Lihat Berkas]</a>';
      }
      docHtml += '</div>';
    }

    if (master.evidenceBAST) {
      docHtml += '<div style="margin-bottom:4px;"><strong>BAST Selesai:</strong> <a href="' + _esc(master.evidenceBAST) + '" target="_blank" rel="noopener" style="color:var(--n-primary); text-decoration:underline;">[Lihat Berkas BAST]</a></div>';
    }

    elDocs.innerHTML = docHtml;
  }

  var elCount = document.getElementById('bmn-detail-hps-items-count');
  if (elCount) elCount.textContent = items.length + ' item';

  var tbody = document.getElementById('bmn-detail-hps-items-tbody');
  if (tbody) {
    if (items.length === 0) {
      tbody.innerHTML = '<tr><td colspan="6" style="text-align:center; padding:16px; color:var(--n-text-muted);">Tidak ada daftar aset dalam usulan ini.</td></tr>';
    } else {
      var itemHtml = '';
      items.forEach(function (it) {
        var stBadge = '';
        var st = String(it.statusAset || '').toUpperCase();
        if (st === 'DALAM_PENGHAPUSAN') {
          stBadge = '<span class="badge" style="background:#FEF08A;color:#854D0E;">Karantina Usulan</span>';
        } else if (st === 'DIHAPUS') {
          stBadge = '<span class="badge" style="background:#FEE2E2;color:#DC2626;">Dihapus (Final)</span>';
        } else {
          stBadge = '<span class="badge" style="background:#DEF7EC;color:#03543F;">' + _esc(st) + '</span>';
        }

        itemHtml += '<tr>' +
                      '<td>' +
                        '<strong class="tnum">' + _esc(it.kodeBarang) + '</strong>' +
                        '<div style="font-size:.72rem; color:var(--n-text-muted);">NUP: ' + _esc(it.nup) + '</div>' +
                      '</td>' +
                      '<td>' +
                        '<div style="font-weight:600;">' + _esc(it.namaBarang) + '</div>' +
                        (it.merekTipe ? '<div style="font-size:.72rem; color:var(--n-text-muted);">' + _esc(it.merekTipe) + '</div>' : '') +
                      '</td>' +
                      '<td>' + _esc(it.kondisiSaatUsulan || '-') + '</td>' +
                      '<td>' + _esc(it.lokasiId || '-') + '</td>' +
                      '<td style="text-align:right;" class="tnum font-semibold">' + _rupiah(it.nilaiBukuSaatUsulan) + '</td>' +
                      '<td>' + stBadge + '</td>' +
                    '</tr>';
      });
      tbody.innerHTML = itemHtml;
    }
  }

  _bmnRenderAdvanceForm(currentTahap, master);
}
