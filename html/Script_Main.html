// ── ITEM LIST "rincian per-item" (revisi Fase 13) ─────────
// Komponen daftar baris input generik.
//   spec.columns — [{key, label, type:'text'|'select'|'hidden',
//                    placeholder, options:[{value,label}], value}]
//   spec.grid    — grid-template-columns utk head + tiap baris
//                  (default: kolom selebar 1fr + kolom hapus auto).
//   spec.onInput(items) — dipanggil tiap kali isi daftar berubah.
//   spec.minEmptyRows   — baris kosong cadangan (default 1).
// return — { add(values), set(items), clear(), get(), count() }
// `get()` membuang baris yang SEMUA kolom input (non-hidden) kosong,
// sehingga empty-rows cadangan tidak ikut menjadi item.
function _nList(wrapId, spec) {
  spec = spec || {};
  var columns = spec.columns || [];
  var wrap = document.getElementById(wrapId);
  if (!wrap) return { add: function(){}, set: function(){}, clear: function(){}, get: function(){ return []; }, count: function(){ return 0; } };
  var rows = [];
  var grid = spec.grid || columns.map(function(){ return '1fr'; }).join(' ');

  function colSel(col) {
    var s = document.createElement('select');
    var empty = { value: '', label: '(Pilih)' };
    var opts = col.options || [];
    if (col.empty !== false && (opts.length === 0 || String(opts[0].value || '') !== '')) {
      opts = [empty].concat(opts);
    }
    opts.forEach(function (o) {
      var opt = document.createElement('option');
      opt.value = o.value != null ? o.value : '';
      opt.textContent = o.label != null ? o.label : String(o.value || '');
      s.appendChild(opt);
    });
    return s;
  }

  function makeCell(col) {
    var cell = document.createElement('div');
    cell.className = 'n-list-cell';
    var el;
    if (col.type === 'hidden') {
      el = document.createElement('input');
      el.type = 'hidden';
      el.value = col.value != null ? col.value : '';
      // Kolom hidden TIDAK boleh memakan track grid — kalau ikut jadi sel,
      // jumlah anak melebihi jumlah track dan tombol hapus wrap ke baris baru.
      cell.style.display = 'none';
    } else if (col.type === 'select') {
      el = colSel(col);
    } else {
      el = document.createElement('input');
      el.type = 'text';
      if (col.placeholder) el.placeholder = col.placeholder;
    }
    el.setAttribute('data-f', col.key);
    if (col.type !== 'hidden') el.addEventListener('input', onChanged);
    cell.appendChild(el);
    return cell;
  }

  function isRowFilled(rowEl) {
    for (var i = 0; i < columns.length; i++) {
      var col = columns[i];
      if (col.type === 'hidden') continue;
      var el = rowEl.querySelector('[data-f="' + col.key + '"]');
      if (el && String(el.value || '').trim() !== '') return true;
    }
    return false;
  }

  function makeRow(values) {
    var rowEl = document.createElement('div');
    rowEl.className = 'n-list-row';
    rowEl.style.gridTemplateColumns = grid + ' auto';
    columns.forEach(function (col) { rowEl.appendChild(makeCell(col)); });
    var delCell = document.createElement('div');
    delCell.className = 'n-list-delcell';
    var del = document.createElement('button');
    del.type = 'button';
    del.className = 'n-list-del';
    del.title = 'Hapus baris';
    del.setAttribute('aria-label', 'Hapus baris');
    del.innerHTML = _ico('trash');
    del.addEventListener('click', function () { removeRow(rowEl); });
    delCell.appendChild(del);
    rowEl.appendChild(delCell);
    if (values) {
      columns.forEach(function (col) {
        var el = rowEl.querySelector('[data-f="' + col.key + '"]');
        if (el) {
          var v = values[col.key];
          if (v != null && String(v) !== '') el.value = String(v);
        }
      });
    }
    wrap.appendChild(rowEl);
    rows.push(rowEl);
    return rowEl;
  }

  function removeRow(rowEl) {
    var i = rows.indexOf(rowEl);
    if (i !== -1) rows.splice(i, 1);
    if (rowEl.parentNode) rowEl.parentNode.removeChild(rowEl);
    onChanged();
  }

  function onChanged() {
    if (spec.onInput) spec.onInput(get());
  }

  function add(values) { makeRow(values); onChanged(); }

  function set(items) {
    for (var i = rows.length - 1; i >= 0; i--) removeRow(rows[i]);
    (items || []).forEach(function (it) { makeRow(it); });
    var min = Math.max(Number(spec.minEmptyRows) || 1, 1);
    for (var j = 0; j < min; j++) makeRow(null);
    onChanged();
  }

  function clear() { set([]); }

  function get() {
    var out = [];
    for (var i = 0; i < rows.length; i++) {
      var rowEl = rows[i];
      if (!isRowFilled(rowEl)) continue;
      var o = {};
      columns.forEach(function (col) {
        var el = rowEl.querySelector('[data-f="' + col.key + '"]');
        o[col.key] = el ? String(el.value || '') : '';
      });
      out.push(o);
    }
    return out;
  }

  function count() { return get().length; }

  if (wrap) wrap.classList.add('n-list');
  var initial = Math.max(Number(spec.minEmptyRows) || 1, 1);
  for (var k = 0; k < initial; k++) makeRow(null);

  return { add: add, set: set, clear: clear, get: get, count: count };
}

// ── SEARCH DROPDOWN "Pilih…" (revisi Fase 12) ────────────
// Menggantikan combobox typeahead **Backlog B (dibatalkan)**. Enum
// Jenis/Kategori kembali ke <select> Opsi biasa (PRD memakai istilah
// dropdown). Field relasi Kapal memakai dropdown yang jelas terlihat
// sebagai dropdown (chevron), dengan kotak cari di panel + tombol hapus.
// Nilai akhir tetap divalidasi server.
// Markup (di tiap form, lihat views/*.html):
//   <div class="kdl-sel">
//     <input  id="X-input"  class="kdl-field" readonly placeholder="…">
//     <input type="hidden"  id="X">                 ← token terpilih
//     <button id="X-clear"  class="kdl-clear" style="display:none;"></button>
//     <span   class="kdl-caret"></span>
//     <div    class="kdl-panel" id="X-panel">
//       <input id="X-q" type="text" class="kdl-q" placeholder="Cari…">
//       <ul    id="X-dd" class="kdl-list"></ul>
//     </div>
//   </div>
// Submit membaca token via _v('X'); hapus keyword me-reset filter penuh.
var _KDL_DATA = {};

// Mengisi <select> biasa dari daftar item Opsi {value,label}; mempertahankan
// nilai terpilih bila masih tersedia, juga untuk form revisi.
function _fillOpsiSelect(id, items, labelKosong) {
  var sel = document.getElementById(id);
  if (!sel) return;
  var prev = sel.value;
  sel.innerHTML = '';
  if (labelKosong !== undefined) {
    var o0 = document.createElement('option');
    o0.value = '';
    o0.textContent = labelKosong;
    sel.appendChild(o0);
  }
  (items || []).forEach(function (it) {
    var o = document.createElement('option');
    o.value = it.value;
    o.textContent = it.label;
    sel.appendChild(o);
  });
  sel.value = prev;
  return sel;
}
function _kdlInit(id, items) {
  var field = document.getElementById(id + '-input');
  var hid   = document.getElementById(id);
  var panel = document.getElementById(id + '-panel');
  var q     = document.getElementById(id + '-q');
  var dd    = document.getElementById(id + '-dd');
  var clear = document.getElementById(id + '-clear');
  if (!field || !hid || !panel) return;
  _KDL_DATA[id] = items || [];
  if (field.getAttribute('data-kdl-bound')) return;
  field.setAttribute('data-kdl-bound', '1');

  field.addEventListener('click', function () { _kdlToggle(id); });
  field.addEventListener('keydown', function (e) {
    if (e.keyCode === 40 || e.keyCode === 38 || e.keyCode === 13) { // ↓/↑/Enter buka
      e.preventDefault();
      _kdlOpen(id);
    }
  });

  if (q) {
    q.addEventListener('input', function () { _kdlFilter(id); });
    q.addEventListener('keydown', function (e) { _kdlKey(id, e); });
  }
  if (dd) dd.addEventListener('mousedown', function (e) { _kdlPickEvent(id, e); });
  if (clear) clear.addEventListener('click', function (e) {
    e.stopPropagation();
    _kdlClear(id);
  });
}

function _kdlOpen(id) {
  _kdlCloseAll();
  var panel = document.getElementById(id + '-panel');
  var q     = document.getElementById(id + '-q');
  if (panel) panel.classList.add('kdl-open');
  if (q) q.value = '';
  _kdlFilter(id);
  if (q) q.focus();
}

function _kdlToggle(id) {
  var panel = document.getElementById(id + '-panel');
  if (panel && panel.classList.contains('kdl-open')) _kdlClose(id);
  else _kdlOpen(id);
}

function _kdlClose(id) {
  var panel = document.getElementById(id + '-panel');
  if (panel) panel.classList.remove('kdl-open');
}

function _kdlCloseAll() {
  var els = document.querySelectorAll('.kdl-panel.kdl-open');
  for (var i = 0; i < els.length; i++) els[i].classList.remove('kdl-open');
}

document.addEventListener('mousedown', function (e) {
  if (e.target && e.target.closest && e.target.closest('.kdl-sel')) return;
  _kdlCloseAll();
});

function _kdlFilter(id) {
  var q  = document.getElementById(id + '-q');
  var dd = document.getElementById(id + '-dd');
  if (!q || !dd) return;
  var term = (q.value || '').toLowerCase();
  var shown = [];
  (_KDL_DATA[id] || []).forEach(function (it) {
    if (it && (it.label || '').toLowerCase().indexOf(term) !== -1) shown.push(it);
  });
  dd.innerHTML = '';
  shown.forEach(function (it) {
    var li = document.createElement('li');
    li.textContent = it.label;
    li.setAttribute('data-v', it.value);
    li.setAttribute('data-l', it.label);
    if (it.label && it.label.toLowerCase() === term) li.className = 'kdl-hl';
    dd.appendChild(li);
  });
  if (!shown.length && term) {
    var empty = document.createElement('li');
    empty.textContent = 'Tidak ada opsi — tambahkan di Master Data';
    empty.className = 'kdl-empty';
    dd.appendChild(empty);
  }
}

function _kdlPickEvent(id, e) {
  e.preventDefault();
  var li = e.target;
  while (li && li.tagName !== 'LI') li = li.parentNode;
  if (!li || !li.getAttribute('data-v')) return;
  _kdlPick(id, li.getAttribute('data-v'), li.getAttribute('data-l'));
}

function _kdlPick(id, value, label) {
  var field = document.getElementById(id + '-input');
  var hid   = document.getElementById(id);
  var clear = document.getElementById(id + '-clear');
  if (field) field.value = label;
  if (hid)   hid.value = value;
  if (clear) clear.style.display = '';
  _kdlClose(id);
}

function _kdlKey(id, e) {
  var k = e.keyCode;
  var dd = document.getElementById(id + '-dd');
  if (!dd) return;
  var items = dd.querySelectorAll('li');
  if (k === 38 || k === 40) {
    e.preventDefault();
    var idx = -1;
    for (var i = 0; i < items.length; i++) {
      if (items[i].classList.contains('kdl-hl')) { idx = i; break; }
    }
    idx += (k === 40) ? 1 : -1;
    if (idx < 0) idx = 0;
    if (idx > items.length - 1) idx = items.length - 1;
    for (var j = 0; j < items.length; j++) items[j].classList.remove('kdl-hl');
    if (items[idx]) items[idx].classList.add('kdl-hl');
  } else if (k === 13) {
    for (var m = 0; m < items.length; m++) {
      if (items[m].classList.contains('kdl-hl')) {
        e.preventDefault();
        _kdlPick(id, items[m].getAttribute('data-v'), items[m].getAttribute('data-l'));
        return;
      }
    }
  } else if (k === 27) {
    _kdlClose(id);
    var field = document.getElementById(id + '-input');
    if (field) field.focus();
  }
}

// Hapus pilihan + keyword → filter kembali penuh saat panel dibuka kembali.
function _kdlClear(id) {
  _kdlSet(id, '', '');
  var q = document.getElementById(id + '-q');
  if (q) q.value = '';
  _kdlFilter(id);
  var field = document.getElementById(id + '-input');
  if (field) field.focus();
}

// Reset penuh saat form dibuka (pola Backlog A). Tidak membuka panel.
function _kdlReset(id) {
  _kdlSet(id, '', '');
  _kdlClose(id);
  var q = document.getElementById(id + '-q');
  if (q) q.value = '';
  _kdlFilter(id);
}

function _kdlSet(id, token, label) {
  var field = document.getElementById(id + '-input');
  var hid   = document.getElementById(id);
  var clear = document.getElementById(id + '-clear');
  if (field) field.value = label;
  if (hid)   hid.value = token;
  if (clear) clear.style.display = token ? '' : 'none';
}

// ── PENCARIAN KAPAL (search dropdown) — Fase 12 ──────────
// Semua APPROVED boleh baca master kapal (PRD §6), jadi dropdown kapal
// di form Operasi Laut/Udara & Logistik memakai master_getKapalList.
var _KAPAL_ITEMS   = [];
var _KAPAL_LABEL   = {}; // kapalId → nama (untuk tabel riwayat & profil)
var _KAPAL_JENIS   = {}; // kapalId → JenisKapal (filter form per kategori hari operasi)

function _kapalItemsFor(jenisKategori) {
  var kat = String(jenisKategori || '').trim().toUpperCase();
  if (!kat || kat === 'SEMUA_KAPAL') return _KAPAL_ITEMS.slice();
  return _KAPAL_ITEMS.filter(function (k) {
    var j = String(k.jenis || '').trim().toUpperCase();
    return !j || j === kat; // kapal lama tanpa JenisKapal → tidak dibatasi
  });
}

function _kapalInit(id, jenisKategori) {
  var items = _kapalItemsFor(jenisKategori);
  if (_KAPAL_ITEMS.length) { _kdlInit(id, items); return; }
  google.script.run
    .withSuccessHandler(function (res) {
      if (res && res.success && res.data) {
        _KAPAL_ITEMS = res.data.map(function (k) {
          var kid = String(k.kapalId || '');
          _KAPAL_LABEL[kid] = String(k.nama || kid || '');
          _KAPAL_JENIS[kid] = String(k.jenisKapal || '').trim().toUpperCase();
          return { value: kid, label: _KAPAL_LABEL[kid], jenis: _KAPAL_JENIS[kid] };
        });
      } else {
        _KAPAL_ITEMS = [];
      }
      if (id) _kdlInit(id, _kapalItemsFor(jenisKategori));
    })
    .withFailureHandler(function () {
      _KAPAL_ITEMS = [];
      if (id) _kdlInit(id, []);
    })
    .master_getKapalList(APP.token);
}

function _kapalName(kapalId) {
  if (!kapalId) return '—';
  return _KAPAL_LABEL[String(kapalId)] || String(kapalId);
}

/**
 * Saring ulang dropdown kapal berdasarkan kategori hari operasi (Fase 14
 * Item 6). Dipanggil saat kategori berubah: kapal yang jenisnya tidak cocok
 * disembunyikan dari daftar, dan pilihan yang jadi tidak sah di-reset.
 */
function _kapalSyncKategori(kdlId, kategoriId) {
  var kat = _v(kategoriId);
  _KDL_DATA[kdlId] = _kapalItemsFor(kat);
  var chosen = _v(kdlId);
  if (chosen) {
    var jenis = _KAPAL_JENIS[String(chosen)] || '';
    var katU = String(kat || '').toUpperCase();
    var cocok = (!katU || katU === 'SEMUA_KAPAL' || !jenis || jenis === katU);
    if (!cocok) _kdlClear(kdlId);
  }
  _kdlFilter(kdlId);
}

  if (!kapalId) return '—';
  return '<span style="font-size:.82rem;">' + _esc(_kapalName(kapalId)) + '</span>';

function _renderOperasiUdara(el) {
  // Teardown peta Pesawat dulu (setiap render ulang utuh)
  if (window.opsUdaraMap) {
    try { window.opsUdaraMap.remove(); } catch(e) {}
    window.opsUdaraMap = null;
  }
  window.opsUdaraWppLayer = null;

  var tpl = document.getElementById('view-tpl-operasi-udara');
  if (!tpl) { el.innerHTML = _moduleStub('Operasi Udara'); return; }
  el.innerHTML = tpl.innerHTML;
  _attachInit('opsudara', { refSheet: 'TX_OperasiUdara' });

  _opsInitPeriodeUi('oud-');
  _opsUdaraLoadOptions();
  _opsUdaraLoadKPI();
  _opsUdaraLoadHistory();

  var pHint = document.getElementById('oud-periode-hint');
  if (pHint) {
    google.script.run.withSuccessHandler(function(res){
      if(res) pHint.textContent = 'Periode saat ini: ' + res;
    }).utils_getCurrentPeriode();
  }

  // Init map — tunggu Leaflet dimuat dulu (on-demand loader)
  _loadLeaflet(function() { setTimeout(_initOpsUdaraMap, 100); });
}

function _initOpsUdaraMap() {
  _loadLeaflet(function () {
    if (window.opsUdaraMap) {
      window.opsUdaraMap.invalidateSize();
      _renderOpsUdaraWppLayer();
      return;
    }
    var mapEl = document.getElementById('map-ops-udara');
    if (!mapEl) return;
    _ensureCartoKey(function (key) {
      if (!window.opsUdaraMap) {
        window.opsUdaraMap = L.map('map-ops-udara').setView([-2.5489, 118.0149], 5);
      }
      L.tileLayer(_cartoTileUrl(key), {
        attribution: '&copy; OpenStreetMap contributors &copy; CARTO',
        subdomains: 'abcd',
        maxZoom: 20
      }).addTo(window.opsUdaraMap);
      _renderOpsUdaraWppLayer();
    });
  });
}

function _renderOpsUdaraWppLayer() {
  if (!window.opsUdaraMap) return;
  if (window.opsUdaraWppLayer) {
    window.opsUdaraMap.removeLayer(window.opsUdaraWppLayer);
    window.opsUdaraWppLayer = null;
  }

  _opsMapStatus('map-ops-udara', 'loading');
  _opsGetGeoData(function (geoData, err) {
    if (!window.opsUdaraMap) return;
    if (err) {
      _opsMapStatus('map-ops-udara', 'error', err, _renderOpsUdaraWppLayer);
      return;
    }
    var kpi = _OPSUDARA.kpiData;
    var intensitasOf = function (code) {
      return _opsWppIntensitas(kpi && kpi.wppIntensitas, code);
    };
    window.opsUdaraWppLayer = L.geoJSON(geoData, {
        style: function(feature) {
          var intensitas = intensitasOf(feature.properties.wppnri);
          return {
            fillColor: _opsWppFill(intensitas),
            fillOpacity: 0.85,
            weight: 1,
            opacity: 1,
            color: 'rgba(43,54,116,0.45)'
          };
        },
        onEachFeature: function(feature, layer) {
          var wppCode = feature.properties.wppnri;
          layer.bindTooltip(
            _opsWppTooltip(feature.properties, intensitasOf(wppCode)),
            { sticky: true }
          );
        }
      }).addTo(window.opsUdaraMap);
    _opsMapStatus('map-ops-udara', null);
    _opsMapLegend('map-ops-udara', _OPS_WPP_SCALE);
  });
}

function _opsUdaraLoadOptions() {

function _opsUdaraRenderKPI(kpi) {
  var strip = document.getElementById('ops-udara-kpi-strip');
  if (!strip) return;

  var totalPantau = (kpi.kii || 0) + (kpi.kia || 0);
  var pctOp = kpi.hari_operasi_target > 0 ? ((kpi.hari_operasi_realisasi / kpi.hari_operasi_target)*100).toFixed(1) : 0;

  var html = '    <div style="display:grid; grid-template-columns: repeat(4, 1fr); gap:16px; margin-bottom: 24px;">\n' +
'      <div class="n-card">\n' +
'        <div class="kpi-label">KAPAL DIPANTAU</div>\n' +
'        <div class="kpi-val">' + (totalPantau) + '</div>\n' +
'        <div class="kpi-sub">KII: ' + (kpi.kii) + ' &middot; KIA: ' + (kpi.kia) + '</div>\n' +
'      </div>\n' +
'      <div class="n-card">\n' +
'        <div class="kpi-label">RUMPON LOKAL</div>\n' +
'        <div class="kpi-val">' + (kpi.rumpon_lokal) + '</div>\n' +
'        <div class="kpi-sub">Teridentifikasi</div>\n' +
'      </div>\n' +
'      <div class="n-card">\n' +
'        <div class="kpi-label">CAKUPAN WILAYAH</div>\n' +
'        <div class="kpi-val">' + (kpi.cakupan_nm2) + '</div>\n' +
'        <div class="kpi-sub">NM&sup2; teramati</div>\n' +
'      </div>\n' +
'      <div class="n-card">\n' +
'        <div class="kpi-label">HARI OPERASI (' + (pctOp) + '%)</div>\n' +
'        <div class="kpi-val" style="font-size:1.5rem;">' + (kpi.hari_operasi_realisasi) + ' / ' + (kpi.hari_operasi_target) + '</div>\n' +
'        <div style="margin-top:8px; height:6px; background:#e2e8f0; border-radius:99px; overflow:hidden;">\n' +
'          <div style="height:100%; width:' + (Math.min(pctOp,100)) + '%; background:var(--n-status-success);"></div>\n' +
'        </div>\n' +
'      </div>\n' +
'    </div>\n';
  strip.innerHTML = html;
}

  // baris lama yang masih kosong. Server mewarisi nilai lama bila tidak dikirim.
  var kapal = _v('rv-oud-kapal');
  if (!kapal) {
    _msg('oud-revisi-msg', 'error', 'Kapal Pengawas wajib dipilih.');
    btn.disabled = false; btn.textContent = 'Simpan Revisi';
    return;
  }

  var params = {
    targetRowId: _OPSUDARA.pendingRowId,
    alasanRevisi: alasan,
    KapalID: kapal
  };

  opsUdaraBindRevisiList();
  var objek = _OPSUDARA.rvObjek.get();
  objek = objek.filter(function (it) { return String(it.ItemType || '') !== ''; });
  if (objek.length) params.rincian = objek;
  if(_v('rv-oud-rumpon')) params.RumponLokalTeridentifikasi = parseInt(_v('rv-oud-rumpon'), 10);
  if(_v('rv-oud-cakupan')) params.CakupanWilayah_NM2 = parseInt(_v('rv-oud-cakupan'), 10);
  if(_v('rv-oud-hari-jumlah')) params.HariOperasi_Jumlah = parseInt(_v('rv-oud-hari-jumlah'), 10);
  if(_v('rv-oud-hari-target')) params.HariOperasi_Target = parseInt(_v('rv-oud-hari-target'), 10);

  google.script.run
    .withSuccessHandler(function(res) {
      btn.disabled = false; btn.textContent = 'Simpan Revisi';
      if(res.success) {
        _attachCarry('TX_OperasiUdara', params.targetRowId, res.data.rowId);
        _attachUploadAll('oud-revisi', [res.data.rowId], function () {
          closeModal('modal-oud-revisi');
          _msg('oud-hist-msg', 'success', res.data.message);
          _opsUdaraLoadKPI();
          _opsUdaraLoadHistory();
        });
      } else {
        _msg('oud-revisi-msg', 'error', res.error);
      }
    })
    .operasiUdara_revisi(APP.token, params);
}

function _intelRenderKPI(kpi) {
  var strip = document.getElementById('int-kpi-strip');

  var kawasanTotal = 0;
  if (kpi.kawasanPeriode) {
    Object.keys(kpi.kawasanPeriode).forEach(function(k){ kawasanTotal += (kpi.kawasanPeriode[k] || 0); });
  }

  function card(label, value) {
    return '<div class="n-card"><div class="kpi-label">' + _esc(label) + '</div>' +
           '<div class="kpi-val">' + (value || 0) + '</div></div>';

    card('Pelanggaran Transmitter',    kpi.pelanggaranTransmitter) +
    card('Nota Dinas',                 kpi.notaDinas) +
    card('Pengangkut Ikan Hidup',      kpi.kapalPengangkutIkanHidup) +
    card('Pelanggaran Kawasan',        kawasanTotal) +

// ── Tabel Kawasan Konservasi (§8.2) ──
function _intelRenderKawasanTable(rows) {
  var wrap = document.getElementById('int-kawasan-wrap');
  if (!wrap) return;

  if (!rows || rows.length === 0) {
    wrap.innerHTML = '<div style="padding:20px 24px;color:var(--n-text-muted);font-size:.875rem;">Belum ada data kawasan konservasi pada master.</div>';
    return;
  }

  var t = '<table class="n-table n-table-full"><thead><tr>' +
    '<th>Kawasan</th><th>Provinsi</th><th>Pelanggaran Periode</th><th>YTD</th><th>Tren</th><th>Laporan</th>' +
    '</tr></thead><tbody>';

  for (var i = 0; i < rows.length; i++) {
    var r = rows[i];
    var tren = '<span style="color:var(--n-text-muted);">—</span>';
    if (r.tren === 'NAIK')  tren = '<span style="color:var(--n-status-critical);font-weight:600;">▲ Naik</span>';
    else if (r.tren === 'TURUN') tren = '<span style="color:var(--n-status-success);font-weight:600;">▼ Turun</span>';

    t += '<tr>';
    t += '<td>' + _esc(r.nama) + '</td>';
    t += '<td>' + _esc(r.provinsi) + '</td>';
    t += '<td>' + (r.pelanggaranPeriode || 0) + '</td>';
    t += '<td>' + (r.pelanggaranYTD || 0) + '</td>';
    t += '<td>' + tren + '</td>';
    t += '<td><button class="btn-mini" onclick="intelSetKawasanFilter(\'' + String(r.kawasanId).replace(/[^A-Za-z0-9_-]/g,'') + '\')">Riwayat</button></td>';
    t += '</tr>';
  }

  t += '</tbody></table>';
  wrap.innerHTML = t;
}

function _intelRenderHistory(data) {

      '<button class="btn-mini" onclick="intelClearKawasanFilter()">Tampilkan Semua</button></div>';
  }

  var canWrite = (APP.user && (APP.user.role === 'SUPERADMIN' || (APP.user.divisiId === 'DIV-INTEL' && (APP.user.role === 'STAF' || APP.user.role === 'KADIV'))));

  _histRender('int-history-wrap', {
    columns: ['Periode', 'Kategori', 'Jumlah', 'Detail'],
    cells: function (r) {
      return [_esc(r.periode), _esc(INTEL_LABELS[r.Jenis] || r.Jenis), _idNum(r.Jumlah), _esc(_intelDetail(r))];
    },
    refSheet: 'TX_Intelijen',
    title: function (r) { return 'Intelijen — ' + (INTEL_LABELS[r.Jenis] || r.Jenis) + ' · Periode ' + r.periode; },
    detail: function (r) {
      return [
        ['Periode', _esc(r.periode)],
        ['Kategori', _esc(INTEL_LABELS[r.Jenis] || r.Jenis)],
        ['Jumlah', _idNum(r.Jumlah)],
        ['Kawasan', r.Jenis !== 'KAWASAN_KONSERVASI' ? '—' : _esc(r.kawasanNama || r.KawasanID || '—')],
        ['Detail', _esc(_intelDetail(r))],
        ['Dikirim', _esc(r.timestamp ? new Date(r.timestamp).toLocaleString('id-ID') : '—')],
        ['Status', _esc(r.status)]
      ].concat(_rncDetailFields(r.rincian));
    },
    revisi: canWrite  ? function (r) { return "intelOpenRevisiModal('" + _esc(r.rowId) + "')"; } : null,
    anulir: isPimpinan ? function (r) { return "intelOpenAnulirModal('" + _esc(r.rowId) + "')"; } : null,
    empty: 'Belum ada laporan untuk periode ini.'

// Nilai kolom "Detail" — sama antara baris tabel dan modal Lihat.
function _intelDetail(r) {
  if (r.Jenis === 'KAWASAN_KONSERVASI') return r.kawasanNama || r.KawasanID || '—';
  return r.Keterangan || '—';
}

// ── Submit ──
function intelSubmit(e) {
  _msg('int-form-msg', '', '');
  var attachErr = _attachValidate('intel');
  if (attachErr) { _msg('int-form-msg', 'error', attachErr); return; }
  var periode = _composePeriode('int-');
  if (!periode) { _msg('int-form-msg', 'error', 'Periode wajib dipilih.'); return; }

  var items = [];
  // Kejadian intelijen (5 jenis non-kawasan): jumlah dihitung sistem
  // dari daftar rincian per kejadian, dikelompokkan per jenis.
  var kejadian = _intelBindKejadianList().get();
  var byJenis = {};
  kejadian.forEach(function (k) {
    var j = String(k.Jenis || '');
    if (!j) return;
    if (!byJenis[j]) byJenis[j] = [];
    byJenis[j].push({ Deskripsi: String(k.Deskripsi || '') });
  });
  Object.keys(byJenis).forEach(function (j) {
    items.push({ jenis: j, rincian: byJenis[j] });
  });

  var kwRows = document.querySelectorAll('#int-kawasan-rows .int-kawasan-row');
  for (var i = 0; i < kwRows.length; i++) {
    var sel = kwRows[i].querySelector('.int-kw-sel');
    var jml = kwRows[i].querySelector('.int-kw-jml');
    var ket = kwRows[i].querySelector('.int-kw-ket');
    if (sel && sel.value) {
      items.push({
        jenis: 'KAWASAN_KONSERVASI',
        kawasanId: sel.value,
        jumlah: parseInt(jml && jml.value, 10) || 0,
        keterangan: ket ? ket.value : ''
      });
    }
  }

  if (items.length === 0) { _msg('int-form-msg', 'error', 'Minimal satu kejadian atau kawasan wajib diisi.'); return; }

  var btn = document.getElementById('int-btn-submit');
  _setLoading(btn, true);

  google.script.run
    .withSuccessHandler(function(res) {
      _setLoading(btn, false);
      if (res.success) {
        _msg('int-form-msg', 'success', res.data.message);
        var rowIds = (res.data && res.data.rowIds) || [];
        _intelResetForm();
        _attachUploadAll('intel', rowIds, function(ok) {
          _formSubmitDone('modal-int-form', 'Laporan intelijen tersimpan.', function () {
            _intelLoadKPI();
            _intelLoadHistory();
            _msg('int-form-msg', '', '');
          }, ok);
        });
      } else {
        _msg('int-form-msg', 'error', res.error);
      }
    })
    .withFailureHandler(function() {
      _setLoading(btn, false);
      _msg('int-form-msg', 'error', 'Koneksi terputus.');
    })
    .intelijen_submitMingguan(APP.token, { periode: periode, items: items });
}

function _intelRefreshKejadianCaptions() {
  var c = {
    DREDGING: 0,
    PELANGGARAN_PERIZINAN: 0,

// ── Revisi / Anulir ──
function _intelFindRow(rowId) {
  for (var i = 0; i < _INTEL.rows.length; i++) {
    if (String(_INTEL.rows[i].RowID) === String(rowId)) return _INTEL.rows[i];
  }
  return null;
}

function intelOpenRevisiModal(rowId) {
  var r = _intelFindRow(rowId);
  if (!r) return;
  _INTEL.pendingRowId = rowId;

  document.getElementById('int-revisi-info').textContent =
    (INTEL_LABELS[r.Jenis] || r.Jenis) + ' — Periode ' + r.Periode +
    (r.Jenis === 'KAWASAN_KONSERVASI' ? ' (' + (r.kawasanNama || r.KawasanID) + ')' : '');

  var isKw = (r.Jenis === 'KAWASAN_KONSERVASI');
  var kwBlock = document.getElementById('rv-int-kawasan-block');
  var kjBlock = document.getElementById('rv-int-kejadian-block');
  if (kwBlock) kwBlock.style.display = isKw ? '' : 'none';
  if (kjBlock) kjBlock.style.display = isKw ? 'none' : '';

  if (isKw) {
    document.getElementById('rv-int-jumlah').value = (Number(r.Jumlah) || 0);
    document.getElementById('rv-int-keterangan').value = r.Keterangan || '';
  } else {
    var items = [];
    (r.rincian || []).forEach(function (x) {
      if (String(x.Deskripsi || '').trim() !== '') items.push({ Deskripsi: String(x.Deskripsi) });
    });
    _intelBindRevisiList().set(items);
  }
  document.getElementById('rv-int-alasan').value = '';
  _attachInit('intel-revisi', { refSheet: 'TX_Intelijen' });
  _msg('int-revisi-msg', '', '');
  document.getElementById('modal-int-revisi').classList.remove('n-hidden');
}

function intelRevisiConfirm() {
  _msg('int-revisi-msg', '', '');
  var alasan = _v('rv-int-alasan');
  if (!alasan) { _msg('int-revisi-msg', 'error', 'Alasan revisi wajib diisi.'); return; }

  var r = _intelFindRow(_INTEL.pendingRowId);
  var isKw = r && r.Jenis === 'KAWASAN_KONSERVASI';
  var params = {
    targetRowId: _INTEL.pendingRowId,
    alasanRevisi: alasan
  };
  if (isKw) {
    params.jumlah = _v('rv-int-jumlah') || 0;
    params.keterangan = _v('rv-int-keterangan') || '';
  } else {
    var items = _intelBindRevisiList().get();
    params.rincian = items.map(function (k) {
      return { Deskripsi: String(k.Deskripsi || '') };
    });
  }

  var btn = document.getElementById('int-btn-revisi-save');
  _setLoading(btn, true);

  google.script.run
    .withSuccessHandler(function(res) {
      _setLoading(btn, false);
      if (res.success) {
        _attachCarry('TX_Intelijen', params.targetRowId, res.data.rowId);
        _attachUploadAll('intel-revisi', [res.data.rowId], function () {
          closeModal('modal-int-revisi');

// MODUL KEGIATAN DIREKTORAT — Fase 11 (PRD §5.10)
// Lintas-divisi (Direktur + semua Kadiv), feed kronologis per tanggal.
// Form input memakai POLA POPUP (backlog A).
// ============================================================
var _KGD = {
  pendingRowId: null,
  rows:         []
};

function _renderKegiatan(el) {
  var tpl = document.getElementById('view-tpl-kegiatan');
  if (!tpl) { el.innerHTML = _moduleStub('Kegiatan Pendukung'); return; }
  el.innerHTML = tpl.innerHTML;
  _attachInit('kgd', { refSheet: 'TX_KegiatanDirektorat' });

  _KGD.rows = [];

  var tglInput = document.getElementById('kgd-tanggal');
  if (tglInput) {
    var now = new Date();
    tglInput.value = now.getFullYear() + '-' +
      (now.getMonth() < 9 ? '0' : '') + (now.getMonth() + 1) + '-' +
      (now.getDate() < 10 ? '0' : '') + now.getDate();
  }

  _kgdLoadKPI();
  _kgdLoadHistory();
}

function _kgdFmtDate(v) {
  if (!v) return '—';
  var d = new Date(v);
  if (isNaN(d.getTime())) return '—';
  return d.toLocaleDateString('id-ID', { day: '2-digit', month: 'short', year: 'numeric' });
}

function _kgdDateInput(v) {
  if (!v) return '';
  var d = new Date(v);
  if (isNaN(d.getTime())) return '';
  var y = d.getFullYear();
  var m = (d.getMonth() < 9 ? '0' : '') + (d.getMonth() + 1);
  var dd = (d.getDate() < 10 ? '0' : '') + d.getDate();
  return y + '-' + m + '-' + dd;
}

// ── KPI ──
function _kgdLoadKPI() {
  var strip = document.getElementById('kgd-kpi-strip');
  if (strip) strip.innerHTML = _kpiSkeleton(3);

  google.script.run
    .withSuccessHandler(function(res) {
      if (res.success) _kgdRenderKPI(res.data);
      else if (strip) strip.innerHTML = '<div class="n-msg error">Gagal memuat KPI: ' + _esc(res.error) + '</div>';
    })
    .withFailureHandler(function() {
      if (strip) strip.innerHTML = '<div class="n-msg error">Koneksi terputus.</div>';
    })
    .kegiatanDirektorat_getKPI(APP.token, APP.filter);
}

function _kgdRenderKPI(kpi) {
  var strip = document.getElementById('kgd-kpi-strip');
  if (!strip) return;

  function card(label, value, sub) {
    return '<div class="n-card"><div class="kpi-label">' + _esc(label) + '</div>' +
           '<div class="kpi-val">' + (value || 0) + '</div>' +
           '<div class="kpi-sub">' + _esc(sub || '') + '</div></div>';
  }

  strip.innerHTML = '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:16px;">' +
    card('Kegiatan Periode Ini', _idNum(kpi.kegiatanPeriode), 'Dalam rentang filter') +
    card('Kegiatan YTD',        _idNum(kpi.kegiatanYtd),     'Sejak awal tahun terpilih') +
    card('Terakhir Dicatat',    kpi.terakhirDicatat ? _kgdFmtDate(kpi.terakhirDicatat) : '—', 'Entri aktif terbaru') +
  '</div>';
}

function _kgdLoadHistory() {
  var wrap = document.getElementById('kgd-history-wrap');
  if (!wrap) return;
  wrap.innerHTML = _loadingInline('Memuat kegiatan direktorat\u2026');

    .withSuccessHandler(function(res) {

      wrap.innerHTML = '<div class="n-msg error">Koneksi terputus.</div>';
    })

}

function _kgdRenderHistory(data) {
  var isPimpinan = (APP.user && (APP.user.role === 'DIREKTUR' || APP.user.role === 'SUPERADMIN' || APP.user.role === 'KADIV'));

  _histRender('kgd-history-wrap', {
    // "Periode" ditambahkan agar bentuk kolom sama dengan modul lain; nilainya
    // sudah disimpan server (dateToPeriode dari Tanggal kegiatan), bukan dihitung client.
    columns: ['Periode', 'Tanggal', 'Judul Kegiatan', 'Divisi', 'Pihak Hadir'],
    cells: function (r) {
      return [
        _esc(r.periode),
        _kgdFmtDate(r.Tanggal),
        _esc(r.JudulKegiatan || '—'),
        _esc(r.divisiNama || r.DivisiID || '—'),
        _esc(r.PihakHadir || '—')
      ];
    },
    refSheet: 'TX_KegiatanDirektorat',
    title: function (r) { return 'Kegiatan — ' + (r.JudulKegiatan || '—'); },
    detail: function (r) {
      return [
        ['Periode', _esc(r.periode || '—')],
        ['Tanggal', _kgdFmtDate(r.Tanggal)],
        ['Judul', _esc(r.JudulKegiatan || '—')],
        ['Deskripsi', _esc(r.Deskripsi || '—')],
        ['Pihak Hadir', _esc(r.PihakHadir || '—')],
        ['Divisi', _esc(r.divisiNama || r.DivisiID || '—')],
        ['Dikirim', _esc(r.timestamp ? new Date(r.timestamp).toLocaleString('id-ID') : '—')],
        ['Status', _esc(r.status)]
      ];
    },
    revisi: isPimpinan ? function (r) { return "kgdOpenRevisiModal('" + _esc(r.rowId) + "')"; } : null,
    anulir: isPimpinan ? function (r) { return "kgdOpenAnulirModal('" + _esc(r.rowId) + "')"; } : null,

function kgdSubmit() {
  _msg('kgd-form-msg', '', '');

function _pemRenderPenyedia(rows) {
  var wrap = document.getElementById('pem-penyedia-wrap');
  if (!wrap) return;

    wrap.innerHTML = '<div style="padding:20px 24px;color:var(--n-text-muted);font-size:.875rem;">Belum ada persetujuan penyedia pada periode ini.</div>';
    return;
  }
  var t = '<table class="n-table n-table-full"><thead><tr><th>Penyedia</th><th>Jumlah</th><th>Periode</th><th>Tanggal</th></tr></thead><tbody>';
  rows.forEach(function(r){
    t += '<tr><td>' + _esc(r.nama) + '</td><td>' + (r.jumlah || 0) + '</td><td>' + _esc(r.periode) + '</td><td>' +
         (r.timestamp ? new Date(r.timestamp).toLocaleDateString('id-ID') : '—') + '</td></tr>';
  });

  wrap.innerHTML = t;
}

function _pemRenderMarabahaya(rows) {
  var wrap = document.getElementById('pem-marabahaya-wrap');
  if (!wrap) return;
  if (!rows || rows.length === 0) {
    wrap.innerHTML = '<div style="padding:20px 24px;color:var(--n-text-muted);font-size:.875rem;">Tidak ada kapal marabahaya pada periode ini.</div>';
    return;
  }
  var t = '<table class="n-table n-table-full"><thead><tr><th>Kapal</th><th>Kondisi</th><th>Status</th><th>Periode</th></tr></thead><tbody>';
  rows.forEach(function(r){
    var st = '<span class="status-badge" style="background:#f3f4f6;color:#374151;">—</span>';
    if (r.statusPenanganan === 'DALAM_PENANGANAN') st = '<span class="status-badge" style="background:#fef3c7;color:#92400e;">Dalam Penanganan</span>';
    else if (r.statusPenanganan === 'SELESAI') st = '<span class="status-badge" style="background:var(--n-primary-light);color:var(--n-status-success);">Selesai</span>';
    t += '<tr><td>' + _esc(r.namaKapal) + '</td><td>' + _esc(r.kondisiDarurat) + '</td><td>' + st + '</td><td>' + _esc(r.periode) + '</td></tr>';
  });
  t += '</tbody></table>';
  wrap.innerHTML = t;
}

function _pemLoadHistory() {
  var wrap = document.getElementById('pem-history-wrap');

function _pemRenderHistory(data) {
  var isPimpinan = (APP.user && (APP.user.role === 'DIREKTUR' || APP.user.role === 'SUPERADMIN' || APP.user.role === 'KADIV'));
  var canWrite = (APP.user && (APP.user.role === 'SUPERADMIN' || (APP.user.divisiId === 'DIV-PANTAU' && (APP.user.role === 'STAF' || APP.user.role === 'KADIV'))));

  _histRender('pem-history-wrap', {
    columns: ['Periode', 'Kategori', 'Jumlah', 'Detail'],
    cells: function (r) {
      return [_esc(r.periode), _esc(PEM_LABELS[r.Jenis] || r.Jenis), _idNum(r.Jumlah), _esc(_pemDetail(r))];
    },
    refSheet: 'TX_Pemantauan',
    title: function (r) { return 'Pemantauan — ' + (PEM_LABELS[r.Jenis] || r.Jenis) + ' · Periode ' + r.periode; },
    detail: function (r) {
      var marabahaya = r.Jenis === 'MARABAHAYA';
      return [
        ['Periode', _esc(r.periode)],
        ['Kategori', _esc(PEM_LABELS[r.Jenis] || r.Jenis)],
        ['Jumlah', _idNum(r.Jumlah)],
        ['Nama Penyedia', r.Jenis !== 'PERSETUJUAN_PENYEDIA' ? '—' : _esc(r.NamaPenyedia || '—')],
        ['Kapal', !marabahaya ? '—' : _esc(r.namaKapal || r.KapalID || '—')],
        ['Kondisi Darurat', !marabahaya ? '—' : _esc(r.KondisiDarurat || '—')],
        ['Status Penanganan', !marabahaya ? '—' : _esc(r.StatusPenanganan || '—')],
        ['Keterangan', _esc(r.Keterangan || '—')],
        ['Detail', _esc(_pemDetail(r))],
        ['Dikirim', _esc(r.timestamp ? new Date(r.timestamp).toLocaleString('id-ID') : '—')],
        ['Status', _esc(r.status)]
      ];
    },
    revisi: canWrite  ? function (r) { return "pemOpenRevisiModal('" + _esc(r.rowId) + "')"; } : null,
    anulir: isPimpinan ? function (r) { return "pemOpenAnulirModal('" + _esc(r.rowId) + "')"; } : null,
    empty: 'Belum ada laporan untuk periode ini.'
  }, data);
}

// Nilai kolom "Detail" — sama antara baris tabel dan modal Lihat.
function _pemDetail(r) {
  if (r.Jenis === 'PERSETUJUAN_PENYEDIA') return r.NamaPenyedia || '—';
  if (r.Jenis === 'MARABAHAYA') return (r.namaKapal || r.KapalID || '—') + (r.KondisiDarurat ? ' · ' + r.KondisiDarurat : '');
  return '—';
}

// ── Submit ──
function pemSubmit(e) {
  _msg('pem-form-msg', '', '');
  var attachErr = _attachValidate('pem');
  if (attachErr) { _msg('pem-form-msg', 'error', attachErr); return; }
  var periode = _composePeriode('pem-');
  if (!periode) { _msg('pem-form-msg', 'error', 'Periode wajib dipilih.'); return; }

  var items = [];
  [['pem-username','USERNAME'],['pem-skat','SKAT'],['pem-migrasi','PEMASANGAN_MIGRASI']].forEach(function(pair){
    var v = _v(pair[0]);
    if (v !== '' && v !== null) items.push({ jenis: pair[1], jumlah: parseInt(v, 10) || 0 });
  });

  var pRows = document.querySelectorAll('#pem-penyedia-rows .pem-penyedia-row');
  for (var i = 0; i < pRows.length; i++) {
    var nama = pRows[i].querySelector('.pem-penyedia-nama');
    var jml  = pRows[i].querySelector('.pem-penyedia-jml');
    if (nama && nama.value.trim()) {
      items.push({ jenis: 'PERSETUJUAN_PENYEDIA', namaPenyedia: nama.value.trim(), jumlah: parseInt(jml && jml.value, 10) || 1 });
    }
  }

  var mRows = document.querySelectorAll('#pem-marabahaya-rows .pem-marabahaya-row');
  for (var j = 0; j < mRows.length; j++) {
    var nama  = mRows[j].querySelector('.pem-mb-nama');
    var jenis = mRows[j].querySelector('.pem-mb-jenis');
    var kond  = mRows[j].querySelector('.pem-mb-kondisi');
    var stat  = mRows[j].querySelector('.pem-mb-status');
    if (nama && nama.value.trim()) {
      items.push({ jenis: 'MARABAHAYA', namaKapal: nama.value.trim(), jenisKapal: jenis ? jenis.value : '', kondisiDarurat: kond ? kond.value : '', statusPenanganan: stat ? stat.value : '' });
    }
  }

  if (items.length === 0) { _msg('pem-form-msg', 'error', 'Minimal satu data pemantauan wajib diisi.'); return; }

  var btn = document.getElementById('pem-btn-submit');
  _setLoading(btn, true);

  google.script.run
    .withSuccessHandler(function(res) {
      _setLoading(btn, false);
      if (res.success) {
        _msg('pem-form-msg', 'success', res.data.message);
        var rowIds = (res.data && res.data.rowIds) || [];
        _pemResetForm();
        _attachUploadAll('pem', rowIds, function(ok) {
          _formSubmitDone('modal-pem-form', 'Laporan pemantauan tersimpan.', function () {
            _pemLoadKPI();
            _pemLoadHistory();
            _msg('pem-form-msg', '', '');
          }, ok);
        });
      } else {
        _msg('pem-form-msg', 'error', res.error);
      }
    })
    .withFailureHandler(function() {
      _setLoading(btn, false);
      _msg('pem-form-msg', 'error', 'Koneksi terputus.');
    })
    .pemantauan_submitMingguan(APP.token, { periode: periode, items: items });
}

function _pemResetForm() {
  ['pem-username','pem-skat','pem-migrasi'].forEach(function(id){
    var el = document.getElementById(id);
    if (el) el.value = '';
  });
  var pw = document.getElementById('pem-penyedia-rows');
  if (pw) pw.innerHTML = '';
  var mw = document.getElementById('pem-marabahaya-rows');
  if (mw) mw.innerHTML = '';
  pemAddPenyediaRow();
  pemAddMarabahayaRow();
}

// ── Revisi / Anulir ──
function _pemFindRow(rowId) {
  for (var i = 0; i < _PEM.rows.length; i++) {
    if (String(_PEM.rows[i].RowID) === String(rowId)) return _PEM.rows[i];
  }
  return null;
}

function pemOpenRevisiModal(rowId) {
  var r = _pemFindRow(rowId);
  if (!r) return;
  _PEM.pendingRowId = rowId;

  var isMarabahaya = (r.Jenis === 'MARABAHAYA');
  document.getElementById('pem-revisi-info').textContent =
    (PEM_LABELS[r.Jenis] || r.Jenis) + ' — Periode ' + r.Periode;

  document.getElementById('rv-pem-marabahaya').hidden = !isMarabahaya;
  document.getElementById('rv-pem-jumlah-wrap').hidden = isMarabahaya;

  if (isMarabahaya) {
    document.getElementById('rv-pem-nama').value = r.NamaKapal || '';
    document.getElementById('rv-pem-jenis').value = r.JenisKapal || '';
    document.getElementById('rv-pem-kondisi').value = r.KondisiDarurat || '';
    document.getElementById('rv-pem-status').value = r.StatusPenanganan || '';
  } else {
    document.getElementById('rv-pem-jumlah').value = (Number(r.Jumlah) || 0);
  }
  document.getElementById('rv-pem-alasan').value = '';
  _attachInit('pem-revisi', { refSheet: 'TX_Pemantauan' });
  _msg('pem-revisi-msg', '', '');

  var params = { targetRowId: _PEM.pendingRowId, alasanRevisi: alasan };
  var r = _pemFindRow(_PEM.pendingRowId);
  if (r && r.Jenis === 'MARABAHAYA') {
    params.namaKapal = _v('rv-pem-nama');
    params.jenisKapal = _v('rv-pem-jenis');

  }

  google.script.run

        _attachCarry('TX_Pemantauan', params.targetRowId, res.data.rowId);

// ── FORMAT RUPIAH ─────────────────────────────────────────

function _rupiah(angka) {
  if (angka === null || angka === undefined) return 'Rp —';
  var n = parseFloat(angka) || 0;
  var prefix = n < 0 ? '-Rp ' : 'Rp ';
  return prefix + Math.abs(Math.round(n)).toLocaleString('id-ID');
}

function _opsLautBuildWppChart() {
  var kpi = _OPSLAUT.kpiData;
  if (!kpi || !kpi.wppIntensitas) return;
  var arr = [];
  for (var code in kpi.wppIntensitas) {
    if (Object.prototype.hasOwnProperty.call(kpi.wppIntensitas, code)) {
      arr.push({ code: code, val: kpi.wppIntensitas[code] });

  arr.sort(function (a, b) { return b.val - a.val; });
  arr = arr.slice(0, 8);

    [{ label: 'Intensitas', data: arr.map(function (o) { return o.val; }), color: _CHART_COLORS.primary }],

// Peta token -> teks tampilan & daftar pilihan semuanya berasal dari sheet
// `Opsi` (server: perawatan_getOptions) — bukan lagi peta hardcoded di frontend.
function _rawatLbl(map, token) {
  var t = String(token || '');
  return ((_RAWAT.options || {})[map] || {})[t] || t;
}
// Daftar token aktif sebuah grup Opsi (dari server), untuk mengisi <select> &
// membangunkunci chart. Selalu berupa array (kosong sebelum opsi termuat).
function _rawatOpsi(grup) {
  var items = (_RAWAT.options || {})[grup] || [];
  return items.map(function (it) { return typeof it === 'string' ? it : it.value; });
}
function _rawatLokasiLbl(t)   { return _rawatLbl('labelLokasi', t); }

function _renderPerawatan(el) {
  var tpl = document.getElementById('view-tpl-perawatan');
  if (!tpl) { el.innerHTML = _moduleStub('Perawatan'); return; }
  el.innerHTML = tpl.innerHTML;

  _RAWAT.tab = 'kesiapan';
  _rawatSetTab('kesiapan');

  _rawatLoadOptions();
  _rawatLoadKPI();
}

function _rawatSyncTabState() {
  var tabs = document.querySelectorAll('#rawat-tabs .n-tab');
  tabs.forEach(function (t) {
    t.classList.toggle('active', t.getAttribute('data-rawat-tab') === _RAWAT.tab);
  });
}

function _rawatSetTab(name) {
  if (name !== 'kesiapan' && name !== 'docking' && name !== 'item') return;
  _RAWAT.tab = name;
  _rawatSyncTabState();

  // Chart pane lama dibersihkan sebelum DOM pane di-rebuild
  _chartDestroy('rawd-chart-tahap');
  _chartDestroy('rawi-chart-kategori');

  var pane = document.getElementById('rawat-tab-pane');
  if (!pane) return;
  var tpl = document.getElementById('view-tpl-rawat-' + name);
  pane.innerHTML = tpl ? tpl.innerHTML : '';
  _rawatInitPane(name);
}

// RBAC UI mengikuti server: write = SUPERADMIN atau (KADIV/STAF DIV-RAWAT);
// anulir = SUPERADMIN/DIREKTUR atau KADIV DIV-RAWAT.
function _rawatCanWrite() {
  var u = APP.user || {};
  return u.role === 'SUPERADMIN' || (u.divisiId === 'DIV-RAWAT' && (u.role === 'STAF' || u.role === 'KADIV'));
}

function _rawatCanAnulir() {
  var u = APP.user || {};
  return u.role === 'SUPERADMIN' || u.role === 'DIREKTUR' || (u.divisiId === 'DIV-RAWAT' && u.role === 'KADIV');
}

function _rawatInitPane(name) {
  var prefix = _RAWAT_PREFIX[name] + '-';

  var formSection = document.getElementById(prefix + '-form-section');
  if (formSection) formSection.style.display = _rawatCanWrite() ? '' : 'none';

  _attachInit(name === 'kesiapan' ? 'rawk' : (name === 'docking' ? 'rawd' : 'rawi'), {
    refSheet: 'TX_Perawatan_' + (name === 'kesiapan' ? 'Kesiapan' : (name === 'docking' ? 'Docking' : 'Item'))
  });

  _opsInitPeriodeUi(prefix);
  ['tahun', 'bulan', 'minggu'].forEach(function (k) {
    var sel = document.getElementById(prefix + 'periode-' + k);
    if (sel) sel.onchange = function () { _rawatUpdatePeriodeHint(name); };
  });
  _rawatUpdatePeriodeHint(name);

  _rawatPopulateOptions();
  _rawatFetchHistory(name);
  _rawatBuildPaneCharts();

  if (name === 'kesiapan') _rawatKesiapanStatusChange();
}

function _rawatUpdatePeriodeHint(name) {
  var hint = document.getElementById(_RAWAT_PREFIX[name] + '-periode-hint');
  if (hint) hint.textContent = _composePeriode(_RAWAT_PREFIX[name] + '-') || '—';
}

// Form popup: reset field + attach, lalu tampilkan modal (Backlog A)
function _rawatOpenForm(name) {
  var prefix = _RAWAT_PREFIX[name];
  var key = name === 'kesiapan' ? 'rawk' : (name === 'docking' ? 'rawd' : 'rawi');

  if (name === 'kesiapan') {
    var status = document.getElementById('rawk-status');
    if (status) { status.value = 'true'; _rawatKesiapanStatusChange(); }
    var penyebab = document.getElementById('rawk-penyebab');
    if (penyebab) penyebab.value = '';
  } else if (name === 'docking') {
    var nilaiD = document.getElementById('rawd-nilai');
    if (nilaiD) nilaiD.value = '';
    var kontraktor = document.getElementById('rawd-kontraktor');
    if (kontraktor) kontraktor.value = '';
    var lokasi = document.getElementById('rawd-lokasi');
    if (lokasi) lokasi.selectedIndex = 0;
    var tahap = document.getElementById('rawd-tahap');
    if (tahap) tahap.selectedIndex = 0;
  } else {
    var nama = document.getElementById('rawi-nama');
    if (nama) nama.value = '';
    var nilai = document.getElementById('rawi-nilai');
    if (nilai) nilai.value = '';
    var kategori = document.getElementById('rawi-kategori');
    if (kategori) kategori.selectedIndex = 0;
    var dock = document.getElementById('rawi-docking');
    if (dock) dock.value = '';
  }

  _msg(prefix + '-form-msg', '', '');
  _attachInit(key, { refSheet: _RAWAT_SHEET[name] });
  var m = document.getElementById('modal-' + prefix + '-form');
  if (m) m.classList.remove('n-hidden');
}

// ── OPTIONS ───────────────────────────────────────────────

function _rawatLoadOptions() {
  if (_RAWAT.options) { _rawatPopulateOptions(); return; }
  google.script.run
    .withSuccessHandler(function (res) {
      if (!res.success) return;
      _RAWAT.options = res.data;
      _rawatPopulateOptions();
    })
    .withFailureHandler(function () {})
    .perawatan_getOptions(APP.token);
}

function _rawatPopulateOptions() {
  if (!_RAWAT.options) return;
  var kapal = _RAWAT.options.kapal || [];

  ['rawk-kapal', 'rawd-kapal'].forEach(function (id) {
    var sel = document.getElementById(id);
    if (!sel) return;
    var prev = sel.value;
    sel.innerHTML = '<option value="">(Pilih Kapal)</option>';
    kapal.forEach(function (k) {
      var o = document.createElement('option');
      o.value = k.kapalId;
      o.textContent = k.nama + (k.aktif ? '' : ' (non-aktif)');
      sel.appendChild(o);
    });
    if (prev) sel.value = prev;
  });

  var dSel = document.getElementById('rawi-docking');
  if (dSel) {
    var pd = dSel.value;
    dSel.innerHTML = '<option value="">— Tidak terkait baris docking —</option>';
    (_RAWAT.options.docking || []).forEach(function (d) {
      var o = document.createElement('option');
      o.value = d.rowId;
      o.textContent = d.label;
      dSel.appendChild(o);
    });
    if (pd) dSel.value = pd;
  }

  // Select enum Perawatannya diisi dari sheet `Opsi` (isi & urutanIkut server).
  [
    { id: 'rawd-lokasi',    items: _RAWAT.options.lokasi },
    { id: 'rawd-tahap',     items: _RAWAT.options.tahap },
    { id: 'rawi-kategori',  items: _RAWAT.options.kategori }
  ].forEach(function (cfg) {
    var sel = document.getElementById(cfg.id);
    if (!sel) return;
    var prev = sel.value;
    sel.innerHTML = '';
    (cfg.items || []).forEach(function (it) {
      var o = document.createElement('option');
      o.value = it.value;
      o.textContent = it.label;
      sel.appendChild(o);
    });
    // Pertahankan pilihan lama bila masih ada; selain itu ambil yang pertama.
    if (prev && sel.querySelector('option[value="' + prev + '"]')) sel.value = prev;
    else if (sel.options.length) sel.selectedIndex = 0;
  });
}

// ── KPI ───────────────────────────────────────────────────

function _rawatLoadKPI() {
  var strip = document.getElementById('rawat-kpi-strip');
  if (strip) strip.innerHTML = _kpiSkeleton(4);

  google.script.run
    .withSuccessHandler(function (res) {
      if (!res.success) { _msg('rawk-history-msg', 'error', res.error); return; }
      _RAWAT.kpi = res.data;
      _rawatRenderKPI(res.data);
      _rawatBuildCharts();
      _rawatBuildPaneCharts();
    })
    .withFailureHandler(function () {
      var s = document.getElementById('rawat-kpi-strip');
      if (s) s.innerHTML = '<div class="n-msg error show">Gagal memuat KPI Perawatan.</div>';
    })
    .perawatan_getKPI(APP.token, APP.filter);
}

function _rawatRenderKPI(d) {
  var el = document.getElementById('rawat-kpi-strip');
  if (!el) return;
  var k = d.kesiapan, dk = d.docking, it = d.item;

  var dockingAktif = 0;
  Object.keys(dk.byTahap).forEach(function (t) { if (t !== 'SELESAI') dockingAktif += dk.byTahap[t]; });

  el.innerHTML =
    '<div class="ov-kpi-row">' +
      _kpiHeadline('Armada Siap Operasi', k.siap, 'kapal', k.pctSiap + '% dari ' + k.totalArmada + ' armada aktif') +
      _kpiHeadline('Kapal Tidak Siap', k.tidakSiap, 'kapal', k.tidakSiap > 0 ? 'Perlu perhatian' : 'Seluruh armada siap') +
      _kpiHeadline('Docking Berjalan', dockingAktif, 'kapal', dk.total + ' kapal terdokumentasi') +
      _kpiHeadline('Nilai Item Pekerjaan', _rupiah(it.totalNilai), '', it.total + ' item tercatat') +
    '</div>';
}

// ── CHARTS ────────────────────────────────────────────────

function _rawatBuildCharts() {
  var k = (_RAWAT.kpi || {}).kesiapan;
  if (k) {
    _chartDonut('rawat-chart-kesiapan', ['Siap', 'Tidak Siap'], [k.siap, k.tidakSiap],
      [_CHART_COLORS.ok, _CHART_COLORS.crit],
      { center: k.pctSiap + '%', centerSub: 'Siap Operasi', emptyMsg: 'Belum ada status kesiapan pada periode ini.' });
  }
  _rawatLoadTren();
}

function _rawatLoadTren() {
  google.script.run
    .withSuccessHandler(function (res) {
      if (!res.success) return;
      var d = res.data;
      var labels = d.months.map(function (m) { return _chartMonthLabel(m); });
      _chartLine('rawat-chart-tren', labels, [
        { label: 'Siap',        data: d.siap,      color: _CHART_COLORS.ok },
        { label: 'Tidak Siap',  data: d.tidakSiap, color: _CHART_COLORS.crit }
      ], { fmt: _chartNum, emptyMsg: 'Belum ada status kesiapan pada rentang terpilih.' });
    })
    .withFailureHandler(function () {})
    .perawatan_getTren(APP.token, APP.filter);
}

function _rawatBuildPaneCharts() {
  var kpi = _RAWAT.kpi;
  if (!kpi) return;

  var dk = kpi.docking;
  var tahapKeys = _rawatOpsi('tahap');
  _chartBar('rawd-chart-tahap',
    tahapKeys.map(function (t) { return _rawatTahapLbl(t); }),
    [{ label: 'Kapal', data: tahapKeys.map(function (t) { return dk.byTahap[t] || 0; }), color: _CHART_COLORS.primary }],
    { horizontal: true, fmt: _chartNum, emptyMsg: 'Belum ada progres docking pada periode ini.' }
  );

  var it = kpi.item;
  var katKeys = _rawatOpsi('kategori');
  _chartDonut('rawi-chart-kategori',
    katKeys.map(function (k) { return _rawatKategoriLbl(k); }),
    katKeys.map(function (k) { return (it.byKategori[k] || {}).count || 0; }),
    [_CHART_COLORS.primary, _CHART_COLORS.warn, _CHART_COLORS.ok],
    { center: it.total, centerSub: 'Item', emptyMsg: 'Belum ada item pekerjaan pada periode ini.' }
  );
}

// ── HISTORY ───────────────────────────────────────────────

// Endpoint getter per jenis (ditulis eksplisit agar google.script.run aman)
function _rawatFetchHistory(jenis) {
  var prefix = _RAWAT_PREFIX[jenis];
  var wrap = document.getElementById(prefix + '-history-wrap');
  if (wrap) wrap.innerHTML = _loadingInline('Memuat riwayat\u2026');

  var runner = google.script.run
    .withSuccessHandler(function (res) {
      if (!res.success) {
        _msg(prefix + '-history-msg', 'error', res.error);
        if (wrap) wrap.innerHTML = '';
        return;
      }
      _RAWAT.history[jenis] = res.data;
      _rawatRenderHistory(jenis, res.data);
    })
    .withFailureHandler(function () {
      _msg(prefix + '-history-msg', 'error', 'Gagal memuat riwayat.');
    });

  if (jenis === 'kesiapan')      runner.perawatan_getKesiapan(APP.token, APP.filter);
  else if (jenis === 'docking')  runner.perawatan_getDocking(APP.token, APP.filter);
  else                           runner.perawatan_getItem(APP.token, APP.filter);
}

function _rawatRenderHistory(jenis, items) {
  var prefix = _RAWAT_PREFIX[jenis];
  var sheet = _RAWAT_SHEET[jenis];
  var label = _RAWAT_LABEL[jenis];

  _histRender(prefix + '-history-wrap', {
    columns: _rawatColumns(jenis),
    cells: function (r) { return _rawatCells(jenis, r); },
    refSheet: sheet,
    title: function (r) { return label + ' — Periode ' + r.periode; },
    detail: function (r) { return _rawatDetailFields(jenis, r); },
    // Tombol "Lampiran" dihapus dari baris tabel; kelola lampiran dipindah ke
    // bagian "Lampiran" di dalam modal Lihat (bentuk baris seragam semua modul).
    manage: function (r) { return "_rawatOpenEvidence('" + jenis + "','" + _esc(r.rowId) + "')"; },
    revisi: _rawatCanWrite() ? function (r) { return "_rawatOpenRevisi('" + jenis + "','" + _esc(r.rowId) + "')"; } : null,
    anulir: _rawatCanAnulir() ? function (r) { return "_rawatOpenAnulir('" + jenis + "','" + _esc(r.rowId) + "')"; } : null,
    empty: 'Belum ada laporan untuk periode ini.'
  }, items);
}

// Field modal Lihat — dipakai bersama tabel riwayat dan modal revisi.
function _rawatDetailFields(jenis, r) {
  if (jenis === 'kesiapan') {
    return [
      ['Periode', _esc(r.periode)],
      ['Kapal', _esc(r.kapalNama)],
      ['Status Kapal', _rawatBadgeSiap(r.statusSiap)],
      ['Penyebab Ketidaksiapan', _esc(r.penyebab || '—')],
      ['Dikirim', _esc(r.timestamp ? new Date(r.timestamp).toLocaleString('id-ID') : '—')],
      ['Status', _esc(r.status)]
    ];
  }
  if (jenis === 'docking') {
    return [
      ['Periode', _esc(r.periode)],
      ['Kapal', _esc(r.kapalNama)],
      ['Lokasi', _esc(_rawatLokasiLbl(r.lokasi))],
      ['Tahap', _esc(_rawatTahapLbl(r.tahap))],
      ['Nilai Kontrak', _rupiah(r.nilaiKontrak)],
      ['Kontraktor', _esc(r.kontraktor || '—')],
      ['Dikirim', _esc(r.timestamp ? new Date(r.timestamp).toLocaleString('id-ID') : '—')],
      ['Status', _esc(r.status)]
    ];
  }
  return [
    ['Periode', _esc(r.periode)],
    ['Nama Pekerjaan', _esc(r.namaPekerjaan)],
    ['Kategori', _esc(_rawatKategoriLbl(r.kategori))],
    ['Nilai', _rupiah(r.nilai)],
    ['Terkait Docking', _esc(r.dockingLabel || '—')],
    ['Dikirim', _esc(r.timestamp ? new Date(r.timestamp).toLocaleString('id-ID') : '—')],
    ['Status', _esc(r.status)]
  ];
}

function _rawatBadgeSiap(siap) {
  return siap ? _histBadgeTone('SIAP', 'siap') : _histBadgeTone('TIDAK SIAP', 'tidak-siap');
}

function _rawatColumns(jenis) {
  if (jenis === 'kesiapan') return ['Periode', 'Kapal', 'Status', 'Penyebab'];
  if (jenis === 'docking')  return ['Periode', 'Kapal', 'Lokasi', 'Tahap', 'Nilai Kontrak', 'Kontraktor'];
  return ['Periode', 'Nama Pekerjaan', 'Kategori', 'Nilai', 'Terkait Docking'];
}

function _rawatCells(jenis, r) {
  if (jenis === 'kesiapan') {
    return [_esc(r.periode), _esc(r.kapalNama), _rawatBadgeSiap(r.statusSiap), _esc(r.penyebab || '—')];
  }
  if (jenis === 'docking') {
    return [
      _esc(r.periode),
      _esc(r.kapalNama),
      _esc(_rawatLokasiLbl(r.lokasi)),
      _esc(_rawatTahapLbl(r.tahap)),
      _rupiah(r.nilaiKontrak),
      _esc(r.kontraktor || '—')
    ];
  }
  return [
    _esc(r.periode),
    _esc(r.namaPekerjaan),
    _esc(_rawatKategoriLbl(r.kategori)),
    _rupiah(r.nilai),
    _esc(r.dockingLabel || '—')
  ];
}

function _rawatOpenRevisi(jenis, rowId) {
  var row = (_RAWAT.history[jenis] || []).filter(function (r) { return r.rowId === rowId; })[0];
  if (!row) return;
  _RAWAT.revisi = { jenis: jenis, rowId: rowId };

  var info = document.getElementById('rawat-revisi-info');
  if (info) info.textContent = 'Merevisi ' + _RAWAT_LABEL[jenis] + ' periode ' + row.periode + '.';

  var fields = document.getElementById('rawat-revisi-fields');
  fields.innerHTML = _rawatRevisiFieldsHtml(jenis, row);

  document.getElementById('rawat-revisi-alasan').value = '';
  _attachInit('rawat-revisi', { refSheet: _RAWAT_SHEET[jenis] });
  _msg('rawat-revisi-msg', null);
  document.getElementById('modal-rawat-revisi').classList.remove('n-hidden');
}

    }).join('');
    return '<div class="form-grp"><label>Kapal</label>' +
      '<input type="text" value="' + _esc(row.kapalNama) + '" disabled></div>' +

        '<div class="form-grp"><label>Lokasi</label><select id="rv-rawd-lokasi">' + lok + '</select></div>' +
        '<div class="form-grp"><label>Tahap</label><select id="rv-rawd-tahap">' + tah + '</select></div>' +
      '</div>' +
      '<div style="display:grid;grid-template-columns:1fr 1fr;gap:14px;">' +
        '<div class="form-grp"><label>Nilai Kontrak (Rp)</label><input type="number" id="rv-rawd-nilai" min="0" value="' + (row.nilaiKontrak || 0) + '"></div>' +
        '<div class="form-grp"><label>Kontraktor</label><input type="text" id="rv-rawd-kontraktor" value="' + _esc(row.kontraktor || '') + '"></div>' +

      return '<option value="' + _esc(d.rowId) + '"' + (row.dockingRowId === d.rowId ? ' selected' : '') + '>' + _esc(d.label) + '</option>';
    }).join('');
  return '<div class="form-grp"><label>Nama Pekerjaan</label>' +
    '<input type="text" id="rv-rawi-nama" value="' + _esc(row.namaPekerjaan) + '"></div>' +
    '<div style="display:grid;grid-template-columns:1fr 1fr;gap:14px;">' +
      '<div class="form-grp"><label>Kategori</label><select id="rv-rawi-kategori">' + kat + '</select></div>' +
      '<div class="form-grp"><label>Nilai (Rp)</label><input type="number" id="rv-rawi-nilai" min="0" value="' + (row.nilai || 0) + '"></div>' +
    '</div>' +
    '<div class="form-grp"><label>Terkait Docking</label><select id="rv-rawi-docking">' + dockOpts + '</select></div>';
}

function _rawatRevisiConfirm() {
  var jenis = _RAWAT.revisi.jenis;
  var btn = document.getElementById('rawat-btn-revisi-save');
  var alasan = _v('rawat-revisi-alasan');
  _msg('rawat-revisi-msg', null);
  if (!alasan.trim()) { _msg('rawat-revisi-msg', 'error', 'Alasan revisi wajib diisi.'); return; }
  _setLoading(btn, true);

  var params = { targetRowId: _RAWAT.revisi.rowId, alasanRevisi: alasan };
  if (jenis === 'kesiapan') {
    params.statusSiap = _v('rv-rawk-status') === 'true';
    params.penyebab   = _v('rv-rawk-penyebab');
  } else if (jenis === 'docking') {
    params.lokasi = _v('rv-rawd-lokasi');
    params.tahap = _v('rv-rawd-tahap');
    params.nilaiKontrak = _v('rv-rawd-nilai');
    params.kontraktor = _v('rv-rawd-kontraktor');
  } else {
    params.namaPekerjaan = _v('rv-rawi-nama');
    params.kategori = _v('rv-rawi-kategori');
    params.nilai = _v('rv-rawi-nilai');
    params.dockingRowId = _v('rv-rawi-docking');
  }

  var runner = google.script.run
    .withSuccessHandler(function (res) {
      _setLoading(btn, false);
      if (!res.success) { _msg('rawat-revisi-msg', 'error', res.error); return; }
      _attachCarry('TX_Perawatan_' + (
        jenis === 'kesiapan' ? 'Kesiapan' : (jenis === 'docking' ? 'Docking' : 'Item')
      ), params.targetRowId, res.data.rowId);
      _attachUploadAll('rawat-revisi', [res.data.rowId], function () {
        _rawatCloseRevisi();
        _msg(_RAWAT_PREFIX[jenis] + '-history-msg', 'success', res.data.message);
        _rawatLoadKPI();
        _rawatFetchHistory(jenis);
      });
    })
    .withFailureHandler(function () {
      _setLoading(btn, false);
      _msg('rawat-revisi-msg', 'error', 'Terjadi kesalahan. Coba lagi.');
    });

  if (jenis === 'kesiapan')      runner.perawatan_revisiKesiapan(APP.token, params);
  else if (jenis === 'docking')  runner.perawatan_revisiDocking(APP.token, params);
  else                           runner.perawatan_revisiItem(APP.token, params);
}

function _rawatCloseRevisi() {

  closeModal('modal-rawat-revisi');
}

function _rawatCloseEvidence() {
  _RAWAT.evidence = { refSheet: null, refRowId: null };

function _rawatLoadEvidence() {
  var ev = _RAWAT.evidence;
  var list = document.getElementById('rawat-evidence-list');
  if (!ev.refSheet || !list) return;
  list.innerHTML = _loadingInline('Memuat lampiran\u2026');

  google.script.run
    .withSuccessHandler(function (res) {
      if (!res.success) { list.innerHTML = '<div class="n-msg error show">' + _esc(res.error) + '</div>'; return; }
      if (!res.data.length) { list.innerHTML = '<div style="color:var(--n-text-muted);font-size:.85rem;">Belum ada lampiran.</div>'; return; }
      list.innerHTML = res.data.map(function (e) {
        var tgl = e.uploadedAt ? new Date(e.uploadedAt).toLocaleString('id-ID') : '';
        return '<div style="display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--n-border-subtle);">' +
          '<a href="' + _esc(e.viewUrl) + '" target="_blank" style="color:var(--n-primary);font-size:.85rem;">' + _esc(e.fileName) + '</a>' +
          '<span style="font-size:.75rem;color:var(--n-text-muted);">' + _esc(e.sourceMode) + ' · ' + tgl + '</span>' +
        '</div>';
      }).join('');
    })
    .withFailureHandler(function () { list.innerHTML = '<div class="n-msg error show">Gagal memuat lampiran.</div>'; })
    .evidence_list(APP.token, ev.refSheet, ev.refRowId);
}

function _rawatEvidenceUploadFile() {
  var ev = _RAWAT.evidence;
  var fileEl = document.getElementById('rawat-evidence-file');
  var btn = document.getElementById('rawat-btn-evidence-upload');
  _msg('rawat-evidence-msg', null);
  if (!fileEl || !fileEl.files || !fileEl.files.length) {
    _msg('rawat-evidence-msg', 'error', 'Pilih file terlebih dahulu.');
    return;
  }
  var file = fileEl.files[0];
  var isVideo = /^video\//i.test(file.type);
  var limit = isVideo ? 50 * 1024 * 1024 : 15 * 1024 * 1024;
  if (file.size > limit) {
    _msg('rawat-evidence-msg', 'error', isVideo
      ? 'Ukuran video melebihi 50MB. Kompres terlebih dahulu.'
      : 'Ukuran file melebihi 15MB. Pilih file yang lebih kecil.');
    return;
  }

  _setLoading(btn, true);
  var reader = new FileReader();
  reader.onload = function () {
    var base64 = String(reader.result).split(',')[1] || '';
    google.script.run
      .withSuccessHandler(function (res) {
        _setLoading(btn, false);
        if (!res.success) { _msg('rawat-evidence-msg', 'error', res.error); return; }
        _msg('rawat-evidence-msg', 'success', res.data.message);
        fileEl.value = '';
        _rawatLoadEvidence();
        _hdRefreshEvidenceIfCurrent(ev.refSheet, ev.refRowId);
      })
      .withFailureHandler(function () { _setLoading(btn, false); _msg('rawat-evidence-msg', 'error', 'Gagal mengunggah file. Coba lagi.'); })
      .evidence_upload(APP.token, {
        refSheet: ev.refSheet,
        refRowId: ev.refRowId,
        fileName: file.name,
        mimeType: file.type || 'application/octet-stream',
        dataBase64: base64
      });
  };
  reader.onerror = function () { _setLoading(btn, false); _msg('rawat-evidence-msg', 'error', 'Gagal membaca file.'); };
  reader.readAsDataURL(file);
}

function _rawatEvidenceUploadLink() {
  var ev = _RAWAT.evidence;
  var btn = document.getElementById('rawat-btn-evidence-link');
  var url = _v('rawat-evidence-link');
  _msg('rawat-evidence-msg', null);
  if (!url.trim()) { _msg('rawat-evidence-msg', 'error', 'Tempel link Google Drive terlebih dahulu.'); return; }
  _setLoading(btn, true);

  google.script.run
    .withSuccessHandler(function (res) {
      _setLoading(btn, false);
      if (!res.success) { _msg('rawat-evidence-msg', 'error', res.error); return; }
      _msg('rawat-evidence-msg', 'success', res.data.message);
      document.getElementById('rawat-evidence-link').value = '';
      _rawatLoadEvidence();
      _hdRefreshEvidenceIfCurrent(ev.refSheet, ev.refRowId);
    })
    .withFailureHandler(function () { _setLoading(btn, false); _msg('rawat-evidence-msg', 'error', 'Gagal menyalin file. Coba lagi.'); })
    .evidence_uploadFromLink(APP.token, { refSheet: ev.refSheet, refRowId: ev.refRowId, url: url });
}

// ============================================================
// MODUL LOGISTIK (Fase 10) — DIV-LOG
// Amunisi / BBM / Logistik Personil (mingguan + baseline tahunan)
// ============================================================

var _LOG = {
  tab: 'amunisi',
  options: null,
  kpi: null,
  history: { amunisi: [], bbm: [], personil: [] },
  revisi: { jenis: null, rowId: null, mode: null },
  anulir: { jenis: null, rowId: null }
};
var _LOG_LABEL  = { amunisi: 'Amunisi', bbm: 'BBM', personil: 'Logistik Personil' };
var _LOG_PREFIX = { amunisi: 'lga', bbm: 'lgb', personil: 'lgp' };
var _LOG_MODE_LABEL = { BASELINE: 'Baseline', PENGGUNAAN: 'Penggunaan' };

// Peta token -> teks tampilan. Diisi dari sheet `Opsi` (server) via
// logistik_getOptions; bukan lagi peta hardcoded.
function _logLabel(group, token) {
  var opts = _LOG.options || {};
  var map = group === 'amunisi' ? opts.labelAmunisi
          : group === 'bbm'     ? opts.labelBbm
          : group === 'personil'? opts.labelPersonil
          : null;
  var t = String(token || '');
  return (map && map[t]) || t;
}

function _idNum(v) {
  var n = Number(v);
  return isNaN(n) ? '0' : n.toLocaleString('id-ID');
}

// ── RENDER UTAMA ────────────────────────────────────────

function _renderLogistik(el) {
  var tpl = document.getElementById('view-tpl-logistik');
  if (!tpl) { el.innerHTML = _moduleStub('Logistik'); return; }
  el.innerHTML = tpl.innerHTML;

  _LOG.tab = 'amunisi';
  _logSetTab('amunisi');

  _logLoadOptions();
  _logLoadKPI();
}

function _logSyncTabState() {
  var tabs = document.querySelectorAll('#log-tabs .n-tab');
  tabs.forEach(function (t) {
    t.classList.toggle('active', t.getAttribute('data-log-tab') === _LOG.tab);
  });
}

function _logSetTab(name) {
  if (!_LOG_LABEL[name]) return;
  _LOG.tab = name;
  _logSyncTabState();

  _logDestroyPaneCharts();

  var pane = document.getElementById('log-tab-pane');
  if (!pane) return;
  var tpl = document.getElementById('view-tpl-log-' + name);
  pane.innerHTML = tpl ? tpl.innerHTML : '';
  _logInitPane(name);
}

// RBAC UI mengikuti server: write = SUPERADMIN atau (KADIV/STAF DIV-LOG);
// anulir = SUPERADMIN/DIREKTUR atau KADIV DIV-LOG.
function _logCanWrite() {
  var u = APP.user || {};
  return u.role === 'SUPERADMIN' || (u.divisiId === 'DIV-LOG' && (u.role === 'STAF' || u.role === 'KADIV'));
}

function _logCanAnulir() {
  var u = APP.user || {};
  return u.role === 'SUPERADMIN' || u.role === 'DIREKTUR' || (u.divisiId === 'DIV-LOG' && u.role === 'KADIV');
}

function _logInitPane(name) {
  var prefix = _LOG_PREFIX[name] + '-';

  var formSection = document.getElementById(prefix + 'form-section');
  if (formSection) formSection.style.display = _logCanWrite() ? '' : 'none';

  _opsInitPeriodeUi(prefix);
  ['tahun', 'bulan', 'minggu'].forEach(function (k) {
    var sel = document.getElementById(prefix + 'periode-' + k);
    if (sel) sel.onchange = function () { _logUpdatePeriodeHint(name); };
  });
  _logUpdatePeriodeHint(name);

  _attachInit(name === 'amunisi' ? 'lga' : (name === 'bbm' ? 'lgb' : 'lgp'), {
    refSheet: 'TX_Logistik_' + (name === 'amunisi' ? 'Amunisi' : (name === 'bbm' ? 'BBM' : 'Personil'))
  });

  _logPopulateOptions();
  if (name === 'amunisi') _logAmunisiModeChange();
  if (name === 'bbm')     _logBbmModeChange();

  _logFetchHistory(name);
  _logBuildPaneCharts();
}

function _logUpdatePeriodeHint(name) {
  var hint = document.getElementById(_LOG_PREFIX[name] + '-periode-hint');
  if (hint) hint.textContent = _composePeriode(_LOG_PREFIX[name] + '-') || '—';
}

// Form popup: reset field + attach + tampilkan modal (Backlog A)
function _logOpenForm(name) {
  var prefix = _LOG_PREFIX[name];

  if (name === 'amunisi') {
    _kapalInit('lga-kapal');
    _kdlReset('lga-kapal');
    var mode = document.getElementById('lga-mode');
    if (mode) mode.value = 'PENGGUNAAN';
    _logAmunisiModeChange();
    var stok = document.getElementById('lga-stok');
    if (stok) stok.value = '';
    var pakai = document.getElementById('lga-penggunaan');
    if (pakai) pakai.value = '';
    var selA = document.getElementById('lga-jenis');
    if (selA) selA.selectedIndex = 0;
  } else if (name === 'bbm') {
    _kapalInit('lgb-kapal');
    _kdlReset('lgb-kapal');
    var modeB = document.getElementById('lgb-mode');
    if (modeB) modeB.value = 'PENGGUNAAN';
    _logBbmModeChange();
    ['lgb-pagu','lgb-realisasi','lgb-harga','lgb-tunggakan'].forEach(function(id) {
      var el = document.getElementById(id);
      if (el) el.value = '';
    });
    var selB = document.getElementById('lgb-jenis');
    if (selB) selB.selectedIndex = 0;
  } else {
    var nilai = document.getElementById('lgp-nilai');
    if (nilai) nilai.value = '';
    var selP = document.getElementById('lgp-komponen');
    if (selP) selP.selectedIndex = 0;
  }

  _logFillFormContext(name);
  _msg(prefix + '-form-msg', '', '');
  _attachInit(name === 'amunisi' ? 'lga' : (name === 'bbm' ? 'lgb' : 'lgp'), {
    refSheet: 'TX_Logistik_' + (name === 'amunisi' ? 'Amunisi' : (name === 'bbm' ? 'BBM' : 'Personil'))
  });
  var m = document.getElementById('modal-' + prefix + '-form');
  if (m) m.classList.remove('n-hidden');
}

// Konteks di dalam modal: data penting satu baris (Backlog A)
function _logFillFormContext(name) {
  var k = _LOG.kpi || {};
  if (name === 'amunisi') {
    var vA = document.getElementById('lga-form-context-value');
    if (vA) vA.textContent = (k.totalStokAkhir !== undefined && k.totalStokAkhir !== null)
      ? _idNum(k.totalStokAkhir) + ' tembakan' : '—';
  } else if (name === 'bbm') {
    var vB = document.getElementById('lgb-form-context-value');
    if (vB) vB.textContent = (k.totalBBMSisa !== undefined && k.totalBBMSisa !== null)
      ? _idNum(k.totalBBMSisa) + ' liter' : '—';
  } else {
    var vP = document.getElementById('lgp-form-context-value');
    if (vP) vP.textContent = (k.totalPersonil !== undefined && k.totalPersonil !== null)
      ? _rupiah(k.totalPersonil) : '—';
  }
}

// ── OPTIONS ───────────────────────────────────────────────

function _logLoadOptions() {
  if (_LOG.options) { _logPopulateOptions(); return; }
  google.script.run
    .withSuccessHandler(function (res) {
      if (!res.success) return;
      _LOG.options = res.data;
      _logPopulateOptions();

    .logistik_getOptions(APP.token);

function _logPopulateOptions() {

  _fillOpsiSelect('lga-jenis', _LOG.options.amunisi, '(Pilih Jenis)');

// ── MODE BASELINE / PENGGUNAAN ───────────────────────────
