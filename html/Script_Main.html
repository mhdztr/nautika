<script>
/* ============================================================
   Script_Main.html
   State management, hash routing, sidebar, filter periode.
   Dipanggil via include di Index.html.
   ============================================================ */

// ── KONSTANTA ─────────────────────────────────────────────
var TOKEN_KEY  = 'nautika_token';
var MONTHS     = ['Januari','Februari','Maret','April','Mei','Juni',
                  'Juli','Agustus','September','Oktober','November','Desember'];
var ROLE_LABEL = {
  SUPERADMIN: 'Super Administrator',
  DIREKTUR:   'Direktur',
  KADIV:      'Kepala Divisi / Ketua Tim Kerja',
  STAF:       'Staf'
};

// ── STATE ─────────────────────────────────────────────────
var APP = {
  token:          null,
  user:           null,
  currentView:    'overview',
  pendingQueueId: null,
  profilKapalId:  '',
  filter: {
    mode:     'monthly',   // 'monthly' | 'range'
    month:    new Date().getMonth() + 1,
    year:     new Date().getFullYear(),
    dateFrom: '',
    dateTo:   ''
  }
};

// State pendaftaran 2 tahap (verifikasi OTP). pendingTokenissued server
// setelah kode OTP benar; auth_register mewajibkannya sebagai bukti.
var REG = { otpEmail: null, pendingToken: null };

// ── BUSY GLOBAL — indikator loading di samping filter periode ──
// Setiap google.script.run otomatis memunculkan spinner selama call in-flight,
// apa pun sheet/server function-nya. Strategi (stabil, tanpa bergantung this):
//  - withSuccessHandler  : +1 saat setup call; -1 di dalam handler sukses.
//  - withFailureHandler  : tidak menaikkan, hanya -1 di dalam handler gagal.
// Karena GS hanya memanggil SATU handler (sukses ATAU gagal, tidak keduanya),
// setiap rantai = tepat +1 dan tepat -1 → selalu balik ke 0.
var _BUSY = 0;
var _BUSY_LAST = 0;
var _BUSY_WATCHDOG = null;
function _busyPushActivity() { _BUSY_LAST = Date.now(); }
function _busyInc() { _BUSY++; _busyPushActivity(); _syncBusy(); }
function _busyDec() {
  if (_BUSY > 0) _BUSY--;
  _busyPushActivity();
  _syncBusy();
}
function _syncBusy() {
  var el = document.getElementById('filter-busy');
  if (el) el.style.display = (_BUSY > 0) ? 'flex' : 'none';
  if (_BUSY > 0 && !_BUSY_WATCHDOG) {
    // Jaring pengaman: force-reset jika counter nyangkut (mis. call tanpa
    // failure-handler lalu GAGAL, sehingga tak ada handler yang menurunkan).
    _BUSY_WATCHDOG = setInterval(function () {
      if (_BUSY > 0 && (Date.now() - _BUSY_LAST) > 20000) {
        _BUSY = 0;
        _syncBusy();
      }
    }, 1000);
  } else if (_BUSY === 0 && _BUSY_WATCHDOG) {
    clearInterval(_BUSY_WATCHDOG);
    _BUSY_WATCHDOG = null;
  }
}
var _SILENT_RPC = false;
function _silentRun(fn) {
  _SILENT_RPC = true;
  try {
    fn();
  } finally {
    setTimeout(function () { _SILENT_RPC = false; }, 50);
  }
}

(function () {
  try {
    var g = window.google && google.script && google.script.run;
    if (!g) return;
    var oWsh = g.withSuccessHandler;
    var oWfh = g.withFailureHandler;
    if (g.__nBusyPatched) return;
    g.__nBusyPatched = true;
    g.withSuccessHandler = function (h) {
      if (_SILENT_RPC) {
        return oWsh.call(this, h);
      }
      _busyInc();
      return oWsh.call(this, function (res) {
        try { return h ? h(res) : res; }
        finally { _busyDec(); }
      });
    };
    g.withFailureHandler = function (h) {
      if (_SILENT_RPC) {
        return oWfh.call(this, h);
      }
      return oWfh.call(this, function (err) {
        try { return h ? h(err) : err; }
        finally { _busyDec(); }
      });
    };
  } catch (e) {
    // patch gagal → spinner tidak tampil, call tetap berjalan normal (tidak wajib)
  }
})();

// ── NAVIGASI: section + items ─────────────────────────────
// divisiId: null = semua role; string = DIV-* untuk Kadiv/Staf
// minRoles: null = semua APPROVED; array = hanya role tsb
var NAV_SECTIONS = [
  {
    label: 'UTAMA',
    items: [
      { id: 'overview',    label: 'Ikhtisar',            divisiId: null,         minRoles: null }
    ]
  },
  {
    label: 'DIVISI',
    items: [
      { id: 'tata-usaha',    label: 'Tata Usaha',          divisiId: 'DIV-TU',     minRoles: null },
      { id: 'operasi',       label: 'Operasi',             divisiId: 'DIV-OPS',    minRoles: null },
      { id: 'intelijen',     label: 'Intelijen',           divisiId: 'DIV-INTEL',  minRoles: null },
      { id: 'pemantauan',    label: 'Pemantauan',          divisiId: 'DIV-PANTAU', minRoles: null },
      { id: 'perawatan',     label: 'Perawatan',           divisiId: 'DIV-RAWAT',  minRoles: null },
      { id: 'logistik',      label: 'Logistik',            divisiId: 'DIV-LOG',    minRoles: null },
      { id: 'pengawakan',    label: 'Pengawakan',          divisiId: 'DIV-AWAK',   minRoles: null },
      { id: 'kegiatan',      label: 'Kegiatan Pendukung',  divisiId: null,         minRoles: ['SUPERADMIN','DIREKTUR','KADIV'] }
    ]
  },
  {
    label: 'SISTEM',
    items: [
      { id: 'notifikasi',  label: 'Notifikasi',       divisiId: null, minRoles: null },
      { id: 'kelola-akun', label: 'Admin Panel',      divisiId: null, minRoles: ['SUPERADMIN','DIREKTUR'] },
      { id: 'master-data', label: 'Master Data',      divisiId: null, minRoles: ['SUPERADMIN','DIREKTUR'] },
      { id: 'riwayat',     label: 'Riwayat Laporan',  divisiId: null, minRoles: null }
    ]
  }
];

// Apakah user bisa akses view ini?
function _canAccess(item, user) {
  if (!user) return false;
  if (user.role === 'SUPERADMIN' || user.role === 'DIREKTUR') return true;
  if (item.minRoles && item.minRoles.indexOf(user.role) === -1) return false;
  if (item.divisiId && user.divisiId !== item.divisiId) return false;
  return true;
}

// Ambil item nav dari id
function _navItem(id) {
  for (var s = 0; s < NAV_SECTIONS.length; s++) {
    var items = NAV_SECTIONS[s].items;
    for (var i = 0; i < items.length; i++) {
      if (items[i].id === id) return items[i];
    }
  }
  return null;
}

// Judul halaman dari view ID
function _viewTitle(id) {
  if (id === 'profil-kapal') return 'Profil Kapal';
  var item = _navItem(id);
  return item ? item.label : '—';
}

// ── INIT ──────────────────────────────────────────────────
document.addEventListener('DOMContentLoaded', function () {
  // Dekorasi tombol berlabel dengan ikon (satu peta global `_ICO_LABEL`).
  // Jalan di awal untuk markup statis views/*.html, lalu MutationObserver
  // menutupi semua render dinamis setelahnya.
  try { _icoDecorate(); _icoWatch(); } catch (e) { /* dekorasi tidak boleh halt app */ }

  // Overlay click-to-close: klik di luar .n-modal menutup popup,
  // dengan konfirmasi jika ada field yang sudah diisi.
  try { _initOverlayClose(); } catch (e) { /* tidak boleh halt app */ }

  // Fallback safety: jika dalam 15 detik callback tidak pernah dipanggil
  // (GAS RPC error, sandbox restriction, dsb), paksa sembunyikan loading.
  var _loadingTimedOut = false;
  var _loadingTimer = setTimeout(function () {
    _loadingTimedOut = true;
    _hideLoading();
    _showAuthView('login');
  }, 15000);

  function _doneLoading() {
    if (_loadingTimedOut) return;
    clearTimeout(_loadingTimer);
    _hideLoading();
  }

  // Prefill divisi list (dipakai di form register) — fire-and-forget
  try {
    google.script.run
      .withSuccessHandler(function (res) {
        if (!res || !res.success || !res.data) return;
        var sel = document.getElementById('reg-divisi');
        if (!sel) return;
        res.data.forEach(function (d) {
          var opt = document.createElement('option');
          opt.value       = d.divisiId;
          opt.textContent = d.namaDashboard + ' \u2014 ' + d.namaResmi;
          sel.appendChild(opt);
        });
      })
      .withFailureHandler(function () { /* silent – tidak kritis */ })
      .auth_getDivisiList();
  } catch (e) { /* silent */ }

  // Cek sesi
  var savedToken = null;
  try { savedToken = sessionStorage.getItem(TOKEN_KEY); } catch (e) { /* sandbox restriction */ }

  if (savedToken) {
    try {
      google.script.run
        .withSuccessHandler(function (res) {
          _doneLoading();
          if (res && res.success && res.data) {
            APP.token = savedToken;
            APP.user  = res.data;
            if (res.data.status === 'APPROVED') {
              _stopPendingStatusPolling();
              _initApp();
            } else {
              _renderPendingInfo(res.data);
              _showAuthView('pending');
              _startPendingStatusPolling(res.data);
            }
          } else {
            try { sessionStorage.removeItem(TOKEN_KEY); } catch (e) {}
            _showAuthView('login');
          }
        })
        .withFailureHandler(function () {
          _doneLoading();
          try { sessionStorage.removeItem(TOKEN_KEY); } catch (e) {}
          _showAuthView('login');
        })
        .auth_getSessionInfo(savedToken);
    } catch (e) {
      _doneLoading();
      _showAuthView('login');
    }
  } else {
    _doneLoading();
    // Cek apakah ada pendaftaran pending yang sedang dipantau di sesi ini
    var restoredPending = false;
    try {
      var rawPending = sessionStorage.getItem('NAUTIKA_PENDING_REG');
      if (rawPending) {
        var pData = JSON.parse(rawPending);
        if (pData && (pData.email || pData.userId)) {
          _renderPendingInfo(pData);
          _showAuthView('pending');
          _startPendingStatusPolling(pData);
          restoredPending = true;
        }
      }
    } catch (e) {}
    if (!restoredPending) {
      _showAuthView('login');
    }
  }
});

// ── AUTH HELPERS ──────────────────────────────────────────
function _hideLoading() {
  var el = document.getElementById('n-loading');
  if (el) { el.style.opacity = '0'; setTimeout(function(){ el.style.display='none'; }, 250); }
}

function _showAuthView(name) {
  document.getElementById('auth-wrapper').classList.remove('n-hidden');
  document.getElementById('app-wrapper').classList.add('n-hidden');
  ['login','register','pending'].forEach(function (v) {
    document.getElementById('v-' + v).classList.add('n-hidden');
  });
  document.getElementById('v-' + name).classList.remove('n-hidden');
}

function showAuthView(name) { _showAuthView(name); } // public alias for inline onclick

// State polling status pendaftaran (real-time tanpa refresh)
var _pendingPollTimer = null;
var _lastPendingPayload = null;

function _clearPendingBanners() {
  var pHost = document.getElementById('pending-banner-host');
  if (pHost) pHost.innerHTML = '';
  var rHost = document.getElementById('register-banner-host');
  if (rHost) rHost.innerHTML = '';
}

function _startPendingStatusPolling(payload) {
  if (!payload || (!payload.email && !payload.userId)) return;
  _lastPendingPayload = payload;
  _stopPendingStatusPolling();

  function checkOnce() {
    if (!_lastPendingPayload) return;
    _silentRun(function () {
      google.script.run
        .withSuccessHandler(function (res) {
          if (!res || !res.success || !res.data) return;
          var st = res.data.status;
          if (st === 'APPROVED') {
            _stopPendingStatusPolling();
            _onRegistrationApproved(res.data);
          } else if (st === 'REJECTED') {
            _stopPendingStatusPolling();
            _onRegistrationRejected(res.data);
          }
        })
        .withFailureHandler(function () {
          // silent: kegagalan sesaat tidak menghentikan polling berkala
        })
        .auth_checkRegistrationStatus({
          email: _lastPendingPayload.email,
          userId: _lastPendingPayload.userId
        });
    });
  }

  // Cek segera + interval setiap 8 detik
  checkOnce();
  _pendingPollTimer = setInterval(checkOnce, 8000);
}

function _stopPendingStatusPolling() {
  if (_pendingPollTimer) {
    clearInterval(_pendingPollTimer);
    _pendingPollTimer = null;
  }
}

function _onRegistrationApproved(data) {
  var email = data.email || (_lastPendingPayload && _lastPendingPayload.email) || '';
  var nama  = data.nama  || (_lastPendingPayload && _lastPendingPayload.nama)  || 'Pengguna';

  try { sessionStorage.removeItem('NAUTIKA_PENDING_REG'); } catch (e) {}

  var bannerHtml =
    '<div class="n-banner-approved" role="alert">' +
      '<div class="n-banner-approved-head">' +
        '<span class="n-banner-approved-icon">&#10003;</span>' +
        '<span>Akun Anda Berhasil Disetujui!</span>' +
      '</div>' +
      '<p class="n-banner-approved-text">' +
        'Pendaftaran akun atas nama <b>' + _esc(nama) + '</b> telah diterima dan disetujui oleh atasan/administrator. ' +
        'Akun Anda kini aktif. Silakan masuk untuk mengakses sistem Nautika.' +
      '</p>' +
      '<div class="n-banner-approved-actions">' +
        '<button type="button" class="btn-primary" onclick="_pendingGoToLogin(\'' + _esc(email) + '\')">' +
          'Masuk ke Akun (Sign In)' +
        '</button>' +
      '</div>' +
    '</div>';

  var pHost = document.getElementById('pending-banner-host');
  if (pHost) pHost.innerHTML = bannerHtml;
  var rHost = document.getElementById('register-banner-host');
  if (rHost) rHost.innerHTML = bannerHtml;

  var liveEl = document.getElementById('pending-live-status');
  if (liveEl) {
    liveEl.innerHTML = '<span style="color:var(--n-status-success);font-weight:600;">Status: Akun Aktif &amp; Disetujui</span>';
  }
}

function _onRegistrationRejected(data) {
  var email  = data.email || (_lastPendingPayload && _lastPendingPayload.email) || '';
  var alasan = data.alasanReject || 'Pendaftaran tidak memenuhi kriteria verifikasi.';

  try { sessionStorage.removeItem('NAUTIKA_PENDING_REG'); } catch (e) {}

  var bannerHtml =
    '<div class="n-banner-rejected" role="alert">' +
      '<div class="n-banner-rejected-head">' +
        '<span>Pendaftaran Belum Disetujui</span>' +
      '</div>' +
      '<p class="n-banner-rejected-text">' +
        'Permintaan pendaftaran akun ditolak. Alasan: <b>' + _esc(alasan) + '</b>. ' +
        'Anda dapat melakukan pendaftaran ulang dengan data yang benar.' +
      '</p>' +
      '<div class="n-banner-approved-actions">' +
        '<button type="button" class="btn-primary" onclick="_pendingGoToRegister(\'' + _esc(email) + '\')">' +
          'Daftar Ulang' +
        '</button>' +
      '</div>' +
    '</div>';

  var pHost = document.getElementById('pending-banner-host');
  if (pHost) pHost.innerHTML = bannerHtml;
  var rHost = document.getElementById('register-banner-host');
  if (rHost) rHost.innerHTML = bannerHtml;

  var liveEl = document.getElementById('pending-live-status');
  if (liveEl) {
    liveEl.innerHTML = '<span style="color:var(--n-status-critical);font-weight:600;">Status: Pendaftaran Ditolak</span>';
  }
}

function _pendingGoToLogin(email) {
  _showAuthView('login');
  var emailInput = document.getElementById('login-email');
  if (emailInput && email) {
    emailInput.value = email;
  }
  var pwdInput = document.getElementById('login-password');
  if (pwdInput) {
    pwdInput.value = '';
    pwdInput.focus();
  }
  _msg('login-msg', 'success', 'Akun Anda telah aktif. Masukkan password Anda untuk masuk.');
}

function _pendingGoToRegister(email) {
  _showAuthView('register');
  _regResetOtp();
  var emailInput = document.getElementById('reg-email');
  if (emailInput && email) {
    emailInput.value = email;
  }
  _clearPendingBanners();
}

function _pendingCancelOrNew() {
  _stopPendingStatusPolling();
  _lastPendingPayload = null;
  try { sessionStorage.removeItem('NAUTIKA_PENDING_REG'); } catch (e) {}
  _clearPendingBanners();
  _showAuthView('register');
  _regResetOtp();
}

function _renderPendingInfo(user) {
  var el = document.getElementById('pending-info');
  if (!el) return;
  el.innerHTML =
    '<div class="info-row"><span class="lbl">Nama</span><span class="val">' + _esc(user.nama) + '</span></div>' +
    '<div class="info-row"><span class="lbl">Email</span><span class="val">' + _esc(user.email) + '</span></div>' +
    '<div class="info-row"><span class="lbl">Jabatan Dilamar</span><span class="val">' + _esc(ROLE_LABEL[user.role] || user.role) + '</span></div>' +
    '<div class="info-row"><span class="lbl">Status</span>' +
      '<span class="val"><span class="badge badge-warn">Menunggu Persetujuan</span></span>' +
    '</div>';
  var liveEl = document.getElementById('pending-live-status');
  if (liveEl) {
    liveEl.innerHTML = '<span class="pending-pulse-dot"></span><span>Memeriksa status persetujuan secara otomatis…</span>';
  }
}

// ── AUTH HANDLERS ─────────────────────────────────────────
function handleLogin(e) {
  e.preventDefault();
  var btn = document.getElementById('btn-login');
  _setLoading(btn, true);
  _msg('login-msg', null);
  google.script.run
    .withSuccessHandler(function (res) {
      _setLoading(btn, false);
      if (!res || !res.success) { _msg('login-msg', 'error', (res && res.error) || 'Terjadi kesalahan. Coba lagi.'); return; }
      APP.token = res.data.token;
      APP.user  = res.data.user;
      sessionStorage.setItem(TOKEN_KEY, APP.token);
      if (res.data.user.status === 'APPROVED') {
        _stopPendingStatusPolling();
        _initApp();
      } else {
        _renderPendingInfo(res.data.user);
        _showAuthView('pending');
        _startPendingStatusPolling(res.data.user);
      }
    })
    .withFailureHandler(function () {
      _setLoading(btn, false);
      _msg('login-msg', 'error', 'Terjadi kesalahan koneksi. Coba lagi.');
    })
    .auth_login({
      email:    document.getElementById('login-email').value,
      password: document.getElementById('login-password').value
    });
}

// Tahap 1: kirim kode OTP ke email. Akun BELUM dibuat di tahap ini.
function handleRegister(e) {
  e.preventDefault();
  // Email sudah terbukti pada percobaan sebelumnya dan pendingToken-nya masih
  // hidup (server tidak mencabut token saat registrasi ditolak) — lewati tahap
  // OTP dan kirim ulang pendaftaran dengan token tersebut.
  var email = String(document.getElementById('reg-email').value || '').trim().toLowerCase();
  if (REG.pendingToken && REG.otpEmail === email) {
    _regSubmitRegister();
    return;
  }
  var btn = document.getElementById('btn-register');
  _setLoading(btn, true);
  _msg('register-msg', null);
  google.script.run
    .withSuccessHandler(function (res) {
      _setLoading(btn, false);
      if (!res || !res.success) {
        _msg('register-msg', 'error', (res && res.error) || 'Terjadi kesalahan. Coba lagi.');
        return;
      }
      _regShowOtpStep(res.data.email);
      _msg('register-msg', 'success',
        'Kode verifikasi dikirim ke ' + res.data.email + '. Periksa kotak masuk (dan spam).');
    })
    .withFailureHandler(function () {
      _setLoading(btn, false);
      _msg('register-msg', 'error', 'Terjadi kesalahan koneksi. Coba lagi.');
    })
    .auth_requestOtp(_regPayload(document.getElementById('reg-email').value));
}

// Kumpulkan seluruh field registrasi. Server memvalidasi SEMUA field sebelum
// mengirim kode OTP — jadi kalau ada yang tidak valid, user tidak perlu
// menunggu email hanya untuk ditolak di akhir.
function _regPayload(email) {
  return {
    nama:        document.getElementById('reg-nama').value,
    email:       email,
    nip:         document.getElementById('reg-nip').value,
    password:    document.getElementById('reg-password').value,
    divisiId:    document.getElementById('reg-divisi').value,
    roleDilamar: document.getElementById('reg-role').value
  };
}

function _regShowOtpStep(email) {
  var step = document.getElementById('reg-otp-step');
  var form = document.getElementById('form-register');
  var hint = document.getElementById('reg-otp-hint');
  if (step) step.classList.remove('n-hidden');
  if (form) form.classList.add('n-hidden');
  if (hint) hint.textContent = 'Kode dikirim ke ' + email;
  var code = document.getElementById('reg-otp');
  if (code) { code.value = ''; code.focus(); }
  REG.otpEmail = email;
  REG.pendingToken = null;
}

// Kembali ke tahap 1.
//
// keepVerified = true dipakai setelah auth_register ditolak di tahap akhir
// (mis. NIP sudah dipakai). Server TIDAK membatalkan pendingToken saat
// registrasi gagal, jadi user cukup memperbaiki fieldnya lalu menekan
// "Verifikasi" lagi dengan kode yang sama — tanpa perlu email baru.
function _regResetOtp(keepVerified) {
  if (!keepVerified) {
    REG.otpEmail = null;
    REG.pendingToken = null;
  }
  var step = document.getElementById('reg-otp-step');
  var form = document.getElementById('form-register');
  if (step) step.classList.add('n-hidden');
  if (form) form.classList.remove('n-hidden');
  var code = document.getElementById('reg-otp');
  if (code) code.value = '';
  if (!keepVerified) _msg('register-msg', null);
  var btn = document.getElementById('btn-register');
  if (btn) btn.disabled = false;
}

function _regResendOtp() {
  if (!REG.otpEmail) { _regResetOtp(); return; }
  var btn = document.getElementById('btn-otp-resend');
  _setLoading(btn, true);
  google.script.run
    .withSuccessHandler(function (res) {
      _setLoading(btn, false);
      if (!res || !res.success) {
        _msg('register-msg', 'error', (res && res.error) || 'Gagal mengirim ulang kode.');
        return;
      }
      _msg('register-msg', 'success', 'Kode baru dikirim ke ' + res.data.email + '.');
      var code = document.getElementById('reg-otp');
      if (code) code.value = '';
    })
    .withFailureHandler(function () {
      _setLoading(btn, false);
      _msg('register-msg', 'error', 'Terjadi kesalahan koneksi. Coba lagi.');
    })
    .auth_requestOtp(_regPayload(REG.otpEmail));
}

// Tahap 2: cek kode → dapat pendingToken.
function _regVerifyOtp() {
  var code = String(document.getElementById('reg-otp').value || '').trim();
  if (!/^[0-9]{6}$/.test(code)) {
    _msg('register-msg', 'error', 'Masukkan 6 digit kode verifikasi.');
    return;
  }
  var btn = document.getElementById('btn-otp-verify');
  _setLoading(btn, true);
  _msg('register-msg', null);
  google.script.run
    .withSuccessHandler(function (res) {
      _setLoading(btn, false);
      if (!res || !res.success) {
        _msg('register-msg', 'error', (res && res.error) || 'Kode verifikasi gagal.');
        return;
      }
      REG.pendingToken = res.data.pendingToken;
      _regSubmitRegister();
    })
    .withFailureHandler(function () {
      _setLoading(btn, false);
      _msg('register-msg', 'error', 'Terjadi kesalahan koneksi. Coba lagi.');
    })
    .auth_verifyOtp({ email: REG.otpEmail, code: code });
}

// Tahap 3: kirim pendaftaran dengan bukti OTP.
function _regSubmitRegister() {
  // Tombol yang sedang terlihat: "Verifikasi" saat masih di step OTP, atau
  // "Daftar" saat user kembali ke form untuk memperbaiki data yang ditolak.
  var step = document.getElementById('reg-otp-step');
  var inOtp = step && !step.classList.contains('n-hidden');
  var btn = document.getElementById(inOtp ? 'btn-otp-verify' : 'btn-register');
  _setLoading(btn, true);

  var payload = {
    nama:         document.getElementById('reg-nama').value,
    email:        document.getElementById('reg-email').value,
    nip:          document.getElementById('reg-nip').value,
    password:     document.getElementById('reg-password').value,
    divisiId:     document.getElementById('reg-divisi').value,
    roleDilamar:  document.getElementById('reg-role').value,
    pendingToken: REG.pendingToken
  };

  google.script.run
    .withSuccessHandler(function (res) {
      _setLoading(btn, false);
      if (!res || !res.success) {
        var err = (res && res.error) || 'Terjadi kesalahan. Coba lagi.';
        // Email masih terverifikasi — server menyimpan pendingToken (15 menit).
        // Kembalikan ke form supaya user bisa memperbaiki field yang bermasalah
        // tanpa menunggu email baru.
        var keep = /tidak cocok dengan email/i.test(err);
        _regResetOtp(keep);
        _msg('register-msg', 'error', err + (keep
          ? ''
          : ' Perbaiki data Anda lalu masukkan kode yang sama untuk melanjutkan.'));
        return;
      }
      var registeredUser = {
        userId:   (res.data && res.data.userId) || '',
        nama:     (res.data && res.data.nama) || payload.nama,
        email:    (res.data && res.data.email) || payload.email,
        nip:      payload.nip,
        role:     (res.data && res.data.role) || payload.roleDilamar,
        divisiId: (res.data && res.data.divisiId) || payload.divisiId
      };
      try {
        sessionStorage.setItem('NAUTIKA_PENDING_REG', JSON.stringify(registeredUser));
      } catch (e) {}

      document.getElementById('form-register').reset();
      _regResetOtp();
      _clearPendingBanners();
      _renderPendingInfo(registeredUser);
      _showAuthView('pending');
      _startPendingStatusPolling(registeredUser);
    })
    .withFailureHandler(function () {
      _setLoading(btn, false);
      _msg('register-msg', 'error', 'Terjadi kesalahan koneksi. Coba lagi.');
    })
    .auth_register(payload);
}

function handleLogout() {
  if (_appHeartbeatTimer) {
    clearInterval(_appHeartbeatTimer);
    _appHeartbeatTimer = null;
  }
  _stopPendingStatusPolling();
  if (APP.token) google.script.run.auth_logout(APP.token);
  APP.token = null;
  APP.user  = null;
  sessionStorage.removeItem(TOKEN_KEY);
  _showAuthView('login');
}

/**
 * Error handler bersama: kalau server menyatakan sesi tidak valid lagi
 * (logout paksa, akun dinonaktifkan/diubah Superadmin, TTL habis), paksa
 * keluar ke layar login dengan pesan yang bisa dimengerti user.
 * Dipakai oleh semua pemanggilan google.script.run di halaman Notifikasi,
 * shell status, dan Admin Panel.
 */
function _failOrLogout(err) {
  var msg = (err && err.message) ? err.message : String(err || '');
  if (/^UNAUTHORIZED/.test(msg)) {
    handleLogout();
    _msg('login-msg', 'error',
      'Sesi Anda berakhir atau akun diperbarui oleh Superadmin. Silakan login kembali.');
    return;
  }
  return msg || 'Gagal menghubungi server.';
}

/**
 * Jaring pengaman loader (Fase 13). Dua kegagalan yang tadinya muncul sebagai
 * "loading selamanya" tanpa pesan apa pun:
 *   1. Exception di dalam withSuccessHandler — google.script.run TIDAK
 *      meneruskannya ke withFailureHandler, jadi spinner tetap menggantung.
 *   2. Server tidak pernah menjawab (script belum di-push, versi deployed
 *      masih lama, atau hang) — tidak ada callback sama sekali.
 * _asyncArm menyalakan pengatur waktu; kalau loader selesai (sukses maupun
 * gagal) memanggil _asyncDisarm, jadi tidak ada perubahan perilaku normal.
 */
var _asyncTimeoutMs = 20000;
var _asyncTimers = {};

// UI kegagalan bersama: pesan + tombol coba lagi. Dipakai oleh timeout,
// respons kosong, dan handler lain supaya konsisten.
//
// "Coba lagi" dibuat ICON-ONLY (ikon refresh + `title`/`aria-label`): tombol
// ini selalu muncul di dalam pesan error yang teksnya sudah menjelaskan
// kegagalannya, jadi mengulang kata "Coba lagi" hanya memakan ruang tanpa
// menambah informasi.
function _asyncFailUi(wrap, msg, retryCall) {
  if (!wrap || !wrap.isConnected) return;
  wrap.innerHTML = '<div class="n-msg error">' + _esc(msg) + '</div>' +
    (retryCall ? '<div style="margin-top:8px"><button type="button" class="n-iconbtn-x" ' +
      'data-ico="refresh" title="Coba lagi" aria-label="Coba lagi" onclick="' +
      retryCall + '"></button></div>' : '');
}

function _asyncArm(key, wrap, retryCall) {
  _asyncDisarm(key);
  _asyncTimers[key] = setTimeout(function () {
    delete _asyncTimers[key];
    _asyncFailUi(wrap, 'Server tidak menjawab dalam ' +
      Math.round(_asyncTimeoutMs / 1000) + ' detik. Kemungkinan perubahan belum di-deploy, ' +
      'atau server sedang mengalami error.', retryCall);
  }, _asyncTimeoutMs);
}

function _asyncDisarm(key) {
  if (_asyncTimers[key]) { clearTimeout(_asyncTimers[key]); delete _asyncTimers[key]; }
}

/**
 * Normalisasi respons google.script.run.
 *
 * GAS memanggil success handler dengan `null` (bukan failure handler) bila
 * fungsi server selesai tanpa nilai balik, atau nilai balik tidak bisa
 * diserialisasi. Accessor `res.success` pada null melempar TypeError di dalam
 * callback, sehingga spinner menggantung dan tidak ada jejak errornya.
 *
 * @param {*} res respons dari success handler
 * @return {string|null} pesan error, atau null bila res sah
 */
function _asyncResErr(res) {
  if (!res) {
    return 'Server mengembalikan respons kosong. Fungsi server mungkin belum ' +
      'di-deploy (jalankan clasp push) atau melempar exception sebelum return.';
  }
  if (res.success) return null;
  return res.error || 'Permintaan ditolak server.';
}

// null-safe counterpart of _asyncRenderFail: untuk respons kosong/bermasalah.
function _asyncResFail(key, wrap, res, retryCall) {
  _asyncDisarm(key);
  if (window.console && console.error) {
    console.error('[nautika] respons tidak valid: ' + key, res);
  }
  _asyncFailUi(wrap, _asyncResErr(res), retryCall);
}

// Dipanggil dari catch di dalam success handler: tampilkan error, jangan spinner.
function _asyncRenderFail(key, wrap, e) {
  _asyncDisarm(key);
  if (window.console && console.error) console.error('[nautika] render gagal: ' + key, e);
  if (!wrap || !wrap.isConnected) return;
  wrap.innerHTML = '<div class="n-msg error">Gagal menampilkan data: ' +
    _esc(e && e.message ? e.message : String(e)) + '</div>';
}

// ── APP INIT ──────────────────────────────────────────────
function _initApp() {
  document.getElementById('auth-wrapper').classList.add('n-hidden');
  document.getElementById('app-wrapper').classList.remove('n-hidden');
  _renderSidebar();
  var hash = (window.location.hash || '').replace('#', '') || 'overview';
  _routeTo(hash);
  _applyShellStatus(); // badge notifikasi + strip "divisi belum melapor" (Fase 13)
  _startAppHeartbeat();
  window.addEventListener('hashchange', function () {
    _routeTo((window.location.hash || '').replace('#', ''));
  });
}

// ── SIDEBAR ───────────────────────────────────────────────
function _renderSidebar() {
  var user = APP.user;
  // Footer
  document.getElementById('sb-user-name').textContent = user.nama;
  document.getElementById('sb-user-role').textContent = ROLE_LABEL[user.role] || user.role;

  // Nav
  var nav = document.getElementById('sb-nav');
  var html = '';
  NAV_SECTIONS.forEach(function (section) {
    var visibleItems = section.items.filter(function (it) { return _canAccess(it, user); });
    if (visibleItems.length === 0) return;
    html += '<div class="sb-section-label">' + section.label + '</div>';
    visibleItems.forEach(function (it) {
      html += '<div class="nav-item" id="nav-' + it.id + '" onclick="_routeTo(\'' + it.id + '\')">' +
        _esc(it.label);
      // Badge jumlah notifikasi belum dibaca (Fase 13)
      if (it.id === 'notifikasi') {
        html += '<span class="nav-badge n-hidden" id="nav-notif-badge">0</span>';
      }
      html += '</div>';
    });
  });
  nav.innerHTML = html;
}

function _updateActiveNav(viewId) {
  document.querySelectorAll('.nav-item').forEach(function (el) {
    el.classList.remove('active');
  });
  var active = document.getElementById('nav-' + viewId);
  if (active) active.classList.add('active');
}

// ── ROUTING ───────────────────────────────────────────────
function _routeTo(viewId) {
  // Rute khusus — bukan nav sidebar (dibuka dari Master Data / tautan langsung)
  if (viewId === 'profil-kapal') { _routeProfil(); return; }

  var item = _navItem(viewId);
  // Jika view tidak ada atau tidak bisa diakses → ke overview
  if (!item || !_canAccess(item, APP.user)) {
    viewId = 'overview';
  }
  APP.currentView = viewId;
  if (window.location.hash !== '#' + viewId) {
    window.location.hash = viewId;
  }
  _updateActiveNav(viewId);
  _renderPageHeader(viewId);
  _renderViewContent(viewId);
  _applyShellStatus();
}

function _routeProfil() {
  APP.currentView = 'profil-kapal';
  if (window.location.hash !== '#profil-kapal') {
    window.location.hash = 'profil-kapal';
  }
  _updateActiveNav('profil-kapal');
  _renderPageHeader('profil-kapal');
  _renderViewContent('profil-kapal');
}

function _openProfilKapal(kapalId) {
  APP.profilKapalId = String(kapalId || '').trim();
  _routeProfil();
}

// ── PAGE HEADER ───────────────────────────────────────────
function _renderPageHeader(viewId) {
  // filter tidak tampil di master-data & profil kapal (tidak relevan)
  var noFilter = (viewId === 'master-data' || viewId === 'profil-kapal' ||
                  viewId === 'kelola-akun' || viewId === 'notifikasi');
  var filterHtml = noFilter ? '' : _buildFilterHtml();

  document.getElementById('page-header').innerHTML =
    '<div class="page-header-inner">' +
      '<h1 class="page-title">' + _esc(_viewTitle(viewId)) + '</h1>' +

      '</div>' +
    '</div>';
  _syncBusy();
}

// ── FILTER PERIODE ────────────────────────────────────────
function _buildFilterHtml() {
  var f    = APP.filter;
  var now  = new Date();
  var year = now.getFullYear();

  // Year options: 3 tahun ke belakang s.d. tahun ini
  var yearOpts = '';
  for (var y = year; y >= year - 3; y--) {
    yearOpts += '<option value="' + y + '"' + (f.year === y ? ' selected' : '') + '>' + y + '</option>';
  }

  // Month options
  var monthOpts = MONTHS.map(function (m, i) {
    var val = i + 1;
    return '<option value="' + val + '"' + (f.month === val ? ' selected' : '') + '>' + m + '</option>';
  }).join('');

  var mode =
    '<div class="filter-mode">' +
      '<button type="button" class="filter-mode-btn' + (f.mode==='monthly'?' active':'') + '" onclick="_setFilterMode(\'monthly\')">Bulanan</button>' +
      '<button type="button" class="filter-mode-btn' + (f.mode==='range'  ?' active':'') + '" onclick="_setFilterMode(\'range\')">Rentang</button>' +
    '</div>';

  var monthlyInputs =
    '<div class="filter-inputs" id="filter-monthly" ' + (f.mode !== 'monthly' ? 'style="display:none"' : '') + '>' +
      '<select class="filter-sel" onchange="_setFilterMonth(this.value)">' + monthOpts + '</select>' +
      '<select class="filter-sel" onchange="_setFilterYear(this.value)">' + yearOpts + '</select>' +
    '</div>';

  var rangeInputs =
    '<div class="filter-inputs" id="filter-range" ' + (f.mode !== 'range' ? 'style="display:none"' : '') + '>' +
      '<input type="date" class="filter-date" value="' + (f.dateFrom||'') + '" onchange="_setFilterFrom(this.value)">' +
      '<span class="filter-sep">s.d.</span>' +
      '<input type="date" class="filter-date" value="' + (f.dateTo||'') + '"   onchange="_setFilterTo(this.value)">' +
    '</div>';

  return mode + '<div class="filter-mode-sep"></div>' + monthlyInputs + rangeInputs;
}

function _setFilterMode(mode) {
  APP.filter.mode = mode;
  var ml = document.getElementById('filter-monthly');
  var rl = document.getElementById('filter-range');
  if (ml) ml.style.display = (mode === 'monthly') ? '' : 'none';
  if (rl) rl.style.display = (mode === 'range')   ? '' : 'none';
  document.querySelectorAll('.filter-mode-btn').forEach(function(btn, i){
    btn.classList.toggle('active', (i===0 && mode==='monthly') || (i===1 && mode==='range'));
  });
  _reloadOnFilterChange();
}
function _setFilterMonth(v) { APP.filter.month    = parseInt(v, 10); _reloadOnFilterChange(); }
function _setFilterYear(v)  { APP.filter.year     = parseInt(v, 10); _reloadOnFilterChange(); }
function _setFilterFrom(v)  { APP.filter.dateFrom = v; _reloadOnFilterChange(); }
function _setFilterTo(v)    { APP.filter.dateTo   = v; _reloadOnFilterChange(); }

// Reload otomatis seluruh isi halaman saat filter global berubah (keputusan
// user Fase 12). Header/filter input TIDAK dibangun ulang — hanya konten.
function _reloadOnFilterChange() {
  if (APP.currentView && APP.currentView !== 'master-data') {
    _renderViewContent(APP.currentView);
  }
}

// ── VIEW CONTENT ──────────────────────────────────────────
function _renderViewContent(viewId) {
  _chartTeardownAll(); // destroy instance chart lama sebelum DOM direbuild (Fase 8)
  _ovMapDestroy();     // peta Ikhtisar menempel container yang akan hilang (Fase 14)
  var el = document.getElementById('page-content');
  if (viewId === 'overview')    { _renderOverview(el);    return; }
  if (viewId === 'tata-usaha')  { _renderTataUsaha(el);   return; }
  if (viewId === 'operasi')     { _renderOperasi(el);     return; }
  if (viewId === 'intelijen')   { _renderIntelijen(el);   return; }
  if (viewId === 'pemantauan')  { _renderPemantauan(el);  return; }
  if (viewId === 'perawatan')   { _renderPerawatan(el);   return; }
  if (viewId === 'logistik')    { _renderLogistik(el);    return; }
  if (viewId === 'pengawakan')  { _renderPengawakan(el);  return; }
  if (viewId === 'master-data') { _renderMasterData(el); return; }
  if (viewId === 'kelola-akun') { _renderKelolaAkun(el); return; }
  if (viewId === 'notifikasi')  { _renderNotifikasi(el);  return; }
  if (viewId === 'riwayat')     { _renderRiwayat(el);    return; }
  if (viewId === 'kegiatan')    { _renderKegiatan(el);    return; }
  if (viewId === 'profil-kapal'){ _renderProfilKapal(el); return; }
  // Modul lain — stub hingga fase masing-masing
  el.innerHTML = _moduleStub(_viewTitle(viewId));
}

// ── OVERVIEW — muat data agregasi (DashboardService.js) ────
var APP_OV = { key: null };

function _ovFilterKey() {
  var f = APP.filter || {};
  if (f.mode === 'range') return 'range_' + (f.dateFrom || '') + '_' + (f.dateTo || '');
  return 'monthly_' + (f.year || '') + '_' + (f.month || '');
}

function _ovLoadData(force) {
  if (!force && APP_OV.key === _ovFilterKey()) return; // sudah dimuat untuk filter ini

  var kpiRow = document.getElementById('ov-kpi-row');
  var grid = document.getElementById('ov-div-grid');
  if (!kpiRow && !grid) return;

  _busyInc();
  google.script.run
    .withSuccessHandler(function (res) {
      try {
        // Kunci cache hanya setelah server benar-benar menjawab sukses — kalau tidak,
        // satu kegagalan sementara (sesi expired/timeout) akan membuat semua
        // pemanggilan berikutnya dilewati sehingga Ikhtisar tidak pernah terisi.
        APP_OV.key = _ovFilterKey();
        if (res && res.success) {
          _ovRenderData(res.data);
        } else {
          _ovLoadError((res && res.error) || 'Gagal memuat data Ikhtisar.');
        }
      } finally {
        _busyDec();
      }
    })
    .withFailureHandler(function (err) {
      // Gagal keras (UNAUTHORIZED/timeout) — jangan kunci filter, agar bisa dicoba ulang.
      APP_OV.key = null;
      _ovLoadError((err && err.message) || 'Gagal menghubungi server.');
      _busyDec();
    })
    .dashboard_getOverview(APP.token, APP.filter);
}

function _ovLoadError(msg) {
  var kpiRow = document.getElementById('ov-kpi-row');
  if (kpiRow) {
    kpiRow.innerHTML = '<div class="n-msg error show">Data Ikhtisar gagal dimuat: ' +
      _esc(msg) +
      '. <button type="button" class="n-iconbtn-x" data-ico="refresh" ' +
      'title="Coba lagi" aria-label="Coba lagi" onclick="_ovLoadData(true)"></button></div>';
  }
  var grid = document.getElementById('ov-div-grid');
  if (grid) grid.innerHTML = '';
}

function _ovRenderData(d) {
  if (!d) return;

  var kpiRow = document.getElementById('ov-kpi-row');
  if (kpiRow) {
    if (d.headline && d.headline.length) {
      kpiRow.innerHTML = d.headline.map(function (h) {
        return _kpiHeadline(h.label, _ovNum(h.value, h.unit), h.unit, h.sub,
          { ring: h.ring, spark: h.spark, minibars: h.minibars, donut: h.donut, dots: h.dots, trend: h.trend });
      }).join('');
    } else {
      kpiRow.innerHTML = '<div class="chart-empty">Belum ada laporan pada rentang terpilih — ' +
        'isi minimal satu laporan (Operasi Laut/Udara/Intelijen/Pemantauan) pada periode ini ' +
        'agar indikator Ikhtisar muncul.</div>';
    }
  }

  var grid = document.getElementById('ov-div-grid');
  if (grid) {
    if (d.divisi && d.divisi.length) {
      grid.innerHTML = d.divisi.map(function (dv) {
        var metrics = dv.metrics.map(function (m) { return _ovMetric(m); });
        return _divCard(dv.title, metrics, dv.stack, dv.dots, { span: dv.span, viz: dv.viz });
      }).join('');
    } else {
      grid.innerHTML = '<div class="chart-empty">Belum ada ringkasan divisi pada rentang terpilih — ' +
        'laporan yang masuk akan ditampilkan sebagai kartu ringkas per divisi di sini.</div>';
    }
  }

  // Peta WPP (Fase 14): dimuat setelah kartu agar tidak menahan render kartu.
  _ovMapLoad(d.wppMap);

  if (d.charts) {
    var labels = d.charts.trendMonths || [];
    if (d.charts.realisasi) {
      _chartLine('ov-chart-real', labels, [
        { label: 'SP2D',   data: d.charts.realisasi.sp2d,   color: _CHART_COLORS.primary },
        { label: 'Akrual', data: d.charts.realisasi.akrual, color: _CHART_COLORS.primarySoft, fill: true }
      ], { emptyMsg: 'Belum ada data realisasi pada rentang terpilih.' });
    }
    if (d.charts.hariOperasi) {
      _chartBar('ov-chart-op', labels, [
        { label: 'Kapal',   data: d.charts.hariOperasi.kapal,   color: _CHART_COLORS.primary },
        { label: 'Pesawat', data: d.charts.hariOperasi.pesawat, color: _CHART_COLORS.primarySoft }
      ], { emptyMsg: 'Belum ada data hari operasi pada rentang terpilih.' });
    }

    var penEl = document.getElementById('ov-chart-penindakan');
    if (penEl) {
      var penSegs = d.charts.penindakan || [];
      penEl.innerHTML = _ovSegTotal(penSegs) > 0 ? _ovPlotDonut(penSegs, 160, 'KAPAL')
        : '<div class="chart-empty">Belum ada penindakan pada rentang terpilih.</div>';
    }
    var topEl = document.getElementById('ov-chart-teraktif');
    if (topEl) {
      var teraktif = (d.charts.kapalTeraktif || []).filter(function (k) { return (Number(k.val) || 0) > 0; });
      // Hari operasi yang tidak bisa diatribusikan ke kapal (baris lama sebelum
      // KapalID jadi wajib). Tanpa catatan ini, chart kosong terlihat seperti
      // tidak ada aktivitas — padahal ada hari operasi yang tidak masuk grafik.
      var tanpaKapal = Number(d.charts.hariTanpaKapal) || 0;
      var catatan = tanpaKapal > 0
        ? '<div style="font-size:.75rem;color:var(--n-text-muted);margin-top:10px;text-align:center;">' +
            _idNum(tanpaKapal) + ' hari operasi belum tertaut kapal \u2014 revisi laporannya agar masuk grafik.</div>'
        : '';
      topEl.innerHTML = teraktif.length
        ? '<div class="ov-plot-bars">' + _ovBars(teraktif, { ranked: true, unit: 'hari' }) + catatan + '</div>'
        : '<div class="chart-empty">Belum ada hari operasi yang tertaut kapal pada periode terpilih.' + catatan + '</div>';
    }
  }
}

function _ovNum(v, unit) {
  var n = Number(v);
  if (isNaN(n)) return (v === null || v === undefined || v === '') ? '\u2014' : String(v);
  if (unit === 'Rp') return _rupiah(n);
  return _idNum(n);
}

function _ovMetric(m) {
  var v = m.val;
  if (v === null || v === undefined || v === '' || v === '\u2014') {
    return { lbl: m.lbl, val: '\u2014', unit: m.unit, prog: !!m.prog, progMax: m.progMax, stack: m.stack, bars: m.bars, raw: null, badge: m.badge, tone: m.tone };
  }
  var valStr = _ovNum(v, m.unit);
  return { lbl: m.lbl, val: valStr, unit: m.unit, prog: !!m.prog, progMax: m.progMax, stack: m.stack, bars: m.bars, raw: (m.raw !== undefined ? m.raw : v), badge: m.badge, tone: m.tone };
}

// ── PROFIL KAPAL (DashboardService.js → dashboard_profilKapal) ──

      '<div class="content-section-hd">Stok &amp; Konsumsi</div>' +
      '<div class="chart-grid-2">' +
        '<div class="chart-cell"><div class="chart-cell-hd"><div><div class="chart-cell-title">Stok Amunisi per Jenis</div><div class="chart-cell-sub">Stok akhir = baseline \u2212 penggunaan kumulatif</div></div></div><div class="chart-box"><canvas id="pk-chart-amunisi"></canvas></div></div>' +
