function _mdSyncTabState() {
  var tabs = document.querySelectorAll('#md-tabs .n-tab');
  tabs.forEach(function (t) {
    t.classList.toggle('active', t.getAttribute('data-md-tab') === _MD.tab);
  });
  ['kapal','kawasan','wpp','opsi'].forEach(function (pane) {
    var el = document.getElementById('md-pane-' + pane);
    if (el) el.classList.toggle('n-hidden', pane !== _MD.tab);
  });
}

function _mdSetTab(name) {
  _MD.tab = name;
  _mdSyncTabState();
  if (name === 'opsi') _mdLoadOpsi();
}

function _mdLoadAll() {
  // Hanya muat tab aktif per-permintaan render; data lain dimuat saat tab dibuka.
  _mdLoadKapal();
  _mdLoadKawasan();
  _mdLoadWpp();
}

function _mdLoadKapal() {
  var wrap = document.getElementById('md-kapal-wrap');
  var sum  = document.getElementById('md-kapal-summary');
  if (wrap) wrap.innerHTML = _tableSkeleton(4, 5);
  if (sum)  sum.innerHTML   = '';

  // Muat label enum Jenis Kapal lebih dulu supaya kolom "Jenis" di tabel
  // menampilkan teks (bukan token mentah) sejak render pertama. Kegagalan di
  // sini tidak boleh memblokir tabel — label akan jatuh ke token mentah.
  _mdLoadKapalJenis(
    function () { _mdRenderKapal(_MD.data.kapal); },
    function () { _mdRenderKapal(_MD.data.kapal); }
  );

  google.script.run
    .withSuccessHandler(function (res) {
      if (!res.success) { _mdKapalMsg('error', res.error); return; }
      _MD.data.kapal = res.data;
      _mdRenderKapal(res.data);
    })
    .withFailureHandler(function () { _mdKapalMsg('error', 'Gagal memuat data kapal.'); })
    .master_getKapalList(APP.token);
}

function _mdKapalMsg(type, text) { _mdMsg('md-kapal-msg', type, text); }

function _mdRenderKapal(items) {
  var wrap = document.getElementById('md-kapal-wrap');
  var sum  = document.getElementById('md-kapal-summary');
  if (!wrap) return;

  var list = items || [];
  var aktif = list.filter(function (k) { return k.statusAktif; });

  if (sum) {
    sum.innerHTML =
      '<div class="md-chip"><span class="lbl">Total armada</span><span class="val">' + list.length + '</span></div>' +
      '<div class="md-chip"><span class="lbl">Aktif</span><span class="val">' + aktif.length + '</span></div>' +
      '<div class="md-chip"><span class="lbl">Tidak aktif</span><span class="val">' + (list.length - aktif.length) + '</span></div>';
  }

  if (list.length === 0) {
    wrap.innerHTML = '<div style="padding:20px 24px;color:var(--n-text-muted);font-size:.875rem;">Belum ada data kapal. Gunakan "Tambah Kapal" untuk mulai.</div>';
    return;
  }

  var rows = list.map(function (k) {
    var badge = k.statusAktif
      ? '<span class="badge badge-ok">Aktif</span>'
      : '<span class="badge badge-neutral">Tidak aktif</span>';
    return '<tr>' +
      '<td>' + _esc(k.kapalId) + '</td>' +
      '<td>' + _esc(k.nama) + '</td>' +
      '<td>' + _esc(k.kelas || '\u2014') + '</td>' +
      '<td>' + _esc(k.homebaseUpt || '\u2014') + '</td>' +
      '<td>' + _esc(k.jenisKapal ? _mdKapalJenisLabel(k.jenisKapal) : '\u2014') + '</td>' +
      '<td>' + badge + '</td>' +
      '<td>' +
        '<button class="btn-sm" style="background:var(--n-primary-light);color:var(--n-primary);border:1px solid #C7CCEC;margin-right:5px;" onclick="_openProfilKapal(\'' + _esc(k.kapalId) + '\')">Profil</button>' +
        '<button class="btn-sm" style="background:var(--n-primary-light);color:var(--n-primary);border:1px solid #C7CCEC;margin-right:5px;" onclick="_mdOpenKapalModal(\'' + _esc(k.kapalId) + '\')">Edit</button>' +
        (k.statusAktif
          ? '<button class="btn-sm btn-sm-crit" onclick="_mdToggleKapal(\'' + _esc(k.kapalId) + '\')">Nonaktifkan</button>'
          : '<button class="btn-sm btn-sm-ok" onclick="_mdToggleKapal(\'' + _esc(k.kapalId) + '\')">Aktifkan</button>') +
      '</td>' +
    '</tr>';
  }).join('');

  wrap.innerHTML =
    '<table class="n-table"><thead><tr>' +
      '<th>ID</th><th>Nama</th><th>Kelas</th><th>Homebase / UPT</th><th>Jenis</th><th>Status</th><th>Aksi</th>' +
    '</tr></thead><tbody>' + rows + '</tbody></table>';
}

// Label enum JenisKapal untuk tabel Master Kapal. Opsi diambil dari cache
// `master_getOpsiJenis`; kalau belum termuat, tampilkan token mentahnya
// (bukan kosong) supaya admin tetap bisa melihat kapal lewat kategori apa pun.
function _mdKapalJenisLabel(token) {
  var t = String(token || '').trim();
  if (!t) return '';
  var items = _MD.kapalJenisOptions || [];
  for (var i = 0; i < items.length; i++) {
    if (items[i].value === t) return items[i].label;
  }
  return t;
}

function _mdOpenKapalModal(kapalId) {
  _MD.editingKapalId = kapalId || null;
  _mdKapalModalMsg(null);
  var row = kapalId ? (_MD.data.kapal || []).filter(function (k) { return k.kapalId === kapalId; })[0] : null;
  var rowJenis = row ? String(row.jenisKapal || '') : '';

  _mdLoadKapalJenis(function () {
    _mdOpenKapalModalFill(kapalId, row, rowJenis);
  });
}

function _mdOpenKapalModalFill(kapalId, row, rowJenis) {

  var idIn   = document.getElementById('md-kapal-id');
  var nmIn   = document.getElementById('md-kapal-nama');
  var klIn   = document.getElementById('md-kapal-kelas');
  var hbIn   = document.getElementById('md-kapal-homebase');
  var jnSel  = document.getElementById('md-kapal-jenis');
  var stSel  = document.getElementById('md-kapal-status');

  _fillOpsiSelect('md-kapal-jenis', _MD.kapalJenisOptions || [], '(Pilih Jenis Kapal)');

  if (row) {
    idIn.value  = row.kapalId;
    nmIn.value  = row.nama;
    klIn.value  = row.kelas || '';
    hbIn.value  = row.homebaseUpt || '';
    stSel.value = row.statusAktif ? 'true' : 'false';
    // Kapal lama belum punya JenisKapal → biarkan kosong agar bisa diisi
    // tanpa memaksa admin memilih ulang saat hanya ingin mengubah yang lain.
    if (jnSel) jnSel.value = rowJenis;
    idIn.disabled = true;
    document.getElementById('md-kapal-modal-title').textContent = 'Edit Kapal';
  } else {
    idIn.value = ''; nmIn.value = ''; klIn.value = ''; hbIn.value = '';
    stSel.value = 'true';
    if (jnSel) jnSel.value = '';
    idIn.disabled = false;
    document.getElementById('md-kapal-modal-title').textContent = 'Tambah Kapal';
  }
  document.getElementById('modal-md-kapal').classList.remove('n-hidden');
  if (!row && nmIn) nmIn.focus();
}

function _mdKapalModalMsg(type, text) { _mdMsg('md-kapal-modal-msg', type, text); }

// Ambil daftar enum KAPAL_JENIS dari sheet Opsi (lazily, di-cache) untuk
// mengisi dropdown "Jenis Kapal". Golongan Opsi lain dimuat lewat tab Opsi,
// jadi tidak boleh diasumsikan sudah tersedia saat modal kapal dibuka.
function _mdLoadKapalJenis(done, onError) {
  if (_MD.kapalJenisOptions) { done(_MD.kapalJenisOptions); return; }
  var fail = function () {
    if (onError) onError();
    else _mdKapalModalMsg('error', 'Gagal memuat daftar Jenis Kapal.');
  };
  google.script.run
    .withSuccessHandler(function (res) {
      if (res && res.success && res.data) {
        var items = ((res.data.groups || {}).KAPAL_JENIS || [])
          .filter(function (it) { return it.aktif !== false; })
          .map(function (it) { return { value: it.label, label: it.labelTampil || it.label }; });
        _MD.kapalJenisOptions = items;
        done(items);
      } else {
        fail();
      }
    })
    .withFailureHandler(fail)
    .master_getOpsiJenis(APP.token);
}

function _mdSaveKapal() {
  var editing = !!_MD.editingKapalId;
  var btn = document.getElementById('md-btn-kapal-save');
  var params = {
    kapalId:      ((document.getElementById('md-kapal-id')    || {}).value || '').trim(),
    nama:         ((document.getElementById('md-kapal-nama')  || {}).value || '').trim(),
    kelas:        ((document.getElementById('md-kapal-kelas') || {}).value || '').trim(),
    homebaseUpt:  ((document.getElementById('md-kapal-homebase') || {}).value || '').trim(),
    jenisKapal:   ((document.getElementById('md-kapal-jenis')   || {}).value || '').trim(),
    statusAktif:  ((document.getElementById('md-kapal-status')  || {}).value || 'true') === 'true'
  };

  if (!params.kapalId || !params.nama) {
    _mdKapalModalMsg('error', 'KapalID dan Nama wajib diisi.');
    return;
  }
  // JenisKapal menentukan kapal mana yang muncul di form Operasi Laut untuk
  // tiap Kategori Hari Operasi (Fase 14 Item 6) — jadi wajib saat buat baru.
  if (!params.jenisKapal) {
    _mdKapalModalMsg('error', 'Jenis Kapal wajib dipilih.');
    return;
  }
  _mdKapalModalMsg(null);
  _setLoading(btn, true);

  var runner = google.script.run
    .withSuccessHandler(function (res) {
      _setLoading(btn, false);
      if (!res.success) { _mdKapalModalMsg('error', res.error); return; }
      _formSubmitDone('modal-md-kapal', res.message, function () {
        _mdKapalMsg('success', res.message);
        _MD.data.kapal = null;
        _mdLoadKapal();
      });
    })
    .withFailureHandler(function () {
      _setLoading(btn, false);
      _mdKapalModalMsg('error', 'Terjadi kesalahan koneksi. Coba lagi.');
    });

  if (editing) runner.master_updateKapal(APP.token, params);
  else         runner.master_createKapal(APP.token, params);
}

function _mdToggleKapal(kapalId) {
  var row = (_MD.data.kapal || []).filter(function (k) { return k.kapalId === kapalId; })[0];
  if (!row) return;
  var target = !row.statusAktif;
  var label  = target ? 'mengaktifkan' : 'menonaktifkan';
  if (!confirm('Yakin ' + label + ' kapal ' + kapalId + '?')) return;

  google.script.run
    .withSuccessHandler(function (res) {
      if (!res.success) { _mdKapalMsg('error', res.error); return; }
      _mdKapalMsg('success', res.message);
      _MD.data.kapal = null;
      _mdLoadKapal();
    })
    .withFailureHandler(function () { _mdKapalMsg('error', 'Gagal memperbarui status kapal.'); })
    .master_updateKapal(APP.token, { kapalId: kapalId, statusAktif: target });
}

function _mdOpsiCanWrite() {
  return !!(APP.user && (APP.user.role === 'SUPERADMIN' || APP.user.role === 'DIREKTUR'));
}

function _mdLoadOpsi() {
  var wrap = document.getElementById('md-opsi-wrap');
  if (wrap) wrap.innerHTML = _loadingInline('Memuat opsi daftar\u2026');
  _mdMsg('md-opsi-msg', null);

  google.script.run
    .withSuccessHandler(function (res) {
      if (!res.success) { _mdMsg('md-opsi-msg', 'error', res.error); return; }
      _MD.data.opsi = res.data;
      _mdRenderOpsi(res.data);
    })
    .withFailureHandler(function () { _mdMsg('md-opsi-msg', 'error', 'Gagal memuat opsi daftar.'); })
    .master_getOpsiJenis(APP.token);
}

function _mdRenderOpsi(d) {
  var wrap = document.getElementById('md-opsi-wrap');
  if (!wrap) return;
  var canWrite = _mdOpsiCanWrite();

  var html = '';
  var kodeList = d.kodeList || [];
  for (var g = 0; g < kodeList.length; g++) {
    var kode = kodeList[g];

      '<div class="attach-list" style="margin-bottom:14px;">';

    for (var i = 0; i < items.length; i++) {

        (canWrite

              _ico('pencil', 14) + '</button>' +
              '<button type="button" title="' + (it.aktif ? 'Nonaktifkan' : 'Aktifkan') + '" ' +
              'aria-label="' + (it.aktif ? 'Nonaktifkan' : 'Aktifkan') + '" ' +

    html += '</div>';

    if (canWrite) {
      html += '<div style="display:flex;gap:10px;align-items:center;">' +
        '<input type="text" id="md-opsi-add-' + kode + '" maxlength="40" class="md-opsi-input" ' +
          'placeholder="Nama ' + _esc(judul).toLowerCase() + ' baru..." style="flex:1;padding:9px 12px;border:1px solid var(--n-border-subtle);border-radius:var(--n-r-sm);background:var(--n-surface-2);color:var(--n-text-primary);" onkeydown="if(event.key===\'Enter\'){_mdOpsiAdd(\'' + kode + '\')}">' +

var _RIW = { rows: [], statusTab: 'ALL' };

function _renderRiwayat(el) {
  var tpl = document.getElementById('view-tpl-riwayat');
  if (!tpl) { el.innerHTML = _moduleStub('Riwayat Laporan'); return; }
  el.innerHTML = tpl.innerHTML;
  _RIW.rows = [];
  _RIW.statusTab = 'ALL';
  _riwSyncTabs();
  _riwLoad();
}

function _riwFmtTS(v) {
  if (!v) return '—';
  var d = new Date(v);
  if (isNaN(d.getTime())) return '—';
  return d.toLocaleString('id-ID');
}

function _riwSyncTabs() {
  var tabs = document.querySelectorAll('#riw-status-tabs .n-tab');
  var counts = _riwStatusCounts();
  for (var i = 0; i < tabs.length; i++) {
    var st = tabs[i].getAttribute('data-status');
    tabs[i].classList.toggle('active', st === _RIW.statusTab);
    var c = counts[st] || 0;
    var base = tabs[i].textContent.split(' (')[0];
    tabs[i].textContent = base + ' (' + c + ')';
  }
}

function _riwStatusCounts() {
  var c = { ALL: _RIW.rows.length, ACTIVE: 0, SUPERSEDED: 0, VOID: 0 };
  for (var i = 0; i < _RIW.rows.length; i++) {
    var st = _RIW.rows[i].status;
    if (c[st] !== undefined) c[st]++;
  }
  return c;
}

function _riwSetTab(status) {
  _RIW.statusTab = status;
  _riwSyncTabs();
  _riwRender();
}

function _riwLoad() {
  var wrap = document.getElementById('riw-history-wrap');
  if (!wrap) return;
  wrap.innerHTML = _loadingInline('Memuat riwayat seluruh laporan\u2026');

  var stripKPI = document.getElementById('riw-kpi-strip');
  if (stripKPI) stripKPI.innerHTML = _kpiSkeleton(4);

  google.script.run
    .withSuccessHandler(function(res) {
      if (res.success) { _RIW.rows = res.data || []; _riwSyncTabs(); _riwRenderKPI(); _riwRender(); }
      else {
        wrap.innerHTML = '<div class="n-msg error">' + _esc(res.error) + '</div>';
        if (stripKPI) stripKPI.innerHTML = '';
      }
    })
    .withFailureHandler(function() {
      wrap.innerHTML = '<div class="n-msg error">Koneksi terputus.</div>';
      if (stripKPI) stripKPI.innerHTML = '';
    })
    .riwayat_getAll(APP.token, APP.filter);
}

function _riwRenderKPI() {
  var strip = document.getElementById('riw-kpi-strip');
  if (!strip) return;

  function card(label, value, sub) {
    return '<div class="n-card"><div class="kpi-label">' + _esc(label) + '</div>' +
           '<div class="kpi-val">' + (value || 0) + '</div>' +
           '<div class="kpi-sub">' + _esc(sub || '') + '</div></div>';
  }

  var c = _riwStatusCounts();
  var modules = {};
  for (var i = 0; i < _RIW.rows.length; i++) modules[_RIW.rows[i].sheetLabel] = true;
  var nModul = Object.keys(modules).length;

  strip.innerHTML = '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:16px;">' +
    card('Total Entri',   c.ALL, 'Dalam rentang filter') +
    card('Modul',         nModul, 'Lintas divisi') +
    card('Aktif',         c.ACTIVE, 'Status berlaku') +
    card('Ditimpa',       c.SUPERSEDED, 'Berlaku saat ini') +
    card('Dianulir',      c.VOID, 'Dibatalkan') +
  '</div>';
}

function _riwRender() {
  var rows = _RIW.rows;
  if (_RIW.statusTab !== 'ALL') {
    rows = rows.filter(function (r) { return r.status === _RIW.statusTab; });
  }

  // Feed lintas divisi (PRD §7.5): kolom & badge disamakan dengan tabel riwayat
  // modul, tapi aksi tetap "Lihat" saja — revisi/anulir harus diarahkan ke modal
  // modul asalnya, jadi tidak dipakai di halaman agregat ini.
  _histRender('riw-history-wrap', {
    columns: ['Periode', 'Modul', 'Ringkasan', 'Divisi', 'Dikirim oleh'],
    cells: function (r) {
      return [
        _esc(r.periode || '—'),
        _esc(r.sheetLabel || '—'),
        _esc(r.ringkasan || '—'),
        _esc(r.divisiNama || r.divisiId || '—'),
        _esc(r.submittedByName || r.submittedBy || '—')
      ];
    },
    refSheet: function (r) { return r.sheet; },
    title: function (r) { return (r.sheetLabel || '—') + ' — ' + (r.periode || ''); },
    detail: function (r) { return _riwDetailFields(r); },
    empty: 'Tidak ada laporan pada rentang ini.'
  }, rows);
}

function _riwDetailFields(r) {
  var fields = [
    ['Periode', _esc(r.periode || '—')],
    ['Modul', _esc(r.sheetLabel || '—')],
    ['Divisi', _esc(r.divisiNama || r.divisiId || '—')],
    ['Dikirim', _esc(_riwFmtTS(r.timestamp))],
    ['Dikirim oleh', _esc(r.submittedByName || r.submittedBy || '—')],
    ['Status', _esc(r.status)]
  ];
  for (var f = 0; f < (r.detail || []).length; f++) {
    fields.push([_esc(r.detail[f][0]), _esc(r.detail[f][1])]);
  }
  if (r.status === 'VOID') {
    fields.push(['Alasan Anulir', _esc(r.voidReason || '—')]);
    fields.push(['Dianulir oleh', _esc(r.voidedByName || r.voidedBy || '—')]);
  }
  return fields;
}

  _asyncArm('ntf-list', list, '_ntfReload()');

  google.script.run
    .withSuccessHandler(function (res) {

// ── APP HEARTBEAT (Auto-refresh tanpa reload) ─────────────
var _appHeartbeatTimer = null;
var _lastHeartbeatTick = 0;

function _runHeartbeatTick() {
  if (!APP.token || !APP.user) return;
  var now = Date.now();
  if (now - _lastHeartbeatTick < 10000) return; // minimal tenggang 10 detik
  _lastHeartbeatTick = now;

  _silentRun(function () {
    // 1. Selalu perbarui badge notifikasi & strip pengingat mingguan
    _applyShellStatus();

    // 2. Jika user sedang di halaman notifikasi, reload list
    if (APP.currentView === 'notifikasi') {
      _ntfReload();
    }

    // 3. Jika approver dan sedang membuka overview atau panel kelola akun / drawer terbuka
    var isApprover = (APP.user.role === 'SUPERADMIN' || APP.user.role === 'DIREKTUR' || APP.user.role === 'KADIV');
    if (isApprover) {
      var drawer = document.getElementById('approval-drawer');
      var drawerOpen = drawer && !drawer.classList.contains('n-hidden');
      if (drawerOpen || APP.currentView === 'kelola-akun' || APP.currentView === 'overview') {
        _refreshApprovalPanels();
      }
    }
  });
}

function _startAppHeartbeat() {
  if (_appHeartbeatTimer) clearInterval(_appHeartbeatTimer);
  _appHeartbeatTimer = setInterval(function () {
    var isVisible = (typeof document !== 'undefined' && document.visibilityState)
      ? (document.visibilityState === 'visible')
      : true;
    if (isVisible) {
      _runHeartbeatTick();
    }
  }, 25000);
}

if (typeof document !== 'undefined') {
  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState === 'visible') {
      if (APP.token) {
        _runHeartbeatTick();
      } else if (_lastPendingPayload) {
        _startPendingStatusPolling(_lastPendingPayload);
      }
    }
  });
}

if (typeof window !== 'undefined') {
  window.addEventListener('focus', function () {
    if (APP.token) {
      _runHeartbeatTick();
    } else if (_lastPendingPayload) {
      _startPendingStatusPolling(_lastPendingPayload);
    }
  });
}

// _ico(name, size) — SVG dekoratif (aria-hidden). Aksesibilitas tetap lewat
// `title` + `aria-label` pada tombolnya.
function _ico(name, size) {

         (it.fill ? 'fill="currentColor" stroke="none"'
                  : 'fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"') +
         ' aria-hidden="true" focusable="false">' + it.d + '</svg>';

function _icoPlainText(el) {
  // Kembalikan teks polos, atau null kalau ada elemen anak (biarkan saja).
  var t = '';
  for (var i = 0; i < el.childNodes.length; i++) {
    var n = el.childNodes[i];
    if (n.nodeType === 3) { t += n.nodeValue; continue; }
    if (n.nodeType === 1) return null;
  }
  return t.replace(/\s+/g, ' ').trim();
}

var _ICO_SEL = 'button, a.btn, a.btn-mini, a.btn-outline, a.btn-primary, a.btn-ghost, [data-ico]';

function _icoDecorate(root) {
  var scope = root && root.nodeType === 1 ? root : null;
  var list = [];
  if (scope && scope.matches && scope.matches(_ICO_SEL)) list.push(scope);
  if (scope) {
    list = list.concat(Array.prototype.slice.call(scope.querySelectorAll(_ICO_SEL)));
  } else {
    list = Array.prototype.slice.call(document.querySelectorAll(_ICO_SEL));
  }
  for (var i = 0; i < list.length; i++) {
    var el = list[i];
    if (el.querySelector('svg.ico')) continue;
    var cls = ' ' + String(el.className || '') + ' ';
    if (cls.indexOf(' n-iconbtn ') !== -1 || cls.indexOf(' n-iconbtn-sm ') !== -1 ||
        cls.indexOf(' n-chip-x ') !== -1 || cls.indexOf(' n-has-ico ') !== -1 ||
        cls.indexOf(' n-tab ') !== -1) continue;
    // Icon-only: markup statis tidak bisa memanggil `_ico()` (Script_Main
    // dimuat setelah markup), jadi tombol mendeklarasikan ikon lewat
    // `data-ico="<nama>"`. Tombol ini WAJIB sudah punya `title` +
    // `aria-label` — ikon saja tidak boleh jadi satu-satunya makna.
    var named = el.getAttribute && el.getAttribute('data-ico');
    if (named) {
      var ico = _ico(named, el.getAttribute('data-ico-size') || 16);
      if (!ico) continue;
      el.insertAdjacentHTML('afterbegin', ico);
      continue;
    }
    var txt = _icoPlainText(el);
    if (!txt) continue;
    var name = _ICO_LABEL[txt];
    if (!name) continue;
    el.insertAdjacentHTML('afterbegin', _ico(name, 16));
    el.className = String(el.className || '') + ' n-has-ico';
  }
}

var _ICO_OBS = null;
function _icoWatch() {
  if (_ICO_OBS || typeof MutationObserver === 'undefined') return;
  _ICO_OBS = new MutationObserver(function (muts) {
    for (var i = 0; i < muts.length; i++) {
      var added = muts[i].addedNodes;
      for (var j = 0; j < added.length; j++) {
        if (added[j].nodeType === 1) _icoDecorate(added[j]);
      }
    }
  });
  _ICO_OBS.observe(document.body, { childList: true, subtree: true });
}

function _msg(id, type, text) {
  var el = document.getElementById(id);
  if (!el) return;
  if (!type) { el.className = 'n-msg'; el.textContent = ''; return; }
  el.className  = 'n-msg ' + type + ' show';
  el.textContent = text;
}

function _setLoading(btn, loading) {
  btn.disabled = loading;
  if (loading) {
    btn._orig = btn.innerHTML;
    btn.innerHTML = '<span class="n-spin-sm"></span>Memproses\u2026';
  } else {
    btn.innerHTML = btn._orig || btn.textContent;
  }
  // Kalau tombol ini berada di dalam popup form, tampilkan overlay loading
  // besar di area form supaya proses simpan jauh lebih terlihat (bukan hanya
  // teks "Memproses…" di tombol).
  var ov = btn.closest ? btn.closest('.n-overlay') : null;
  if (ov && ov.id) _formLoadingOverlay(ov.id, loading, 'Menyimpan\u2026');
}

// ── STATE SUKSES DI DALAM MODAL FORM ───────────────────────
// Saat submit berhasil, isi modal popup tidak langsung hilang kosong: diganti
// panel "Berhasil" sebentar, baru ditutup otomatis. Markup modal asli disimpan
// di _FORM_SUCCESS supaya bisa dipulihkan saat form dibuka lagi.
var _FORM_SUCCESS = {};

function _formRestore(modalId) {
  var rec = _FORM_SUCCESS[modalId];
  if (!rec) return false;
  // Batalkan timer auto-close: kalau modal ditutup lebih awal dan langsung
  // dibuka lagi, timer lama tidak boleh menutup form yang sedang dipakai.
  if (rec.timer) { clearTimeout(rec.timer); rec.timer = null; }
  rec.modal.innerHTML = rec.origHTML;
  delete _FORM_SUCCESS[modalId];
  return true;
}

// Menutup overlay loading (dipakai juga oleh _setLoading).
function _formLoadingOverlay(modalId, on, text) {
  if (!modalId) return;
  var ov = document.getElementById(modalId);
  if (!ov) return;
  // Fallback ke .n-modal untuk popup yang tidak memakai area scroll form
  // (mis. Master Data, Kegiatan) — keduanya punya position:relative.
  var scroll = ov.querySelector('.n-modal-form-scroll') || ov.querySelector('.n-modal');
  if (!scroll) return;
  var el = scroll.querySelector('.form-loading-overlay');
  if (!on) {
    if (el && el.parentNode) el.parentNode.removeChild(el);
    return;
  }
  if (!el) {
    el = document.createElement('div');
    el.className = 'form-loading-overlay';
    scroll.appendChild(el);
  }
  el.innerHTML = '<span class="n-spin-lg"></span>' +
                 '<span class="loading-text">' + _esc(text || 'Menyimpan\u2026') + '</span>';
  el.classList.add('show');
}

// Tampilkan panel "Berhasil" di dalam modal form. `sub` = kalimat konfirmasi,
// `onClose` = aksi setelah panel ditutup (umumnya reload KPI + riwayat).
function _formShowSuccess(modalId, sub, onClose, delay) {
  var ov = document.getElementById(modalId);
  var modal = ov && ov.querySelector('.n-modal');
  if (!modal) {
    // Fallback: tetap jalankan aksi lanjutan supaya alur tidak macet.
    if (onClose) onClose();
    return;
  }
  var titleEl = modal.querySelector('h2');
  var titleHTML = titleEl ? titleEl.outerHTML : '';

  var msIcon =
    '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" ' +
    'stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">' +
    '<path d="M4.5 12.5l5 5 10-11"/></svg>';

  var rec = _FORM_SUCCESS[modalId];
  if (!rec) {
    rec = { modal: modal, origHTML: modal.innerHTML };
    _FORM_SUCCESS[modalId] = rec;
  }
  rec.close = onClose || null;

  modal.innerHTML =
    titleHTML +
    '<div class="modal-success" role="status" aria-live="polite">' +
      '<div class="ms-icon" aria-hidden="true">' + msIcon + '</div>' +
      '<div class="ms-title">Berhasil</div>' +
      '<div class="ms-sub">' + _esc(sub || 'Laporan berhasil disimpan.') + '</div>' +
      '<div class="ms-auto">Menutup otomatis\u2026</div>' +
    '</div>';

  if (rec.timer) { clearTimeout(rec.timer); rec.timer = null; }
  rec.timer = setTimeout(function () {
    var fn = (rec && rec.close) || null;
    _formRestore(modalId);
    closeModal(modalId);
    if (fn) fn();
  }, delay || 650);
}

// Titik masuk tunggal untuk 14 form laporan: dipanggil dari callback
// `_attachUploadAll`. Upload gagal (ok === false) tidak menampilkan panel
// sukses — perilaku lama (tutup modal + reload) dipertahankan.
function _formSubmitDone(modalId, sub, onClose, ok) {
  // Berhenti di "Mengunggah…" — baik sukses maupun gagal, overlay sudah tidak
  // relevan karena isi modal akan diganti panel sukses atau langsung ditutup.
  _formLoadingOverlay(modalId, false);
  if (ok === false) {
    closeModal(modalId);
    if (onClose) onClose();
    return;
  }
  _formShowSuccess(modalId, sub, onClose);
}

// Peta key lampiran → id modal form, supaya overlay loading ikut berlanjut
// selama tahap unggah (bukan hanya saat simpan ke server).

  tu: 'modal-tu-form',
  opslaut: 'modal-ops-laut-form',
  opsudara: 'modal-ops-udara-form',
  intel: 'modal-int-form',

function closeModal(id) {
  // Kalau sedang menampilkan panel sukses, pulihkan markup modal asli dulu
  // supaya form bisa dipakai lagi saat dibuka berikutnya.
  _formRestore(id);

  if (el) el.classList.add('n-hidden');

// ── OVERLAY KLIK DI LUAR MODAL = TUTUP ──────────────────────────────────
// Berlaku untuk semua .n-overlay yang berisi form. Overlay drawer (n-z-drawer)
// dan modal-hd (read-only detail) dikecualikan.
// Jika ada field yang sudah diisi, tampilkan konfirmasi sebelum menutup.

var _MODAL_OVERLAY_EXCLUDE = {
  'dr-mask': true,         // drawer persetujuan
  'modal-hd': true,        // modal lihat detail (read-only)
  'modal-reject': true,    // modal tolak pendaftaran (satu field saja, aman)
  'modal-admin-user': true // modal admin kelola akun
};

// Cek apakah overlay memiliki field yang telah diisi pengguna.
function _modalHasDirtyFields(overlayEl) {
  var inputs = overlayEl.querySelectorAll('input, textarea, select');
  for (var i = 0; i < inputs.length; i++) {
    var el = inputs[i];
    // Skip: hidden, disabled, readonly, checkbox "tidak perlu lampiran"
    if (el.type === 'hidden' || el.disabled || el.readOnly) continue;
    if (el.type === 'checkbox') continue;
    // Skip: input bertipe file (nilai default = '')
    if (el.type === 'file') continue;
    // Select: dirty bila berubah dari option pertama (index 0) dan option > 1
    if (el.tagName === 'SELECT') {
      if (el.options.length > 1 && el.selectedIndex > 0) return true;
      continue;
    }
    var v = (el.value || '').trim();
    // Angka: dirty jika bukan '0' dan bukan ''
    if (el.type === 'number') { if (v !== '' && v !== '0') return true; continue; }
    if (v !== '') return true;
  }
  return false;
}

// Pasang listener overlay-click-to-close satu kali saat init.
function _initOverlayClose() {
  document.addEventListener('click', function (e) {
    // Cari overlay terdekat yang menjadi target klik
    var overlay = e.target;
    if (!overlay || !overlay.classList || !overlay.classList.contains('n-overlay')) return;
    // Klik harus tepat di overlay (bukan di anak elemen .n-modal)
    var modal = overlay.querySelector('.n-modal');
    if (modal && modal.contains(e.target)) return;
    // Lewati overlay yang dikecualikan
    if (_MODAL_OVERLAY_EXCLUDE[overlay.id]) return;
    // Lewati overlay drawer (pakai kelas n-z-drawer)
    if (overlay.classList.contains('n-z-drawer')) return;
    // Lewati overlay yang sudah hidden
    if (overlay.classList.contains('n-hidden')) return;

    // Jika ada field yang diisi, konfirmasi dulu
    if (_modalHasDirtyFields(overlay)) {
      var ok = confirm('Formulir ini memiliki isian yang belum disimpan.\nApakah Anda yakin ingin menutup dan membuang perubahan?');
      if (!ok) return;
    }

    // Cari tombol Batal / fungsi close yang terkait dengan overlay ini
    // (supaya state modul ikut di-reset, mis. _TU.pendingRowId)
    var cancelBtn = overlay.querySelector('button.btn-ghost, button.btn-outline');
    if (cancelBtn && cancelBtn.onclick) {
      cancelBtn.click();
    } else {
      closeModal(overlay.id);
    }
  });
}

// ── MODAL LIHAT RIWAYAT (detail submission, berlaku semua modul) ──
// Tiap renderer riwayat mendorong satu entri detail per baris via _hdPush(),
// lalu menaruh tombol "Lihat" dengan index-nya sebagai argumen onclick.
// Argumen `manage` (opsional) = kode onclick untuk aksi kelola lampiran,
// ditampilkan di bagian "Lampiran" modal — menggantikan tombol "Lampiran"
// terpisah yang dulu ada di baris tabel.

var _HD = { stack: [], cur: null };

function _hdReset() {
  _HD.stack = [];
  _HD.cur = null;
}

function _hdPush(refSheet, rowId, title, fields, manage) {
  var i = _HD.stack.length;
  _HD.stack.push({ refSheet: refSheet, rowId: rowId, title: title, fields: fields || [], manage: manage || null });
  return i;
}

function _hdOpen(i) {
  var d = _HD.stack[i];
  if (!d) return;
  _HD.cur = d;
  var titleEl = document.getElementById('hd-title');
  if (titleEl) titleEl.textContent = d.title;
  var body = document.getElementById('hd-body');
  var rows = '';
  for (var j = 0; j < d.fields.length; j++) {
    rows += '<tr><td class="hd-k">' + d.fields[j][0] + '</td><td class="hd-v">' + d.fields[j][1] + '</td></tr>';
  }
  if (body) body.innerHTML = rows || '<tr><td colspan="2" style="padding:12px;color:var(--n-text-muted);font-size:.85rem;">Tidak ada detail tambahan.</td></tr>';
  var manageEl = document.getElementById('hd-evidence-manage');
  if (manageEl) manageEl.innerHTML = d.manage ? '<button class="btn-mini" onclick="' + d.manage + '">Kelola</button>' : '';
  _hdLoadEvidence(d.refSheet, d.rowId);
  var m = document.getElementById('modal-hd');
  if (m) m.classList.remove('n-hidden');
}

function _hdClose() {
  _HD.cur = null;
  closeModal('modal-hd');
}

// Setelah lampiran ditambah/diubah dari modal kelola, segarkan daftar lampiran
// di modal Lihat bila baris yang sama masih terbuka di sana.
function _hdRefreshEvidenceIfCurrent(refSheet, refRowId) {
  var d = _HD.cur;
  if (!d || d.refSheet !== refSheet || d.rowId !== refRowId) return;
  _hdLoadEvidence(d.refSheet, d.rowId);
}

function _hdLoadEvidence(refSheet, rowId) {
  var list = document.getElementById('hd-evidence');
  if (!list) return;
  list.innerHTML = _loadingInline('Memuat lampiran\u2026');
  if (!refSheet || !rowId) {
    list.innerHTML = '<div style="color:var(--n-text-muted);font-size:.85rem;">Tidak ada lampiran.</div>';
    return;
  }
  google.script.run
    .withSuccessHandler(function (res) {
      if (!res || !res.success) {
        list.innerHTML = '<div class="n-msg error show">' + _esc((res && res.error) || 'Gagal memuat lampiran.') + '</div>';
        return;
      }
      if (!res.data.length) {
        list.innerHTML = '<div style="color:var(--n-text-muted);font-size:.85rem;">Belum ada lampiran untuk laporan ini.</div>';
        return;
      }
      list.innerHTML = res.data.map(function (e) {
        var tgl = e.uploadedAt ? new Date(e.uploadedAt).toLocaleString('id-ID') : '';
        return '<div style="display:flex;justify-content:space-between;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--n-border-subtle);">' +
          '<a href="' + _esc(e.viewUrl) + '" target="_blank" rel="noopener" style="color:var(--n-primary);font-size:.85rem;">' + _esc(e.fileName) + '</a>' +
          '<span style="font-size:.75rem;color:var(--n-text-muted);white-space:nowrap;">' + _esc(e.sourceMode) + ' \u00b7 ' + tgl + '</span>' +
        '</div>';
      }).join('');
    })
    .withFailureHandler(function () {
      list.innerHTML = '<div class="n-msg error show">Gagal memuat lampiran. Coba lagi.</div>';
    })
    .evidence_list(APP.token, refSheet, rowId);
}

// RENDERER RIWAYAT DIVISI — SATU IMPLEMENTASI UNTUK SEMUA MODUL
// ══════════════════════════════════════════════════════════
// Bentuk tabel riwayat seragam di setiap divisi:
//   Periode | …kolom khusus modul… | Dikirim | Status | Aksi
//   Aksi   : Lihat · Revisi · Anulir  (urutan tetap, Anulir destruktif di akhir)
//   Status : badge AKTIF / DITIMPA / DIANULIR dari token tema
//   VOID   : baris tinted + komentar anulir inline (ARCHITECTURE.md §5, PRD §7.4)
// Modul hanya supplying konfigurasi `columns` / `cells` / `detail` dan callback
// revisi-anulir-nya; badge, baris anulir, empty state, dan aksi tetap di sini
// supaya tidak ada lagi salinan yang menyimpang antar modul.

// Modul "Gen-1" (Tata Usaha, Operasi Laut/Udara, Intelijen, Kegiatan, Pemantauan)
// mengirim baris apa adanya dari sheet dengan key PascalCase. Normalisasi di
// sisi client saja — kontrak endpoint server tidak diubah.
var _HIST_KEYMAP = {
  RowID: 'rowId', DivisiID: 'divisiId', Periode: 'periode', Timestamp: 'timestamp',
  Status: 'status', SupersedesRowID: 'supersedesRowId',
  VoidReason: 'voidReason', VoidedBy: 'voidedBy', VoidedAt: 'voidedAt'
};

function _histNorm(r) {
  var out = {}, k;
  for (k in r) if (Object.prototype.hasOwnProperty.call(r, k)) out[k] = r[k];
  for (k in _HIST_KEYMAP) {
    if (out[_HIST_KEYMAP[k]] === undefined && out[k] !== undefined) out[_HIST_KEYMAP[k]] = out[k];
  }
  return out;
}

function _histBadge(status) {
  var s = String(status || '').toUpperCase();
  if (s === 'ACTIVE') return '<span class="status-badge aktif">AKTIF</span>';
  if (s === 'VOID') return '<span class="status-badge dianulir">DIANULIR</span>';
  return '<span class="status-badge ditimpa">DITIMPA</span>';
}

// Badge status domain (mis. SIAP/TIDAK SIAP, BASELINE/PENGGUNAAN) — tetap
// bermakna status, bukan dekorasi (DESIGN.md §1.3), jadi memakai kelas yang sama.
function _histBadgeTone(label, tone) {
  return '<span class="status-badge ' + tone + '">' + _esc(label) + '</span>';
}

function _histRowAttrs(status) {
  var s = String(status || '').toUpperCase();
  if (s === 'VOID') return ' class="hist-row-void"';
  if (s === 'SUPERSEDED') return ' class="hist-row-ditampa"';
  return '';
}

function _histActions(cfg, r) {
  var active = String(r.status || '').toUpperCase() === 'ACTIVE';
  var sheet = (typeof cfg.refSheet === 'function') ? cfg.refSheet(r) : cfg.refSheet;
  var out = '<button class="btn-mini" onclick="_hdOpen(' +
    _hdPush(sheet, r.rowId, cfg.title(r), cfg.detail(r), cfg.manage ? cfg.manage(r) : null) +
    ')">Lihat</button>';
  if (active && cfg.revisi) out += '<button class="btn-mini" onclick="' + cfg.revisi(r) + '">Revisi</button>';
  if (active && cfg.anulir) out += '<button class="btn-mini btn-danger" onclick="' + cfg.anulir(r) + '">Anulir</button>';
  return '<div class="hist-actions">' + out + '</div>';
}

function _histRender(wrapId, cfg, rows, prefixHtml) {
  var wrap = document.getElementById(wrapId);
  if (!wrap) return;
  _hdReset();
  var pre = prefixHtml || '';
  var items = (rows || []).map(_histNorm);

  if (!items.length) {
    wrap.innerHTML = pre + '<div class="hist-empty">' +
      _esc(cfg.empty || 'Belum ada laporan untuk periode ini.') + '</div>';
    return;
  }

  var t = '<table class="n-table"><thead><tr>';
  cfg.columns.forEach(function (c) { t += '<th>' + _esc(c) + '</th>'; });
  t += '<th>Dikirim</th><th>Status</th><th>Aksi</th></tr></thead><tbody>';

  items.forEach(function (r) {
    t += '<tr' + _histRowAttrs(r.status) + '>';
    cfg.cells(r).forEach(function (cell) { t += '<td>' + cell + '</td>'; });
    t += '<td>' + (r.timestamp ? _esc(new Date(r.timestamp).toLocaleDateString('id-ID')) : '—') + '</td>';
    t += '<td>' + _histBadge(r.status) + '</td>';
    t += '<td>' + _histActions(cfg, r) + '</td>';
    t += '</tr>';

    if (String(r.status || '').toUpperCase() === 'VOID' && r.voidReason) {
      t += '<tr class="hist-void-note"><td colspan="' + (cfg.columns.length + 3) + '">' +
        '<strong>Alasan Anulir:</strong> ' + _esc(r.voidReason) +
        (r.voidedBy ? ' (oleh ' + _esc(r.voidedBy) + ')' : '') + '</td></tr>';
    }
  });

  wrap.innerHTML = pre + t + '</tbody></table>';
}

// ── LOADING INDICATORS ────────────────────────────────────

function _loadingInline(text) {
  return '<div class="md-loading-inline"><span class="n-spin-sm"></span><span>' +
    _esc(text || 'Memuat\u2026') + '</span></div>';
}

function _kpiSkeleton(n) {

  for (var i = 0; i < (n || 4); i++) {
    chips += '<div class="n-card kpi-skeleton-item"><div class="sk-bar sk-bar-lg"></div>' +
             '<div class="sk-bar sk-bar-sm" style="margin-top:10px;"></div><div class="sk-bar sk-bar-sm" style="margin-top:6px;width:40%;"></div></div>';
  }

function _tableSkeleton(rows, cols) {
  var h = '<thead><tr>';
  for (var c = 0; c < (cols || 3); c++) h += '<th><div class="sk-bar sk-bar-sm" style="width:80%;"></div></th>';

// ── LAMPIRAN INLINE (Fase 10 revisi) ─────────────────────
// Blok lampiran dirender di dalam tiap form modul divisi. Satu CTA (tombol
// submit) menangani: simpan baris -> upload file/link -> refresh. Centang
// "Pengunggahan ini tidak perlu lampiran" mematikan kewajiban lampiran.
// Dipakai server: evidence_upload / evidence_uploadFromLink (1 baris) dan
// evidence_uploadBatch / evidence_uploadFromLinkBatch (N baris sekaligus).

var _ATTACH = {};

function _attachState(key) {
  return _ATTACH[key] || null;
}

function _attachInit(key, cfg) {
  var el = document.getElementById(String(key) + '-attach');
  if (!el) return null;
  var k = String(key);
  _ATTACH[k] = {
    refSheet: (cfg && cfg.refSheet) || '',
    noAtt: false,
    files: [],
    link: '',
    rowIds: [],
    tasks: [],
    busy: false,
    after: null
  };
  el.innerHTML =
    '<div class="content-section">' +
      '<div class="content-section-hd">Lampiran</div>' +
      '<div class="attach-row">' +
        '<label class="attach-check">' +
          '<input type="checkbox" id="' + k + '-noatt" onchange="_attachToggle(\'' + k + '\')">' +
          '<span>Pengunggahan ini tidak perlu lampiran</span>' +
        '</label>' +
      '</div>' +
      '<div id="' + k + '-fields" class="attach-fields">' +
        '<div class="form-grp">' +
          '<label for="' + k + '-files">Unggah file (bisa lebih dari satu; maks 15MB file biasa, 50MB video)</label>' +
          '<input type="file" id="' + k + '-files" multiple onchange="_attachPickFiles(\'' + k + '\')">' +
        '</div>' +
        '<div class="form-grp">' +
          '<label for="' + k + '-link">Atau tempel link Google Drive</label>' +
          '<input type="text" id="' + k + '-link" placeholder="https://drive.google.com/file/d/..." oninput="_attachLinkInput(\'' + k + '\')">' +
        '</div>' +
        '<div id="' + k + '-list"></div>' +
      '</div>' +
      '<div id="' + k + '-attach-msg" class="n-msg"></div>' +
    '</div>';
  return _ATTACH[k];
}

function _attachToggle(key) {
  var s = _attachState(key);
  if (!s) return;
  var cb = document.getElementById(key + '-noatt');
  s.noAtt = !!(cb && cb.checked);
  var f = document.getElementById(key + '-fields');
  if (f) f.style.display = s.noAtt ? 'none' : 'grid';
  _attachMsg(key, null);
}

function _attachPickFiles(key) {
  var s = _attachState(key);
  if (!s) return;
  var input = document.getElementById(key + '-files');
  if (input && input.files) {
    for (var i = 0; i < input.files.length; i++) s.files.push(input.files[i]);
    input.value = '';
  }
  _attachRenderList(key);
  _attachMsg(key, null);
}

function _attachRemoveFile(key, idx) {
  var s = _attachState(key);
  if (!s) return;
  s.files.splice(idx, 1);
  _attachRenderList(key);
  _attachMsg(key, null);
}

function _attachLinkInput(key) {
  var s = _attachState(key);
  if (!s) return;
  var inp = document.getElementById(key + '-link');
  s.link = (inp && inp.value || '').trim();
  _attachRenderList(key);
  _attachMsg(key, null);
}

function _attachClearLink(key) {
  var s = _attachState(key);
  if (!s) return;
  s.link = '';
  var inp = document.getElementById(key + '-link');
  if (inp) inp.value = '';
  _attachRenderList(key);
  _attachMsg(key, null);
}

function _attachRenderList(key) {
  var s = _attachState(key);
  var el = document.getElementById(key + '-list');
  if (!s || !el) return;
  var html = (s.files.length || s.link) ? '<div class="attach-list">' : '';
  for (var i = 0; i < s.files.length; i++) {
    html += '<div class="attach-chip"><b>File</b><span>' + _esc(s.files[i].name) + '</span>' +
      '<button type="button" class="n-chip-x" title="Hapus file" aria-label="Hapus file" ' +
        'onclick="_attachRemoveFile(\'' + key + '\',' + i + ')">' + _ico('x', 14) + '</button></div>';
  }
  if (s.link) {
    html += '<div class="attach-chip"><b>Link</b><span>' + _esc(s.link) + '</span>' +
      '<button type="button" class="n-chip-x" title="Hapus link" aria-label="Hapus link" ' +
        'onclick="_attachClearLink(\'' + key + '\')">' + _ico('x', 14) + '</button></div>';
  }
  html += (s.files.length || s.link) ? '</div>' : '';
  el.innerHTML = html;
}

function _attachMsg(key, type, text) {
  var el = document.getElementById(key + '-attach-msg');
  if (!el) return;
  if (!type) { el.className = 'n-msg'; el.innerHTML = ''; return; }
  if (type === 'warn') {
    el.className = 'n-msg warn show';
    el.innerHTML = '<div class="attach-retry">' + _esc(text || '') + ' ' +
      '<button type="button" onclick="_attachRetry(\'' + key + '\')">Ulangi upload lampiran</button></div>';
    return;
  }
  el.className = 'n-msg ' + type + ' show';
  el.innerHTML = _esc(text || '');
}

/**
 * Validasi blok lampiran: default wajib ada file/link, kecuali dicentang
 * "tidak perlu lampiran". Mengembalikan '' jika valid, pesan error jika tidak.
 */
function _attachValidate(key) {
  var s = _attachState(key);
  if (!s) return '';
  if (s.noAtt) return '';
  if (s.files.length === 0 && !s.link) {
    return 'Lampiran wajib pada pengunggahan ini, atau centang \u201cPengunggahan ini tidak perlu lampiran\u201d.';
  }
  if (s.link && !/drive\.google\.com/.test(s.link) && !/^[a-zA-Z0-9_\-]{20,}$/.test(s.link)) {
    return 'Link harus berupa URL Google Drive yang valid.';
  }
  return '';
}

function _attachReset(key) {
  var s = _attachState(key);
  if (!s) return;
  s.noAtt = false;
  s.files = [];
  s.link = '';
  s.rowIds = [];
  s.tasks = [];
  s.busy = false;
  s.after = null;
  var cb = document.getElementById(key + '-noatt');
  if (cb) cb.checked = false;
  var f = document.getElementById(key + '-fields');
  if (f) f.style.display = 'grid';
  var li = document.getElementById(key + '-link');
  if (li) li.value = '';
  _attachRenderList(key);
  _attachMsg(key, null);
}

function _attachReadBase64(file, cb) {
  var reader = new FileReader();
  reader.onload = function (e) {
    var data = String(e.target.result || '').replace(/^data:[^;]+;base64,/, '');
    cb(data || null);
  };
  reader.onerror = function () { cb(null); };
  reader.readAsDataURL(file);
}

/**
 * Upload semua lampiran (file/link) ke baris hasil submit, lalu reset blok.
 * @param key   - kunci state blok (prefix form)
 * @param rowIds- RowID baris tujuan (1..N dari hasil submit)
 * @param after - callback(ok:boolean) setelah seluruh tentatif selesai
 */
function _attachUploadAll(key, rowIds, after) {
  var s = _attachState(key);
  if (!s) return;
  if (s.noAtt || !s.refSheet || !rowIds || !rowIds.length) { if (after) after(true); return; }
  if (s.files.length === 0 && !s.link) { if (after) after(true); return; }

  s.rowIds = rowIds;
  s.after = after;
  s.busy = true;
  s.tasks = [];
  for (var i = 0; i < s.files.length; i++) {
    s.tasks.push({ kind: 'file', file: s.files[i], base64: null });
  }
  if (s.link) s.tasks.push({ kind: 'link', url: s.link });

  if (s.tasks.length === 0) { if (after) after(true); return; }

  // Data sudah tersimpan, sekarang tinggal mengunggah lampiran — lanjutkan
  // overlay besar dengan status baru supaya prosesnya tetap terlihat.
  var mid = _attachModalId(key);
  if (mid) _formLoadingOverlay(mid, true, 'Mengunggah lampiran\u2026');
  _attachReadTasks(key, 0, function () { _attachRunNext(key, 0); });
}

function _attachReadTasks(key, idx, done) {
  var s = _attachState(key);
  if (idx >= s.tasks.length) { done(); return; }
  var t = s.tasks[idx];
  if (t.kind !== 'file' || t.base64) { _attachReadTasks(key, idx + 1, done); return; }
  _attachReadBase64(t.file, function (b64) {
    t.base64 = b64;
    _attachReadTasks(key, idx + 1, done);
  });
}

function _attachRunNext(key, idx) {
  var s = _attachState(key);
  if (!s) return;
  if (idx >= s.tasks.length) {
    s.busy = false;
    var doneCb = s.after;
    _attachMsg(key, 'success', 'Semua lampiran berhasil diunggah.');
    _attachReset(key);
    if (doneCb) doneCb(true);
    return;
  }

  var t = s.tasks[idx];
  var single = s.rowIds.length === 1;
  var runner = google.script.run.withSuccessHandler(function (res) {
    if (res && res.success) {
      s.tasks.splice(idx, 1);
      _attachRunNext(key, idx);
    } else {
      _attachFail(key, (res && res.error) || 'Upload gagal.');
    }
  }).withFailureHandler(function () {
    _attachFail(key, 'Terjadi kesalahan koneksi saat mengunggah lampiran.');
  });

  if (t.kind === 'file') {
    var params = {
      refSheet: s.refSheet,
      fileName: t.file.name,
      mimeType: t.file.type || 'application/octet-stream',
      dataBase64: t.base64
    };
    if (single) { params.refRowId = s.rowIds[0]; runner.evidence_upload(APP.token, params); }
    else        { params.refRowIds = s.rowIds;     runner.evidence_uploadBatch(APP.token, params); }
  } else {
    var p2 = { refSheet: s.refSheet, url: t.url };
    if (single) { p2.refRowId = s.rowIds[0]; runner.evidence_uploadFromLink(APP.token, p2); }
    else        { p2.refRowIds = s.rowIds;   runner.evidence_uploadFromLinkBatch(APP.token, p2); }
  }
}

function _attachFail(key, text) {
  var s = _attachState(key);
  if (!s) return;
  s.busy = false;
  var doneCb = s.after;
  s.after = null;
  var mid = _attachModalId(key);
  if (mid) _formLoadingOverlay(mid, false);
  _attachMsg(key, 'warn', text + ' Baris sudah tersimpan; lampiran yang belum ter-upload akan dicoba lagi.');
  if (doneCb) doneCb(false);
}

function _attachRetry(key) {
  var s = _attachState(key);
  if (!s || s.busy) return;
  if (!s.tasks.length) return;
  s.after = null;
  s.busy = true;
  _attachMsg(key, null);
  _attachReadTasks(key, 0, function () { _attachRunNext(key, 0); });
}

/** Bersihkan input file/link setelah semua berhasil (state file/link di-reset). */
function _attachResetFieldsOnly(key) {
  var s = _attachState(key);
  if (!s) return;
  s.files = [];
  s.link = '';
  var li = document.getElementById(key + '-link');
  if (li) li.value = '';
  _attachRenderList(key);
}

/**
 * Bawa lampiran baris lama ke baris baru hasil revisi (fire-and-forget).
 * Dipanggil setelah revisi sukses, agar lampiran tidak "hilang" dari baris aktif.
 */
function _attachCarry(refSheet, fromRowId, toRowId) {
  if (!refSheet || !fromRowId || !toRowId) return;
  google.script.run
    .withFailureHandler(function () { /* non-blokir — revisi tetap sukses */ })
    .evidence_carry(APP.token, { refSheet: refSheet, fromRowId: fromRowId, toRowId: toRowId });
}

function _renderTataUsaha(el) {

function _tuLoadKPI() {

function _tuKPIError(msg) {
  var el = document.getElementById('tu-kpi-strip');
  if (el) el.innerHTML = '<div class="n-msg error show">' + _esc(msg) + '</div>';
}

function _tuRenderKPI(d) {
  var el = document.getElementById('tu-kpi-strip');
  if (!el) return;

  // Pagu diambil server dari baris ACTIVE terbaru (berlaku tahunan, bukan per-filter).
  // Jika belum ada laporan, nilai = 0.
  var paguSource = d.paguReguler > 0 || d.paguABT > 0 ? 'Berlaku tahunan' : 'Belum diisi';

  var progSP2D   = Math.min(Math.max(d.pctSP2D,   0), 100);
  var progAkrual = Math.min(Math.max(d.pctAkrual, 0), 100);
  var clsSP2D    = progSP2D   >= 90 ? 'warn' : '';
  var clsAkrual  = progAkrual >= 90 ? 'warn' : '';

  // Baris 1: Pagu (2 kartu) + Realisasi SP2D
  var html = '<div class="ov-kpi-row" style="grid-template-columns:repeat(3,1fr);">';
  // Pagu Reguler
  html += '<div class="kpi-card"><div class="kpi-label">Pagu Reguler</div>' +
    '<div class="kpi-value" style="font-size:1.25rem;">' + _rupiah(d.paguReguler) + '</div>' +
    '<div class="kpi-sub">' + paguSource + '</div></div>';
  // Pagu ABT
  html += '<div class="kpi-card"><div class="kpi-label">Pagu ABT</div>' +
    '<div class="kpi-value" style="font-size:1.25rem;">' + _rupiah(d.paguABT) + '</div>' +
    '<div class="kpi-sub">Anggaran Biaya Tambahan</div></div>';
  // Realisasi SP2D: persen besar + bar + sub teks
  html += '<div class="kpi-card"><div class="kpi-label">Realisasi SP2D</div>' +
    '<div class="kpi-value" style="font-size:1.5rem;">' + d.pctSP2D + '<span style="font-size:.9rem;font-weight:500;color:var(--n-text-secondary);">%</span></div>' +
    '<div class="prog-wrap"><div class="prog-bar-bg"><div class="prog-bar-fill ' + clsSP2D + '" style="width:' + progSP2D + '%;"></div></div></div>' +
    '<div class="kpi-sub">' + _rupiah(d.realisasiSP2D) + ' dari ' + _rupiah(d.paguReguler) + '</div></div>';
  html += '</div>';

  // Baris 2: Realisasi Akrual + Sisa SP2D + Sisa Akrual
  html += '<div class="ov-kpi-row" style="grid-template-columns:repeat(3,1fr);margin-top:0;">';
  html += '<div class="kpi-card"><div class="kpi-label">Realisasi Akrual</div>' +
    '<div class="kpi-value" style="font-size:1.5rem;">' + d.pctAkrual + '<span style="font-size:.9rem;font-weight:500;color:var(--n-text-secondary);">%</span></div>' +
    '<div class="prog-wrap"><div class="prog-bar-bg"><div class="prog-bar-fill ' + clsAkrual + '" style="width:' + progAkrual + '%;"></div></div></div>' +
    '<div class="kpi-sub">' + _rupiah(d.realisasiAkrual) + ' dari ' + _rupiah(d.paguABT) + '</div></div>';
  html += '<div class="kpi-card"><div class="kpi-label">Sisa SP2D</div>' +
    '<div class="kpi-value" style="font-size:1.25rem;color:' + (d.sisaSP2D < 0 ? 'var(--n-crit)' : 'inherit') + ';">' + _rupiah(d.sisaSP2D) + '</div>' +
    '<div class="kpi-sub">' + (d.sisaSP2D >= 0 ? 'Saldo aman' : 'Melebihi Pagu') + '</div></div>';
  html += '<div class="kpi-card"><div class="kpi-label">Sisa Akrual</div>' +
    '<div class="kpi-value" style="font-size:1.25rem;color:' + (d.sisaAkrual < 0 ? 'var(--n-crit)' : 'inherit') + ';">' + _rupiah(d.sisaAkrual) + '</div>' +
    '<div class="kpi-sub">' + (d.sisaAkrual >= 0 ? 'Saldo aman' : 'Melebihi Pagu') + '</div></div>';
  html += '</div>';

  el.innerHTML = html;
}

// Status bar kunci Pagu: 'lock' (terkunci, ikut laporan sebelumnya), 'unlock' (bisa diubah), 'none' (belum ada laporan sebelumnya).
function _tuSetPaguBar(state) {
  var bar   = document.getElementById('tu-pagu-bar');
  var txt   = document.getElementById('tu-pagu-bar-txt');
  var btnU  = document.getElementById('tu-btn-unlock-pagu');
  var btnL  = document.getElementById('tu-btn-lock-pagu');
  var pr    = document.getElementById('tu-pagu-reguler');
  var pa    = document.getElementById('tu-pagu-abt');
  if (pr) pr.readOnly = (state === 'lock');
  if (pa) pa.readOnly = (state === 'lock');
  _tuWatchPagu(state === 'unlock');
  if (state === 'none') {
    if (bar) bar.classList.add('n-hidden');
    if (btnU) btnU.classList.add('n-hidden');
    if (btnL) btnL.classList.add('n-hidden');
    return;
  }
  if (bar) {
    bar.classList.remove('n-hidden');
    bar.classList.toggle('unlocked', state === 'unlock');
  }
  if (txt) {
    txt.textContent = (state === 'lock')
      ? 'Pagu terkunci \u2014 mengikuti laporan sebelumnya (Reguler Rp ' + _rupiah(_TU._paguBase.r) + ' \u00B7 ABT Rp ' + _rupiah(_TU._paguBase.a) + '). Klik "Ubah Pagu" hanya bila pagu berubah.'
      : 'Pagu dibuka untuk diubah \u2014 wajib isi Catatan Revisi Pagu saat menyimpan.';
  }
  if (btnU) btnU.classList.toggle('n-hidden', state !== 'lock');
  if (btnL) btnL.classList.toggle('n-hidden', state !== 'unlock');
}

// Pasang/lepas pemantau perubahan nilai Pagu. Ditempel di satu tempat
// (_tuSetPaguBar) supaya tidak ada listener nyangkut saat modal ditutup
// dalam keadaan pagu terbuka — kalau nyangkut, penghitung akan ikut
// berubah di luar modal.
function _tuWatchPagu(on) {
  ['tu-pagu-reguler', 'tu-pagu-abt'].forEach(function (id) {
    var el = document.getElementById(id);
    if (!el) return;
    if (on) el.addEventListener('input', _tuPaguBerubah);
    else    el.removeEventListener('input', _tuPaguBerubah);
  });
}

function _tuShowCatatan(show) {
  var wrap = document.getElementById('tu-catatan-wrap');
  if (wrap) wrap.classList.toggle('n-hidden', !show);
}

// Penghitung "Revisi pagu: sudah N kali" (server: _tuHitungRevisiPagu di
// TataUsahaService, lewat KPI.revisiPagu). Angka = revisi yang SUDAH terjadi.
// Saat pagu dibuka untuk diubah, tambahkan prediksi "Jika disimpan, menjadi
// revisi ke-(N+1)" — user jadi tahu nomor yang akan terpakai sebelum menyimpan.
function _tuRenderRevisiPagu(elId, next) {
  var el = document.getElementById(elId);
  if (!el) return;
  var k = _TU.kpi;
  el.classList.remove('is-next');
  // KPI belum termuat → jangan tampilkan "Belum pernah direvisi": itu klaim
  // yang belum terverifikasi. Tanda hubung netral sampai data tiba.
  if (!k) { el.textContent = '\u2014'; return; }
  var n = parseInt(k.revisiPagu, 10);
  if (isNaN(n) || n < 0) n = 0;
  var html = n > 0
    ? 'Revisi pagu: sudah <b>' + n + '</b> kali'
    : 'Belum pernah direvisi';
  if (next) {
    html += ' \u2014 jika disimpan, menjadi <b>revisi ke-' + (n + 1) + '</b>.';
    el.classList.add('is-next');
  }
  el.innerHTML = html;
}

// Apakah nilai Pagu saat ini benar-benar berbeda dari nilai dasar (dari
// laporan sebelumnya)? Membuka "Ubah Pagu" tanpa mengubah angka TIDAK
// menambah revisi — jadi prediksi "revisi ke-N" harus hilang kalau nilai
// dikembalikan ke nilai asal.
function _tuPaguBerubah() {
  var pr = document.getElementById('tu-pagu-reguler');
  var pa = document.getElementById('tu-pagu-abt');
  var base = _TU._paguBase || { r: null, a: null };
  var berubah =
    (pr && Number(pr.value || 0) !== Number(base.r)) ||
    (pa && Number(pa.value || 0) !== Number(base.a));
  _tuRenderRevisiPagu('tu-pagu-rev', berubah);
}

function tuUnlockPagu(enable) {
  if (enable) {
    // Kunci dulu nilai lama agar "Batalkan" bisa mengembalikannya.
    if (!_TU._paguBase || _TU._paguBase.r === null) {
      _TU._paguBase = {
        r: (document.getElementById('tu-pagu-reguler') || {}).value || 0,
        a: (document.getElementById('tu-pagu-abt')     || {}).value || 0
      };
    }
    _tuSetPaguBar('unlock');
    _tuShowCatatan(true);
    // Nilai saat unlock masih sama dengan nilai dasar → belum sebuah revisi.
    _tuRenderRevisiPagu('tu-pagu-rev', false);
  } else {
    var pr = document.getElementById('tu-pagu-reguler');
    var pa = document.getElementById('tu-pagu-abt');
    if (pr && _TU._paguBase.r !== null) pr.value = _TU._paguBase.r;
    if (pa && _TU._paguBase.a !== null) pa.value = _TU._paguBase.a;
    var cl = document.getElementById('tu-catatan');
    if (cl) cl.value = '';
    _tuSetPaguBar('lock');
    _tuShowCatatan(false);
    _tuRenderRevisiPagu('tu-pagu-rev', false);
  }
  _msg('tu-form-msg', null);
}

function _tuFillFormContext() {
  var ctx = document.getElementById('tu-form-context-value');
  if (!ctx) return;
  var d = _TU.kpi;
  ctx.textContent = d ? _rupiah(d.paguReguler) + ' · ABT ' + _rupiah(d.paguABT) : '—';

// ============================================================
// MODUL OPERASI (KAPAL & PESAWAT — tab gabungan, Fase 7)
// ============================================================
var _OPS = {
  tab: 'kapal' // 'kapal' | 'pesawat'
};

// Cache GeoJSON WPP — dibagi Kapal & Pesawat (load sekali per sesi)
var _OPS_GEO = { wppGeoJsonData: null, wppPromise: null };

// Sumber geometri WPPNRI. Berkas ±10 MB di-host di GitHub raw (bukan GAS —
// Sheet/Apps Script tidak bisa menyajikan berkas statik besar tanpa biaya).
// Risikonya nyata: satu unduhan gagal = peta kosong. Yang sebelumnya terjadi,
// `fetch` tanpa guard membuat SETIAP panggilan `_renderWppLayer()` /
// `_renderOpsUdaraWppLayer()` menyalakan unduhan 10 MB sendiri (ganti tab,
// ganti filter, KPI reload), dan `.catch` hanya `console.error` — jadi user
// hanya melihat kotak abu-abu tanpa batas WPP dan tanpa pesan apa pun.
var _OPS_GEO_SRC        = 'https://raw.githubusercontent.com/mhdztr/wppnri/main/wpp_final.geojson';
var _OPS_GEO_TIMEOUT_MS = 30000;   // batas waktu sebelum menyerah
var _OPS_GEO_RETRY      = 2;       // total percobaan (1 retry)

// Unduh geometri dengan timeout + retry. Resolve dengan FeatureCollection.
function _opsFetchWppGeoJson(attempt) {
  attempt = attempt || 1;
  return new Promise(function (resolve, reject) {
    var ctrl = (typeof AbortController !== 'undefined') ? new AbortController() : null;
    // GitHub raw mengirim max-age sangat panjang → setelah berhasil,
    // unduhan berikutnya dilayani cache browser (tidak boros 10 MB).
    var opts = { cache: 'force-cache' };
    if (ctrl) opts.signal = ctrl.signal;
    var timer = setTimeout(function () { if (ctrl) ctrl.abort(); }, _OPS_GEO_TIMEOUT_MS);

    fetch(_OPS_GEO_SRC, opts)
      .then(function (r) {
        if (!r.ok) throw new Error('HTTP ' + r.status);
        return r.json();
      })
      .then(function (data) {
        clearTimeout(timer);
        if (!data || !data.features || !data.features.length) {
          throw new Error('Berkas batas WPP kosong.');
        }
        resolve(data);
      })
      .catch(function (e) {
        clearTimeout(timer);
        if (attempt < _OPS_GEO_RETRY) {           // koneksi sempat putus / CDN rate-limit
          _opsFetchWppGeoJson(attempt + 1).then(resolve, reject);
          return;
        }
        reject(new Error(
          e && e.name === 'AbortError'
            ? 'Waktu muat batas WPP habis (' + (_OPS_GEO_TIMEOUT_MS / 1000) + ' detik).'
            : 'Gagal memuat batas WPP dari sumber geospasial.'
        ));
      });
  });
}

// Ambil cache GeoJSON WPP bersama (load sekali, dipakai Laut & Udara).
// cb(geoJsonData, null) | cb(null, pesanError) — pemanggil WAJIB menangani
// kedua cabang; tidak ada lagi diam-diam gagal.
function _opsGetGeoData(cb) {
  if (_OPS_GEO.wppGeoJsonData) { cb(_OPS_GEO.wppGeoJsonData, null); return; }
  // Satu promise dipakai bersama: pemanggil yang datang sebelum unduhan
  // selesai ikut menunggu, bukan memulai unduhan kedua.
  if (!_OPS_GEO.wppPromise) {
    _OPS_GEO.wppPromise = _opsFetchWppGeoJson(1).then(function (data) {
      _OPS_GEO.wppGeoJsonData = data;
      return data;
    });
  }
  _OPS_GEO.wppPromise.then(
    function (data) { cb(data, null); },
    function (err) {
      _OPS_GEO.wppPromise = null;   // izinkan percobaan berikutnya
      cb(null, err.message || 'Gagal memuat batas WPP.');
    }
  );
}

// ── STATUS & LEGENDA PETA ─────────────────────────────────
// Container peta tidak punya elemen status di view, jadi dibuat dari JS.
// Tanpa ini kegagalan unduhan GeoJSON tidak pernah terlihat user.
function _opsMapStatus(mapId, mode, msg, onRetry) {
  var host = document.getElementById(mapId);
  if (!host) return;
  var old = host.querySelector('.ops-map-status');
  if (old) old.remove();
  if (!mode) return;

  var el = document.createElement('div');
  el.className = 'ops-map-status';
  var inner = document.createElement('div');
  inner.className = 'ops-map-status-inner';

  if (mode === 'loading') {
    var sp = document.createElement('span');
    sp.className = 'n-spin';
    inner.appendChild(sp);
    var l = document.createElement('div');
    l.textContent = msg || 'Memuat batas WPP…';
    inner.appendChild(l);
  } else {
    var t = document.createElement('strong');
    t.textContent = 'Batas WPP belum tampil';
    inner.appendChild(t);
    var d = document.createElement('div');
    d.textContent = msg || 'Sumber geospasial tidak dapat dihubungi.';
    inner.appendChild(d);
    var btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'ops-map-retry';
    btn.textContent = 'Coba lagi';
    btn.addEventListener('click', function () { if (onRetry) onRetry(); });
    inner.appendChild(btn);
  }
  el.appendChild(inner);
  host.appendChild(el);
}

// Legenda skala intensitas (PRD.md §8.1: 0 / 1-5 / 6-15 / >15).
function _opsMapLegend(mapId, colors) {
  var host = document.getElementById(mapId);
  if (!host) return;
  if (host.querySelector('.ops-map-legend')) return;   // jangan dobel saat filter berubah

  var el = document.createElement('div');
  el.className = 'ops-map-legend';
  var html = '<div class="ops-map-legend-title">Kapal + rumpon (periode ini)</div>';
  colors.forEach(function (c) {
    html += '<div class="ops-map-legend-row"><i style="background:' + c.fill + '"></i>' + c.label + '</div>';
  });
  el.innerHTML = html;
  host.appendChild(el);
}

// Peta warna choropleth — SATU hue (navy), pucat → pekat (PRD §8.1: bukan
// traffic-light multi-warna). Di-mirror dari token Style.html sebagai hex
// karena Leaflet menulis gaya sebagai ATRIBUT SVG (`fill="..."`), dan `var()`
// hanya resolve di CSS — bukan di atribut. (Bug lama: `var(--n-primary)`
// membuat setiap WPP terisi hitam, bukan navy.)
var _OPS_WPP_SCALE = [
  { max: 0,  fill: '#E4E7F2', label: '0 kapal' },          // ~ --n-primary-light
  { max: 5,  fill: '#A9B0D0', label: '1-5 kapal' },
  { max: 15, fill: '#6B76A8', label: '6-15 kapal' },
  { max: Infinity, fill: '#2B3674', label: '>15 kapal' }  // --n-primary
];
function _opsWppFill(intensitas) {
  var n = Number(intensitas) || 0;
  for (var i = 0; i < _OPS_WPP_SCALE.length; i++) {
    if (n <= _OPS_WPP_SCALE[i].max) return _OPS_WPP_SCALE[i].fill;
  }
  return _OPS_WPP_SCALE[_OPS_WPP_SCALE.length - 1].fill;
}

// Cocokkan kode GeoJSON (string) dengan key wppIntensitas dari server.
// Sheet bisa menyimpan "571" atau " 571 " — tanpa trim, seluruh peta
// diam-diam jadi warna 0 padahal datanya ada.
function _opsWppIntensitas(wppIntensitas, wppCode) {
  if (!wppIntensitas || wppCode === undefined || wppCode === null) return 0;
  var v = wppIntensitas[wppCode];
  if (v === undefined) v = wppIntensitas[String(wppCode).trim()];
  return Number(v) || 0;
}
// Satu sumber untuk tooltip kedua peta (Laut & Udara) supaya tidak berbeda.
function _opsWppTooltip(props, intensitas) {
  var nama = props.name || props.wppnri || 'WPP';
  return '<strong>' + nama + '</strong><br>WPP: ' + props.wppnri +
         '<br>Kapal + rumpon periode ini: ' + (Number(intensitas) || 0);
}

// Init dropdown periode Tahun/Bulan/Minggu Ke- (prefix: 'ops-' | 'oud-')
function _opsInitPeriodeUi(prefix) {
  prefix = prefix || 'ops-';
  var now = new Date();
  var ySel = document.getElementById(prefix + 'periode-tahun');
  var mSel = document.getElementById(prefix + 'periode-bulan');
  var wSel = document.getElementById(prefix + 'periode-minggu');
  if (!ySel || !mSel || !wSel) return;

  // Tahun: tahun lalu - tahun depan (laporan lintas-tahun jadi aman)
  var tahunOpts = '';
  for (var y = now.getFullYear() - 1; y <= now.getFullYear() + 1; y++) {
    tahunOpts += '<option value="' + y + '"' + (y === now.getFullYear() ? ' selected' : '') + '>' + y + '</option>';
  }
  ySel.innerHTML = tahunOpts;

  var bulanOpts = MONTHS.map(function(m, i) {
    return '<option value="' + (i + 1) + '"' + ((i + 1) === (now.getMonth() + 1) ? ' selected' : '') + '>' + m + '</option>';
  }).join('');
  mSel.innerHTML = bulanOpts;

  var mingguKe = Math.min(Math.ceil(now.getDate() / 7), 5); // konvensi DateUtil: tanggal 1-7 = W01, dst
  var mingguOpts = '';
  for (var w = 1; w <= 5; w++) {
    mingguOpts += '<option value="' + w + '"' + (w === mingguKe ? ' selected' : '') + '>Ke-' + w + '</option>';
  }
  wSel.innerHTML = mingguOpts;
}

// Rakit Periode "YYYY-MM-W0X" dari 3 dropdown (Tahun/Bulan/Minggu Ke-).
// Format selalu valid, tidak ada kemungkinan salah ketik.
// prefix: 'ops-' (Kapal) | 'oud-' (Pesawat)
function _composePeriode(prefix) {
  prefix = prefix || 'ops-';
  var y = _v(prefix + 'periode-tahun');
  var m = _v(prefix + 'periode-bulan');
  var w = _v(prefix + 'periode-minggu');
  if (!y || !m || !w) return '';
  m = (parseInt(m, 10) < 10 ? '0' : '') + parseInt(m, 10);
  w = 'W0' + parseInt(w, 10);
  return y + '-' + m + '-' + w;
}

function _ensureCartoKey(cb) {
  if (window._nautikaCartoKey !== undefined) { cb(window._nautikaCartoKey); return; }
  google.script.run
    .withSuccessHandler(function (key) {
      window._nautikaCartoKey = key || '';
      cb(window._nautikaCartoKey);
    })
    .withFailureHandler(function () {
      window._nautikaCartoKey = '';
      cb('');
    })
    .utils_getCartoKey();
}

function _cartoTileUrl(key) {
  var base = 'https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png';
  return key ? (base + '?key=' + encodeURIComponent(key)) : base;
}

function _initOpsLautMap() {
  _loadLeaflet(function () {
    if (window.opsLautMap) {
      window.opsLautMap.invalidateSize();
      _renderWppLayer();
      return;
    }
    var mapEl = document.getElementById('map-ops-laut');
    if (!mapEl) return;
    _ensureCartoKey(function (key) {
      if (!window.opsLautMap) {
        window.opsLautMap = L.map('map-ops-laut').setView([-2.5489, 118.0149], 5);
      }
      L.tileLayer(_cartoTileUrl(key), {
        attribution: '&copy; OpenStreetMap contributors &copy; CARTO',
        subdomains: 'abcd',
        maxZoom: 20
      }).addTo(window.opsLautMap);
      _renderWppLayer();
    });
  });
}

function _renderWppLayer() {
  if (!window.opsLautMap) return;
  if (window.opsLautWppLayer) {
    window.opsLautMap.removeLayer(window.opsLautWppLayer);
    window.opsLautWppLayer = null;
  }

  _opsMapStatus('map-ops-laut', 'loading');
  _opsGetGeoData(function (geoData, err) {
    if (!window.opsLautMap) return;   // pindah tab / pindah halaman saat unduhan berjalan
    if (err) {
      // Dulu: diam-diam. Kotak peta tetap abu-abu tanpa alasan — user
      // menyimpulkan petanya memang kosong.
      _opsMapStatus('map-ops-laut', 'error', err, _renderWppLayer);
      return;
    }
    var kpi = _OPSLAUT.kpiData;
    var intensitasOf = function (code) {
      return _opsWppIntensitas(kpi && kpi.wppIntensitas, code);
    };
    window.opsLautWppLayer = L.geoJSON(geoData, {
        style: function(feature) {
          var intensitas = intensitasOf(feature.properties.wppnri);
          // Skala intensitas: 0 kapal WAJIB tetap terlihat (PRD §8.1) → palet
          // pucat, bukan "sembunyikan". Bobot ditegakkan lewat warna satu hue.
          return {
            fillColor: _opsWppFill(intensitas),
            fillOpacity: 0.85,
            weight: 1,
            opacity: 1,
            color: 'rgba(43,54,116,0.45)'
          };
        },
        onEachFeature: function(feature, layer) {
          var wppCode = feature.properties.wppnri;
          layer.bindTooltip(
            _opsWppTooltip(feature.properties, intensitasOf(wppCode)),
            { sticky: true }
          );
        }
      }).addTo(window.opsLautMap);
    _opsMapStatus('map-ops-laut', null);
    _opsMapLegend('map-ops-laut', _OPS_WPP_SCALE);
  });
}
