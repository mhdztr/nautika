<!-- =========================================================
     AUTH WRAPPER — login / register / pending
     ========================================================= -->
<div id="auth-wrapper" class="n-hidden">

  <!-- LOGIN -->
  <div id="v-login" class="auth-screen n-hidden">
    <div class="auth-card">
      <div class="auth-brand">Nautika</div>
      <h1 class="auth-title">Masuk ke Akun</h1>
      <div id="login-msg" class="n-msg"></div>
      <form id="form-login" onsubmit="handleLogin(event)">
        <div class="form-grp">
          <label for="login-email">Email / NIP</label>
          <input type="email" id="login-email" placeholder="nama@instansi.go.id"
                 required autocomplete="email">
        </div>
        <div class="form-grp">
          <label for="login-password">Password</label>
          <input type="password" id="login-password" placeholder="••••••••"
                 required autocomplete="current-password">
        </div>
        <button type="submit" class="btn-primary" id="btn-login">Masuk</button>
      </form>
      <div class="auth-foot">
        Belum punya akun? <a onclick="showAuthView('register')">Daftar</a>
      </div>
    </div>
  </div>

  <!-- REGISTER -->
  <div id="v-register" class="auth-screen n-hidden">
    <div class="auth-card">
      <div class="auth-brand">Nautika</div>
      <h1 class="auth-title">Daftar Akun Baru</h1>
      <div id="register-msg" class="n-msg"></div>
      <form id="form-register" onsubmit="handleRegister(event)">
        <div class="form-grp">
          <label for="reg-nama">Nama Lengkap</label>
          <input type="text" id="reg-nama" placeholder="Nama sesuai dokumen resmi" required>
        </div>
        <div class="form-grp">
          <label for="reg-email">Email / NIP</label>
          <input type="email" id="reg-email" placeholder="nama@instansi.go.id" required>
        </div>
        <div class="form-grp">
          <label for="reg-password">Password</label>
          <input type="password" id="reg-password" placeholder="Minimal 8 karakter"
                 required minlength="8">
        </div>
        <div class="form-grp">
          <label for="reg-divisi">Unit Kerja</label>
          <select id="reg-divisi" required>
            <option value="">— Pilih Unit Kerja —</option>
          </select>
        </div>
        <div class="form-grp">
          <label for="reg-role">Jabatan yang Dilamar</label>
          <select id="reg-role" required>
            <option value="">— Pilih Jabatan —</option>
            <option value="STAF">Staf / Pegawai</option>
            <option value="KADIV">Kepala Divisi / Ketua Tim Kerja / Kepala Sub Direktorat</option>
          </select>
        </div>
        <button type="submit" class="btn-primary" id="btn-register">Kirim Permintaan</button>
      </form>
      <div class="auth-foot">
        Sudah punya akun? <a onclick="showAuthView('login')">Masuk</a>
      </div>
    </div>
  </div>

  <!-- PENDING -->
  <div id="v-pending" class="auth-screen n-hidden">
    <div class="auth-card">
      <div class="auth-brand">Nautika</div>
      <h1 class="auth-title">Menunggu Persetujuan</h1>
      <div class="n-info-static">
        Akun Anda sedang dalam proses verifikasi oleh administrator.
        Silakan cek kembali setelah mendapat konfirmasi.
      </div>
      <div id="pending-info"></div>
      <button class="btn-ghost" onclick="handleLogout()" style="margin-top:20px;">Keluar</button>
    </div>
  </div>

</div><!-- end auth-wrapper -->
