   ============================================================ */
.prog-wrap {
  margin-top: 8px;
}
.prog-bar-bg {
  background: var(--n-surface-2);
  border-radius: var(--n-r-pill);
  height: 6px;
  overflow: hidden;
}
.prog-bar-fill {
  height: 100%;
  border-radius: var(--n-r-pill);
  background: var(--n-primary);
  transition: width 0.3s;
}
.prog-bar-fill.warn { background: var(--n-warn); }
.prog-bar-fill.crit { background: var(--n-crit); }
.prog-labels {
  display: flex;
  justify-content: space-between;
  margin-top: 4px;
  font-size: 0.73rem;
  color: var(--n-text-muted);
}

/* ============================================================
   SECTION HEADER inside page content
   ============================================================ */
.content-section { margin-bottom: 28px; }
.content-section-hd {
  font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
  font-weight: 700;
  font-size: 0.9375rem;
  letter-spacing: -0.015em;
  color: var(--n-text-primary);
  margin-bottom: 14px;
}

/* ============================================================
   ZONA CHART — konteks di antara KPI dan tabel (DESIGN.md §6)
   ============================================================ */
.chart-grid-2 {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 16px;
}
.chart-cell {
  background: var(--n-material-surface, rgba(255, 255, 255, 0.82));
  backdrop-filter: blur(20px) saturate(180%);
  -webkit-backdrop-filter: blur(20px) saturate(180%);
  border: 1px solid var(--n-border-hairline, rgba(0,0,0,0.07));
  border-radius: var(--n-r-lg);
  box-shadow: var(--n-shadow-1);
  padding: 18px 18px 16px;
  transition: box-shadow 0.25s var(--n-spring-snappy);
}
.chart-cell:hover {
  box-shadow: var(--n-shadow-2);
}
.chart-cell-hd {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 12px;
}
.chart-cell-title {
  font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
  font-weight: 600;
  font-size: 0.875rem;
  letter-spacing: -0.010em;
  color: var(--n-text-primary);
}
.chart-cell-sub {
  font-size: 0.73rem;
  color: var(--n-text-muted);
  margin-top: 2px;
}
.chart-cell-chips {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  justify-content: flex-end;
  flex-shrink: 0;
}
.chart-chip {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-size: 0.72rem;
  color: var(--n-text-muted);
}
.chart-chip i {
  width: 10px;
  height: 10px;
  border-radius: 3px;
  display: inline-block;
}
.chart-box {
  position: relative;
  height: 260px;
}
.chart-empty {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--n-text-muted);
  font-size: 0.875rem;
  text-align: center;
  padding: 0 20px;
}
@media (max-width: 900px) {
  .chart-grid-2 { grid-template-columns: 1fr; }
  /* grid kartu divisi: breakpoint tablet/ponsel ada di blok akhir file
     (harus SESUDAH aturan dasar #ov-div-grid 6 kolom). */
}

/* ============================================================
   OVERVIEW — visual pendukung tipis (DESIGN.md §6)
   Thin progress bar target (divisi), stacked bar proporsi,
   indikator tren, mini-chart KPI, plot donut & bar kapal teraktif.
   Warna hanya dari token tema §3.
   ============================================================ */
.ov-trend {
  margin-top: 0;
  font-size: 0.6875rem;
  font-weight: 600;
  line-height: 1.2;
  display: inline-flex;
  align-items: center;
  gap: 3px;
  padding: 2px 7px;
  border-radius: var(--n-radius-pill);
  background: rgba(0, 0, 0, 0.03);
  color: var(--n-text-secondary);
  font-variant-numeric: tabular-nums;
  -webkit-font-feature-settings: "tnum";
  font-feature-settings: "tnum";
  border: 1px solid rgba(0, 0, 0, 0.06);
  letter-spacing: -0.01em;
  white-space: nowrap;
  flex-shrink: 0;
}
.ov-trend.up {
  color: #047857;
  background: rgba(16, 185, 129, 0.06);
  border-color: rgba(16, 185, 129, 0.15);
}
.ov-trend.down {
  color: var(--n-text-secondary);
  background: rgba(0, 0, 0, 0.03);
  border-color: rgba(0, 0, 0, 0.06);
}
.ov-trend-cmp {
  font-weight: 500;
  font-size: 0.65rem;
  color: inherit;
  opacity: 0.8;
  white-space: nowrap;
}
.stk-wrap { margin-top: 8px; }
.stk-bar {
  display: flex;
  height: 6px;
  border-radius: var(--n-r-pill);
  overflow: hidden;
  background: var(--n-surface-2);
}
.stk-seg { height: 100%; }
.stk-legend {
  display: flex;
  flex-wrap: wrap;
  column-gap: 14px;
  row-gap: 3px;
  margin-top: 5px;
}
.stk-item {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  font-size: 0.75rem;
  font-weight: 500;
  color: var(--n-text-secondary);
  white-space: nowrap;
}
.stk-item i {
  width: 8px;
  height: 8px;
  border-radius: 2px;
  display: inline-block;
  flex-shrink: 0;
}
.stk-caption {
  margin-top: 12px;
  padding-top: 9px;
  border-top: 1px solid var(--n-border-subtle);
  font-size: 0.78rem;
  font-weight: 600;
  text-transform: none;
  letter-spacing: -0.005em;
  color: var(--n-text-secondary);
  margin-bottom: 4px;
}

/* ── Visual mini KPI & sel chart (DESIGN §6.3, §10.2) ── */

/* Titik status (7 divisi melapor) */
.ov-dots {
  display: flex;
  gap: 8px;
  align-items: center;
}
.ov-dot {
  width: 14px;
  height: 14px;
  border-radius: 50%;
  background: var(--n-surface-2);
  border: 1.5px solid var(--n-border-subtle);
  display: inline-block;
}
.ov-dot.on {
  background: var(--n-primary);
  border-color: var(--n-primary);
}

/* Baris batang horizontal (label + track + nilai) */
.ov-bars {
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.bar-line {
  display: grid;
  grid-template-columns: 1.4fr 2fr auto;
  align-items: center;
  gap: 12px;
}
.bar-line.has-rank {
  grid-template-columns: 24px minmax(100px, 1.4fr) 2fr auto;
}
.bar-rank {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 22px;
  height: 22px;
  border-radius: 6px;
  font-size: 0.72rem;
  font-weight: 600;
  background: var(--n-surface-2);
  color: var(--n-text-secondary);
  font-variant-numeric: tabular-nums;
}
.bar-rank.top {
  background: var(--n-primary);
  color: #FFFFFF;
}
.bar-line-lbl {
  font-size: 0.8125rem;
  font-weight: 600;
  color: var(--n-text-primary);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.bar-line-track {
  height: 9px;
  border-radius: 99px;
  background: var(--n-surface-2);
  overflow: hidden;
}
.bar-line-fill {
  height: 100%;
  border-radius: 99px;
}
.bar-line-val {
  font-size: 0.8rem;
  font-weight: 700;
  color: var(--n-text-primary);
  font-variant-numeric: tabular-nums;
  text-align: right;
  white-space: nowrap;
}
.bar-line-unit {
  font-size: 0.75rem;
  font-weight: 500;
  color: var(--n-text-secondary);
  margin-left: 2px;
}

/* Status & Penindakan container */
#ov-chart-penindakan {
  display: flex;
  align-items: center;
  justify-content: center;
  height: 100%;
  min-height: 240px;
}
#ov-chart-teraktif {
  display: flex;
  flex-direction: column;
  justify-content: center;
  height: 100%;
  min-height: 240px;
  padding: 10px 16px;
  box-sizing: border-box;
}

/* Plot donut + legenda (sel chart) */
.ov-plot {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 36px;
  width: 100%;
  height: 100%;
  padding: 10px 16px;
  box-sizing: border-box;
}
.ov-plot-legend {
  display: flex;
  flex-direction: column;
  gap: 10px;
  min-width: 220px;
}
.legend-row {
  display: grid;
  grid-template-columns: 10px minmax(110px, 1fr) auto auto;
  align-items: center;
  gap: 12px;
  padding: 6px 10px;
  border-radius: var(--n-r-sm);
  transition: background 0.15s ease;
}
.legend-row:hover {
  background: var(--n-surface-hover);
}
.legend-row i {
  width: 10px;
  height: 10px;
  border-radius: 3px;
  display: inline-block;
  flex-shrink: 0;
}
.legend-lbl {
  font-size: 0.8125rem;
  font-weight: 600;
  color: var(--n-text-primary);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.legend-val {
  font-size: 0.82rem;
  font-weight: 700;
  color: var(--n-text-primary);
  font-variant-numeric: tabular-nums;
  min-width: 22px;
  text-align: right;
}
.legend-pct {
  font-size: 0.72rem;
  font-weight: 600;
  color: var(--n-text-secondary);
  background: var(--n-surface-2);
  border-radius: 99px;
  padding: 2px 7px;
  min-width: 38px;
  text-align: center;
  font-variant-numeric: tabular-nums;
}
.ov-plot-bars {
  height: 100%;
  width: 100%;
  display: flex;
  flex-direction: column;
  justify-content: center;
  gap: 10px;
}


/* ============================================================
   FASE 13 — NOTIFIKASI & ADMIN PANEL
   Badge unread di sidebar, strip peringatan "divisi belum
   melapor", tabel penuh, dan padding muted untuk state kosong.
   ============================================================ */
.nav-badge {
  margin-left: auto;
  min-width: 20px;
  padding: 1px 6px;
  border-radius: var(--n-r-pill);
  background: rgba(255,255,255,0.16);
  color: #FFFFFF;
  font-size: 0.68rem;
  font-weight: 700;
  text-align: center;
  font-variant-numeric: tabular-nums;
}
.nav-item.active .nav-badge { background: rgba(255,255,255,0.28); }

.reminder-strip {
  margin: 0;
  padding: 10px 28px;
  background: var(--n-primary-light);
  border-bottom: 1px solid var(--n-border-subtle);
  color: var(--n-text-secondary);
  font-size: 0.8125rem;
  font-weight: 500;
}
.reminder-strip strong { font-weight: 700; }

.hd-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
  flex-wrap: wrap;
}
.hd-row > div:last-child { display: flex; gap: 8px; }

.n-pad-muted {
  padding: 20px 24px;
  color: var(--n-text-muted);
  font-size: 0.875rem;
}
.n-table-full { width: 100%; }

/* Shared spin keyframe (filter-busy, n-spin-sm, n-spin-lg) */
@keyframes _spin { to { transform: rotate(360deg); } }

/* ============================================================
   PETA WPP — STATUS & LEGENDA CHOROPLETH
   Peta tidak punya elemen DOM sendiri di view: container
   `#map-ops-*` diisi Leaflet. Status muat & legenda dibuat
   dari JS (satu helper untuk Kapal & Pesawat) lalu diposisikan
   absolut di atas kanvas peta. Tanpa ini, kegagalan fetch
   GeoJSON hanya muncul di console — user hanya melihat kotak
   abu-abu dan mengira peta-nya memang kosong.
   ============================================================ */
.ops-map-status {
  position: absolute;
  inset: 0;
  z-index: 500;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px;
  text-align: center;
  background: rgba(248,250,252,0.88);
  backdrop-filter: blur(1px);
}
.ops-map-status-inner {
  max-width: 340px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 10px;
  color: var(--n-text-secondary);
  font-size: 0.8125rem;
  line-height: 1.5;
}
.ops-map-status strong {
  display: block;
  color: var(--n-text-primary);
  font-size: 0.875rem;
  font-weight: 600;
}
.ops-map-retry {
  margin-top: 2px;
  padding: 7px 16px;
  border-radius: var(--n-r-pill);
  border: 1px solid var(--n-primary);
  background: var(--n-primary);
  color: #FFFFFF;
  font-family: inherit;
  font-size: 0.8125rem;
  font-weight: 600;
  cursor: pointer;
}
.ops-map-retry:hover { background: #232C5E; }
.ops-map-retry:focus-visible {
  outline: 2px solid var(--n-primary);
  outline-offset: 2px;
}

.ops-map-legend {
  position: absolute;
  left: 12px;
  bottom: 12px;
  z-index: 450;
  padding: 10px 12px;
  border-radius: var(--n-r-sm);
  background: rgba(255,255,255,0.94);
  box-shadow: var(--n-shadow-card);
  font-size: 0.6875rem;
  color: var(--n-text-secondary);
  line-height: 1.45;
  pointer-events: none;
}
.ops-map-legend-title {
  margin-bottom: 6px;
  font-weight: 600;
  color: var(--n-text-primary);
}
.ops-map-legend-row {
  display: flex;
  align-items: center;
  gap: 7px;
}
.ops-map-legend-row i {
  width: 12px;
  height: 12px;
  flex: 0 0 12px;
  border-radius: 3px;
  border: 1px solid rgba(43,54,116,0.18);
}

/* ── PETA CHOROPLETH IKHTISAR (Fase 14) ───────────────────────
   Peta hero langsung di bawah KPI Utama: focal point lewat ukuran
   (bukan gradient/blob — DESIGN §1). Legenda & status memakai pola
   yang sama dengan peta Operasi supaya konsisten. */
.ov-map-cell { padding-bottom: 14px; }
.ov-map-wrap { position: relative; }
#ov-map {
  position: relative;
  height: 420px;
  width: 100%;
  border-radius: var(--n-r-md);
  overflow: hidden;
  background: var(--n-surface-2, #EFF1F6);
  border: 1px solid var(--n-border-subtle);
}
.ov-map-legend {
  position: absolute;
  left: 12px;
  bottom: 12px;
  z-index: 450;
  padding: 10px 12px;
  border-radius: var(--n-r-sm);
  background: rgba(255,255,255,0.94);
  box-shadow: var(--n-shadow-card);
  font-size: 0.6875rem;
  color: var(--n-text-secondary);
  line-height: 1.45;
  pointer-events: none;
}
.ov-map-legend-title {
  margin-bottom: 6px;
  font-weight: 600;
  color: var(--n-text-primary);
}
.ov-map-legend-row {
  display: flex;
  align-items: center;
  gap: 7px;
}
.ov-map-legend-row i {
  width: 12px;
  height: 12px;
  flex: 0 0 12px;
  border-radius: 3px;
  border: 1px solid rgba(43,54,116,0.18);
}
/* Chip pengalih metrik — tombol sungguhan (bukan span dekoratif). */
.ov-map-chip {
  font-family: 'Plus Jakarta Sans', sans-serif;
  font-size: 0.6875rem;
  font-weight: 600;
  color: var(--n-text-secondary);
  background: var(--n-surface-1);
  border: 1px solid var(--n-border-subtle);
  border-radius: 999px;
  padding: 4px 11px;
  cursor: pointer;
  transition: background .15s ease, color .15s ease, border-color .15s ease;
}
.ov-map-chip:hover { border-color: var(--n-primary); color: var(--n-text-primary); }
.ov-map-chip:focus-visible {
  outline: 2px solid var(--n-primary);
  outline-offset: 2px;
}
.ov-map-chip.is-on {
  background: var(--n-primary);
  border-color: var(--n-primary);
  color: #fff;
}
/* Panel ranking WPP — baris hover menyorot poligon di peta. */
.ov-map-rank { margin-top: 12px; }
.ov-map-rank-hd {
  font-size: 0.6875rem;
  font-weight: 600;
  color: var(--n-text-secondary);
  margin-bottom: 6px;
}
.ov-map-rank-list {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 8px;
}
.ov-map-rank-row {
  display: grid;
  grid-template-columns: auto 1fr;
  grid-template-areas: 'no nm' 'bar bar' 'val val';
  gap: 2px 6px;
  align-items: center;
  padding: 8px 10px;
  border: 1px solid var(--n-border-subtle);
  border-radius: var(--n-r-sm);
  background: var(--n-surface-1);
  cursor: pointer;
  transition: border-color .15s ease, background .15s ease;
}
.ov-map-rank-row:hover,
.ov-map-rank-row:focus-visible {
  border-color: var(--n-primary);
  background: var(--n-surface-2, #F7F8FC);
  outline: none;
}
.ov-map-rank-no {
  grid-area: no;
  font-family: 'Plus Jakarta Sans', sans-serif;
  font-size: 0.6875rem;
  font-weight: 700;
  color: var(--n-primary);
  width: 15px;
  height: 15px;
  border-radius: 50%;
  background: rgba(43,54,116,0.1);
  display: inline-flex;
  align-items: center;
  justify-content: center;
}
.ov-map-rank-nm {
  grid-area: nm;
  font-size: 0.75rem;
  font-weight: 600;
  color: var(--n-text-primary);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.ov-map-rank-bar {
  grid-area: bar;
  display: block;
  height: 4px;
  border-radius: 2px;
  background: rgba(43,54,116,0.1);
  overflow: hidden;
  margin-top: 3px;
}
.ov-map-rank-bar i {
  display: block;
  height: 100%;
  border-radius: 2px;
  background: var(--n-primary);
}
.ov-map-rank-val {
  grid-area: val;
  font-family: 'Plus Jakarta Sans', sans-serif;
  font-size: 0.8125rem;
  font-weight: 700;
  color: var(--n-text-primary);
  margin-top: 3px;
}
.ov-map-rank-empty,
.ov-map-rank-note {
  font-size: 0.6875rem;
  color: var(--n-text-muted);
  line-height: 1.5;
}
.ov-map-rank-note { margin-top: 8px; }

/* ── Peta Sebaran Aset BMN (Sub-Fase 18B.5) ─────────────────── */
#bmn-upt-map {
  position: relative;
  height: 320px;
  width: 100%;
  background: var(--n-surface-2, #EFF1F6);
}
.bmn-upt-marker-wrap {
  background: transparent !important;
  border: none !important;
}
.bmn-upt-marker {
  display: inline-flex;
  align-items: center;
  background: #FFFFFF;
  border: 1.5px solid var(--n-primary);
  border-radius: 9999px;
  padding: 2px 8px 2px 2px;
  box-shadow: 0 2px 6px rgba(43, 54, 116, 0.22);
  cursor: pointer;
  white-space: nowrap;
  font-family: inherit;
  transition: transform 0.15s ease, box-shadow 0.15s ease;
}
.bmn-upt-marker:hover {
  transform: scale(1.08);
  box-shadow: 0 4px 12px rgba(43, 54, 116, 0.35);
  z-index: 1000 !important;
}
.bmn-upt-marker-count {
  display: flex;
  align-items: center;
  justify-content: center;
  min-width: 20px;
  height: 20px;
  border-radius: 50%;
  background: var(--n-primary);
  color: #FFFFFF;
  font-size: 0.7rem;
  font-weight: 700;
  padding: 0 4px;
  margin-right: 6px;
}
.bmn-upt-marker.has-rusak-berat {
  border-color: var(--n-crit);
}
.bmn-upt-marker.has-rusak-berat .bmn-upt-marker-count {
  background: var(--n-crit);
}
.bmn-upt-marker-name {
  font-size: 0.72rem;
  font-weight: 600;
  color: var(--n-text-primary);
}
.bmn-popover {
  font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
  color: var(--n-text-primary);
  min-width: 210px;
  max-width: 260px;
  padding: 2px;
}
.bmn-popover-title {
  font-weight: 700;
  font-size: 0.875rem;
  color: var(--n-primary);
  margin-bottom: 2px;
}
.bmn-popover-sub {
  font-size: 0.75rem;
  color: var(--n-text-secondary);
  margin-bottom: 8px;
}

/* ── Stepper Alur Administrasi BMN (Sub-Fase 18B.6) ─────────── */
.n-stepper {
  display: flex;
  align-items: center;
  justify-content: space-between;
  width: 100%;
  margin-bottom: 24px;
  position: relative;
}
.n-stepper::before {
  content: '';
  position: absolute;
  top: 14px;
  left: 32px;
  right: 32px;
  height: 2px;
  background: var(--n-border);
  z-index: 1;
}
.n-step-item {
  position: relative;
  z-index: 2;
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
  flex: 1;
}
.n-step-dot {
  width: 28px;
  height: 28px;
  border-radius: 50%;
  background: #FFFFFF;
  border: 2px solid var(--n-border-strong);
  color: var(--n-text-muted);
  font-size: 0.75rem;
  font-weight: 700;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.2s ease;
  margin-bottom: 6px;
}
.n-step-label {
  font-size: 0.72rem;
  font-weight: 600;
  color: var(--n-text-muted);
  line-height: 1.25;
}
.n-step-item.active .n-step-dot {
  border-color: var(--n-primary);
  background: var(--n-primary);
  color: #FFFFFF;
  box-shadow: 0 0 0 3px var(--n-primary-tint);
}
.n-step-item.active .n-step-label {
  color: var(--n-primary);
  font-weight: 700;
}
.n-step-item.completed .n-step-dot {
  border-color: var(--n-ok);
  background: var(--n-ok);
  color: #FFFFFF;
}
.n-step-item.completed .n-step-label {
  color: var(--n-text-primary);
}
.n-step-item.rejected .n-step-dot {
  border-color: var(--n-crit);
  background: var(--n-crit);
  color: #FFFFFF;
}
.n-step-item.rejected .n-step-label {
  color: var(--n-crit);
}

/* ============================================================
   IKHTISAR — grid kartu divisi dinamis (Fase 14)
   6 kolom; tiap kartu memilih lebar (.s2/.s3/.s4/.s6) sehingga baris
   penuh (4+2, 2+2+2, 2+4, 3+3) dan kartu lebar bisa memakan 2 sel.
   Berbeda dari `.div-grid` dasar (align-items:start — tetap dipakai
   Profil Kapal `#pk-kpi`), grid Ikhtisar MEMANJANGKAN kartu satu baris
   sampai sama tinggi; ruang sisa diisi area visual (.vz, flex:1) yang
   memusatkan isinya, jadi tidak ada lubang kosong.
   ============================================================ */
#ov-div-grid {
  grid-template-columns: repeat(6, minmax(0, 1fr));
  grid-auto-flow: row dense;
  align-items: stretch;
}
#ov-div-grid > .s2 { grid-column: span 2; }
#ov-div-grid > .s3 { grid-column: span 3; }
#ov-div-grid > .s4 { grid-column: span 4; }
#ov-div-grid > .s6 { grid-column: span 6; }

.div-card-body {
  flex: 1 1 auto;
  display: flex;
  flex-direction: column;
  min-height: 0;
}
.div-card-body > .div-card-metrics { flex: 0 0 auto; }
.div-card.wide .div-card-body {
  display: grid;
  grid-template-columns: minmax(0, 5fr) minmax(0, 6fr);
  gap: 24px;
  align-items: stretch;
}
.div-card.wide .div-card-body > .div-card-metrics { justify-content: space-between; }
.div-card.wide .div-card-metrics .div-metric-row { flex: 1 1 0; display: flex; flex-direction: column; justify-content: center; }

/* Area visual kartu */
.vz {
  flex: 1 1 auto;
  display: flex;
  flex-direction: column;
  min-height: 150px;
  margin-top: 12px;
  padding-top: 12px;
  border-top: 1px solid var(--n-border-subtle);
}
.div-card.wide .vz {
  margin-top: 0;
  padding-top: 0;
  border-top: none;
  padding-left: 24px;
  border-left: 1px solid var(--n-border-subtle);
}
.vz > .div-card-foot-cap { margin-bottom: 10px; }
.vz-body {
  flex: 1 1 auto;
  display: flex;
  flex-direction: column;
  justify-content: center;
  min-height: 0;
}
.vz-empty {
  text-align: center;
  color: var(--n-text-muted);
  font-size: 0.78rem;
  padding: 16px 0;
}
.vz-legend {
  display: flex;
  flex-wrap: wrap;
  gap: 4px 14px;
  margin-top: 10px;
  font-size: 0.7rem;
  font-weight: 500;
  color: var(--n-text-secondary);
}
.vz-legend span { display: inline-flex; align-items: center; gap: 6px; }
.vz-legend i { width: 9px; height: 9px; border-radius: 3px; display: inline-block; flex-shrink: 0; }
.vz-legend b { color: var(--n-text-primary); font-weight: 700; font-variant-numeric: tabular-nums; }

/* Kolom vertikal */
.vz-cols { flex: 1 1 auto; display: flex; flex-direction: column; min-height: 130px; }
.vz-bars { flex: 1 1 auto; display: flex; align-items: stretch; gap: 8px; min-height: 100px; }
.vz-col { flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; }
.vz-col-bars { flex: 1 1 auto; display: flex; align-items: stretch; justify-content: center; gap: 3px; }
.vz-bar-wrap { position: relative; flex: 1 1 0; max-width: 34px; }
.vz-bar {
  position: absolute;
  left: 0; right: 0; bottom: 0;
  border-radius: 4px 4px 0 0;
}
.vz-bar-val {
  position: absolute;
  left: 50%;
  transform: translateX(-50%);
  font-size: 0.66rem;
  font-weight: 700;
  color: var(--n-text-primary);
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
}
.vz-col-lbl {
  margin-top: 6px;
  padding-top: 4px;
  border-top: 1px solid rgba(0,0,0,0.12);
  text-align: center;
  font-size: 0.75rem;
  font-weight: 500;
  color: var(--n-text-secondary);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

/* Donut + legenda */
.vz-donut { display: flex; align-items: center; justify-content: center; flex-wrap: wrap; gap: 14px 18px; }
.vz-donut-legend { display: flex; flex-direction: column; gap: 2px; min-width: 150px; }
.vz-donut-legend .legend-row { padding: 4px 6px; gap: 8px; grid-template-columns: 10px minmax(60px, 1fr) auto auto; }

/* Batang horizontal */
.vz-hbars { flex: 1 1 auto; display: flex; flex-direction: column; justify-content: center; }
.vz-hbars .ov-bars { flex: 1 1 auto; justify-content: space-evenly; gap: 12px; }
.vz-hbars .bar-line { grid-template-columns: minmax(92px, 1.7fr) 1.3fr auto; }
.vz-hbars .bar-line-track { height: 12px; }

/* Garis */
.vz-line { display: flex; flex-direction: column; flex: 1 1 auto; }
.vz-line-plot { position: relative; flex: 1 1 auto; min-height: 100px; }
.vz-line-plot svg { position: absolute; inset: 0; width: 100%; height: 100%; }
.vz-line-x { display: grid; margin-top: 4px; font-size: 0.72rem; font-weight: 500; color: var(--n-text-secondary); text-align: center; }

/* Waffle */
.vz-waffle { display: grid; grid-template-columns: repeat(10, minmax(0, 1fr)); gap: 3px; }
.vz-waffle i { display: block; height: 16px; border-radius: 3px; }

/* Heat strip */
.vz-heat { display: grid; gap: 4px; }
.vz-heat-cell {
  height: 48px;
  border-radius: 8px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 0.8rem;
  font-weight: 700;
  font-variant-numeric: tabular-nums;
}
.vz-heat-cell.zero { background: var(--n-surface-2); border: 1px solid var(--n-border-subtle); box-sizing: border-box; }
.vz-heat-lbl { margin-top: 5px; text-align: center; font-size: 0.72rem; font-weight: 500; color: var(--n-text-secondary); }

/* Chip status */
.vz-chips { display: flex; flex-wrap: wrap; gap: 8px; }
.vz-chip {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  padding: 5px 11px;
  border-radius: var(--n-r-pill);
  background: var(--n-surface-2);
  border: 1px solid var(--n-border-subtle);
  font-size: 0.72rem;
  font-weight: 600;
  color: var(--n-text-muted);
}
.vz-chip i { width: 8px; height: 8px; border-radius: 50%; border: 1.5px solid rgba(43,54,116,0.35); box-sizing: border-box; }
.vz-chip.on { color: var(--n-text-primary); background: var(--n-primary-light); }
.vz-chip.on i { background: var(--n-primary); border-color: var(--n-primary); }

/* Grid chart asimetris (12 kolom) — 7/5 dan 5/7, bukan dua kotak sama besar */
.chart-grid-asym {
  display: grid;
  grid-template-columns: repeat(12, minmax(0, 1fr));
  gap: 16px;
  align-items: stretch;
}
.chart-grid-asym > .cs-5 { grid-column: span 5; }
.chart-grid-asym > .cs-7 { grid-column: span 7; }

/* Peta & ranking — breakpoint.
   WAJIB diletakkan SESUDAH aturan dasar #ov-map / .ov-map-rank-list di atas.
   Specificity-nya sama (ID / class), jadi aturan dasar yang ditulis belakangan
   menang — media query yang diletakkan sebelum aturan dasar akan mati diam-diam
   (sudah pernah terjadi: tinggi peta tetap 420px di 768px). Berlaku juga untuk
   #ov-div-grid dan .chart-grid-asym di atas. */
@media (max-width: 1100px) {
  .div-card.wide .div-card-body { grid-template-columns: 1fr; gap: 0; }
  .div-card.wide .vz { margin-top: 12px; padding: 12px 0 0; border-left: none; border-top: 1px solid var(--n-border-subtle); }
}
@media (max-width: 900px) {
  #ov-map { height: 340px; }
  .ov-map-rank-list { grid-template-columns: repeat(3, 1fr); }
  #ov-div-grid { grid-template-columns: repeat(2, 1fr); }
  #ov-div-grid > .s3, #ov-div-grid > .s4, #ov-div-grid > .s6 { grid-column: span 2; }
  #ov-div-grid > .s2 { grid-column: span 1; }
  /* 5 kartu s2 → ganjil di 2 kolom: Pemantauan (anak ke-6, urutan dijaga test
     'layout kartu divisi') mengisi lebar penuh supaya tidak ada lubang. */
  #ov-div-grid > .s2:nth-child(6) { grid-column: span 2; }
  .chart-grid-asym > .cs-5, .chart-grid-asym > .cs-7 { grid-column: span 12; }
}
@media (max-width: 600px) {
  #ov-map { height: 280px; }
  .ov-map-rank-list { grid-template-columns: repeat(2, 1fr); }
  #ov-div-grid { grid-template-columns: 1fr; }
  #ov-div-grid > .s2, #ov-div-grid > .s3, #ov-div-grid > .s4, #ov-div-grid > .s6,
  #ov-div-grid > .s2:nth-child(6) { grid-column: span 1; }
}

/* ============================================================
   TABULAR NUMBERS & REDUCED MOTION (DESIGN.md §2.2, §5c.5)
   ============================================================ */
.kpi-value,
.kpi-sub,
.div-metric-val,
.n-table td,
.n-table th,
.n-badge,
.status-badge,
.filter-date,
.filter-sel,
.n-derive-val,
.stat-val,
.timestamp-label,
#sync-indicator,
.coord-val,
.table-num {
  font-variant-numeric: tabular-nums;
  -webkit-font-feature-settings: "tnum";
  font-feature-settings: "tnum";
}

/* =========================================================
   FASE 18: INTERLOCK VALIDASI LAIK LAUT & PETA TAKTIS 34 KAPAL
   ========================================================= */

/* ── 1. Interlock Warning Banner ── */
.interlock-warn-banner {
  margin-top: 8px;
  margin-bottom: 8px;
  background: #FFF1F2;
  border: 1px solid #FECDD3;
  border-left: 4px solid var(--n-status-critical, #EF4444);
  border-radius: var(--n-r-sm, 6px);
  padding: 10px 14px;
}
.interlock-banner-inner {
  display: flex;
  align-items: flex-start;
  gap: 10px;
}
.interlock-banner-icon {
  font-size: 1.15rem;
  color: var(--n-status-critical, #EF4444);
  line-height: 1.2;
}
.interlock-banner-text {
  font-size: 0.8125rem;
  line-height: 1.45;
  color: #881337;
}

/* ── 2. Peta Taktis 34 Kapal: Filter Chips & Markers ── */
.ov-fleet-filter-bar {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 6px;
  padding: 8px 12px;
  background: var(--n-surface-1);
  border-bottom: 1px solid var(--n-border-subtle);
}
.ov-fleet-chip {
  font-family: 'Plus Jakarta Sans', sans-serif;
  font-size: 0.6875rem;
  font-weight: 600;
  color: var(--n-text-secondary);
  background: var(--n-surface-2, #EFF1F6);
  border: 1px solid var(--n-border-subtle);
  border-radius: 999px;
  padding: 4px 10px;
  cursor: pointer;
  transition: background .15s ease, color .15s ease, border-color .15s ease;
}
.ov-fleet-chip:hover {
  border-color: var(--n-primary);
  color: var(--n-text-primary);
}
.ov-fleet-chip.is-on {
  background: var(--n-primary, #2B3674);
  border-color: var(--n-primary, #2B3674);
  color: #fff;
}

/* Tactical Ship Marker on Leaflet */
.ship-marker-wrap {
  background: transparent !important;
  border: none !important;
}
.ship-marker {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 3px 8px;
  background: rgba(255, 255, 255, 0.94);
  border: 1px solid var(--n-border-subtle);
  border-radius: 999px;
  box-shadow: 0 2px 6px rgba(0, 0, 0, 0.12);
  cursor: pointer;
  position: relative;
  transition: transform .15s ease, box-shadow .15s ease;
  white-space: nowrap;
}
.ship-marker:hover {
  transform: translateY(-2px) scale(1.05);
  box-shadow: 0 4px 10px rgba(0, 0, 0, 0.18);
  z-index: 1000;
}
.ship-marker-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  flex: 0 0 8px;
}
.ship-marker.status-op .ship-marker-dot { background: #10B981; }
.ship-marker.status-siap .ship-marker-dot { background: #F59E0B; }
.ship-marker.status-galangan .ship-marker-dot { background: #EF4444; }

.ship-marker-lbl {
  font-family: 'Plus Jakarta Sans', sans-serif;
  font-size: 0.6875rem;
  font-weight: 700;
  color: var(--n-text-primary, #1B2559);
}

/* Radar Beacon Pulse for Operasional ships */
.ship-beacon-pulse {
  position: absolute;
  left: 6px;
  top: 50%;
  width: 14px;
  height: 14px;
  margin-top: -7px;
  margin-left: -3px;
  border-radius: 50%;
  background: rgba(16, 185, 129, 0.4);
  animation: shipPulse 2s infinite ease-out;
  pointer-events: none;
}
@keyframes shipPulse {
  0% { transform: scale(0.6); opacity: 0.9; }
  100% { transform: scale(2.4); opacity: 0; }
}

/* Ship Popover in Leaflet */
.n-leaflet-pop .leaflet-popup-content-wrapper {
  padding: 0;
  border-radius: var(--n-r-md, 8px);
  overflow: hidden;
  box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.15), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
  border: 1px solid var(--n-border-subtle);
}
.n-leaflet-pop .leaflet-popup-content {
  margin: 0;
  line-height: 1.4;
}
.ship-popover {
  font-family: 'Plus Jakarta Sans', sans-serif;
  color: var(--n-text-primary);
}
.ship-pop-hd {
  padding: 12px 14px 10px;
  background: var(--n-surface-1, #fff);
  border-bottom: 1px solid var(--n-border-subtle);
}
.ship-pop-badge {
  display: inline-block;
  font-size: 0.625rem;
  font-weight: 700;
  padding: 2px 7px;
  border-radius: 999px;
  margin-bottom: 6px;
}
.ship-pop-name {
  font-size: 0.9375rem;
  font-weight: 700;
  color: var(--n-primary, #2B3674);
}
.ship-pop-sub {
  font-size: 0.6875rem;
  color: var(--n-text-secondary);
}
.ship-pop-body {
  padding: 10px 14px;
  font-size: 0.75rem;
  background: #FAFAFC;
}
.ship-pop-row {
  display: flex;
  justify-content: space-between;
  margin-bottom: 4px;
}
.ship-pop-lbl {
  color: var(--n-text-secondary);
}
.ship-pop-benchmark {
  margin-top: 8px;
  padding-top: 8px;
  border-top: 1px dashed var(--n-border-subtle);
}
.ship-bm-row {
  display: flex;
  justify-content: space-between;
  font-size: 0.6875rem;
  color: var(--n-text-secondary);
  margin-bottom: 3px;
}
.ship-bm-bar {
  height: 5px;
  background: #E2E8F0;
  border-radius: 999px;
  overflow: hidden;
  margin-bottom: 6px;
}
.ship-bm-fill {
  height: 100%;
  background: #2563EB;
  border-radius: 999px;
}
.ship-bm-fill.ship-bm-center {
  background: #0D9488;
}
.ship-pop-ft {
  padding: 8px 14px;
  background: var(--n-surface-1, #fff);
  border-top: 1px solid var(--n-border-subtle);
  text-align: right;
}

/* ── 3. Kapal Terbaik: Toolbar, Podium & Table ── */
.kt-page-toolbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 12px;
  margin-bottom: 20px;
  padding: 12px 18px;
  background: var(--n-surface-1, #fff);
  border: 1px solid var(--n-border-subtle);
  border-radius: var(--n-r-md, 8px);
}
.kt-toolbar-left {
  display: flex;
  align-items: center;
  gap: 10px;
}
.kt-back-btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-weight: 600;
  font-size: 0.8125rem;
  color: var(--n-primary, #2B3674);
  background: rgba(43, 54, 116, 0.06);
  border: 1px solid rgba(43, 54, 116, 0.12);

}

  align-items: center;

  gap: 8px;
}

  color: var(--n-text-secondary);
}
.kt-select {

  font-size: 0.8125rem;

  border: 1px solid var(--n-border-subtle);

  color: var(--n-text-primary);
}
.kt-btn-refresh {

  align-items: center;
  justify-content: center;
  padding: 6px 8px;
}

/* ── Visual Podium (Top 3) ── */

}
.kt-podium-grid {

@media (max-width: 840px) {

.kt-podium-slot {

.kt-podium-slot.is-gold .kt-pedestal-card {

}
.kt-podium-slot.is-bronze .kt-pedestal-card {

}

.kt-card-badge-wrap {

}
.kt-medal-badge {
  font-size: 0.6875rem;
  font-weight: 700;
  padding: 4px 12px;
