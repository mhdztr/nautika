<script>
/* ============================================================
   Script_Main.html
   State management, hash routing, sidebar, filter periode.
   Dipanggil via include di Index.html.
   ============================================================ */

// ── KONSTANTA ─────────────────────────────────────────────
var TOKEN_KEY  = 'nautika_token';
var MONTHS     = ['Januari','Februari','Maret','April','Mei','Juni',
                  'Juli','Agustus','September','Oktober','November','Desember'];
var ROLE_LABEL = {
  SUPERADMIN: 'Super Administrator',
  DIREKTUR:   'Direktur',
  KADIV:      'Kepala Divisi / Ketua Tim Kerja',
  STAF:       'Staf'
};

// ── STATE ─────────────────────────────────────────────────
var APP = {
  token:          null,
  user:           null,
  currentView:    'overview',
  pendingQueueId: null,
  filter: {
    mode:     'monthly',   // 'monthly' | 'range'
    month:    new Date().getMonth() + 1,
    year:     new Date().getFullYear(),
    dateFrom: '',
    dateTo:   ''
  }
};

// ── BUSY GLOBAL — indikator loading di samping filter periode ──
// Setiap google.script.run otomatis memunculkan spinner selama call in-flight,
// apa pun sheet/server function-nya. Strategi (stabil, tanpa bergantung this):
//  - withSuccessHandler  : +1 saat setup call; -1 di dalam handler sukses.
//  - withFailureHandler  : tidak menaikkan, hanya -1 di dalam handler gagal.
// Karena GS hanya memanggil SATU handler (sukses ATAU gagal, tidak keduanya),
// setiap rantai = tepat +1 dan tepat -1 → selalu balik ke 0.
var _BUSY = 0;
var _BUSY_LAST = 0;
var _BUSY_WATCHDOG = null;
function _busyPushActivity() { _BUSY_LAST = Date.now(); }
function _busyInc() { _BUSY++; _busyPushActivity(); _syncBusy(); }
function _busyDec() {
  if (_BUSY > 0) _BUSY--;
  _busyPushActivity();
  _syncBusy();
}
function _syncBusy() {
  var el = document.getElementById('filter-busy');
  if (el) el.style.display = (_BUSY > 0) ? 'flex' : 'none';
  if (_BUSY > 0 && !_BUSY_WATCHDOG) {
    // Jaring pengaman: force-reset jika counter nyangkut (mis. call tanpa
    // failure-handler lalu GAGAL, sehingga tak ada handler yang menurunkan).
    _BUSY_WATCHDOG = setInterval(function () {
      if (_BUSY > 0 && (Date.now() - _BUSY_LAST) > 20000) {
        _BUSY = 0;
        _syncBusy();
      }
    }, 1000);
  } else if (_BUSY === 0 && _BUSY_WATCHDOG) {
    clearInterval(_BUSY_WATCHDOG);
    _BUSY_WATCHDOG = null;
  }
}
(function () {
  try {
    var g = window.google && google.script && google.script.run;
    if (!g) return;
    var oWsh = g.withSuccessHandler;
    var oWfh = g.withFailureHandler;
    if (g.__nBusyPatched) return;
    g.__nBusyPatched = true;
    g.withSuccessHandler = function (h) {
      _busyInc();
      return oWsh.call(this, function (res) {
        try { return h ? h(res) : res; }
        finally { _busyDec(); }
      });
    };
    g.withFailureHandler = function (h) {
      return oWfh.call(this, function (err) {
        try { return h ? h(err) : err; }
        finally { _busyDec(); }
      });
    };
  } catch (e) {
    // patch gagal → spinner tidak tampil, call tetap berjalan normal (tidak wajib)
  }
})();

// ── NAVIGASI: section + items ─────────────────────────────
// divisiId: null = semua role; string = DIV-* untuk Kadiv/Staf
// minRoles: null = semua APPROVED; array = hanya role tsb
var NAV_SECTIONS = [
  {
    label: 'UTAMA',
    items: [
      { id: 'overview',    label: 'Ikhtisar',            divisiId: null,         minRoles: null }
    ]
  },
  {
    label: 'DIVISI',
    items: [
      { id: 'tata-usaha',    label: 'Tata Usaha',          divisiId: 'DIV-TU',     minRoles: null },
      { id: 'operasi',       label: 'Operasi',             divisiId: 'DIV-OPS',    minRoles: null },
      { id: 'intelijen',     label: 'Intelijen',           divisiId: 'DIV-INTEL',  minRoles: null },
      { id: 'pemantauan',    label: 'Pemantauan',          divisiId: 'DIV-PANTAU', minRoles: null },
      { id: 'perawatan',     label: 'Perawatan',           divisiId: 'DIV-RAWAT',  minRoles: null },
      { id: 'logistik',      label: 'Logistik',            divisiId: 'DIV-LOG',    minRoles: null },
      { id: 'pengawakan',    label: 'Pengawakan',          divisiId: 'DIV-AWAK',   minRoles: null },
      { id: 'kegiatan',      label: 'Kegiatan Direktorat', divisiId: null,         minRoles: null }
    ]
  },
  {
    label: 'SISTEM',
    items: [
      { id: 'master-data', label: 'Master Data',     divisiId: null, minRoles: ['SUPERADMIN','DIREKTUR'] },
      { id: 'riwayat',     label: 'Riwayat Laporan', divisiId: null, minRoles: null }
    ]
  }
];

// Apakah user bisa akses view ini?
function _canAccess(item, user) {
  if (!user) return false;
  if (user.role === 'SUPERADMIN' || user.role === 'DIREKTUR') return true;
  if (item.minRoles && item.minRoles.indexOf(user.role) === -1) return false;
  if (item.divisiId && user.divisiId !== item.divisiId) return false;
  return true;
}

// Ambil item nav dari id
function _navItem(id) {
  for (var s = 0; s < NAV_SECTIONS.length; s++) {
    var items = NAV_SECTIONS[s].items;
    for (var i = 0; i < items.length; i++) {
      if (items[i].id === id) return items[i];
    }
  }
  return null;
}

// Judul halaman dari view ID
function _viewTitle(id) {
  var item = _navItem(id);
  return item ? item.label : '—';
}

// ── INIT ──────────────────────────────────────────────────
document.addEventListener('DOMContentLoaded', function () {
  // Fallback safety: jika dalam 15 detik callback tidak pernah dipanggil
  // (GAS RPC error, sandbox restriction, dsb), paksa sembunyikan loading.
  var _loadingTimedOut = false;
  var _loadingTimer = setTimeout(function () {
    _loadingTimedOut = true;
    _hideLoading();
    _showAuthView('login');
  }, 15000);

  function _doneLoading() {
    if (_loadingTimedOut) return;
    clearTimeout(_loadingTimer);
    _hideLoading();
  }

  // Prefill divisi list (dipakai di form register) — fire-and-forget
  try {
    google.script.run
      .withSuccessHandler(function (res) {
        if (!res || !res.success || !res.data) return;
        var sel = document.getElementById('reg-divisi');
        if (!sel) return;
        res.data.forEach(function (d) {
          var opt = document.createElement('option');
          opt.value       = d.divisiId;
          opt.textContent = d.namaDashboard + ' \u2014 ' + d.namaResmi;
          sel.appendChild(opt);
        });
      })
      .withFailureHandler(function () { /* silent – tidak kritis */ })
      .auth_getDivisiList();
  } catch (e) { /* silent */ }

  // Cek sesi
  var savedToken = null;
  try { savedToken = sessionStorage.getItem(TOKEN_KEY); } catch (e) { /* sandbox restriction */ }

  if (savedToken) {
    try {
      google.script.run
        .withSuccessHandler(function (res) {
          _doneLoading();
          if (res && res.success && res.data) {
            APP.token = savedToken;
            APP.user  = res.data;
            if (res.data.status === 'APPROVED') {
              _initApp();
            } else {
              _renderPendingInfo(res.data);
              _showAuthView('pending');
            }
          } else {
            try { sessionStorage.removeItem(TOKEN_KEY); } catch (e) {}
            _showAuthView('login');
          }
        })
        .withFailureHandler(function () {
          _doneLoading();
          try { sessionStorage.removeItem(TOKEN_KEY); } catch (e) {}
          _showAuthView('login');
        })
        .auth_getSessionInfo(savedToken);
    } catch (e) {
      _doneLoading();
      _showAuthView('login');
    }
  } else {
    _doneLoading();
    _showAuthView('login');
  }
});

// ── AUTH HELPERS ──────────────────────────────────────────
function _hideLoading() {
  var el = document.getElementById('n-loading');
  if (el) { el.style.opacity = '0'; setTimeout(function(){ el.style.display='none'; }, 250); }
}

function _showAuthView(name) {
  document.getElementById('auth-wrapper').classList.remove('n-hidden');
  document.getElementById('app-wrapper').classList.add('n-hidden');
  ['login','register','pending'].forEach(function (v) {
    document.getElementById('v-' + v).classList.add('n-hidden');
  });
  document.getElementById('v-' + name).classList.remove('n-hidden');
}

function showAuthView(name) { _showAuthView(name); } // public alias for inline onclick

function _renderPendingInfo(user) {
  var el = document.getElementById('pending-info');
  if (!el) return;
  el.innerHTML =
    '<div class="info-row"><span class="lbl">Nama</span><span class="val">' + _esc(user.nama) + '</span></div>' +
    '<div class="info-row"><span class="lbl">Email</span><span class="val">' + _esc(user.email) + '</span></div>' +
    '<div class="info-row"><span class="lbl">Jabatan Dilamar</span><span class="val">' + _esc(ROLE_LABEL[user.role] || user.role) + '</span></div>' +
    '<div class="info-row"><span class="lbl">Status</span>' +
      '<span class="val"><span class="badge badge-warn">Menunggu Persetujuan</span></span>' +
    '</div>';
}

// ── AUTH HANDLERS ─────────────────────────────────────────
function handleLogin(e) {
  e.preventDefault();
  var btn = document.getElementById('btn-login');
  _setLoading(btn, true);
  _msg('login-msg', null);
  google.script.run
    .withSuccessHandler(function (res) {
      _setLoading(btn, false);
      if (!res.success) { _msg('login-msg', 'error', res.error); return; }
      APP.token = res.data.token;
      APP.user  = res.data.user;
      sessionStorage.setItem(TOKEN_KEY, APP.token);
      if (res.data.user.status === 'APPROVED') {
        _initApp();
      } else {
        _renderPendingInfo(res.data.user);
        _showAuthView('pending');
      }
    })
    .withFailureHandler(function () {
      _setLoading(btn, false);
      _msg('login-msg', 'error', 'Terjadi kesalahan koneksi. Coba lagi.');
    })
    .auth_login({
      email:    document.getElementById('login-email').value,
      password: document.getElementById('login-password').value
    });
}

function handleRegister(e) {
  e.preventDefault();
  var btn = document.getElementById('btn-register');
  _setLoading(btn, true);
  _msg('register-msg', null);
  google.script.run
    .withSuccessHandler(function (res) {
      _setLoading(btn, false);
      if (!res.success) { _msg('register-msg', 'error', res.error); return; }
      _msg('register-msg', 'success', 'Pendaftaran berhasil. Akun menunggu persetujuan administrator.');
      document.getElementById('form-register').reset();
    })
    .withFailureHandler(function () {
      _setLoading(btn, false);
      _msg('register-msg', 'error', 'Terjadi kesalahan koneksi. Coba lagi.');
    })
    .auth_register({
      nama:        document.getElementById('reg-nama').value,
      email:       document.getElementById('reg-email').value,
      password:    document.getElementById('reg-password').value,
      divisiId:    document.getElementById('reg-divisi').value,
      roleDilamar: document.getElementById('reg-role').value
    });
}

function handleLogout() {
  if (APP.token) google.script.run.auth_logout(APP.token);
  APP.token = null;
  APP.user  = null;
  sessionStorage.removeItem(TOKEN_KEY);
  _showAuthView('login');
}

// ── APP INIT ──────────────────────────────────────────────
function _initApp() {
  document.getElementById('auth-wrapper').classList.add('n-hidden');
  document.getElementById('app-wrapper').classList.remove('n-hidden');
  _renderSidebar();
  var hash = (window.location.hash || '').replace('#', '') || 'overview';
  _routeTo(hash);
  window.addEventListener('hashchange', function () {
    _routeTo((window.location.hash || '').replace('#', ''));
  });
}

// ── SIDEBAR ───────────────────────────────────────────────
function _renderSidebar() {
  var user = APP.user;
  // Footer
  document.getElementById('sb-user-name').textContent = user.nama;
  document.getElementById('sb-user-role').textContent = ROLE_LABEL[user.role] || user.role;

  // Nav
  var nav = document.getElementById('sb-nav');
  var html = '';
  NAV_SECTIONS.forEach(function (section) {
    var visibleItems = section.items.filter(function (it) { return _canAccess(it, user); });
    if (visibleItems.length === 0) return;
    html += '<div class="sb-section-label">' + section.label + '</div>';
    visibleItems.forEach(function (it) {
      html += '<div class="nav-item" id="nav-' + it.id + '" onclick="_routeTo(\'' + it.id + '\')">' +
        _esc(it.label) + '</div>';
    });
  });
  nav.innerHTML = html;
}

function _updateActiveNav(viewId) {
  document.querySelectorAll('.nav-item').forEach(function (el) {
    el.classList.remove('active');
  });
  var active = document.getElementById('nav-' + viewId);
  if (active) active.classList.add('active');
}

// ── ROUTING ───────────────────────────────────────────────
function _routeTo(viewId) {
  var item = _navItem(viewId);
  // Jika view tidak ada atau tidak bisa diakses → ke overview
  if (!item || !_canAccess(item, APP.user)) {
    viewId = 'overview';
  }
  APP.currentView = viewId;
  if (window.location.hash !== '#' + viewId) {
    window.location.hash = viewId;
  }
  _updateActiveNav(viewId);
  _renderPageHeader(viewId);
  _renderViewContent(viewId);
}

// ── PAGE HEADER ───────────────────────────────────────────
function _renderPageHeader(viewId) {
  // filter tidak tampil di master-data (tidak relevan)
  var noFilter = (viewId === 'master-data' || viewId === 'riwayat');
  var filterHtml = noFilter ? '' : _buildFilterHtml();

  document.getElementById('page-header').innerHTML =
    '<div class="page-header-inner">' +
      '<h1 class="page-title">' + _esc(_viewTitle(viewId)) + '</h1>' +
      '<div class="filter-periode">' +
        (filterHtml ? '<div class="filter-box">' + filterHtml + '</div>' : '') +
        '<span id="filter-busy" class="filter-busy" title="Memuat data&hellip;"></span>' +
      '</div>' +
    '</div>';
  _syncBusy();
}

// ── FILTER PERIODE ────────────────────────────────────────
function _buildFilterHtml() {
  var f    = APP.filter;
  var now  = new Date();
  var year = now.getFullYear();

  // Year options: 3 tahun ke belakang s.d. tahun ini
  var yearOpts = '';
  for (var y = year; y >= year - 3; y--) {
    yearOpts += '<option value="' + y + '"' + (f.year === y ? ' selected' : '') + '>' + y + '</option>';
  }

  // Month options
  var monthOpts = MONTHS.map(function (m, i) {
    var val = i + 1;
    return '<option value="' + val + '"' + (f.month === val ? ' selected' : '') + '>' + m + '</option>';
  }).join('');

  var mode =
    '<div class="filter-mode">' +
      '<button type="button" class="filter-mode-btn' + (f.mode==='monthly'?' active':'') + '" onclick="_setFilterMode(\'monthly\')">Bulanan</button>' +
      '<button type="button" class="filter-mode-btn' + (f.mode==='range'  ?' active':'') + '" onclick="_setFilterMode(\'range\')">Rentang</button>' +
    '</div>';

  var monthlyInputs =
    '<div class="filter-inputs" id="filter-monthly" ' + (f.mode !== 'monthly' ? 'style="display:none"' : '') + '>' +
      '<select class="filter-sel" onchange="_setFilterMonth(this.value)">' + monthOpts + '</select>' +
      '<select class="filter-sel" onchange="_setFilterYear(this.value)">' + yearOpts + '</select>' +
    '</div>';

  var rangeInputs =
    '<div class="filter-inputs" id="filter-range" ' + (f.mode !== 'range' ? 'style="display:none"' : '') + '>' +
      '<input type="date" class="filter-date" value="' + (f.dateFrom||'') + '" onchange="_setFilterFrom(this.value)">' +
      '<span class="filter-sep">s.d.</span>' +
      '<input type="date" class="filter-date" value="' + (f.dateTo||'') + '"   onchange="_setFilterTo(this.value)">' +
    '</div>';

  return mode + '<div class="filter-mode-sep"></div>' + monthlyInputs + rangeInputs;
}

function _setFilterMode(mode) {
  APP.filter.mode = mode;
  var ml = document.getElementById('filter-monthly');
  var rl = document.getElementById('filter-range');
  if (ml) ml.style.display = (mode === 'monthly') ? '' : 'none';
  if (rl) rl.style.display = (mode === 'range')   ? '' : 'none';
  document.querySelectorAll('.filter-mode-btn').forEach(function(btn, i){
    btn.classList.toggle('active', (i===0 && mode==='monthly') || (i===1 && mode==='range'));
  });
}
function _setFilterMonth(v) { APP.filter.month    = parseInt(v, 10); }
function _setFilterYear(v)  { APP.filter.year     = parseInt(v, 10); }
function _setFilterFrom(v)  { APP.filter.dateFrom = v; }
function _setFilterTo(v)    { APP.filter.dateTo   = v; }

// ── VIEW CONTENT ──────────────────────────────────────────
function _renderViewContent(viewId) {
  _chartTeardownAll(); // destroy instance chart lama sebelum DOM direbuild (Fase 8)
  var el = document.getElementById('page-content');
  if (viewId === 'overview')    { _renderOverview(el);    return; }
  if (viewId === 'tata-usaha')  { _renderTataUsaha(el);   return; }
  if (viewId === 'operasi')     { _renderOperasi(el);     return; }
  if (viewId === 'intelijen')   { _renderIntelijen(el);   return; }
  if (viewId === 'pemantauan')  { _renderPemantauan(el);  return; }
  if (viewId === 'perawatan')   { _renderPerawatan(el);   return; }
  if (viewId === 'logistik')    { _renderLogistik(el);    return; }
  if (viewId === 'pengawakan')  { _renderPengawakan(el);  return; }
  if (viewId === 'master-data') { _renderMasterData(el); return; }
  if (viewId === 'riwayat')     { _renderRiwayatStub(el); return; }
  // Modul lain — stub hingga fase masing-masing
  el.innerHTML = _moduleStub(_viewTitle(viewId));
}

// ── OVERVIEW ──────────────────────────────────────────────
function _renderOverview(el) {
  var user = APP.user;
  var canApprove = ['SUPERADMIN','DIREKTUR','KADIV'].indexOf(user.role) !== -1;
  var html = '';

  // ── 1. Approval panel (admin only) ────────────────────
  if (canApprove) {
    html +=
      '<div class="content-section">' +
        '<div class="content-section-hd">Permintaan Registrasi Masuk</div>' +
        '<div class="n-card">' +
          '<div id="approval-msg" class="n-msg"></div>' +
          '<div id="approval-table-wrap"><div style="color:var(--n-text-muted);font-size:.875rem;">Memuat\u2026</div></div>' +
        '</div>' +
      '</div>';
  }

  // ── 2. Headline KPI — 4 metrik lintas divisi ──────────
  // Data diisi DashboardService.js (Fase 8). Semua nilai placeholder "—".
  html +=
    '<div class="content-section">' +
      '<div class="content-section-hd">KPI Utama</div>' +
      '<div class="ov-kpi-row">' +
        _kpiHeadline('Realisasi Anggaran (SP2D)', '\u2014', '%', 'YTD kumulatif') +
        _kpiHeadline('Hari Operasi Kapal & Pesawat', '\u2014', 'hari', 'Realisasi periode ini') +
        _kpiHeadline('Armada Siap Operasi', '\u2014', 'kapal', 'Dari total armada aktif') +
        _kpiHeadline('Divisi Melapor Minggu Ini', '\u2014', '/ 7', 'Berdasarkan laporan masuk') +
      '</div>' +
    '</div>';

  // ── 3. Ringkasan per Divisi — 9 cards ────────────────
  html +=
    '<div class="content-section">' +
      '<div class="content-section-hd">Ringkasan per Divisi</div>' +
      '<div class="div-grid">' +
        _divCard('Tata Usaha', [
          { lbl: 'Realisasi SP2D (YTD)',    val: '\u2014', unit: '%',   prog: true },
          { lbl: 'Realisasi Akrual (YTD)',  val: '\u2014', unit: '%',   prog: true },
          { lbl: 'Sisa Pagu SP2D',          val: '\u2014', unit: 'Rp',  prog: false }
        ]) +
        _divCard('Operasi Kapal Pengawas dan Pesawat', [
          { lbl: 'Hari Operasi Kapal (realisasi)', val: '\u2014', unit: 'hari', prog: false },
          { lbl: 'Hari Operasi Pesawat (/ 180)',   val: '\u2014', unit: 'hari', prog: false },
          { lbl: 'Kapal Ditangkap (YTD)',          val: '\u2014', unit: 'unit', prog: false },
          { lbl: 'Kapal Dipantau (KII/KIA)',       val: '\u2014', unit: 'unit', prog: false },
          { lbl: 'Cakupan Wilayah',                val: '\u2014', unit: 'NM\u00B2', prog: false }
        ]) +
        _divCard('Intelijen', [
          { lbl: 'Nota Dinas Data Intelijen', val: '\u2014', unit: 'dokumen', prog: false },
          { lbl: 'Pelanggaran Transmitter',   val: '\u2014', unit: 'kapal',   prog: false },
          { lbl: 'Kawasan Konservasi Aktif',  val: '\u2014', unit: 'lokasi',  prog: false }
        ]) +
        _divCard('Pemantauan', [
          { lbl: 'SKAT Diterbitkan (YTD)',    val: '\u2014', unit: 'dokumen', prog: false },
          { lbl: 'Username Diterbitkan (YTD)',val: '\u2014', unit: 'akun',    prog: false },
          { lbl: 'Kapal Kondisi Marabahaya',  val: '\u2014', unit: 'unit',    prog: false }
        ]) +
        _divCard('Perawatan', [
          { lbl: 'Kapal Siap Operasi',   val: '\u2014', unit: 'unit', prog: false },
          { lbl: 'Kapal Tidak Siap',     val: '\u2014', unit: 'unit', prog: false },
          { lbl: 'Docking Aktif',        val: '\u2014', unit: 'unit', prog: false }
        ]) +
        _divCard('Logistik', [
          { lbl: 'Realisasi BBM (YTD)',  val: '\u2014', unit: '%',   prog: true  },
          { lbl: 'Tunggakan BBM',        val: '\u2014', unit: 'Rp',  prog: false },
          { lbl: 'Stok Amunisi (total)', val: '\u2014', unit: 'butir', prog: false }
        ]) +
        _divCard('Pengawakan', [
          { lbl: 'AKN Keseluruhan',         val: '\u2014', unit: 'orang', prog: false },
          { lbl: 'AKN POA',                 val: '\u2014', unit: 'orang', prog: false },
          { lbl: 'Kegiatan Personel (YTD)', val: '\u2014', unit: 'kegiatan', prog: false }
        ]) +
        _divCard('Kegiatan Direktorat', [
          { lbl: 'Kegiatan YTD',            val: '\u2014', unit: 'kegiatan', prog: false },
          { lbl: 'Kegiatan Periode Ini',    val: '\u2014', unit: 'kegiatan', prog: false },
          { lbl: 'Terakhir Dicatat',        val: '\u2014', unit: '',         prog: false }
        ]) +
      '</div>' +
    '</div>';

  el.innerHTML = html;
  if (canApprove) _loadApprovals();
}

// Headline KPI card (top row, bigger number)
function _kpiHeadline(label, value, unit, sub) {
  return '<div class="kpi-card">' +
    '<div class="kpi-label">' + label + '</div>' +
    '<div class="kpi-value">' + value +
      (unit ? '<span style="font-size:0.95rem;font-weight:500;margin-left:3px;color:var(--n-text-secondary);">' + unit + '</span>' : '') +
    '</div>' +
    '<div class="kpi-sub">' + sub + '</div>' +
  '</div>';
}

// Division summary card
// metrics: [{lbl, val, unit, prog}] — prog=true adds a placeholder progress bar
function _divCard(title, metrics) {
  var rows = metrics.map(function(m) {
    var valHtml = '<span class="div-metric-val ' + (m.val === '\u2014' ? 'muted' : '') + '">' +
      m.val + (m.unit ? ' <span style="font-size:.75rem;font-weight:400;color:var(--n-text-muted);">' + m.unit + '</span>' : '') +
    '</span>';
    var progHtml = (m.prog && m.val !== '\u2014') ? (
      '<div class="prog-wrap">' +
        '<div class="prog-bar-bg"><div class="prog-bar-fill" style="width:' + parseFloat(m.val) + '%;"></div></div>' +
        '<div class="prog-labels"><span>0%</span><span>100%</span></div>' +
      '</div>'
    ) : '';
    return '<div class="div-metric"><span class="div-metric-lbl">' + m.lbl + '</span>' + valHtml + '</div>' + progHtml;
  }).join('');

  return '<div class="div-card">' +
    '<div class="div-card-title">' + title + '</div>' +
    rows +
  '</div>';
}

function _loadApprovals() {
  var wrap = document.getElementById('approval-table-wrap');
  if (wrap) wrap.innerHTML = _loadingInline('Memuat permintaan registrasi\u2026');

  google.script.run
    .withSuccessHandler(function (res) {
      if (!res.success) { _appMsg('error', res.error); return; }
      _renderApprovalTable(res.data);
    })
    .withFailureHandler(function () { _appMsg('error', 'Gagal memuat data.'); })
    .auth_getPendingApprovals(APP.token);
}

function _appMsg(type, text) {
  var el = document.getElementById('approval-msg');
  if (!el) return;
  el.className = 'n-msg ' + type + ' show';
  el.textContent = text;
}

function _renderApprovalTable(items) {
  var wrap = document.getElementById('approval-table-wrap');
  if (!wrap) return;
  if (!items || items.length === 0) {
    wrap.innerHTML = '<div style="color:var(--n-text-muted);font-size:.875rem;padding:8px 0;">Tidak ada permintaan yang menunggu persetujuan.</div>';
    return;
  }
  var rows = items.map(function (it) {
    var d = it.registeredAt ? new Date(it.registeredAt).toLocaleDateString('id-ID') : '-';
    return '<tr>' +
      '<td>' + _esc(it.nama) +
        '<br><span style="font-size:.8rem;color:var(--n-text-muted);">' + _esc(it.email) + '</span></td>' +
      '<td>' + _esc(it.namaDivisi) + '</td>' +
      '<td>' + (it.roleDilamar === 'KADIV' ? 'Kepala Divisi / Ketua Tim Kerja' : 'Staf') + '</td>' +
      '<td>' + d + '</td>' +
      '<td>' +
        '<button class="btn-sm btn-sm-ok"   onclick="doApprove(\'' + _esc(it.queueId) + '\')">Setujui</button>' +
        '<button class="btn-sm btn-sm-crit" onclick="openRejectModal(\'' + _esc(it.queueId) + '\')">Tolak</button>' +
      '</td>' +
    '</tr>';
  }).join('');

  wrap.innerHTML =
    '<table class="n-table">' +
      '<thead><tr><th>Nama</th><th>Unit Kerja</th><th>Jabatan</th><th>Tgl Daftar</th><th>Tindakan</th></tr></thead>' +
      '<tbody>' + rows + '</tbody>' +
    '</table>';
}

function doApprove(queueId) {
  if (!confirm('Setujui registrasi ini?')) return;
  google.script.run
    .withSuccessHandler(function (res) {
      if (!res.success) { _appMsg('error', res.error); return; }
      _appMsg('success', 'Registrasi berhasil disetujui.');
      _loadApprovals();
    })
    .withFailureHandler(function () { _appMsg('error', 'Terjadi kesalahan. Coba lagi.'); })
    .auth_decideApproval({ token: APP.token, queueId: queueId, approve: true, alasan: '' });
}

function openRejectModal(queueId) {
  APP.pendingQueueId = queueId;
  document.getElementById('reject-reason').value = '';
  document.getElementById('modal-reject').classList.remove('n-hidden');
}
function closeRejectModal() {
  APP.pendingQueueId = null;
  document.getElementById('modal-reject').classList.add('n-hidden');
}

document.addEventListener('DOMContentLoaded', function () {
  var btnConfirm = document.getElementById('btn-confirm-reject');
  if (!btnConfirm) return;
  btnConfirm.addEventListener('click', function () {
    var alasan = document.getElementById('reject-reason').value.trim();
    if (!alasan) { alert('Alasan penolakan wajib diisi.'); return; }
    google.script.run
      .withSuccessHandler(function (res) {
        closeRejectModal();
        if (!res.success) { _appMsg('error', res.error); return; }
        _appMsg('success', 'Registrasi berhasil ditolak.');
        _loadApprovals();
      })
      .withFailureHandler(function () {
        closeRejectModal();
        _appMsg('error', 'Terjadi kesalahan. Coba lagi.');
      })
      .auth_decideApproval({ token: APP.token, queueId: APP.pendingQueueId, approve: false, alasan: alasan });
  });
});

function _mdKapalMsg(type, text) { _mdMsg('md-kapal-msg', type, text); }

function _mdRenderKapal(items) {
  var wrap = document.getElementById('md-kapal-wrap');
  var sum  = document.getElementById('md-kapal-summary');

  var list = items || [];
  var aktif = list.filter(function (k) { return k.statusAktif; });

    sum.innerHTML =
      '<div class="md-chip"><span class="lbl">Total armada</span><span class="val">' + list.length + '</span></div>' +
      '<div class="md-chip"><span class="lbl">Aktif</span><span class="val">' + aktif.length + '</span></div>' +
      '<div class="md-chip"><span class="lbl">Tidak aktif</span><span class="val">' + (list.length - aktif.length) + '</span></div>';

    wrap.innerHTML = '<div style="padding:20px 24px;color:var(--n-text-muted);font-size:.875rem;">Belum ada data kapal. Gunakan "Tambah Kapal" untuk mulai.</div>';
    return;
  }

  var rows = list.map(function (k) {
    var badge = k.statusAktif

    return '<tr>' +
      '<td>' + _esc(k.kapalId) + '</td>' +
      '<td>' + _esc(k.nama) + '</td>' +
      '<td>' + _esc(k.kelas || '\u2014') + '</td>' +
      '<td>' + _esc(k.homebaseUpt || '\u2014') + '</td>' +
      '<td>' + badge + '</td>' +
      '<td>' +
        '<button class="btn-sm" style="background:var(--n-primary-light);color:var(--n-primary);border:1px solid #C7CCEC;margin-right:5px;" onclick="_mdOpenKapalModal(\'' + _esc(k.kapalId) + '\')">Edit</button>' +
        (k.statusAktif
          ? '<button class="btn-sm btn-sm-crit" onclick="_mdToggleKapal(\'' + _esc(k.kapalId) + '\')">Nonaktifkan</button>'
          : '<button class="btn-sm btn-sm-ok" onclick="_mdToggleKapal(\'' + _esc(k.kapalId) + '\')">Aktifkan</button>') +
      '</td>' +
    '</tr>';
  }).join('');

  wrap.innerHTML =
    '<table class="n-table"><thead><tr>' +
      '<th>ID</th><th>Nama</th><th>Kelas</th><th>Homebase / UPT</th><th>Status</th><th>Aksi</th>' +
    '</tr></thead><tbody>' + rows + '</tbody></table>';
}

function _mdOpenKapalModal(kapalId) {
  _MD.editingKapalId = kapalId || null;
  _mdKapalModalMsg(null);
  var row = kapalId ? (_MD.data.kapal || []).filter(function (k) { return k.kapalId === kapalId; })[0] : null;

  var idIn   = document.getElementById('md-kapal-id');
  var nmIn   = document.getElementById('md-kapal-nama');
  var klIn   = document.getElementById('md-kapal-kelas');
  var hbIn   = document.getElementById('md-kapal-homebase');
  var stSel  = document.getElementById('md-kapal-status');

  if (row) {
    idIn.value  = row.kapalId;
    nmIn.value  = row.nama;
    klIn.value  = row.kelas || '';
    hbIn.value  = row.homebaseUpt || '';
    stSel.value = row.statusAktif ? 'true' : 'false';
    idIn.disabled = true;
    document.getElementById('md-kapal-modal-title').textContent = 'Edit Kapal';
  } else {
    idIn.value = ''; nmIn.value = ''; klIn.value = ''; hbIn.value = '';
    stSel.value = 'true';
    idIn.disabled = false;
    document.getElementById('md-kapal-modal-title').textContent = 'Tambah Kapal';
  }
  document.getElementById('modal-md-kapal').classList.remove('n-hidden');
  if (!row && nmIn) nmIn.focus();
}

function _mdKapalModalMsg(type, text) { _mdMsg('md-kapal-modal-msg', type, text); }

function _mdSaveKapal() {
  var editing = !!_MD.editingKapalId;
  var btn = document.getElementById('md-btn-kapal-save');
  var params = {
    kapalId:      ((document.getElementById('md-kapal-id')    || {}).value || '').trim(),
    nama:         ((document.getElementById('md-kapal-nama')  || {}).value || '').trim(),
    kelas:        ((document.getElementById('md-kapal-kelas') || {}).value || '').trim(),
    homebaseUpt:  ((document.getElementById('md-kapal-homebase') || {}).value || '').trim(),
    statusAktif:  ((document.getElementById('md-kapal-status')  || {}).value || 'true') === 'true'
  };

  if (!params.kapalId || !params.nama) {
    _mdKapalModalMsg('error', 'KapalID dan Nama wajib diisi.');
    return;
  }
  _mdKapalModalMsg(null);
  _setLoading(btn, true);

  var runner = google.script.run
    .withSuccessHandler(function (res) {
      _setLoading(btn, false);
      if (!res.success) { _mdKapalModalMsg('error', res.error); return; }
      closeModal('modal-md-kapal');
      _mdKapalMsg('success', res.message);
      _MD.data.kapal = null;
      _mdLoadKapal();
    })
    .withFailureHandler(function () {
      _setLoading(btn, false);
      _mdKapalModalMsg('error', 'Terjadi kesalahan koneksi. Coba lagi.');
    });

  if (editing) runner.master_updateKapal(APP.token, params);
  else         runner.master_createKapal(APP.token, params);
}

function _mdToggleKapal(kapalId) {
  var row = (_MD.data.kapal || []).filter(function (k) { return k.kapalId === kapalId; })[0];
  if (!row) return;
  var target = !row.statusAktif;
  var label  = target ? 'mengaktifkan' : 'menonaktifkan';
  if (!confirm('Yakin ' + label + ' kapal ' + kapalId + '?')) return;

  google.script.run
    .withSuccessHandler(function (res) {
      if (!res.success) { _mdKapalMsg('error', res.error); return; }
      _mdKapalMsg('success', res.message);
      _MD.data.kapal = null;
      _mdLoadKapal();
    })
    .withFailureHandler(function () { _mdKapalMsg('error', 'Gagal memperbarui status kapal.'); })
    .master_updateKapal(APP.token, { kapalId: kapalId, statusAktif: target });
}

function _mdRenderKawasan(items) {
  var wrap = document.getElementById('md-kawasan-wrap');

  if (list.length === 0) {

      '<td>' + _esc(k.nama) + '</td>' +

      '</td>' +

  }).join('');

  wrap.innerHTML =
    '<table class="n-table"><thead><tr>' +
      '<th>ID</th><th>Nama</th><th>Provinsi</th><th>Koordinat</th><th>Aksi</th>' +
    '</tr></thead><tbody>' + rows + '</tbody></table>';

function _fmtLatLng(lat, lng) {
  if (lat === null && lng === null) return '\u2014';
  if (lat === null) return 'Lon ' + lng;
  if (lng === null) return 'Lat ' + lat;
  return lat + ', ' + lng;
}

function _mdOpenKawasanModal(kawasanId) {
  _MD.editingKawasanId = kawasanId || null;
  _mdKawasanModalMsg(null);
  var row = kawasanId ? (_MD.data.kawasan || []).filter(function (k) { return k.kawasanId === kawasanId; })[0] : null;

  var idIn = document.getElementById('md-kawasan-id');
  var nmIn = document.getElementById('md-kawasan-nama');
  var pvIn = document.getElementById('md-kawasan-provinsi');
  var ltIn = document.getElementById('md-kawasan-lat');
  var lgIn = document.getElementById('md-kawasan-lng');

  if (row) {
    idIn.value = row.kawasanId;
    nmIn.value = row.nama;
    pvIn.value = row.provinsi || '';
    ltIn.value = (row.latitude  === null ? '' : row.latitude);
    lgIn.value = (row.longitude === null ? '' : row.longitude);
    idIn.disabled = true;
    document.getElementById('md-kawasan-modal-title').textContent = 'Edit Kawasan';
  } else {
    idIn.value = ''; nmIn.value = ''; pvIn.value = ''; ltIn.value = ''; lgIn.value = '';
    idIn.disabled = false;
    document.getElementById('md-kawasan-modal-title').textContent = 'Tambah Kawasan';
  }

function _mdKawasanModalMsg(type, text) { _mdMsg('md-kawasan-modal-msg', type, text); }

function _mdSaveKawasan() {
  var editing = !!_MD.editingKawasanId;
  var btn = document.getElementById('md-btn-kawasan-save');
  var latVal = ((document.getElementById('md-kawasan-lat') || {}).value || '').trim();
  var lngVal = ((document.getElementById('md-kawasan-lng') || {}).value || '').trim();

  var params = {
    kawasanId: ((document.getElementById('md-kawasan-id')      || {}).value || '').trim(),
    nama:      ((document.getElementById('md-kawasan-nama')    || {}).value || '').trim(),
    provinsi:  ((document.getElementById('md-kawasan-provinsi')|| {}).value || '').trim(),
    latitude:  latVal === '' ? null : parseFloat(latVal),
    longitude: lngVal === '' ? null : parseFloat(lngVal)
  };

  if (!params.kawasanId || !params.nama || !params.provinsi) {
    _mdKawasanModalMsg('error', 'KawasanID, Nama, dan Provinsi wajib diisi.');
    return;
  }
  if ((params.latitude  !== null && isNaN(params.latitude)) ||
      (params.longitude !== null && isNaN(params.longitude))) {
    _mdKawasanModalMsg('error', 'Latitude/Longitude harus berupa angka.');
    return;
  }
  _mdKawasanModalMsg(null);
  _setLoading(btn, true);

  var runner = google.script.run
    .withSuccessHandler(function (res) {
      _setLoading(btn, false);
      if (!res.success) { _mdKawasanModalMsg('error', res.error); return; }
      closeModal('modal-md-kawasan');
      _mdKawasanMsg('success', res.message);
      _MD.data.kawasan = null;
      _mdLoadKawasan();
    })
    .withFailureHandler(function () {
      _setLoading(btn, false);
      _mdKawasanModalMsg('error', 'Terjadi kesalahan koneksi. Coba lagi.');
    });

  if (editing) runner.master_updateKawasan(APP.token, params);
  else         runner.master_createKawasan(APP.token, params);
}

function _mdDeleteKawasan(kawasanId) {

      if (!res.success) { _mdKawasanMsg('error', res.error); return; }
      _mdKawasanMsg('success', res.message);
      _MD.data.kawasan = null;

    .withFailureHandler(function () { _mdMsg('md-opsi-msg', 'error', 'Gagal memuat opsi daftar.'); })
    .master_getOpsiJenis(APP.token);
}

function _mdRenderOpsi(d) {
  var wrap = document.getElementById('md-opsi-wrap');
  if (!wrap) return;
  var canWrite = _mdOpsiCanWrite();

  var html = '';
  var kodeList = d.kodeList || [];
  for (var g = 0; g < kodeList.length; g++) {
    var kode = kodeList[g];
    var judul = (d.labels && d.labels[kode]) || kode;
    var items = (d.groups && d.groups[kode]) || [];

    html += '<div class="content-section" style="margin-top:0;">' +
      '<div class="content-section-hd">' + _esc(judul) + '</div>' +
      '<div style="font-size:.8125rem;color:var(--n-text-muted);margin-bottom:12px;">' +
        'Tersimpan di basis data sebagai nasab; output dropdown memakai label ini.</div>' +
      '<div class="attach-list" style="margin-bottom:14px;">';

    for (var i = 0; i < items.length; i++) {
      var it = items[i];
      html += '<div class="attach-chip" style="display:inline-flex;">' +
        '<b>' + (it.aktif ? '\u2713' : '\u2715') + '</b>' +
        '<span>' + _esc(it.label) + '</span>' +
        (canWrite
          ? '<button type="button" title="' + (it.aktif ? 'Nonaktifkan' : 'Aktifkan') + '" onclick="_mdOpsiToggle(\'' + kode + '\',\'' + _escJs(it.label) + '\',' + (it.aktif ? 'false' : 'true') + ')">' +
              (it.aktif ? '\u25af' : '\u25b6') + '</button>'
          : '') +
        '</div>';
    }
    html += '</div>';

    if (canWrite) {
      html += '<div style="display:flex;gap:10px;align-items:center;">' +
        '<input type="text" id="md-opsi-add-' + kode + '" maxlength="40" class="md-opsi-input" ' +
          'placeholder="Nama ' + _esc(judul).toLowerCase() + ' baru..." style="flex:1;padding:9px 12px;border:1px solid var(--n-border-subtle);border-radius:var(--n-r-sm);background:var(--n-surface-2);color:var(--n-text-primary);" onkeydown="if(event.key===\'Enter\'){_mdOpsiAdd(\'' + kode + '\')}">' +
        '<button type="button" class="btn-primary" onclick="_mdOpsiAdd(\'' + kode + '\')">+ Tambah</button>' +
        '</div>';
    }
    html += '</div>';
  }

  wrap.innerHTML = html;
}

function _escJs(str) {
  return String(str || '').replace(/\\/g,'\\\\').replace(/'/g,'\\\'');
}

function _mdOpsiAdd(kode) {
  if (!_mdOpsiCanWrite()) { _mdMsg('md-opsi-msg', 'error', 'Tidak punya hak untuk mengubah opsi.'); return; }
  var inp = document.getElementById('md-opsi-add-' + kode);
  var label = (inp && inp.value || '').trim();
  if (!label) { _mdMsg('md-opsi-msg', 'error', 'Nama opsi wajib diisi.'); return; }

  google.script.run
    .withSuccessHandler(function (res) {

      _mdMsg('md-opsi-msg', 'success', res.message);
      _MD.data.opsi = null;
      _mdLoadOpsi();
    })
    .withFailureHandler(function () { _mdMsg('md-opsi-msg', 'error', 'Terjadi kesalahan koneksi.'); })
    .master_addOpsiJenis(APP.token, { kode: kode, label: label });
}

function _mdOpsiToggle(kode, label, aktif) {
  if (!_mdOpsiCanWrite()) { _mdMsg('md-opsi-msg', 'error', 'Tidak punya hak untuk mengubah opsi.'); return; }
  _mdMsg('md-opsi-msg', null);

  google.script.run
    .withSuccessHandler(function (res) {
      if (!res.success) { _mdMsg('md-opsi-msg', 'error', res.error); return; }
      _mdMsg('md-opsi-msg', 'success', res.message);
      _MD.data.opsi = null;
      _mdLoadOpsi();

function _esc(str) {

    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#039;');

function _msg(id, type, text) {
  var el = document.getElementById(id);

  if (!type) { el.className = 'n-msg'; el.textContent = ''; return; }
  el.className  = 'n-msg ' + type + ' show';

function _setLoading(btn, loading) {

  if (loading) {
    btn._orig = btn.innerHTML;
    btn.innerHTML = '<span class="n-spin-sm"></span>Memproses\u2026';

var _HD = { stack: [] };

function _hdReset() {
  _HD.stack = [];

function _hdPush(refSheet, rowId, title, fields) {

  _HD.stack.push({ refSheet: refSheet, rowId: rowId, title: title, fields: fields || [] });

function _hdOpen(i) {

function _hdLoadEvidence(refSheet, rowId) {
  var list = document.getElementById('hd-evidence');
  if (!list) return;
  list.innerHTML = _loadingInline('Memuat lampiran\u2026');
  if (!refSheet || !rowId) {
    list.innerHTML = '<div style="color:var(--n-text-muted);font-size:.85rem;">Tidak ada lampiran.</div>';
    return;
  }
  google.script.run
    .withSuccessHandler(function (res) {
      if (!res || !res.success) {
        list.innerHTML = '<div class="n-msg error show">' + _esc((res && res.error) || 'Gagal memuat lampiran.') + '</div>';
        return;
      }
      if (!res.data.length) {
        list.innerHTML = '<div style="color:var(--n-text-muted);font-size:.85rem;">Belum ada lampiran untuk laporan ini.</div>';
        return;
      }
      list.innerHTML = res.data.map(function (e) {
        var tgl = e.uploadedAt ? new Date(e.uploadedAt).toLocaleString('id-ID') : '';
        return '<div style="display:flex;justify-content:space-between;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--n-border-subtle);">' +
          '<a href="' + _esc(e.viewUrl) + '" target="_blank" rel="noopener" style="color:var(--n-primary);font-size:.85rem;">' + _esc(e.fileName) + '</a>' +
          '<span style="font-size:.75rem;color:var(--n-text-muted);white-space:nowrap;">' + _esc(e.sourceMode) + ' \u00b7 ' + tgl + '</span>' +
        '</div>';
      }).join('');
    })
    .withFailureHandler(function () {
      list.innerHTML = '<div class="n-msg error show">Gagal memuat lampiran. Coba lagi.</div>';
    })
    .evidence_list(APP.token, refSheet, rowId);

// ── LAMPIRAN INLINE (Fase 10 revisi) ─────────────────────
// Blok lampiran dirender di dalam tiap form modul divisi. Satu CTA (tombol
// submit) menangani: simpan baris -> upload file/link -> refresh. Centang
// "Pengunggahan ini tidak perlu lampiran" mematikan kewajiban lampiran.
// Dipakai server: evidence_upload / evidence_uploadFromLink (1 baris) dan
// evidence_uploadBatch / evidence_uploadFromLinkBatch (N baris sekaligus).

var _ATTACH = {};

function _attachState(key) {
  return _ATTACH[key] || null;
}

function _attachInit(key, cfg) {
  var el = document.getElementById(String(key) + '-attach');
  if (!el) return null;
  var k = String(key);
  _ATTACH[k] = {
    refSheet: (cfg && cfg.refSheet) || '',
    noAtt: false,
    files: [],
    link: '',
    rowIds: [],
    tasks: [],
    busy: false,
    after: null
  };
  el.innerHTML =
    '<div class="content-section">' +
      '<div class="content-section-hd">Lampiran</div>' +
      '<div class="attach-row">' +
        '<label class="attach-check">' +
          '<input type="checkbox" id="' + k + '-noatt" onchange="_attachToggle(\'' + k + '\')">' +
          '<span>Pengunggahan ini tidak perlu lampiran</span>' +
        '</label>' +
      '</div>' +
      '<div id="' + k + '-fields" class="attach-fields">' +
        '<div class="form-grp">' +
          '<label for="' + k + '-files">Unggah file (bisa lebih dari satu; maks 15MB file biasa, 50MB video)</label>' +
          '<input type="file" id="' + k + '-files" multiple onchange="_attachPickFiles(\'' + k + '\')">' +
        '</div>' +
        '<div class="form-grp">' +
          '<label for="' + k + '-link">Atau tempel link Google Drive</label>' +
          '<input type="text" id="' + k + '-link" placeholder="https://drive.google.com/file/d/..." oninput="_attachLinkInput(\'' + k + '\')">' +
        '</div>' +
        '<div id="' + k + '-list"></div>' +
      '</div>' +
      '<div id="' + k + '-attach-msg" class="n-msg"></div>' +
    '</div>';
  return _ATTACH[k];
}

function _attachToggle(key) {
  var s = _attachState(key);
  if (!s) return;
  var cb = document.getElementById(key + '-noatt');
  s.noAtt = !!(cb && cb.checked);
  var f = document.getElementById(key + '-fields');
  if (f) f.style.display = s.noAtt ? 'none' : 'grid';
  _attachMsg(key, null);
}

function _attachPickFiles(key) {
  var s = _attachState(key);
  if (!s) return;
  var input = document.getElementById(key + '-files');
  if (input && input.files) {
    for (var i = 0; i < input.files.length; i++) s.files.push(input.files[i]);
    input.value = '';
  }
  _attachRenderList(key);
  _attachMsg(key, null);
}

function _attachRemoveFile(key, idx) {
  var s = _attachState(key);
  if (!s) return;
  s.files.splice(idx, 1);
  _attachRenderList(key);
  _attachMsg(key, null);
}

function _attachLinkInput(key) {
  var s = _attachState(key);
  if (!s) return;
  var inp = document.getElementById(key + '-link');
  s.link = (inp && inp.value || '').trim();
  _attachRenderList(key);
  _attachMsg(key, null);
}

function _attachClearLink(key) {
  var s = _attachState(key);
  if (!s) return;
  s.link = '';
  var inp = document.getElementById(key + '-link');
  if (inp) inp.value = '';
  _attachRenderList(key);
  _attachMsg(key, null);
}

function _attachRenderList(key) {
  var s = _attachState(key);
  var el = document.getElementById(key + '-list');
  if (!s || !el) return;
  var html = (s.files.length || s.link) ? '<div class="attach-list">' : '';
  for (var i = 0; i < s.files.length; i++) {
    html += '<div class="attach-chip"><b>File</b><span>' + _esc(s.files[i].name) + '</span>' +
      '<button type="button" title="Hapus" onclick="_attachRemoveFile(\'' + key + '\',' + i + ')">\u00d7</button></div>';
  }
  if (s.link) {
    html += '<div class="attach-chip"><b>Link</b><span>' + _esc(s.link) + '</span>' +
      '<button type="button" title="Hapus" onclick="_attachClearLink(\'' + key + '\')">\u00d7</button></div>';
  }
  html += (s.files.length || s.link) ? '</div>' : '';
  el.innerHTML = html;
}

function _attachMsg(key, type, text) {
  var el = document.getElementById(key + '-attach-msg');
  if (!el) return;
  if (!type) { el.className = 'n-msg'; el.innerHTML = ''; return; }
  if (type === 'warn') {
    el.className = 'n-msg warn show';
    el.innerHTML = '<div class="attach-retry">' + _esc(text || '') + ' ' +
      '<button type="button" onclick="_attachRetry(\'' + key + '\')">Ulangi upload lampiran</button></div>';
    return;
  }
  el.className = 'n-msg ' + type + ' show';
  el.innerHTML = _esc(text || '');
}

/**
 * Validasi blok lampiran: default wajib ada file/link, kecuali dicentang
 * "tidak perlu lampiran". Mengembalikan '' jika valid, pesan error jika tidak.
 */
function _attachValidate(key) {
  var s = _attachState(key);
  if (!s) return '';
  if (s.noAtt) return '';
  if (s.files.length === 0 && !s.link) {
    return 'Lampiran wajib pada pengunggahan ini, atau centang \u201cPengunggahan ini tidak perlu lampiran\u201d.';
  }
  if (s.link && !/drive\.google\.com/.test(s.link) && !/^[a-zA-Z0-9_\-]{20,}$/.test(s.link)) {
    return 'Link harus berupa URL Google Drive yang valid.';
  }
  return '';
}

function _attachReset(key) {
  var s = _attachState(key);
  if (!s) return;
  s.noAtt = false;
  s.files = [];
  s.link = '';
  s.rowIds = [];
  s.tasks = [];
  s.busy = false;
  s.after = null;
  var cb = document.getElementById(key + '-noatt');
  if (cb) cb.checked = false;
  var f = document.getElementById(key + '-fields');
  if (f) f.style.display = 'grid';
  var li = document.getElementById(key + '-link');
  if (li) li.value = '';
  _attachRenderList(key);
  _attachMsg(key, null);
}

function _attachReadBase64(file, cb) {
  var reader = new FileReader();
  reader.onload = function (e) {
    var data = String(e.target.result || '').replace(/^data:[^;]+;base64,/, '');
    cb(data || null);
  };
  reader.onerror = function () { cb(null); };
  reader.readAsDataURL(file);
}

/**
 * Upload semua lampiran (file/link) ke baris hasil submit, lalu reset blok.
 * @param key   - kunci state blok (prefix form)
 * @param rowIds- RowID baris tujuan (1..N dari hasil submit)
 * @param after - callback(ok:boolean) setelah seluruh tentatif selesai
 */
function _attachUploadAll(key, rowIds, after) {
  var s = _attachState(key);
  if (!s) return;
  if (s.noAtt || !s.refSheet || !rowIds || !rowIds.length) { if (after) after(true); return; }
  if (s.files.length === 0 && !s.link) { if (after) after(true); return; }

  s.rowIds = rowIds;
  s.after = after;
  s.busy = true;
  s.tasks = [];
  for (var i = 0; i < s.files.length; i++) {
    s.tasks.push({ kind: 'file', file: s.files[i], base64: null });
  }
  if (s.link) s.tasks.push({ kind: 'link', url: s.link });

  if (s.tasks.length === 0) { if (after) after(true); return; }

  _attachReadTasks(key, 0, function () { _attachRunNext(key, 0); });
}

function _attachReadTasks(key, idx, done) {
  var s = _attachState(key);
  if (idx >= s.tasks.length) { done(); return; }
  var t = s.tasks[idx];
  if (t.kind !== 'file' || t.base64) { _attachReadTasks(key, idx + 1, done); return; }
  _attachReadBase64(t.file, function (b64) {
    t.base64 = b64;
    _attachReadTasks(key, idx + 1, done);
  });
}

function _attachRunNext(key, idx) {
  var s = _attachState(key);
  if (!s) return;
  if (idx >= s.tasks.length) {
    s.busy = false;
    var doneCb = s.after;
    _attachMsg(key, 'success', 'Semua lampiran berhasil diunggah.');
    _attachReset(key);
    if (doneCb) doneCb(true);
    return;
  }

  var t = s.tasks[idx];
  var single = s.rowIds.length === 1;
  var runner = google.script.run.withSuccessHandler(function (res) {
    if (res && res.success) {
      s.tasks.splice(idx, 1);
      _attachRunNext(key, idx);
    } else {
      _attachFail(key, (res && res.error) || 'Upload gagal.');
    }
  }).withFailureHandler(function () {
    _attachFail(key, 'Terjadi kesalahan koneksi saat mengunggah lampiran.');
  });

  if (t.kind === 'file') {
    var params = {
      refSheet: s.refSheet,
      fileName: t.file.name,
      mimeType: t.file.type || 'application/octet-stream',
      dataBase64: t.base64
    };
    if (single) { params.refRowId = s.rowIds[0]; runner.evidence_upload(APP.token, params); }
    else        { params.refRowIds = s.rowIds;     runner.evidence_uploadBatch(APP.token, params); }
  } else {
    var p2 = { refSheet: s.refSheet, url: t.url };
    if (single) { p2.refRowId = s.rowIds[0]; runner.evidence_uploadFromLink(APP.token, p2); }
    else        { p2.refRowIds = s.rowIds;   runner.evidence_uploadFromLinkBatch(APP.token, p2); }
  }
}

function _attachFail(key, text) {
  var s = _attachState(key);
  if (!s) return;
  s.busy = false;
  var doneCb = s.after;
  s.after = null;
  _attachMsg(key, 'warn', text + ' Baris sudah tersimpan; lampiran yang belum ter-upload akan dicoba lagi.');
  if (doneCb) doneCb(false);
}

function _attachRetry(key) {
  var s = _attachState(key);
  if (!s || s.busy) return;
  if (!s.tasks.length) return;
  s.after = null;
  s.busy = true;
  _attachMsg(key, null);
  _attachReadTasks(key, 0, function () { _attachRunNext(key, 0); });
}

/** Bersihkan input file/link setelah semua berhasil (state file/link di-reset). */
function _attachResetFieldsOnly(key) {
  var s = _attachState(key);
  if (!s) return;
  s.files = [];
  s.link = '';
  var li = document.getElementById(key + '-link');
  if (li) li.value = '';
  _attachRenderList(key);
}

/**
 * Bawa lampiran baris lama ke baris baru hasil revisi (fire-and-forget).
 * Dipanggil setelah revisi sukses, agar lampiran tidak "hilang" dari baris aktif.
 */
function _attachCarry(refSheet, fromRowId, toRowId) {
  if (!refSheet || !fromRowId || !toRowId) return;
  google.script.run
    .withFailureHandler(function () { /* non-blokir — revisi tetap sukses */ })
    .evidence_carry(APP.token, { refSheet: refSheet, fromRowId: fromRowId, toRowId: toRowId });
}

var _TU = {

function _renderTataUsaha(el) {
  // Clone template dari DOM
  var tpl = document.getElementById('view-tpl-tata-usaha');
  if (!tpl) { el.innerHTML = _moduleStub('Tata Usaha'); return; }
  el.innerHTML = tpl.innerHTML;
  _attachInit('tu', { refSheet: 'TX_TataUsaha' });

  // Pre-fill periode saat ini
  var now = new Date();
  var week = Math.ceil(now.getDate() / 7);
  var m    = now.getMonth() + 1;
  var y    = now.getFullYear();
  var periodeNow = y + '-' + (m<10?'0'+m:m) + '-W' + (week<10?'0'+week:week);
  var pIn  = document.getElementById('tu-periode');
  if (pIn) pIn.value = periodeNow;
  var hint = document.getElementById('tu-periode-hint');
  if (hint) hint.textContent = 'Periode saat ini: ' + periodeNow;

  // Load data
  _tuLoadKPI();
}

function _tuLoadKPI() {
  var strip = document.getElementById('tu-kpi-strip');
  if (strip) strip.innerHTML = _kpiSkeleton(4);

  google.script.run
    .withSuccessHandler(function (res) {
      if (!res.success) { _tuKPIError(res.error); return; }
      _TU.kpi = res.data;
      _tuRenderKPI(res.data);
      _tuAutoToggleForm(res.data);
      _tuLoadHistory();
      _tuLoadCharts();
    })
    .withFailureHandler(function () { _tuKPIError('Gagal memuat KPI.'); })
    .tataUsaha_getKPI(APP.token, APP.filter);
}

function _tuKPIError(msg) {
  var el = document.getElementById('tu-kpi-strip');
  if (el) el.innerHTML = '<div class="n-msg error show">' + _esc(msg) + '</div>';
}

function _tuRenderKPI(d) {
  var el = document.getElementById('tu-kpi-strip');
  if (!el) return;

  var kpiData = [
    { lbl: 'Pagu Reguler',      val: _rupiah(d.paguReguler),    sub: 'Diperbarui dari laporan terakhir' },
    { lbl: 'Pagu ABT',          val: _rupiah(d.paguABT),        sub: 'Anggaran Biaya Tambahan' },
    { lbl: 'Realisasi SP2D',    val: d.pctSP2D + '%',           sub: _rupiah(d.realisasiSP2D) + ' dari ' + _rupiah(d.paguReguler) },
    { lbl: 'Realisasi Akrual',  val: d.pctAkrual + '%',         sub: _rupiah(d.realisasiAkrual) + ' dari ' + _rupiah(d.paguABT) },
    { lbl: 'Sisa SP2D',         val: _rupiah(d.sisaSP2D),       sub: d.sisaSP2D >= 0 ? 'Saldo aman' : 'Melebihi Pagu' },
    { lbl: 'Sisa Akrual',       val: _rupiah(d.sisaAkrual),     sub: d.sisaAkrual >= 0 ? 'Saldo aman' : 'Melebihi Pagu' }
  ];

  var progSP2D   = Math.min(Math.max(d.pctSP2D,   0), 100);
  var progAkrual = Math.min(Math.max(d.pctAkrual, 0), 100);
  var clsSP2D    = progSP2D   >= 90 ? 'warn' : '';
  var clsAkrual  = progAkrual >= 90 ? 'warn' : '';

  var html = '<div class="ov-kpi-row" style="grid-template-columns:repeat(3,1fr);">';
  kpiData.slice(0,2).forEach(function(k) {
    html += '<div class="kpi-card"><div class="kpi-label">' + k.lbl + '</div>' +
      '<div class="kpi-value" style="font-size:1.25rem;">' + k.val + '</div>' +
      '<div class="kpi-sub">' + k.sub + '</div></div>';
  });
  // SP2D dengan progress bar
  html += '<div class="kpi-card"><div class="kpi-label">Realisasi SP2D</div>' +
    '<div class="kpi-value" style="font-size:1.5rem;">' + d.pctSP2D + '<span style="font-size:.9rem;font-weight:500;color:var(--n-text-secondary);">%</span></div>' +
    '<div class="prog-wrap"><div class="prog-bar-bg"><div class="prog-bar-fill ' + clsSP2D + '" style="width:' + progSP2D + '%;"></div></div>' +
    '<div class="prog-labels"><span>0%</span><span>' + _rupiah(d.realisasiSP2D) + '</span><span>100%</span></div></div></div>';
  html += '</div>';

  html += '<div class="ov-kpi-row" style="grid-template-columns:repeat(3,1fr);margin-top:0;">';
  // Akrual dengan progress bar
  html += '<div class="kpi-card"><div class="kpi-label">Realisasi Akrual</div>' +
    '<div class="kpi-value" style="font-size:1.5rem;">' + d.pctAkrual + '<span style="font-size:.9rem;font-weight:500;color:var(--n-text-secondary);">%</span></div>' +
    '<div class="prog-wrap"><div class="prog-bar-bg"><div class="prog-bar-fill ' + clsAkrual + '" style="width:' + progAkrual + '%;"></div></div>' +
    '<div class="prog-labels"><span>0%</span><span>' + _rupiah(d.realisasiAkrual) + '</span><span>100%</span></div></div></div>';
  // Sisa SP2D
  html += '<div class="kpi-card"><div class="kpi-label">Sisa SP2D</div>' +
    '<div class="kpi-value" style="font-size:1.25rem;color:' + (d.sisaSP2D < 0 ? 'var(--n-crit)' : 'inherit') + ';">' + _rupiah(d.sisaSP2D) + '</div>' +
    '<div class="kpi-sub">' + kpiData[4].sub + '</div></div>';
  // Sisa Akrual
  html += '<div class="kpi-card"><div class="kpi-label">Sisa Akrual</div>' +
    '<div class="kpi-value" style="font-size:1.25rem;color:' + (d.sisaAkrual < 0 ? 'var(--n-crit)' : 'inherit') + ';">' + _rupiah(d.sisaAkrual) + '</div>' +
    '<div class="kpi-sub">' + kpiData[5].sub + '</div></div>';
  html += '</div>';

  el.innerHTML = html;
}

function _tuAutoToggleForm(kpi) {

function _tuRenderHistory(items) {
  var wrap = document.getElementById('tu-history-wrap');
  if (!wrap) return;
  var canAnulir = ['SUPERADMIN','DIREKTUR','KADIV'].indexOf(APP.user.role) !== -1;
  var canRevisi = ['SUPERADMIN','KADIV','STAF'].indexOf(APP.user.role) !== -1;
  _hdReset();

  if (!items || items.length === 0) {
    wrap.innerHTML = '<div style="padding:20px 24px;color:var(--n-text-muted);font-size:.875rem;">Belum ada laporan untuk periode ini.</div>';
    return;
  }

  var t = '<table class="n-table"><thead><tr>';
  t += '<th>Periode</th><th>Pagu Total</th><th>SP2D Minggu</th><th>Akrual Minggu</th><th>Tanggal</th><th>Status</th><th>Aksi</th>';
  t += '</tr></thead><tbody>';

  for (var i = 0; i < items.length; i++) {
    var r = items[i];

    var st = '<span class="status-badge" style="background:#f3f4f6;color:#374151;">DITIMPA</span>';
    if (r.status === 'ACTIVE') st = '<span class="status-badge" style="background:var(--n-primary-light);color:var(--n-primary);">AKTIF</span>';
    else if (r.status === 'VOID') st = '<span class="status-badge" style="background:#fee2e2;color:var(--n-status-critical);">DIANULIR</span>';

    var bRev = (r.status === 'ACTIVE' && canRevisi) ? '<button class="btn-mini" onclick="tuOpenRevisiModal(\'' + _esc(r.rowId) + '\')">Revisi</button>' : '';
    var bAn  = (r.status === 'ACTIVE' && canAnulir) ? '<button class="btn-mini" style="color:var(--n-status-critical);border-color:var(--n-status-critical);" onclick="tuOpenAnulirModal(\'' + _esc(r.rowId) + '\',\'' + _esc(r.periode) + '\')">Anulir</button>' : '';
    var bLk  = '<button class="btn-mini" onclick="_hdOpen(' + _hdPush('TX_TataUsaha', r.rowId, 'Tata Usaha — Periode ' + r.periode, [
      ['Periode', _esc(r.periode)],
      ['Pagu Reguler', _rupiah(r.paguReguler)],
      ['Pagu ABT', _rupiah(r.paguABT)],
      ['Pagu Total', _rupiah(r.paguTotal)],
      ['Realisasi SP2D', _rupiah(r.realisasiSP2D)],
      ['Realisasi Akrual', _rupiah(r.realisasiAkrual)],
      ['Sisa SP2D', _rupiah(r.sisaSP2D)],
      ['Sisa Akrual', _rupiah(r.sisaAkrual)],
      ['Catatan Revisi Pagu', _esc(r.catatanRevisiPagu || '—')],
      ['Dikirim', _esc(r.timestamp ? new Date(r.timestamp).toLocaleString('id-ID') : '—')],
      ['Status', st === '' ? _esc(r.status) : st]
    ]) + ')">Lihat</button>';

    var rowCls = (r.status === 'VOID') ? 'style="background:#fef2f2;"' : (r.status === 'SUPERSEDED' ? 'style="opacity:0.6;"' : '');
    var tgl = r.timestamp ? new Date(r.timestamp).toLocaleDateString('id-ID') : '—';

    t += '<tr ' + rowCls + '>';
    t += '<td>' + _esc(r.periode) + '</td>';
    t += '<td>' + _rupiah(r.paguTotal) + '</td>';
    t += '<td>' + _rupiah(r.realisasiSP2D) + '</td>';
    t += '<td>' + _rupiah(r.realisasiAkrual) + '</td>';
    t += '<td>' + tgl + '</td>';
    t += '<td>' + st + '</td>';
    t += '<td><div style="display:flex;gap:6px;">' + bLk + bRev + bAn + '</div></td>';
    t += '</tr>';

    if (r.status === 'VOID' && r.voidReason) {
      t += '<tr style="background:#fef2f2;"><td colspan="7" style="padding-top:0; border-bottom:1px solid #fee2e2; color:var(--n-status-critical); font-size:13px;">';
      t += '<strong>Alasan Anulir:</strong> ' + _esc(r.voidReason) + (r.voidedBy ? ' (oleh ' + _esc(r.voidedBy) + ')' : '');
      t += '</td></tr>';
    }
  }

  t += '</tbody></table>';
  wrap.innerHTML = t;
}

// ── Loader Leaflet on-demand ─────────────────────────────────
// Leaflet CSS+JS tidak di-load di Index.html (itu memblokir DOMContentLoaded).
// Di-inject secara dinamis pertama kali modul Operasi dibuka.
var _LEAFLET_LOADED = false;
var _leafletQueue   = [];
function _loadLeaflet(cb) {
  if (typeof L !== 'undefined' || _LEAFLET_LOADED) { cb(); return; }
  _leafletQueue.push(cb);
  if (_leafletQueue.length > 1) return; // sedang loading, tunggu callback

  // Inject CSS
  if (!document.getElementById('leaflet-css')) {
    var link = document.createElement('link');
    link.id   = 'leaflet-css';
    link.rel  = 'stylesheet';
    link.href = 'https://unpkg.com/leaflet@1.9.4/dist/leaflet.css';
    document.head.appendChild(link);
  }

  // Inject JS
  var script = document.createElement('script');
  script.src = 'https://unpkg.com/leaflet@1.9.4/dist/leaflet.js';
  script.onload = function () {
    _LEAFLET_LOADED = true;
    var queue = _leafletQueue.slice();
    _leafletQueue = [];
    queue.forEach(function(fn) { try { fn(); } catch(e) {} });
  };
  script.onerror = function () {
    console.error('Gagal memuat Leaflet dari CDN');
    _leafletQueue = [];
  };
  document.head.appendChild(script);
}

// Init dropdown periode Tahun/Bulan/Minggu Ke- (prefix: 'ops-' | 'oud-')
function _opsInitPeriodeUi(prefix) {
  prefix = prefix || 'ops-';
  var now = new Date();
  var ySel = document.getElementById(prefix + 'periode-tahun');
  var mSel = document.getElementById(prefix + 'periode-bulan');
  var wSel = document.getElementById(prefix + 'periode-minggu');
  if (!ySel || !mSel || !wSel) return;

  // Tahun: tahun lalu - tahun depan (laporan lintas-tahun jadi aman)
  var tahunOpts = '';
  for (var y = now.getFullYear() - 1; y <= now.getFullYear() + 1; y++) {
    tahunOpts += '<option value="' + y + '"' + (y === now.getFullYear() ? ' selected' : '') + '>' + y + '</option>';
  }
  ySel.innerHTML = tahunOpts;

  var bulanOpts = MONTHS.map(function(m, i) {
    return '<option value="' + (i + 1) + '"' + ((i + 1) === (now.getMonth() + 1) ? ' selected' : '') + '>' + m + '</option>';
  }).join('');
  mSel.innerHTML = bulanOpts;

  var mingguKe = Math.min(Math.ceil(now.getDate() / 7), 5); // konvensi DateUtil: tanggal 1-7 = W01, dst
  var mingguOpts = '';
  for (var w = 1; w <= 5; w++) {
    mingguOpts += '<option value="' + w + '"' + (w === mingguKe ? ' selected' : '') + '>Ke-' + w + '</option>';
  }
  wSel.innerHTML = mingguOpts;
}

// Rakit Periode "YYYY-MM-W0X" dari 3 dropdown (Tahun/Bulan/Minggu Ke-).
// Format selalu valid, tidak ada kemungkinan salah ketik.
// prefix: 'ops-' (Kapal) | 'oud-' (Pesawat)
function _composePeriode(prefix) {
  prefix = prefix || 'ops-';
  var y = _v(prefix + 'periode-tahun');
  var m = _v(prefix + 'periode-bulan');
  var w = _v(prefix + 'periode-minggu');
  if (!y || !m || !w) return '';
  m = (parseInt(m, 10) < 10 ? '0' : '') + parseInt(m, 10);
  w = 'W0' + parseInt(w, 10);
  return y + '-' + m + '-' + w;
}

function _cartoTileUrl(key) {
  var base = 'https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png';
  return key ? (base + '?key=' + encodeURIComponent(key)) : base;
}

function _initOpsLautMap() {
  _loadLeaflet(function () {
    if (window.opsLautMap) {
      window.opsLautMap.invalidateSize();
      _renderWppLayer();
      return;
    }
    var mapEl = document.getElementById('map-ops-laut');
    if (!mapEl) return;
    _ensureCartoKey(function (key) {
      if (!window.opsLautMap) {
        window.opsLautMap = L.map('map-ops-laut').setView([-2.5489, 118.0149], 5);
      }
      L.tileLayer(_cartoTileUrl(key), {
        attribution: '&copy; OpenStreetMap contributors &copy; CARTO',
        subdomains: 'abcd',
        maxZoom: 20
      }).addTo(window.opsLautMap);
      _renderWppLayer();
    });
  });
}

function _renderWppLayer() {
  if (!window.opsLautMap) return;
  if (window.opsLautWppLayer) {
    window.opsLautMap.removeLayer(window.opsLautWppLayer);
    window.opsLautWppLayer = null;
  }

  _opsGetGeoData(function(geoData) {
    if (!window.opsLautMap) return;
    var kpi = _OPSLAUT.kpiData;
    window.opsLautWppLayer = L.geoJSON(geoData, {
        style: function(feature) {
          var wppCode = feature.properties.wppnri; // properti geojson: wppnri (kode), name (mis. "WPP 571")
          var intensitas = 0;
          if (kpi && kpi.wppIntensitas && kpi.wppIntensitas[wppCode]) {
            intensitas = kpi.wppIntensitas[wppCode];
          }

          var fillColor = '#e2e8f0'; // default empty
          var fillOpacity = 0.5;
          if (intensitas > 0) {
            fillColor = 'var(--n-primary)';
            fillOpacity = Math.min(0.2 + (intensitas * 0.05), 0.8);
          }

          return {
            fillColor: fillColor,
            weight: 1,
            opacity: 1,
            color: '#cbd5e1',
            fillOpacity: fillOpacity
          };
        },
        onEachFeature: function(feature, layer) {
          var wppCode = feature.properties.wppnri;
          var nama    = feature.properties.name || wppCode;
          var intensitas = 0;
          if (_OPSLAUT.kpiData && _OPSLAUT.kpiData.wppIntensitas) {
            intensitas = _OPSLAUT.kpiData.wppIntensitas[wppCode] || 0;
          }
          layer.bindTooltip("<strong>" + nama + "</strong><br>WPP: " + wppCode + "<br>Intensitas periode ini: " + intensitas, {sticky: true});
        }
      }).addTo(window.opsLautMap);
  });
}

function _opsLautLoadOptions() {
  if (_OPSLAUT.wppData) {
    _opsLautPopulateWpp();
    return;
  }
  google.script.run
    .withSuccessHandler(function(res) {
      if (res.success) {
        _OPSLAUT.wppData = res.data;
        _opsLautPopulateWpp();
      } else {
        var sel = document.getElementById('ops-wpp');
        if (sel) sel.innerHTML = '<option value="">(Gagal: ' + res.error + ')</option>';
      }
    })
    .withFailureHandler(function(err) {
      var sel = document.getElementById('ops-wpp');
      if (sel) sel.innerHTML = '<option value="">(Gagal memuat WPP)</option>';
    })
    .operasiLaut_getOptions(APP.token);
}
function _opsLautPopulateWpp() {
  var sel = document.getElementById('ops-wpp');
  if (!sel) return;
  sel.innerHTML = '<option value="">(Pilih WPP)</option>';
  (_OPSLAUT.wppData || []).forEach(function(opt) {
    var o = document.createElement('option');
    o.value = opt.value;
    o.textContent = opt.text;
    sel.appendChild(o);
  });
}

function _opsLautLoadKPI() {
  var strip = document.getElementById('ops-laut-kpi-strip');
  if (strip) strip.innerHTML = _kpiSkeleton(4);
  
  google.script.run
    .withSuccessHandler(function(res) {
      if(res.success) {
        _OPSLAUT.kpiData = res.data;
        _opsLautRenderKPI(res.data);
        _opsLautBuildWppChart();
        _opsLautLoadCharts();
        _renderWppLayer(); // update map colors
        if(res.data.mingguTerakhirSubmit && res.data.hari_operasi_realisasi > 0) {
          document.getElementById('ops-laut-form-body').style.display = 'none';
          document.getElementById('ops-laut-form-toggle-icon').textContent = '▾';
        }
      } else {
        if(strip) strip.innerHTML = '<div class="n-msg error">Gagal memuat KPI: ' + res.error + '</div>';
      }
    })
    .operasiLaut_getKPI(APP.token, APP.filter);
}

function _opsLautRenderKPI(kpi) {
  var strip = document.getElementById('ops-laut-kpi-strip');
  if (!strip) return;
  
  var totalKapal = (kpi.kii || 0) + (kpi.kia || 0);
  var pctOp = kpi.hari_operasi_target > 0 ? ((kpi.hari_operasi_realisasi / kpi.hari_operasi_target)*100).toFixed(1) : 0;
  
  var html = '<div style="display:grid; grid-template-columns: repeat(4, 1fr); gap:16px; margin-bottom: 24px;">' +
'<div class="n-card">' +
'<div class="kpi-label">TOTAL KAPAL DITANGKAP</div>' +
'<div class="kpi-val">' + totalKapal + '</div>' +
'<div class="kpi-sub">KII: ' + kpi.kii + ' &middot; KIA: ' + kpi.kia + '</div>' +
'</div>' +
'<div class="n-card">' +
'<div class="kpi-label">VALUASI DICEGAH</div>' +
'<div class="kpi-val">' + _rupiah(kpi.valuasi_ikan) + '</div>' +
'</div>' +
'<div class="n-card">' +
'<div class="kpi-label">RUMPON DITERTIBKAN</div>' +
'<div class="kpi-val">' + kpi.rumpon + '</div>' +
'<div class="kpi-sub">Val: ' + _rupiah(kpi.valuasi_rumpon) + '</div>' +
'</div>' +
'<div class="n-card">' +
'<div class="kpi-label">HARI OPERASI (' + pctOp + '%)</div>' +
'<div class="kpi-val" style="font-size:1.5rem;">' + kpi.hari_operasi_realisasi + ' / ' + kpi.hari_operasi_target + '</div>' +
'<div style="margin-top:8px; height:6px; background:#e2e8f0; border-radius:99px; overflow:hidden;">' +
'<div style="height:100%; width:' + Math.min(pctOp,100) + '%; background:var(--n-status-success);"></div>' +
'</div>' +
'</div>' +
'</div>';
  strip.innerHTML = html;
}

function opsLautToggleForm() {
  var b = document.getElementById('ops-laut-form-body');

  if (b.style.display === 'none') {
    b.style.display = 'block';
    i.textContent = '▴';
  } else {
    b.style.display = 'none';
    i.textContent = '▾';
  }
}

function opsLautSubmit() {
  _msg('ops-laut-form-msg', '', '');
  var attachErr = _attachValidate('opslaut');
  if (attachErr) { _msg('ops-laut-form-msg', 'error', attachErr); return; }
  var btn = document.getElementById('ops-btn-submit');
  btn.disabled = true;
  btn.textContent = 'Menyimpan...';

  var params = {
    Periode: _composePeriode(),
    WPPCode: _v('ops-wpp'),
    KII_Ditangkap: parseInt(_v('ops-kii'), 10) || 0,
    KIA_Ditangkap: parseInt(_v('ops-kia'), 10) || 0,
    AsalNegaraAsing: _v('ops-asal-negara'),
    ValuasiIllegalFishing: parseInt(_v('ops-valuasi-ikan'), 10) || 0,
    RumponDitertibkan: parseInt(_v('ops-rumpon'), 10) || 0,
    ValuasiRumpon: parseInt(_v('ops-valuasi-rumpon'), 10) || 0,
    HasilRiksa_Kategori: _v('ops-riksa-kategori'),
    HasilRiksa_KII: parseInt(_v('ops-riksa-kii'), 10) || 0,
    HasilRiksa_KIA: parseInt(_v('ops-riksa-kia'), 10) || 0,
    HasilRiksa_ObjekSDK: parseInt(_v('ops-riksa-sdk'), 10) || 0,
    HariOperasi_Kategori: _v('ops-hari-kategori'),
    HariOperasi_Jumlah: parseInt(_v('ops-hari-jumlah'), 10) || 0,
    HariOperasi_Target: parseInt(_v('ops-hari-target'), 10) || 180
  };

  google.script.run
    .withSuccessHandler(function(res) {
      btn.disabled = false;
      btn.textContent = 'Simpan Laporan';
      if(res.success) {
        _msg('ops-laut-form-msg', 'success', res.data.message);
        var rowId = res.data && res.data.rowId;
        _attachUploadAll('opslaut', rowId ? [rowId] : [], function() {
          opsLautToggleForm();
          _opsLautLoadKPI();
          _opsLautLoadHistory();
        });
      } else {
        _msg('ops-laut-form-msg', 'error', res.error);
      }
    })
    .withFailureHandler(function() {
      btn.disabled = false;
      btn.textContent = 'Simpan Laporan';
      _msg('ops-laut-form-msg', 'error', 'Koneksi terputus.');
    })
    .operasiLaut_submit(APP.token, params);
}

function _opsLautLoadHistory() {
  var wrap = document.getElementById('ops-laut-history-wrap');
  if(!wrap) return;
  wrap.innerHTML = _loadingInline('Memuat riwayat operasi laut\u2026');
  
  google.script.run
    .withSuccessHandler(function(res){
      if(res.success) _opsLautRenderHistory(res.data);
      else wrap.innerHTML = '<div class="n-msg error">' + res.error + '</div>';
    })
    .operasiLaut_getHistory(APP.token, APP.filter);
}

function _opsLautRenderHistory(data) {
  var wrap = document.getElementById('ops-laut-history-wrap');
  if(!wrap) return;
  _hdReset();
  if(data.length === 0) {
    wrap.innerHTML = '<div style="padding:20px 24px;">Tidak ada riwayat untuk periode ini.</div>';
    return;
  }
  
  var isStaf = (APP.user && APP.user.role === 'STAF');
  var isPimpinan = (APP.user && (APP.user.role==='DIREKTUR' || APP.user.role==='SUPERADMIN' || APP.user.role==='KADIV'));
  
  var t = '<table class="n-table"><thead><tr>';
  t += '<th>Periode</th><th>WPP</th><th>Kapal (KII/KIA)</th><th>Valuasi</th><th>Rumpon</th><th>Riksa</th><th>Hari Op</th><th>Status</th><th>Aksi</th>';
  t += '</tr></thead><tbody>';
  
  for(var i=0; i<data.length; i++) {
    var r = data[i];
    
    var st = '<span class="status-badge" style="background:#f3f4f6;color:#374151;">DITIMPA</span>';
    if(r.Status === 'ACTIVE') st = '<span class="status-badge" style="background:var(--n-primary-light);color:var(--n-primary);">AKTIF</span>';
    else if(r.Status === 'VOID') st = '<span class="status-badge" style="background:#fee2e2;color:var(--n-status-critical);">DIANULIR</span>';
    
    var bRev = (r.Status==='ACTIVE' && !isStaf && APP.user.divisiId === 'DIV-OPS') ? '<button class="btn-mini" onclick="opsLautOpenRevisiModal(\'' + r.RowID + '\')">Revisi</button>' : '';
    var bAn  = (r.Status==='ACTIVE' && isPimpinan) ? '<button class="btn-mini" style="color:var(--n-status-critical);border-color:var(--n-status-critical);" onclick="opsLautOpenAnulirModal(\'' + r.RowID + '\')">Anulir</button>' : '';
    
    if(r.Status==='ACTIVE' && (APP.user.role==='STAF'||APP.user.role==='KADIV') && APP.user.divisiId === 'DIV-OPS'){
      bRev = '<button class="btn-mini" onclick="opsLautOpenRevisiModal(\'' + r.RowID + '\')">Revisi</button>';
    }

    var bLk = '<button class="btn-mini" onclick="_hdOpen(' + _hdPush('TX_OperasiLaut', r.RowID, 'Operasi Laut — Periode ' + r.Periode + ' (' + r.WPPCode + ')', [
      ['Periode', _esc(r.Periode)],
      ['WPP', _esc(r.WPPCode)],
      ['Kapal Asing Ditangkap (KII)', _esc(r.KII_Ditangkap)],
      ['Kapal Asing Ditangkap (KIA)', _esc(r.KIA_Ditangkap)],
      ['Asal Negara Asing', _esc(r.AsalNegaraAsing || '—')],
      ['Valuasi Illegal Fishing', _rupiah(r.ValuasiIllegalFishing)],
      ['Rumpon Ditertibkan', _esc(r.RumponDitertibkan)],
      ['Valuasi Rumpon', _rupiah(r.ValuasiRumpon)],
      ['Hasil Riksa — Kategori', _esc(r.HasilRiksa_Kategori || '—')],
      ['Hasil Riksa — KII', _idNum(r.HasilRiksa_KII)],
      ['Hasil Riksa — KIA', _idNum(r.HasilRiksa_KIA)],
      ['Hasil Riksa — Objek SDK', _idNum(r.HasilRiksa_ObjekSDK)],
      ['Hari Operasi — Kategori', _esc(r.HariOperasi_Kategori || '—')],
      ['Hari Operasi — Jumlah', _idNum(r.HariOperasi_Jumlah)],
      ['Hari Operasi — Target', _idNum(r.HariOperasi_Target)],
      ['Dikirim', _esc(r.Timestamp ? new Date(r.Timestamp).toLocaleString('id-ID') : '—')],
      ['Status', _esc(r.Status)]
    ]) + ')">Lihat</button>';
    
    var rowCls = (r.Status==='VOID') ? 'style="background:#fef2f2;"' : (r.Status==='SUPERSEDED' ? 'style="opacity:0.6;"' : '');
    
    t += '<tr ' + rowCls + '>';
    t += '<td>' + r.Periode + '</td>';
    t += '<td>' + r.WPPCode + '</td>';
    t += '<td>' + r.KII_Ditangkap + ' / ' + r.KIA_Ditangkap + '</td>';
    t += '<td>' + _rupiah(r.ValuasiIllegalFishing) + '</td>';
    t += '<td>' + r.RumponDitertibkan + '</td>';
    t += '<td>' + (r.HasilRiksa_Kategori||'-') + '</td>';
    t += '<td>' + r.HariOperasi_Jumlah + '</td>';
t += '<td>' + st + '</td>';
    t += '<td><div style="display:flex;gap:6px;">' + bLk + bRev + bAn + '</div></td>';
    t += '</tr>';

    if(r.Status === 'VOID' && r.VoidReason) {
      t += '<tr style="background:#fef2f2;"><td colspan="9" style="padding-top:0; border-bottom:1px solid #fee2e2; color:var(--n-status-critical); font-size:13px;">';
      t += '<strong>Alasan Anulir:</strong> ' + r.VoidReason + ' (oleh ' + r.VoidedBy + ')';
      t += '</td></tr>';
    }
  }
  
  t += '</tbody></table>';
  wrap.innerHTML = t;
}

  if(_v('rv-ops-hari-target')) params.HariOperasi_Target = parseInt(_v('rv-ops-hari-target'), 10);

        maxZoom: 20

    });

}

function _renderOpsUdaraWppLayer() {
  if (!window.opsUdaraMap) return;
  if (window.opsUdaraWppLayer) {
    window.opsUdaraMap.removeLayer(window.opsUdaraWppLayer);
    window.opsUdaraWppLayer = null;
  }

  _opsGetGeoData(function(geoData) {
    if (!window.opsUdaraMap) return;
    var kpi = _OPSUDARA.kpiData;
    window.opsUdaraWppLayer = L.geoJSON(geoData, {
        style: function(feature) {
          var wppCode = feature.properties.wppnri;
          var intensitas = 0;
          if (kpi && kpi.wppIntensitas && kpi.wppIntensitas[wppCode]) {
            intensitas = kpi.wppIntensitas[wppCode];
          }

          var fillColor = '#e2e8f0';
          var fillOpacity = 0.5;
          if (intensitas > 0) {
            fillColor = 'var(--n-primary)';
            fillOpacity = Math.min(0.2 + (intensitas * 0.05), 0.8);
          }

          return {
            fillColor: fillColor,
            weight: 1,
            opacity: 1,
            color: '#cbd5e1',
            fillOpacity: fillOpacity
          };
        },
        onEachFeature: function(feature, layer) {
          var wppCode = feature.properties.wppnri;
          var nama    = feature.properties.name || wppCode;
          var intensitas = 0;
          if (_OPSUDARA.kpiData && _OPSUDARA.kpiData.wppIntensitas) {
            intensitas = _OPSUDARA.kpiData.wppIntensitas[wppCode] || 0;
          }
          layer.bindTooltip("<strong>" + nama + "</strong><br>WPP: " + wppCode + "<br>Intensitas periode ini: " + intensitas, {sticky: true});
        }
      }).addTo(window.opsUdaraMap);
  });
}

function _opsUdaraLoadOptions() {
  if (_OPSUDARA.wppData) {
    _opsUdaraPopulateWpp();
    return;
  }
  google.script.run
    .withSuccessHandler(function(res) {
      if (res.success) {
        _OPSUDARA.wppData = res.data;
        _opsUdaraPopulateWpp();
      } else {
        var sel = document.getElementById('oud-wpp');
        if (sel) sel.innerHTML = '<option value="">(Gagal: ' + res.error + ')</option>';
      }
    })
    .withFailureHandler(function(err) {
      var sel = document.getElementById('oud-wpp');
      if (sel) sel.innerHTML = '<option value="">(Gagal memuat WPP)</option>';
    })
    .operasiUdara_getOptions(APP.token);
}

function _opsUdaraPopulateWpp() {
