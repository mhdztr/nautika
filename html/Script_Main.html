function _bmnToggleRejectMode() {
  _BMN_HPS.isRejectMode = !_BMN_HPS.isRejectMode;

  var advanceTitle = document.getElementById('bmn-detail-advance-title');
  var nextBadge = document.getElementById('bmn-detail-next-step-badge');
  var advanceFields = document.getElementById('bmn-detail-advance-fields');
  var btnReject = document.getElementById('btn-advance-reject');
  var btnAdvance = document.getElementById('btn-confirm-advance');

  if (_BMN_HPS.isRejectMode) {
    if (advanceTitle) advanceTitle.textContent = 'Tolak Berkas Usulan (Kemenkeu)';
    if (nextBadge) {
      nextBadge.textContent = 'Tahap: DITOLAK';
      nextBadge.className = 'n-badge n-badge-subtle n-badge-crit';
    }
    if (btnReject) btnReject.textContent = 'Batal Menolak (Kembali ke Persetujuan)';
    if (btnAdvance) {
      btnAdvance.textContent = 'Konfirmasi Tolak Usulan';
      btnAdvance.className = 'btn-danger-solid';
    }

    if (advanceFields) {
      advanceFields.innerHTML = '<div class="form-grp" style="grid-column:1 / -1;">' +
                                  '<label for="bmn-adv-alasan-tolak">Alasan Penolakan dari Kemenkeu <span style="color:var(--n-crit)">*</span></label>' +
                                  '<textarea id="bmn-adv-alasan-tolak" class="n-input" rows="3" placeholder="Sebutkan pertimbangan penolakan oleh Kemenkeu/DJKN..."></textarea>' +
                                  '<div style="font-size:.75rem; color:var(--n-text-muted); margin-top:4px;">' +
                                    'Aset yang sebelumnya dikarantina akan otomatis dipulihkan kembali ke status AKTIF di register inventaris.' +
                                  '</div>' +
                                '</div>';
    }
  } else {
    var master = (_BMN_HPS.activeDetail && _BMN_HPS.activeDetail.master) || {};
    _bmnRenderAdvanceForm('SURAT_USULAN', master);
  }
}

function _bmnSubmitAdvanceStage() {
  if (!_BMN_HPS.activeDetail || !_BMN_HPS.activeDetail.master) return;
  var master = _BMN_HPS.activeDetail.master;
  var currentTahap = String(master.tahap || 'DRAFT_USULAN').toUpperCase();
  var hpsId = master.penghapusanId;

  var payload = {
    penghapusanId: hpsId
  };

  if (_BMN_HPS.isRejectMode) {
    var elAlasanTolak = document.getElementById('bmn-adv-alasan-tolak');
    var alasanTolak = elAlasanTolak ? elAlasanTolak.value.trim() : '';
    if (!alasanTolak) {
      _msg('bmn-detail-advance-msg', 'error', 'Alasan penolakan dari Kemenkeu wajib diisi.');
      return;
    }
    payload.tahapTarget = 'DITOLAK';
    payload.alasanTolak = alasanTolak;
  } else if (currentTahap === 'DRAFT_USULAN') {
    var elNo = document.getElementById('bmn-adv-no-surat');
    var elTgl = document.getElementById('bmn-adv-tgl-surat');
    var elLink = document.getElementById('bmn-adv-link-surat');

    var noSurat = elNo ? elNo.value.trim() : '';
    var tglSurat = elTgl ? elTgl.value : '';
    var linkSurat = elLink ? elLink.value.trim() : '';

    if (!noSurat) { _msg('bmn-detail-advance-msg', 'error', 'Nomor Surat Usulan wajib diisi.'); return; }
    if (!tglSurat) { _msg('bmn-detail-advance-msg', 'error', 'Tanggal Surat Usulan wajib diisi.'); return; }
    if (!linkSurat) { _msg('bmn-detail-advance-msg', 'error', 'Link berkas bukti Surat Usulan wajib dilampirkan.'); return; }

    payload.tahapTarget = 'SURAT_USULAN';
    payload.nomorSuratUsulan = noSurat;
    payload.tanggalSuratUsulan = tglSurat;
    payload.evidenceSuratUsulan = linkSurat;

  } else if (currentTahap === 'SURAT_USULAN') {
    var elNoP = document.getElementById('bmn-adv-no-persetujuan');
    var elTglP = document.getElementById('bmn-adv-tgl-persetujuan');
    var elInst = document.getElementById('bmn-adv-instansi-kemenkeu');
    var elLinkP = document.getElementById('bmn-adv-link-persetujuan');

    var noP = elNoP ? elNoP.value.trim() : '';
    var tglP = elTglP ? elTglP.value : '';
    var inst = elInst ? elInst.value.trim() : '';
    var linkP = elLinkP ? elLinkP.value.trim() : '';

    if (!noP) { _msg('bmn-detail-advance-msg', 'error', 'Nomor Surat Persetujuan Kemenkeu wajib diisi.'); return; }
    if (!tglP) { _msg('bmn-detail-advance-msg', 'error', 'Tanggal Surat Persetujuan Kemenkeu wajib diisi.'); return; }
    if (!inst) { _msg('bmn-detail-advance-msg', 'error', 'Instansi Kemenkeu penerbit persetujuan wajib diisi.'); return; }
    if (!linkP) { _msg('bmn-detail-advance-msg', 'error', 'Link bukti berkas persetujuan wajib dilampirkan.'); return; }

    payload.tahapTarget = 'PERSETUJUAN_KEMENKEU';
    payload.nomorSuratPersetujuan = noP;
    payload.tanggalSuratPersetujuan = tglP;
    payload.instansiKemenkeu = inst;
    payload.evidenceSuratPersetujuan = linkP;

  } else if (currentTahap === 'PERSETUJUAN_KEMENKEU') {
    var elNoSK = document.getElementById('bmn-adv-no-sk');
    var elTglSK = document.getElementById('bmn-adv-tgl-sk');
    var elLinkSK = document.getElementById('bmn-adv-link-sk');

    var noSK = elNoSK ? elNoSK.value.trim() : '';
    var tglSK = elTglSK ? elTglSK.value : '';
    var linkSK = elLinkSK ? elLinkSK.value.trim() : '';

    if (!noSK) { _msg('bmn-detail-advance-msg', 'error', 'Nomor SK Penghapusan KKP wajib diisi.'); return; }
    if (!tglSK) { _msg('bmn-detail-advance-msg', 'error', 'Tanggal SK Penghapusan wajib diisi.'); return; }
    if (!linkSK) { _msg('bmn-detail-advance-msg', 'error', 'Link bukti berkas SK Penghapusan wajib dilampirkan.'); return; }

    payload.tahapTarget = 'SK_PENGHAPUSAN';
    payload.nomorSK = noSK;
    payload.tanggalSK = tglSK;
    payload.evidenceSK = linkSK;

  } else if (currentTahap === 'SK_PENGHAPUSAN') {
    var elLinkBAST = document.getElementById('bmn-adv-link-bast');
    var linkBAST = elLinkBAST ? elLinkBAST.value.trim() : '';

    if (!linkBAST) { _msg('bmn-detail-advance-msg', 'error', 'Link berkas BAST / Risalah Lelang wajib dilampirkan.'); return; }

    payload.tahapTarget = 'BAST_SELESAI';
    payload.evidenceBAST = linkBAST;
  }

  var btnAdvance = document.getElementById('btn-confirm-advance');
  if (btnAdvance) btnAdvance.disabled = true;
  _msg('bmn-detail-advance-msg', 'info', 'Menyimpan proses tahapan siklus...');

  google.script.run
    .withSuccessHandler(function (res) {
      if (btnAdvance) btnAdvance.disabled = false;
      if (!res.success) {
        _msg('bmn-detail-advance-msg', 'error', res.error || 'Gagal memproses tahapan.');
        return;
      }
      _msg('bmn-detail-advance-msg', 'success', 'Tahapan berkas berhasil dimutakhirkan ke: ' + payload.tahapTarget);
      _bmnLoadPenghapusanList(true);
      _bmnLoadAsetList(true);
      _bmnLoadSummary(true);
      setTimeout(function () {
        _bmnOpenDetailHapusModal(hpsId);
      }, 700);
    })
    .withFailureHandler(function (err) {
      if (btnAdvance) btnAdvance.disabled = false;
      _msg('bmn-detail-advance-msg', 'error', 'Terjadi kesalahan sistem: ' + (err.message || 'Koneksi gagal.'));
    })
    .bmn_advancePenghapusan(APP.token, payload);
}

function _bmnPromptVoidHapus(penghapusanId) {
  _BMN_HPS.pendingVoidId = penghapusanId;
  var elTarget = document.getElementById('bmn-void-hps-target-id');
  var elReason = document.getElementById('bmn-void-hps-reason');
  var elMsg = document.getElementById('bmn-void-hps-msg');

  if (elTarget) elTarget.textContent = penghapusanId;
  if (elReason) elReason.value = '';
  if (elMsg) elMsg.innerHTML = '';

  openModal('modal-bmn-void-hapus');
}

function _bmnOpenVoidModal() {
  if (!_BMN_HPS.activeDetail || !_BMN_HPS.activeDetail.master) return;
  _bmnPromptVoidHapus(_BMN_HPS.activeDetail.master.penghapusanId);
}

function _bmnExecuteVoidHapus() {
  var penghapusanId = _BMN_HPS.pendingVoidId;
  var elReason = document.getElementById('bmn-void-hps-reason');
  var reason = elReason ? elReason.value.trim() : '';
  var btn = document.getElementById('btn-confirm-void-hapus');

  if (!reason) {
    _msg('bmn-void-hps-msg', 'error', 'Alasan pembatalan/anulir usulan wajib diisi.');
    return;
  }

  if (btn) btn.disabled = true;
  _msg('bmn-void-hps-msg', 'info', 'Membatalkan berkas usulan dan memulihkan status aset...');

  google.script.run
    .withSuccessHandler(function (res) {
      if (btn) btn.disabled = false;
      if (!res.success) {
        _msg('bmn-void-hps-msg', 'error', res.error || 'Gagal menganulir usulan.');
        return;
      }
      closeModal('modal-bmn-void-hapus');
      closeModal('modal-bmn-detail-hapus');
      _msg('bmn-table-msg', 'success', 'Berkas usulan ' + penghapusanId + ' berhasil dianulir dan seluruh aset dipulihkan ke status AKTIF.');
      _bmnLoadPenghapusanList(true);
      _bmnLoadAsetList(true);
      _bmnLoadSummary(true);
    })
    .withFailureHandler(function (err) {
      if (btn) btn.disabled = false;
      _msg('bmn-void-hps-msg', 'error', 'Terjadi kesalahan sistem: ' + (err.message || 'Koneksi gagal.'));
    })
    .bmn_voidPenghapusan(APP.token, {
      penghapusanId: penghapusanId,
      alasan: reason
    });
}

// ============================================================
// MODUL OPERASI (KAPAL & PESAWAT — tab gabungan, Fase 7)
// ============================================================
var _OPS = {
  tab: 'kapal' // 'kapal' | 'pesawat'
};

// Cache GeoJSON WPP — dibagi Kapal & Pesawat (load sekali per sesi)
var _OPS_GEO = { wppGeoJsonData: null, wppPromise: null };

// Sumber geometri WPPNRI. Berkas ±10 MB di-host di GitHub raw (bukan GAS —
// Sheet/Apps Script tidak bisa menyajikan berkas statik besar tanpa biaya).
// Risikonya nyata: satu unduhan gagal = peta kosong. Yang sebelumnya terjadi,
// `fetch` tanpa guard membuat SETIAP panggilan `_renderWppLayer()` /
// `_renderOpsUdaraWppLayer()` menyalakan unduhan 10 MB sendiri (ganti tab,
// ganti filter, KPI reload), dan `.catch` hanya `console.error` — jadi user
// hanya melihat kotak abu-abu tanpa batas WPP dan tanpa pesan apa pun.
var _OPS_GEO_SRC        = 'https://raw.githubusercontent.com/mhdztr/wppnri/main/wpp_final.geojson';
var _OPS_GEO_TIMEOUT_MS = 30000;   // batas waktu sebelum menyerah
var _OPS_GEO_RETRY      = 2;       // total percobaan (1 retry)

// Unduh geometri dengan timeout + retry. Resolve dengan FeatureCollection.
function _opsFetchWppGeoJson(attempt) {
  attempt = attempt || 1;
  return new Promise(function (resolve, reject) {
    var ctrl = (typeof AbortController !== 'undefined') ? new AbortController() : null;
    // GitHub raw mengirim max-age sangat panjang → setelah berhasil,
    // unduhan berikutnya dilayani cache browser (tidak boros 10 MB).
    var opts = { cache: 'force-cache' };
    if (ctrl) opts.signal = ctrl.signal;
    var timer = setTimeout(function () { if (ctrl) ctrl.abort(); }, _OPS_GEO_TIMEOUT_MS);

    fetch(_OPS_GEO_SRC, opts)
      .then(function (r) {
        if (!r.ok) throw new Error('HTTP ' + r.status);
        return r.json();
      })
      .then(function (data) {
        clearTimeout(timer);
        if (!data || !data.features || !data.features.length) {
          throw new Error('Berkas batas WPP kosong.');
        }
        resolve(data);
      })
      .catch(function (e) {
        clearTimeout(timer);
        if (attempt < _OPS_GEO_RETRY) {           // koneksi sempat putus / CDN rate-limit
          _opsFetchWppGeoJson(attempt + 1).then(resolve, reject);
          return;
        }
        reject(new Error(
          e && e.name === 'AbortError'
            ? 'Waktu muat batas WPP habis (' + (_OPS_GEO_TIMEOUT_MS / 1000) + ' detik).'
            : 'Gagal memuat batas WPP dari sumber geospasial.'
        ));
      });
  });
}

// Ambil cache GeoJSON WPP bersama (load sekali, dipakai Laut & Udara).
// cb(geoJsonData, null) | cb(null, pesanError) — pemanggil WAJIB menangani
// kedua cabang; tidak ada lagi diam-diam gagal.
function _opsGetGeoData(cb) {
  if (_OPS_GEO.wppGeoJsonData) { cb(_OPS_GEO.wppGeoJsonData, null); return; }
  // Satu promise dipakai bersama: pemanggil yang datang sebelum unduhan
  // selesai ikut menunggu, bukan memulai unduhan kedua.
  if (!_OPS_GEO.wppPromise) {
    _OPS_GEO.wppPromise = _opsFetchWppGeoJson(1).then(function (data) {
      _OPS_GEO.wppGeoJsonData = data;
      return data;
    });
  }
  _OPS_GEO.wppPromise.then(
    function (data) { cb(data, null); },
    function (err) {
      _OPS_GEO.wppPromise = null;   // izinkan percobaan berikutnya
      cb(null, err.message || 'Gagal memuat batas WPP.');
    }
  );
}

// ── STATUS & LEGENDA PETA ─────────────────────────────────
// Container peta tidak punya elemen status di view, jadi dibuat dari JS.
// Tanpa ini kegagalan unduhan GeoJSON tidak pernah terlihat user.
function _opsMapStatus(mapId, mode, msg, onRetry) {
  var host = document.getElementById(mapId);
  if (!host) return;
  var old = host.querySelector('.ops-map-status');
  if (old) old.remove();
  if (!mode) return;

  var el = document.createElement('div');
  el.className = 'ops-map-status';
  var inner = document.createElement('div');
  inner.className = 'ops-map-status-inner';

  if (mode === 'loading') {
    var sp = document.createElement('span');
    sp.className = 'n-spin';
    inner.appendChild(sp);
    var l = document.createElement('div');
    l.textContent = msg || 'Memuat batas WPP…';
    inner.appendChild(l);
  } else {
    var t = document.createElement('strong');
    t.textContent = 'Batas WPP belum tampil';
    inner.appendChild(t);
    var d = document.createElement('div');
    d.textContent = msg || 'Sumber geospasial tidak dapat dihubungi.';
    inner.appendChild(d);
    var btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'ops-map-retry';
    btn.textContent = 'Coba lagi';
    btn.addEventListener('click', function () { if (onRetry) onRetry(); });
    inner.appendChild(btn);
  }
  el.appendChild(inner);
  host.appendChild(el);
}

// Legenda skala intensitas (PRD.md §8.1: 0 / 1-5 / 6-15 / >15).
function _opsMapLegend(mapId, colors) {
  var host = document.getElementById(mapId);
  if (!host) return;
  if (host.querySelector('.ops-map-legend')) return;   // jangan dobel saat filter berubah

  var el = document.createElement('div');
  el.className = 'ops-map-legend';
  var html = '<div class="ops-map-legend-title">Kapal + rumpon (periode ini)</div>';
  colors.forEach(function (c) {
    html += '<div class="ops-map-legend-row"><i style="background:' + c.fill + '"></i>' + c.label + '</div>';
  });
  el.innerHTML = html;
  host.appendChild(el);
}

// Peta warna choropleth — SATU hue (navy), pucat → pekat (PRD §8.1: bukan
// traffic-light multi-warna). Di-mirror dari token Style.html sebagai hex
// karena Leaflet menulis gaya sebagai ATRIBUT SVG (`fill="..."`), dan `var()`
// hanya resolve di CSS — bukan di atribut. (Bug lama: `var(--n-primary)`
// membuat setiap WPP terisi hitam, bukan navy.)
var _OPS_WPP_SCALE = [
  { max: 0,  fill: '#E4E7F2', label: '0 kapal' },          // ~ --n-primary-light
  { max: 5,  fill: '#A9B0D0', label: '1-5 kapal' },
  { max: 15, fill: '#6B76A8', label: '6-15 kapal' },
  { max: Infinity, fill: '#2B3674', label: '>15 kapal' }  // --n-primary
];
function _opsWppFill(intensitas) {
  var n = Number(intensitas) || 0;
  for (var i = 0; i < _OPS_WPP_SCALE.length; i++) {
    if (n <= _OPS_WPP_SCALE[i].max) return _OPS_WPP_SCALE[i].fill;
  }
  return _OPS_WPP_SCALE[_OPS_WPP_SCALE.length - 1].fill;
}

// Cocokkan kode GeoJSON (string) dengan key wppIntensitas dari server.
// Sheet bisa menyimpan "571" atau " 571 " — tanpa trim, seluruh peta
// diam-diam jadi warna 0 padahal datanya ada.
function _opsWppIntensitas(wppIntensitas, wppCode) {
  if (!wppIntensitas || wppCode === undefined || wppCode === null) return 0;
  var v = wppIntensitas[wppCode];
  if (v === undefined) v = wppIntensitas[String(wppCode).trim()];
  return Number(v) || 0;
}
// Satu sumber untuk tooltip kedua peta (Laut & Udara) supaya tidak berbeda.
function _opsWppTooltip(props, intensitas) {
  var nama = props.name || props.wppnri || 'WPP';
  return '<strong>' + nama + '</strong><br>WPP: ' + props.wppnri +
         '<br>Kapal + rumpon periode ini: ' + (Number(intensitas) || 0);
}

// Teardown kedua peta (Kapal & Pesawat) sekaligus
function _opsTeardownMaps() {
  _chartTeardownAll(); // chart zona operasi ikut dibersihkan saat ganti tab/view
  if (window.opsLautMap)  { try { window.opsLautMap.remove(); } catch(e) {}  window.opsLautMap = null; }
  window.opsLautWppLayer = null;
  if (window.opsUdaraMap) { try { window.opsUdaraMap.remove(); } catch(e) {} window.opsUdaraMap = null; }
  window.opsUdaraWppLayer = null;
}

function _renderOperasi(el) {

function _opsSyncTabState() {

// ── Loader Leaflet on-demand ─────────────────────────────────

// ============================================================
// MODUL OPERASI LAUT
// ============================================================
var _OPSLAUT = {
  pendingRowId: null,
  wppData: null,       // cache WPP list
  wppOptions: null,    // [{value,label}] utk select WPP pada daftar rumpon
  kpiData: null,       // simpan result kpi agar _renderWppLayer bisa pakai kpiData.wppIntensitas
  rows: [],            // riwayat periode terakhir (utk prefill rincian saat revisi)

function _opsLautInitPeriodeUi() {
  _opsInitPeriodeUi('ops-');
}

// Init dropdown periode Tahun/Bulan/Minggu Ke- (prefix: 'ops-' | 'oud-')
function _opsInitPeriodeUi(prefix) {
  prefix = prefix || 'ops-';
  var now = new Date();
  var ySel = document.getElementById(prefix + 'periode-tahun');
  var mSel = document.getElementById(prefix + 'periode-bulan');
  var wSel = document.getElementById(prefix + 'periode-minggu');
  if (!ySel || !mSel || !wSel) return;

  // Tahun: tahun lalu - tahun depan (laporan lintas-tahun jadi aman)
  var tahunOpts = '';
  for (var y = now.getFullYear() - 1; y <= now.getFullYear() + 1; y++) {
    tahunOpts += '<option value="' + y + '"' + (y === now.getFullYear() ? ' selected' : '') + '>' + y + '</option>';
  }
  ySel.innerHTML = tahunOpts;

  var bulanOpts = MONTHS.map(function(m, i) {
    return '<option value="' + (i + 1) + '"' + ((i + 1) === (now.getMonth() + 1) ? ' selected' : '') + '>' + m + '</option>';
  }).join('');
  mSel.innerHTML = bulanOpts;

  var mingguKe = Math.min(Math.ceil(now.getDate() / 7), 5); // konvensi DateUtil: tanggal 1-7 = W01, dst
  var mingguOpts = '';
  for (var w = 1; w <= 5; w++) {
    mingguOpts += '<option value="' + w + '"' + (w === mingguKe ? ' selected' : '') + '>Ke-' + w + '</option>';
  }
  wSel.innerHTML = mingguOpts;
}

// Rakit Periode "YYYY-MM-W0X" dari 3 dropdown (Tahun/Bulan/Minggu Ke-).
// Format selalu valid, tidak ada kemungkinan salah ketik.
// prefix: 'ops-' (Kapal) | 'oud-' (Pesawat)
function _composePeriode(prefix) {
  prefix = prefix || 'ops-';
  var y = _v(prefix + 'periode-tahun');
  var m = _v(prefix + 'periode-bulan');
  var w = _v(prefix + 'periode-minggu');
  if (!y || !m || !w) return '';
  m = (parseInt(m, 10) < 10 ? '0' : '') + parseInt(m, 10);
  w = 'W0' + parseInt(w, 10);
  return y + '-' + m + '-' + w;
}

function _ensureCartoKey(cb) {
  if (window._nautikaCartoKey !== undefined) { cb(window._nautikaCartoKey); return; }
  google.script.run
    .withSuccessHandler(function (key) {
      window._nautikaCartoKey = key || '';
      cb(window._nautikaCartoKey);
    })
    .withFailureHandler(function () {
      window._nautikaCartoKey = '';
      cb('');
    })
    .utils_getCartoKey();
}

function _cartoTileUrl(key) {
  var base = 'https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png';
  return key ? (base + '?key=' + encodeURIComponent(key)) : base;
}

function _initOpsLautMap() {
  _loadLeaflet(function () {
    if (window.opsLautMap) {
      window.opsLautMap.invalidateSize();
      _renderWppLayer();
      return;
    }
    var mapEl = document.getElementById('map-ops-laut');
    if (!mapEl) return;
    _ensureCartoKey(function (key) {
      if (!window.opsLautMap) {
        window.opsLautMap = L.map('map-ops-laut').setView([-2.5489, 118.0149], 5);
      }
      L.tileLayer(_cartoTileUrl(key), {
        attribution: '&copy; OpenStreetMap contributors &copy; CARTO',
        subdomains: 'abcd',
        maxZoom: 20
      }).addTo(window.opsLautMap);
      _renderWppLayer();
    });
  });
}

function _renderWppLayer() {
  if (!window.opsLautMap) return;
  if (window.opsLautWppLayer) {
    window.opsLautMap.removeLayer(window.opsLautWppLayer);
    window.opsLautWppLayer = null;
  }

  _opsMapStatus('map-ops-laut', 'loading');
  _opsGetGeoData(function (geoData, err) {
    if (!window.opsLautMap) return;   // pindah tab / pindah halaman saat unduhan berjalan
    if (err) {
      // Dulu: diam-diam. Kotak peta tetap abu-abu tanpa alasan — user
      // menyimpulkan petanya memang kosong.
      _opsMapStatus('map-ops-laut', 'error', err, _renderWppLayer);
      return;
    }
    var kpi = _OPSLAUT.kpiData;
    var intensitasOf = function (code) {
      return _opsWppIntensitas(kpi && kpi.wppIntensitas, code);
    };
    window.opsLautWppLayer = L.geoJSON(geoData, {
        style: function(feature) {
          var intensitas = intensitasOf(feature.properties.wppnri);
          // Skala intensitas: 0 kapal WAJIB tetap terlihat (PRD §8.1) → palet
          // pucat, bukan "sembunyikan". Bobot ditegakkan lewat warna satu hue.
          return {
            fillColor: _opsWppFill(intensitas),
            fillOpacity: 0.85,
            weight: 1,
            opacity: 1,
            color: 'rgba(43,54,116,0.45)'
          };
        },
        onEachFeature: function(feature, layer) {
          var wppCode = feature.properties.wppnri;
          layer.bindTooltip(
            _opsWppTooltip(feature.properties, intensitasOf(wppCode)),
            { sticky: true }
          );
        }
      }).addTo(window.opsLautMap);
    _opsMapStatus('map-ops-laut', null);
    _opsMapLegend('map-ops-laut', _OPS_WPP_SCALE);
    _opsLautLoadFleetLayer();
  });
}

// ── Layer 34 Kapal Pengawas di Operasi Laut (Fase 18) ─────
function _opsLautLoadFleetLayer() {
  if (!window.opsLautMap) return;
  if (_OPSLAUT.fleet && _OPSLAUT.fleet.length) {
    _opsLautRenderFleetChips();
    _opsLautRenderFleetMarkers();
    return;
  }
  if (_OV_MAP && _OV_MAP.data && _OV_MAP.data.fleet && _OV_MAP.data.fleet.length) {
    _OPSLAUT.fleet = _OV_MAP.data.fleet;
    _opsLautRenderFleetChips();
    _opsLautRenderFleetMarkers();
    return;
  }
  google.script.run
    .withSuccessHandler(function (res) {
      if (res && res.success && res.data && res.data.fleet) {
        _OPSLAUT.fleet = res.data.fleet;
        _opsLautRenderFleetChips();
        _opsLautRenderFleetMarkers();
      }
    })
    .dashboard_getTacticalFleet(APP.token);
}

function _opsLautRenderFleetChips() {
  var host = document.getElementById('ops-fleet-filter-bar');
  if (!host) return;
  var fleet = _OPSLAUT.fleet || [];
  var total = fleet.length;
  var opCount = 0, siapCount = 0, galCount = 0;
  fleet.forEach(function (k) {
    if (k.status === 'OPERASIONAL') opCount++;
    else if (k.status === 'SIAP_PANGKALAN') siapCount++;
    else if (k.status === 'GALANGAN') galCount++;
  });

  var filters = [
    { key: 'ALL', label: 'Semua Armada (' + total + ')' },
    { key: 'OPERASIONAL', label: 'Operasional (' + opCount + ')' },
    { key: 'SIAP_PANGKALAN', label: 'Siap Pangkalan (' + siapCount + ')' },
    { key: 'GALANGAN', label: 'Galangan (' + galCount + ')' }
  ];

  host.innerHTML = filters.map(function (f) {
    var on = (_OPSLAUT.fleetFilter || 'ALL') === f.key;
    return '<button type="button" class="ov-fleet-chip' + (on ? ' is-on' : '') + '"' +
      ' data-ops-fleet-filter="' + f.key + '" aria-pressed="' + (on ? 'true' : 'false') + '">' +
      _esc(f.label) + '</button>';
  }).join('');

  host.querySelectorAll('[data-ops-fleet-filter]').forEach(function (b) {
    b.addEventListener('click', function () {
      var k = b.getAttribute('data-ops-fleet-filter');
      if (!k || k === _OPSLAUT.fleetFilter) return;
      _OPSLAUT.fleetFilter = k;
      _opsLautRenderFleetChips();
      _opsLautRenderFleetMarkers();
    });
  });
}

function _opsLautRenderFleetMarkers() {
  if (!window.opsLautMap) return;
  if (!_OPSLAUT.fleetLayer) {
    _OPSLAUT.fleetLayer = L.layerGroup().addTo(window.opsLautMap);
  } else {
    _OPSLAUT.fleetLayer.clearLayers();
  }

  var fleet = _OPSLAUT.fleet || [];
  var activeFilter = _OPSLAUT.fleetFilter || 'ALL';

  fleet.forEach(function (k) {
    if (activeFilter !== 'ALL' && k.status !== activeFilter) return;
    if (k.lat == null || k.lng == null) return;

    var isOp = k.status === 'OPERASIONAL';
    var isSiap = k.status === 'SIAP_PANGKALAN';
    var statusCls = isOp ? 'status-op' : (isSiap ? 'status-siap' : 'status-galangan');
    var pulseHtml = isOp ? '<span class="ship-beacon-pulse"></span>' : '';

    var iconHtml =
      '<div class="ship-marker ' + statusCls + '">' +
        pulseHtml +
        '<span class="ship-marker-dot"></span>' +
        '<span class="ship-marker-lbl">' + _esc(k.nama.replace('KP. ', '')) + '</span>' +
      '</div>';

    var icon = L.divIcon({
      className: 'ship-marker-wrap',
      html: iconHtml,
      iconSize: [84, 26],
      iconAnchor: [42, 13]
    });

    var marker = L.marker([k.lat, k.lng], { icon: icon });

    var badgeText = isOp ? 'Operasional di Laut' : (isSiap ? 'Siap di Pangkalan' : 'Pemeliharaan di Galangan');
    var badgeStyle = isOp ? 'background:rgba(16,185,129,0.12);color:#059669;' :
      (isSiap ? 'background:rgba(245,158,11,0.12);color:#D97706;' : 'background:rgba(239,68,68,0.12);color:#DC2626;');

    var pctNas = Math.min(k.pctNasional || Math.round((k.hariOperasi / 44) * 100), 100);
    var pctPus = Math.min(k.pctPusat || Math.round((k.hariOperasi / 49) * 100), 100);

    var popupHtml =
      '<div class="ship-popover">' +
        '<div class="ship-pop-hd">' +
          '<span class="ship-pop-badge" style="' + badgeStyle + '">' + badgeText + '</span>' +
          '<div class="ship-pop-name">' + _esc(k.nama) + '</div>' +
          '<div class="ship-pop-sub">Kelas ' + _esc(k.kelas || '—') + ' &bull; WPP ' + _esc(k.wpp || '—') + '</div>' +
        '</div>' +

// ── ITEM LIST "rincian per-item" (revisi Fase 13) ─────────
// Komponen daftar baris input generik.
//   spec.columns — [{key, label, type:'text'|'select'|'hidden',
//                    placeholder, options:[{value,label}], value}]
//   spec.grid    — grid-template-columns utk head + tiap baris
//                  (default: kolom selebar 1fr + kolom hapus auto).
//   spec.onInput(items) — dipanggil tiap kali isi daftar berubah.
//   spec.minEmptyRows   — baris kosong cadangan (default 1).
// return — { add(values), set(items), clear(), get(), count() }
// `get()` membuang baris yang SEMUA kolom input (non-hidden) kosong,
// sehingga empty-rows cadangan tidak ikut menjadi item.
function _nList(wrapId, spec) {
  spec = spec || {};
  var columns = spec.columns || [];
  var wrap = document.getElementById(wrapId);
  if (!wrap) return { add: function(){}, set: function(){}, clear: function(){}, get: function(){ return []; }, count: function(){ return 0; } };
  var rows = [];
  var grid = spec.grid || columns.map(function(){ return '1fr'; }).join(' ');

  function colSel(col) {
    var s = document.createElement('select');
    var empty = { value: '', label: '(Pilih)' };
    var opts = col.options || [];
    if (col.empty !== false && (opts.length === 0 || String(opts[0].value || '') !== '')) {
      opts = [empty].concat(opts);
    }
    opts.forEach(function (o) {
      var opt = document.createElement('option');
      opt.value = o.value != null ? o.value : '';
      opt.textContent = o.label != null ? o.label : String(o.value || '');
      s.appendChild(opt);
    });
    return s;
  }

  function makeCell(col) {
    var cell = document.createElement('div');
    cell.className = 'n-list-cell';
    var el;
    if (col.type === 'hidden') {
      el = document.createElement('input');
      el.type = 'hidden';
      el.value = col.value != null ? col.value : '';
      // Kolom hidden TIDAK boleh memakan track grid — kalau ikut jadi sel,
      // jumlah anak melebihi jumlah track dan tombol hapus wrap ke baris baru.
      cell.style.display = 'none';
    } else if (col.type === 'select') {
      el = colSel(col);
    } else {
      el = document.createElement('input');
      el.type = 'text';
      if (col.placeholder) el.placeholder = col.placeholder;
    }
    el.setAttribute('data-f', col.key);
    if (col.type !== 'hidden') el.addEventListener('input', onChanged);
    cell.appendChild(el);
    return cell;
  }

  function isRowFilled(rowEl) {
    for (var i = 0; i < columns.length; i++) {
      var col = columns[i];
      if (col.type === 'hidden') continue;
      var el = rowEl.querySelector('[data-f="' + col.key + '"]');
      if (el && String(el.value || '').trim() !== '') return true;
    }
    return false;
  }

  function makeRow(values) {
    var rowEl = document.createElement('div');
    rowEl.className = 'n-list-row';
    rowEl.style.gridTemplateColumns = grid + ' auto';
    columns.forEach(function (col) { rowEl.appendChild(makeCell(col)); });
    var delCell = document.createElement('div');
    delCell.className = 'n-list-delcell';
    var del = document.createElement('button');
    del.type = 'button';
    del.className = 'n-list-del';
    del.title = 'Hapus baris';
    del.setAttribute('aria-label', 'Hapus baris');
    del.innerHTML = _ico('trash');
    del.addEventListener('click', function () { removeRow(rowEl); });
    delCell.appendChild(del);
    rowEl.appendChild(delCell);
    if (values) {
      columns.forEach(function (col) {
        var el = rowEl.querySelector('[data-f="' + col.key + '"]');
        if (el) {
          var v = values[col.key];
          if (v != null && String(v) !== '') el.value = String(v);
        }
      });
    }
    wrap.appendChild(rowEl);
    rows.push(rowEl);
    return rowEl;
  }

  function removeRow(rowEl) {
    var i = rows.indexOf(rowEl);
    if (i !== -1) rows.splice(i, 1);
    if (rowEl.parentNode) rowEl.parentNode.removeChild(rowEl);
    onChanged();
  }

  function onChanged() {
    if (spec.onInput) spec.onInput(get());
  }

  function add(values) { makeRow(values); onChanged(); }

  function set(items) {
    for (var i = rows.length - 1; i >= 0; i--) removeRow(rows[i]);
    (items || []).forEach(function (it) { makeRow(it); });
    var min = Math.max(Number(spec.minEmptyRows) || 1, 1);
    for (var j = 0; j < min; j++) makeRow(null);
    onChanged();
  }

  function clear() { set([]); }

  function get() {
    var out = [];
    for (var i = 0; i < rows.length; i++) {
      var rowEl = rows[i];
      if (!isRowFilled(rowEl)) continue;
      var o = {};
      columns.forEach(function (col) {
        var el = rowEl.querySelector('[data-f="' + col.key + '"]');
        o[col.key] = el ? String(el.value || '') : '';
      });
      out.push(o);
    }
    return out;
  }

  function count() { return get().length; }

  if (wrap) wrap.classList.add('n-list');
  var initial = Math.max(Number(spec.minEmptyRows) || 1, 1);
  for (var k = 0; k < initial; k++) makeRow(null);

  return { add: add, set: set, clear: clear, get: get, count: count };
}

// ── SEARCH DROPDOWN "Pilih…" (revisi Fase 12) ────────────
// Menggantikan combobox typeahead **Backlog B (dibatalkan)**. Enum
// Jenis/Kategori kembali ke <select> Opsi biasa (PRD memakai istilah
// dropdown). Field relasi Kapal memakai dropdown yang jelas terlihat
// sebagai dropdown (chevron), dengan kotak cari di panel + tombol hapus.
// Nilai akhir tetap divalidasi server.
// Markup (di tiap form, lihat views/*.html):
//   <div class="kdl-sel">
//     <input  id="X-input"  class="kdl-field" readonly placeholder="…">
//     <input type="hidden"  id="X">                 ← token terpilih
//     <button id="X-clear"  class="kdl-clear" style="display:none;"></button>
//     <span   class="kdl-caret"></span>
//     <div    class="kdl-panel" id="X-panel">
//       <input id="X-q" type="text" class="kdl-q" placeholder="Cari…">
//       <ul    id="X-dd" class="kdl-list"></ul>
//     </div>
//   </div>
// Submit membaca token via _v('X'); hapus keyword me-reset filter penuh.
var _KDL_DATA = {};

// Mengisi <select> biasa dari daftar item Opsi {value,label}; mempertahankan
// nilai terpilih bila masih tersedia, juga untuk form revisi.
function _fillOpsiSelect(id, items, labelKosong) {
  var sel = document.getElementById(id);
  if (!sel) return;
  var prev = sel.value;
  sel.innerHTML = '';
  if (labelKosong !== undefined) {
    var o0 = document.createElement('option');
    o0.value = '';
    o0.textContent = labelKosong;
    sel.appendChild(o0);
  }
  (items || []).forEach(function (it) {
    var o = document.createElement('option');
    o.value = it.value;
    o.textContent = it.label;
    sel.appendChild(o);
  });
  sel.value = prev;
  return sel;
}
function _kdlInit(id, items) {
  var field = document.getElementById(id + '-input');
  var hid   = document.getElementById(id);
  var panel = document.getElementById(id + '-panel');
  var q     = document.getElementById(id + '-q');
  var dd    = document.getElementById(id + '-dd');
  var clear = document.getElementById(id + '-clear');
  if (!field || !hid || !panel) return;
  _KDL_DATA[id] = items || [];
  if (field.getAttribute('data-kdl-bound')) return;
  field.setAttribute('data-kdl-bound', '1');

  field.addEventListener('click', function () { _kdlToggle(id); });
  field.addEventListener('keydown', function (e) {
    if (e.keyCode === 40 || e.keyCode === 38 || e.keyCode === 13) { // ↓/↑/Enter buka
      e.preventDefault();
      _kdlOpen(id);
    }
  });

  if (q) {
    q.addEventListener('input', function () { _kdlFilter(id); });
    q.addEventListener('keydown', function (e) { _kdlKey(id, e); });
  }
  if (dd) dd.addEventListener('mousedown', function (e) { _kdlPickEvent(id, e); });
  if (clear) clear.addEventListener('click', function (e) {
    e.stopPropagation();
    _kdlClear(id);
  });
}

function _kdlOpen(id) {
  _kdlCloseAll();
  var panel = document.getElementById(id + '-panel');
  var q     = document.getElementById(id + '-q');
  if (panel) panel.classList.add('kdl-open');
  if (q) q.value = '';
  _kdlFilter(id);
  if (q) q.focus();
}

function _kdlToggle(id) {
  var panel = document.getElementById(id + '-panel');
  if (panel && panel.classList.contains('kdl-open')) _kdlClose(id);
  else _kdlOpen(id);
}

function _kdlClose(id) {
  var panel = document.getElementById(id + '-panel');
  if (panel) panel.classList.remove('kdl-open');
}

function _kdlCloseAll() {
  var els = document.querySelectorAll('.kdl-panel.kdl-open');
  for (var i = 0; i < els.length; i++) els[i].classList.remove('kdl-open');
}

document.addEventListener('mousedown', function (e) {
  if (e.target && e.target.closest && e.target.closest('.kdl-sel')) return;
  _kdlCloseAll();
});

function _kdlFilter(id) {
  var q  = document.getElementById(id + '-q');
  var dd = document.getElementById(id + '-dd');
  if (!q || !dd) return;
  var term = (q.value || '').toLowerCase();
  var shown = [];
  (_KDL_DATA[id] || []).forEach(function (it) {
    if (it && (it.label || '').toLowerCase().indexOf(term) !== -1) shown.push(it);
  });
  dd.innerHTML = '';
  shown.forEach(function (it) {
    var li = document.createElement('li');
    li.textContent = it.label;
    li.setAttribute('data-v', it.value);
    li.setAttribute('data-l', it.label);
    if (it.label && it.label.toLowerCase() === term) li.className = 'kdl-hl';
    dd.appendChild(li);
  });
  if (!shown.length && term) {
    var empty = document.createElement('li');
    empty.textContent = 'Tidak ada opsi — tambahkan di Master Data';
    empty.className = 'kdl-empty';
    dd.appendChild(empty);
  }
}

function _kdlPickEvent(id, e) {
  e.preventDefault();
  var li = e.target;
  while (li && li.tagName !== 'LI') li = li.parentNode;
  if (!li || !li.getAttribute('data-v')) return;
  _kdlPick(id, li.getAttribute('data-v'), li.getAttribute('data-l'));
}

function _kdlPick(id, value, label) {
  var field = document.getElementById(id + '-input');
  var hid   = document.getElementById(id);
  var clear = document.getElementById(id + '-clear');
  if (field) field.value = label;
  if (hid)   hid.value = value;
  if (clear) clear.style.display = '';
  _kdlClose(id);

  // Interlock Validasi Laik Laut (Fase 18)
  if (id === 'ops-kapal') {
    _opsCheckInterlock(value, 'ops-kapal-interlock', 'ops-btn-submit');
  } else if (id === 'rv-ops-kapal') {
    _opsCheckInterlock(value, 'rv-ops-kapal-interlock', 'ops-btn-revisi-save');
  }
}

function _kdlKey(id, e) {
  var k = e.keyCode;
  var dd = document.getElementById(id + '-dd');
  if (!dd) return;
  var items = dd.querySelectorAll('li');
  if (k === 38 || k === 40) {
    e.preventDefault();
    var idx = -1;
    for (var i = 0; i < items.length; i++) {
      if (items[i].classList.contains('kdl-hl')) { idx = i; break; }
    }
    idx += (k === 40) ? 1 : -1;
    if (idx < 0) idx = 0;
    if (idx > items.length - 1) idx = items.length - 1;
    for (var j = 0; j < items.length; j++) items[j].classList.remove('kdl-hl');
    if (items[idx]) items[idx].classList.add('kdl-hl');
  } else if (k === 13) {
    for (var m = 0; m < items.length; m++) {
      if (items[m].classList.contains('kdl-hl')) {
        e.preventDefault();
        _kdlPick(id, items[m].getAttribute('data-v'), items[m].getAttribute('data-l'));
        return;
      }
    }
  } else if (k === 27) {
    _kdlClose(id);
    var field = document.getElementById(id + '-input');
    if (field) field.focus();
  }
}

// Hapus pilihan + keyword → filter kembali penuh saat panel dibuka kembali.
function _kdlClear(id) {
  _kdlSet(id, '', '');
  var q = document.getElementById(id + '-q');
  if (q) q.value = '';
  _kdlFilter(id);
  var field = document.getElementById(id + '-input');
  if (field) field.focus();

  // Interlock reset bila kapal dikosongkan (Fase 18)
  if (id === 'ops-kapal') {
    _opsCheckInterlock('', 'ops-kapal-interlock', 'ops-btn-submit');
  } else if (id === 'rv-ops-kapal') {
    _opsCheckInterlock('', 'rv-ops-kapal-interlock', 'ops-btn-revisi-save');
  }
}

// Reset penuh saat form dibuka (pola Backlog A). Tidak membuka panel.
function _kdlReset(id) {
  _kdlSet(id, '', '');
  _kdlClose(id);
  var q = document.getElementById(id + '-q');
  if (q) q.value = '';
  _kdlFilter(id);
}

function _kdlSet(id, token, label) {

var _KAPAL_READINESS_MAP = null;

function _fetchReadinessMap(cb) {
  if (_KAPAL_READINESS_MAP) {
    if (typeof cb === 'function') cb(_KAPAL_READINESS_MAP);
    return;
  }
  google.script.run
    .withSuccessHandler(function (res) {
      _KAPAL_READINESS_MAP = (res && res.success && res.data) ? res.data : {};
      if (typeof cb === 'function') cb(_KAPAL_READINESS_MAP);
    })
    .withFailureHandler(function () {
      _KAPAL_READINESS_MAP = {};
      if (typeof cb === 'function') cb(_KAPAL_READINESS_MAP);
    })
    .perawatan_getReadinessMap(APP.token);
}

function _opsCheckInterlock(kapalId, bannerId, submitBtnId) {
  var banner = document.getElementById(bannerId);
  var btn = document.getElementById(submitBtnId);
  if (!kapalId) {
    if (banner) { banner.classList.add('n-hidden'); banner.innerHTML = ''; }
    if (btn) btn.disabled = false;
    return;
  }
  _fetchReadinessMap(function (map) {
    var rec = map[kapalId];
    if (rec && rec.status === 'TIDAK_SIAP') {
      if (banner) {
        banner.classList.remove('n-hidden');
        banner.innerHTML =
          '<div class="interlock-banner-inner">' +
            '<div class="interlock-banner-icon" aria-hidden="true">&#9888;</div>' +
            '<div class="interlock-banner-text">' +
              '<strong>Interlock Validasi Laik Laut:</strong> Kapal ini tercatat <strong>TIDAK SIAP / TIDAK LAIK LAUT</strong> pada data Perawatan' +
              (rec.catatan ? ' (' + _esc(rec.catatan) + ')' : '') + '.' +
              ' Pengajuan Operasi Laut tidak dapat disimpan sebelum status kesiapan diperbarui.' +
            '</div>' +
          '</div>';
      }
      if (btn) btn.disabled = true;
    } else {
      if (banner) {
        banner.classList.add('n-hidden');
        banner.innerHTML = '';
      }
      if (btn) btn.disabled = false;
    }
  });
}

// Semua APPROVED boleh baca master kapal (PRD §6), jadi dropdown kapal
// di form Operasi Laut/Udara & Logistik memakai master_getKapalList.
var _KAPAL_ITEMS   = [];
var _KAPAL_LABEL   = {}; // kapalId → nama (untuk tabel riwayat & profil)
var _KAPAL_JENIS   = {}; // kapalId → JenisKapal (filter form per kategori hari operasi)

function _kapalItemsFor(jenisKategori) {
  var kat = String(jenisKategori || '').trim().toUpperCase();
  if (!kat || kat === 'SEMUA_KAPAL') return _KAPAL_ITEMS.slice();
  return _KAPAL_ITEMS.filter(function (k) {
    var j = String(k.jenis || '').trim().toUpperCase();
    return !j || j === kat; // kapal lama tanpa JenisKapal → tidak dibatasi
  });
}

function _kapalInit(id, jenisKategori) {
  var items = _kapalItemsFor(jenisKategori);
  if (_KAPAL_ITEMS.length) { _kdlInit(id, items); return; }
  google.script.run
    .withSuccessHandler(function (res) {
      if (res && res.success && res.data) {
        _KAPAL_ITEMS = res.data.map(function (k) {
          var kid = String(k.kapalId || '');
          _KAPAL_LABEL[kid] = String(k.nama || kid || '');
          _KAPAL_JENIS[kid] = String(k.jenisKapal || '').trim().toUpperCase();
          return { value: kid, label: _KAPAL_LABEL[kid], jenis: _KAPAL_JENIS[kid] };
        });
      } else {
        _KAPAL_ITEMS = [];
      }
      if (id) _kdlInit(id, _kapalItemsFor(jenisKategori));
    })
    .withFailureHandler(function () {
      _KAPAL_ITEMS = [];
      if (id) _kdlInit(id, []);
    })
    .master_getKapalList(APP.token);
}

function _kapalName(kapalId) {
  if (!kapalId) return '—';
  return _KAPAL_LABEL[String(kapalId)] || String(kapalId);
}

/**
 * Saring ulang dropdown kapal berdasarkan kategori hari operasi (Fase 14
 * Item 6). Dipanggil saat kategori berubah: kapal yang jenisnya tidak cocok
 * disembunyikan dari daftar, dan pilihan yang jadi tidak sah di-reset.
 */
function _kapalSyncKategori(kdlId, kategoriId) {
  var kat = _v(kategoriId);
  _KDL_DATA[kdlId] = _kapalItemsFor(kat);
  var chosen = _v(kdlId);
  if (chosen) {
    var jenis = _KAPAL_JENIS[String(chosen)] || '';
    var katU = String(kat || '').toUpperCase();
    var cocok = (!katU || katU === 'SEMUA_KAPAL' || !jenis || jenis === katU);
    if (!cocok) _kdlClear(kdlId);
  }
  _kdlFilter(kdlId);
}

    (r.rincian || []).forEach(function (x) {

  _OPSLAUT.rvRumpon.set(rumponItems);

  // Prefill KapalID lama (Fase 14 Item 6): kolom ini dulu opsional sehingga

function _renderOperasiUdara(el) {
  // Teardown peta Pesawat dulu (setiap render ulang utuh)
  if (window.opsUdaraMap) {
    try { window.opsUdaraMap.remove(); } catch(e) {}
    window.opsUdaraMap = null;
  }
  window.opsUdaraWppLayer = null;

  var tpl = document.getElementById('view-tpl-operasi-udara');
  if (!tpl) { el.innerHTML = _moduleStub('Operasi Udara'); return; }
  el.innerHTML = tpl.innerHTML;
  _attachInit('opsudara', { refSheet: 'TX_OperasiUdara' });

  _opsInitPeriodeUi('oud-');
  _opsUdaraLoadOptions();
  _opsUdaraLoadKPI();
  _opsUdaraLoadHistory();

  var pHint = document.getElementById('oud-periode-hint');
  if (pHint) {
    google.script.run.withSuccessHandler(function(res){
      if(res) pHint.textContent = 'Periode saat ini: ' + res;
    }).utils_getCurrentPeriode();
  }

  // Init map — tunggu Leaflet dimuat dulu (on-demand loader)
  _loadLeaflet(function() { setTimeout(_initOpsUdaraMap, 100); });
}

function _initOpsUdaraMap() {
  _loadLeaflet(function () {
    if (window.opsUdaraMap) {
      window.opsUdaraMap.invalidateSize();
      _renderOpsUdaraWppLayer();
      return;
    }
    var mapEl = document.getElementById('map-ops-udara');
    if (!mapEl) return;
    _ensureCartoKey(function (key) {
      if (!window.opsUdaraMap) {
        window.opsUdaraMap = L.map('map-ops-udara').setView([-2.5489, 118.0149], 5);
      }
      L.tileLayer(_cartoTileUrl(key), {
        attribution: '&copy; OpenStreetMap contributors &copy; CARTO',
        subdomains: 'abcd',
        maxZoom: 20
      }).addTo(window.opsUdaraMap);
      _renderOpsUdaraWppLayer();
    });
  });
}

function _renderOpsUdaraWppLayer() {
  if (!window.opsUdaraMap) return;
  if (window.opsUdaraWppLayer) {
    window.opsUdaraMap.removeLayer(window.opsUdaraWppLayer);
    window.opsUdaraWppLayer = null;
  }

  _opsMapStatus('map-ops-udara', 'loading');
  _opsGetGeoData(function (geoData, err) {
    if (!window.opsUdaraMap) return;
    if (err) {
      _opsMapStatus('map-ops-udara', 'error', err, _renderOpsUdaraWppLayer);
      return;
    }
    var kpi = _OPSUDARA.kpiData;
    var intensitasOf = function (code) {
      return _opsWppIntensitas(kpi && kpi.wppIntensitas, code);
    };
    window.opsUdaraWppLayer = L.geoJSON(geoData, {
        style: function(feature) {
          var intensitas = intensitasOf(feature.properties.wppnri);
          return {
            fillColor: _opsWppFill(intensitas),
            fillOpacity: 0.85,
            weight: 1,
            opacity: 1,
            color: 'rgba(43,54,116,0.45)'
          };
        },
        onEachFeature: function(feature, layer) {
          var wppCode = feature.properties.wppnri;
          layer.bindTooltip(
            _opsWppTooltip(feature.properties, intensitasOf(wppCode)),
            { sticky: true }
          );
        }
      }).addTo(window.opsUdaraMap);
    _opsMapStatus('map-ops-udara', null);
    _opsMapLegend('map-ops-udara', _OPS_WPP_SCALE);
  });
}

function _opsUdaraRenderKPI(kpi) {
  var strip = document.getElementById('ops-udara-kpi-strip');

  var totalPantau = (kpi.kii || 0) + (kpi.kia || 0);
  var pctOp = kpi.hari_operasi_target > 0 ? ((kpi.hari_operasi_realisasi / kpi.hari_operasi_target)*100).toFixed(1) : 0;

  var html = '    <div style="display:grid; grid-template-columns: repeat(4, 1fr); gap:16px; margin-bottom: 24px;">\n' +
'      <div class="n-card">\n' +
'        <div class="kpi-label">KAPAL DIPANTAU</div>\n' +
'        <div class="kpi-val">' + (totalPantau) + '</div>\n' +
'        <div class="kpi-sub">KII: ' + (kpi.kii) + ' &middot; KIA: ' + (kpi.kia) + '</div>\n' +
'      </div>\n' +
'      <div class="n-card">\n' +
'        <div class="kpi-label">RUMPON LOKAL</div>\n' +
'        <div class="kpi-val">' + (kpi.rumpon_lokal) + '</div>\n' +
'        <div class="kpi-sub">Teridentifikasi</div>\n' +
'      </div>\n' +
'      <div class="n-card">\n' +
'        <div class="kpi-label">CAKUPAN WILAYAH</div>\n' +
'        <div class="kpi-val">' + (kpi.cakupan_nm2) + '</div>\n' +
'        <div class="kpi-sub">NM&sup2; teramati</div>\n' +
'      </div>\n' +
'      <div class="n-card">\n' +
'        <div class="kpi-label">HARI OPERASI (' + (pctOp) + '%)</div>\n' +
'        <div class="kpi-val" style="font-size:1.5rem;">' + (kpi.hari_operasi_realisasi) + ' / ' + (kpi.hari_operasi_target) + '</div>\n' +
'        <div style="margin-top:8px; height:6px; background:#e2e8f0; border-radius:99px; overflow:hidden;">\n' +
'          <div style="height:100%; width:' + (Math.min(pctOp,100)) + '%; background:var(--n-status-success);"></div>\n' +
'        </div>\n' +
'      </div>\n' +
'    </div>\n';
  strip.innerHTML = html;
}

function opsUdaraSubmit() {

  if (attachErr) { _msg('ops-udara-form-msg', 'error', attachErr); return; }
  var btn = document.getElementById('oud-btn-submit');
  btn.disabled = true;
  btn.textContent = 'Menyimpan...';

  var params = {
    Periode: _composePeriode('oud-'),
    WPPCode: _v('oud-wpp'),
    KapalID: _v('oud-kapal'),

  };

function _intelRenderKPI(kpi) {
  var strip = document.getElementById('int-kpi-strip');
  if (!strip) return;

  var kawasanTotal = 0;
  if (kpi.kawasanPeriode) {
    Object.keys(kpi.kawasanPeriode).forEach(function(k){ kawasanTotal += (kpi.kawasanPeriode[k] || 0); });

  function card(label, value) {

    card('Pelanggaran Transmitter',    kpi.pelanggaranTransmitter) +
    card('Nota Dinas',                 kpi.notaDinas) +
    card('Pengangkut Ikan Hidup',      kpi.kapalPengangkutIkanHidup) +

// ── Tabel Kawasan Konservasi (§8.2) ──
function _intelRenderKawasanTable(rows) {
  var wrap = document.getElementById('int-kawasan-wrap');
  if (!wrap) return;

  if (!rows || rows.length === 0) {
    wrap.innerHTML = '<div style="padding:20px 24px;color:var(--n-text-muted);font-size:.875rem;">Belum ada data kawasan konservasi pada master.</div>';
    return;
  }

  var t = '<table class="n-table n-table-full"><thead><tr>' +
    '<th>Kawasan</th><th>Provinsi</th><th>Pelanggaran Periode</th><th>YTD</th><th>Tren</th><th>Laporan</th>' +
    '</tr></thead><tbody>';

  for (var i = 0; i < rows.length; i++) {
    var r = rows[i];
    var tren = '<span style="color:var(--n-text-muted);">—</span>';
    if (r.tren === 'NAIK')  tren = '<span style="color:var(--n-status-critical);font-weight:600;">▲ Naik</span>';
    else if (r.tren === 'TURUN') tren = '<span style="color:var(--n-status-success);font-weight:600;">▼ Turun</span>';

    t += '<tr>';
    t += '<td>' + _esc(r.nama) + '</td>';
    t += '<td>' + _esc(r.provinsi) + '</td>';
    t += '<td>' + (r.pelanggaranPeriode || 0) + '</td>';
    t += '<td>' + (r.pelanggaranYTD || 0) + '</td>';
    t += '<td>' + tren + '</td>';
    t += '<td><button class="btn-mini" onclick="intelSetKawasanFilter(\'' + String(r.kawasanId).replace(/[^A-Za-z0-9_-]/g,'') + '\')">Riwayat</button></td>';
    t += '</tr>';
  }

  t += '</tbody></table>';
  wrap.innerHTML = t;
}

  var canWrite = (APP.user && (APP.user.role === 'SUPERADMIN' || (APP.user.divisiId === 'DIV-INTEL' && (APP.user.role === 'STAF' || APP.user.role === 'KADIV'))));

  _histRender('int-history-wrap', {
    columns: ['Periode', 'Kategori', 'Jumlah', 'Detail'],

    },

    detail: function (r) {

    anulir: isPimpinan ? function (r) { return "intelOpenAnulirModal('" + _esc(r.rowId) + "')"; } : null,

// Nilai kolom "Detail" — sama antara baris tabel dan modal Lihat.
function _intelDetail(r) {
  if (r.Jenis === 'KAWASAN_KONSERVASI') return r.kawasanNama || r.KawasanID || '—';
  return r.Keterangan || '—';
}

// ── Submit ──
function intelSubmit(e) {
  _msg('int-form-msg', '', '');
  var attachErr = _attachValidate('intel');
  if (attachErr) { _msg('int-form-msg', 'error', attachErr); return; }
  var periode = _composePeriode('int-');
  if (!periode) { _msg('int-form-msg', 'error', 'Periode wajib dipilih.'); return; }

  var items = [];
  // Kejadian intelijen (5 jenis non-kawasan): jumlah dihitung sistem
  // dari daftar rincian per kejadian, dikelompokkan per jenis.
  var kejadian = _intelBindKejadianList().get();
  var byJenis = {};
  kejadian.forEach(function (k) {
    var j = String(k.Jenis || '');
    if (!j) return;
    if (!byJenis[j]) byJenis[j] = [];
    byJenis[j].push({ Deskripsi: String(k.Deskripsi || '') });
  });
  Object.keys(byJenis).forEach(function (j) {
    items.push({ jenis: j, rincian: byJenis[j] });
  });

  var kwRows = document.querySelectorAll('#int-kawasan-rows .int-kawasan-row');
  for (var i = 0; i < kwRows.length; i++) {
    var sel = kwRows[i].querySelector('.int-kw-sel');
    var jml = kwRows[i].querySelector('.int-kw-jml');
    var ket = kwRows[i].querySelector('.int-kw-ket');
    if (sel && sel.value) {
      items.push({
        jenis: 'KAWASAN_KONSERVASI',
        kawasanId: sel.value,
        jumlah: parseInt(jml && jml.value, 10) || 0,
        keterangan: ket ? ket.value : ''
      });
    }
  }

  if (items.length === 0) { _msg('int-form-msg', 'error', 'Minimal satu kejadian atau kawasan wajib diisi.'); return; }

  var btn = document.getElementById('int-btn-submit');
  _setLoading(btn, true);

  google.script.run
    .withSuccessHandler(function(res) {
      _setLoading(btn, false);
      if (res.success) {
        _msg('int-form-msg', 'success', res.data.message);
        var rowIds = (res.data && res.data.rowIds) || [];
        _intelResetForm();
        _attachUploadAll('intel', rowIds, function(ok) {
          _formSubmitDone('modal-int-form', 'Laporan intelijen tersimpan.', function () {
            _intelLoadKPI();
            _intelLoadHistory();
            _msg('int-form-msg', '', '');
          }, ok);
        });
      } else {
        _msg('int-form-msg', 'error', res.error);
      }
    })
    .withFailureHandler(function() {
      _setLoading(btn, false);
      _msg('int-form-msg', 'error', 'Koneksi terputus.');
    })
    .intelijen_submitMingguan(APP.token, { periode: periode, items: items });
}

// ── Revisi / Anulir ──
function _intelFindRow(rowId) {
  for (var i = 0; i < _INTEL.rows.length; i++) {
    if (String(_INTEL.rows[i].RowID) === String(rowId)) return _INTEL.rows[i];
  }
  return null;
}

function intelOpenRevisiModal(rowId) {
  var r = _intelFindRow(rowId);
  if (!r) return;
  _INTEL.pendingRowId = rowId;

  document.getElementById('int-revisi-info').textContent =
    (INTEL_LABELS[r.Jenis] || r.Jenis) + ' — Periode ' + r.Periode +
    (r.Jenis === 'KAWASAN_KONSERVASI' ? ' (' + (r.kawasanNama || r.KawasanID) + ')' : '');

  var isKw = (r.Jenis === 'KAWASAN_KONSERVASI');
  var kwBlock = document.getElementById('rv-int-kawasan-block');
  var kjBlock = document.getElementById('rv-int-kejadian-block');
  if (kwBlock) kwBlock.style.display = isKw ? '' : 'none';
  if (kjBlock) kjBlock.style.display = isKw ? 'none' : '';

  if (isKw) {
    document.getElementById('rv-int-jumlah').value = (Number(r.Jumlah) || 0);
    document.getElementById('rv-int-keterangan').value = r.Keterangan || '';
  } else {
    var items = [];
    (r.rincian || []).forEach(function (x) {
      if (String(x.Deskripsi || '').trim() !== '') items.push({ Deskripsi: String(x.Deskripsi) });
    });
    _intelBindRevisiList().set(items);
  }
  document.getElementById('rv-int-alasan').value = '';
  _attachInit('intel-revisi', { refSheet: 'TX_Intelijen' });
  _msg('int-revisi-msg', '', '');
  document.getElementById('modal-int-revisi').classList.remove('n-hidden');
}

function intelRevisiConfirm() {
  _msg('int-revisi-msg', '', '');
  var alasan = _v('rv-int-alasan');
  if (!alasan) { _msg('int-revisi-msg', 'error', 'Alasan revisi wajib diisi.'); return; }

  var r = _intelFindRow(_INTEL.pendingRowId);
  var isKw = r && r.Jenis === 'KAWASAN_KONSERVASI';
  var params = {
    targetRowId: _INTEL.pendingRowId,
    alasanRevisi: alasan
  };
  if (isKw) {
    params.jumlah = _v('rv-int-jumlah') || 0;
    params.keterangan = _v('rv-int-keterangan') || '';
  } else {
    var items = _intelBindRevisiList().get();
    params.rincian = items.map(function (k) {
      return { Deskripsi: String(k.Deskripsi || '') };
    });
  }

  var btn = document.getElementById('int-btn-revisi-save');
  _setLoading(btn, true);

  google.script.run
    .withSuccessHandler(function(res) {
      _setLoading(btn, false);
      if (res.success) {
        _attachCarry('TX_Intelijen', params.targetRowId, res.data.rowId);
        _attachUploadAll('intel-revisi', [res.data.rowId], function () {
          closeModal('modal-int-revisi');
          _msg('int-hist-msg', 'success', res.data.message);
          _intelLoadKPI();
          _intelLoadHistory();
        });
      } else {
        _msg('int-revisi-msg', 'error', res.error);
      }
    })
    .withFailureHandler(function() {
      _setLoading(btn, false);
      _msg('int-revisi-msg', 'error', 'Koneksi terputus.');
    })
    .intelijen_revisi(APP.token, params);
}

var _KGD = {

function _renderKegiatan(el) {
  var tpl = document.getElementById('view-tpl-kegiatan');
  if (!tpl) { el.innerHTML = _moduleStub('Kegiatan Pendukung'); return; }
  el.innerHTML = tpl.innerHTML;
  _attachInit('kgd', { refSheet: 'TX_KegiatanDirektorat' });

  _KGD.rows = [];

  var tglInput = document.getElementById('kgd-tanggal');
  if (tglInput) {
    var now = new Date();
    tglInput.value = now.getFullYear() + '-' +
      (now.getMonth() < 9 ? '0' : '') + (now.getMonth() + 1) + '-' +
      (now.getDate() < 10 ? '0' : '') + now.getDate();
  }

function _kgdFmtDate(v) {
  if (!v) return '—';
  var d = new Date(v);
  if (isNaN(d.getTime())) return '—';
  return d.toLocaleDateString('id-ID', { day: '2-digit', month: 'short', year: 'numeric' });
}

function _kgdDateInput(v) {
  if (!v) return '';
  var d = new Date(v);
  if (isNaN(d.getTime())) return '';
  var y = d.getFullYear();
  var m = (d.getMonth() < 9 ? '0' : '') + (d.getMonth() + 1);
  var dd = (d.getDate() < 10 ? '0' : '') + d.getDate();
  return y + '-' + m + '-' + dd;
}

// ── FEED KRONOLOGIS ──
function _kgdLoadHistory(silent) {
  var wrap = document.getElementById('kgd-history-wrap');
  if (!wrap) return;
  if (!silent) wrap.innerHTML = _loadingInline('Memuat kegiatan direktorat\u2026');

  google.script.run
    .withSuccessHandler(function(res) {
      if (res.success) { _KGD.rows = res.data; _kgdRenderHistory(res.data); }
      else wrap.innerHTML = '<div class="n-msg error">' + _esc(res.error) + '</div>';
    })
    .withFailureHandler(function() {
      wrap.innerHTML = '<div class="n-msg error">Koneksi terputus.</div>';
    })
    .kegiatanDirektorat_getHistory(APP.token, APP.filter);
}

function _kgdRenderHistory(data) {
  var isPimpinan = (APP.user && (APP.user.role === 'DIREKTUR' || APP.user.role === 'SUPERADMIN' || APP.user.role === 'KADIV'));

  _histRender('kgd-history-wrap', {
    // "Periode" ditambahkan agar bentuk kolom sama dengan modul lain; nilainya
    // sudah disimpan server (dateToPeriode dari Tanggal kegiatan), bukan dihitung client.
    columns: ['Periode', 'Tanggal', 'Judul Kegiatan', 'Divisi', 'Pihak Hadir'],
    cells: function (r) {
      return [
        _esc(r.periode),
        _kgdFmtDate(r.Tanggal),
        _esc(r.JudulKegiatan || '—'),
        _esc(r.divisiNama || r.DivisiID || '—'),
        _esc(r.PihakHadir || '—')
      ];
    },
    refSheet: 'TX_KegiatanDirektorat',
    title: function (r) { return 'Kegiatan — ' + (r.JudulKegiatan || '—'); },
    detail: function (r) {
      return [
        ['Periode', _esc(r.periode || '—')],
        ['Tanggal', _kgdFmtDate(r.Tanggal)],
        ['Judul', _esc(r.JudulKegiatan || '—')],
        ['Deskripsi', _esc(r.Deskripsi || '—')],
        ['Pihak Hadir', _esc(r.PihakHadir || '—')],
        ['Divisi', _esc(r.divisiNama || r.DivisiID || '—')],
        ['Dikirim', _esc(r.timestamp ? new Date(r.timestamp).toLocaleString('id-ID') : '—')],
        ['Status', _esc(r.status)]
      ];
    },
    revisi: isPimpinan ? function (r) { return "kgdOpenRevisiModal('" + _esc(r.rowId) + "')"; } : null,
    anulir: isPimpinan ? function (r) { return "kgdOpenAnulirModal('" + _esc(r.rowId) + "')"; } : null,
    empty: 'Belum ada kegiatan direktorat pada rentang ini.'
  }, data);
}

// ── FORM POPUP (BACKLOG A) ──
function kgdOpenForm() {
  var judul = document.getElementById('kgd-judul');
  var desk = document.getElementById('kgd-deskripsi');
  var pihak = document.getElementById('kgd-pihak');
  if (judul) judul.value = '';
  if (desk) desk.value = '';
  if (pihak) pihak.value = '';
  var tgl = document.getElementById('kgd-tanggal');
  if (tgl) {
    var now = new Date();
    tgl.value = now.getFullYear() + '-' +
      (now.getMonth() < 9 ? '0' : '') + (now.getMonth() + 1) + '-' +
      (now.getDate() < 10 ? '0' : '') + now.getDate();
  }
  _msg('kgd-form-msg', '', '');
  _attachInit('kgd', { refSheet: 'TX_KegiatanDirektorat' });
  var m = document.getElementById('modal-kgd-form');
  if (m) m.classList.remove('n-hidden');
}

function kgdSubmit() {
  _msg('kgd-form-msg', '', '');
  var judul = _v('kgd-judul');
  var tanggal = _v('kgd-tanggal');
  var deskripsi = _v('kgd-deskripsi');
  var pihak = _v('kgd-pihak');

  if (!judul || !judul.trim()) { _msg('kgd-form-msg', 'error', 'Judul kegiatan wajib diisi.'); return; }
  if (!tanggal) { _msg('kgd-form-msg', 'error', 'Tanggal kegiatan wajib diisi.'); return; }
  if (!deskripsi || !deskripsi.trim()) { _msg('kgd-form-msg', 'error', 'Deskripsi kegiatan wajib diisi.'); return; }

  var attachErr = _attachValidate('kgd');
  if (attachErr) { _msg('kgd-form-msg', 'error', attachErr); return; }

  var btn = document.getElementById('kgd-btn-submit');
  _setLoading(btn, true);

  google.script.run
    .withSuccessHandler(function(res) {
      _setLoading(btn, false);
      if (res.success) {
        _msg('kgd-form-msg', 'success', res.data.message);
        var rowIds = (res.data && res.data.rowIds) || [];
        _attachUploadAll('kgd', rowIds, function(ok) {
          _formSubmitDone('modal-kgd-form', 'Kegiatan pendukung tersimpan.', function () {
            _kgdLoadKPI();
            _kgdLoadHistory();
          }, ok);
        });
      } else {
        _msg('kgd-form-msg', 'error', res.error);
      }
    })
    .withFailureHandler(function() {
      _setLoading(btn, false);
      _msg('kgd-form-msg', 'error', 'Koneksi terputus.');
    })
    .kegiatanDirektorat_submit(APP.token, {
      judul: judul,
      tanggal: tanggal,
      deskripsi: deskripsi,
      pihakHadir: pihak || ''
    });
}

// ── Revisi / Anulir ──
function _kgdFindRow(rowId) {
  for (var i = 0; i < _KGD.rows.length; i++) {
    if (String(_KGD.rows[i].RowID) === String(rowId)) return _KGD.rows[i];
  }
  return null;
}

function kgdOpenRevisiModal(rowId) {
  var r = _kgdFindRow(rowId);
  if (!r) return;
  _KGD.pendingRowId = rowId;

  document.getElementById('kgd-revisi-info').textContent =
    (r.JudulKegiatan || '—') + ' — ' + _kgdFmtDate(r.Tanggal);
  document.getElementById('rv-kgd-judul').value = r.JudulKegiatan || '';
  document.getElementById('rv-kgd-tanggal').value = _kgdDateInput(r.Tanggal);
  document.getElementById('rv-kgd-deskripsi').value = r.Deskripsi || '';
  document.getElementById('rv-kgd-pihak').value = r.PihakHadir || '';
  document.getElementById('rv-kgd-alasan').value = '';
  _attachInit('kgd-revisi', { refSheet: 'TX_KegiatanDirektorat' });
  _msg('kgd-revisi-msg', '', '');
  document.getElementById('modal-kgd-revisi').classList.remove('n-hidden');
}

function kgdRevisiConfirm() {
  _msg('kgd-revisi-msg', '', '');
  var alasan = _v('rv-kgd-alasan');
  if (!alasan || !alasan.trim()) { _msg('kgd-revisi-msg', 'error', 'Alasan revisi wajib diisi.'); return; }

  var judul = _v('rv-kgd-judul');
  var tanggal = _v('rv-kgd-tanggal');
  var deskripsi = _v('rv-kgd-deskripsi');
  var pihak = _v('rv-kgd-pihak');
  if (!judul || !judul.trim()) { _msg('kgd-revisi-msg', 'error', 'Judul kegiatan wajib diisi.'); return; }
  if (!tanggal) { _msg('kgd-revisi-msg', 'error', 'Tanggal kegiatan wajib diisi.'); return; }
  if (!deskripsi || !deskripsi.trim()) { _msg('kgd-revisi-msg', 'error', 'Deskripsi kegiatan wajib diisi.'); return; }

  var params = {
    targetRowId: _KGD.pendingRowId,
    alasanRevisi: alasan,
    judul: judul,
    tanggal: tanggal,
    deskripsi: deskripsi,
    pihakHadir: pihak || ''
  };

  var btn = document.getElementById('kgd-btn-revisi-save');
  _setLoading(btn, true);

  google.script.run
    .withSuccessHandler(function(res) {
      _setLoading(btn, false);
      if (res.success) {
        _attachCarry('TX_KegiatanDirektorat', params.targetRowId, res.data.rowId);
        _attachUploadAll('kgd-revisi', [res.data.rowId], function () {
          closeModal('modal-kgd-revisi');
          _msg('kgd-hist-msg', 'success', res.data.message);
          _kgdLoadKPI();
          _kgdLoadHistory();
        });
      } else {
        _msg('kgd-revisi-msg', 'error', res.error);
      }
    })
    .withFailureHandler(function() {
      _setLoading(btn, false);
      _msg('kgd-revisi-msg', 'error', 'Koneksi terputus.');
    })
    .kegiatanDirektorat_revisi(APP.token, params);
}

function kgdOpenAnulirModal(rowId) {
  var r = _kgdFindRow(rowId);
  if (!r) return;
  _KGD.pendingRowId = rowId;
  document.getElementById('kgd-anulir-info').textContent =
    (r.JudulKegiatan || '—') + ' — ' + _kgdFmtDate(r.Tanggal);
  document.getElementById('an-kgd-alasan').value = '';
  _msg('kgd-anulir-msg', '', '');
  document.getElementById('modal-kgd-anulir').classList.remove('n-hidden');
}

function kgdAnulirConfirm() {
  _msg('kgd-anulir-msg', '', '');
  var alasan = _v('an-kgd-alasan');
  if (!alasan || !alasan.trim()) { _msg('kgd-anulir-msg', 'error', 'Komentar anulir wajib diisi.'); return; }

  var btn = document.getElementById('kgd-btn-anulir-save');
  _setLoading(btn, true);

  google.script.run
    .withSuccessHandler(function(res) {
      _setLoading(btn, false);
      if (res.success) {
        _msg('kgd-anulir-msg', 'success', res.message);
        setTimeout(function(){
          closeModal('modal-kgd-anulir');
          _kgdLoadKPI();
          _kgdLoadHistory();
        }, 900);
      } else {
        _msg('kgd-anulir-msg', 'error', res.error);
      }
    })
    .withFailureHandler(function() {
      _setLoading(btn, false);
      _msg('kgd-anulir-msg', 'error', 'Koneksi terputus.');
    })
    .kegiatanDirektorat_anulir(APP.token, { targetRowId: _KGD.pendingRowId, alasan: alasan });
}

  { kode: 'KAPAL_NIAGA',     label: 'Kapal Niaga' },
  { kode: 'KAPAL_PENUMPANG', label: 'Kapal Penumpang' },

];

  kpiData:      null,
  rows:         []
};

// ── KPI + event log ──
function _pemLoadKPI(silent) {
  var strip = document.getElementById('pem-kpi-strip');
  if (strip && !silent) strip.innerHTML = _kpiSkeleton(5);

  google.script.run
    .withSuccessHandler(function(res) {
      if (res.success) {
        _PEM.kpiData = res.data;
        _pemRenderKPI(res.data);
        _pemRenderPenyedia(res.data.penyedia || []);
        _pemRenderMarabahaya(res.data.marabahaya || []);
        _pemBuildPenerbitanChart(res.data);
        _pemLoadCharts();
      } else if (strip) {
        strip.innerHTML = '<div class="n-msg error">Gagal memuat KPI: ' + _esc(res.error) + '</div>';
      }
    })
    .withFailureHandler(function() {
      if (strip) strip.innerHTML = '<div class="n-msg error">Koneksi terputus.</div>';
    })
    .pemantauan_getKPI(APP.token, APP.filter);
}

function _pemRenderKPI(kpi) {
  var strip = document.getElementById('pem-kpi-strip');
  if (!strip) return;

  function card(label, periode, ytd) {
    return '<div class="n-card"><div class="kpi-label">' + _esc(label) + '</div>' +
           '<div class="kpi-val">' + (periode || 0) + '</div>' +
           '<div class="kpi-sub">YTD: ' + (ytd || 0) + '</div></div>';
  }
  function simple(label, value, sub) {
    return '<div class="n-card"><div class="kpi-label">' + _esc(label) + '</div>' +
           '<div class="kpi-val">' + (value || 0) + '</div>' +
           '<div class="kpi-sub">' + _esc(sub) + '</div></div>';
  }

  strip.innerHTML = '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:16px;">' +
    card('Penerbitan Username', kpi.usernamePeriode, kpi.usernameYTD) +
    card('Penerbitan SKAT',     kpi.skatPeriode,     kpi.skatYTD) +
    card('Pemasangan Migrasi',  kpi.pemasanganPeriode, kpi.pemasanganYTD) +
    simple('Persetujuan Penyedia', kpi.penyediaPesan, 'penyedia periode ini') +
    simple('Kapal Marabahaya', (kpi.marabahaya || []).length, 'entri periode ini') +
  '</div>';
}

function _pemRenderPenyedia(rows) {
  var wrap = document.getElementById('pem-penyedia-wrap');
  if (!wrap) return;
  if (!rows || rows.length === 0) {
    wrap.innerHTML = '<div style="padding:20px 24px;color:var(--n-text-muted);font-size:.875rem;">Belum ada persetujuan penyedia pada periode ini.</div>';
    return;
  }
  var t = '<table class="n-table n-table-full"><thead><tr><th>Penyedia</th><th>Jumlah</th><th>Periode</th><th>Tanggal</th></tr></thead><tbody>';
  rows.forEach(function(r){
    t += '<tr><td>' + _esc(r.nama) + '</td><td>' + (r.jumlah || 0) + '</td><td>' + _esc(r.periode) + '</td><td>' +
         (r.timestamp ? new Date(r.timestamp).toLocaleDateString('id-ID') : '—') + '</td></tr>';
  });
  t += '</tbody></table>';
  wrap.innerHTML = t;
}

function _pemRenderMarabahaya(rows) {
  var wrap = document.getElementById('pem-marabahaya-wrap');
  if (!wrap) return;
  if (!rows || rows.length === 0) {
    wrap.innerHTML = '<div style="padding:20px 24px;color:var(--n-text-muted);font-size:.875rem;">Tidak ada kapal marabahaya pada periode ini.</div>';
    return;
  }
  var t = '<table class="n-table n-table-full"><thead><tr><th>Kapal</th><th>Kondisi</th><th>Status</th><th>Periode</th></tr></thead><tbody>';
  rows.forEach(function(r){
    var st = '<span class="status-badge" style="background:#f3f4f6;color:#374151;">—</span>';
    if (r.statusPenanganan === 'DALAM_PENANGANAN') st = '<span class="status-badge" style="background:#fef3c7;color:#92400e;">Dalam Penanganan</span>';
    else if (r.statusPenanganan === 'SELESAI') st = '<span class="status-badge" style="background:var(--n-primary-light);color:var(--n-status-success);">Selesai</span>';
    t += '<tr><td>' + _esc(r.namaKapal) + '</td><td>' + _esc(r.kondisiDarurat) + '</td><td>' + st + '</td><td>' + _esc(r.periode) + '</td></tr>';
  });
  t += '</tbody></table>';
  wrap.innerHTML = t;
}

// ── Riwayat ──
function _pemLoadHistory(silent) {
  var wrap = document.getElementById('pem-history-wrap');
  if (!wrap) return;
  if (!silent) wrap.innerHTML = _loadingInline('Memuat riwayat pemantauan\u2026');

  google.script.run
    .withSuccessHandler(function(res) {
      if (res.success) { _PEM.rows = res.data; _pemRenderHistory(res.data); }
      else wrap.innerHTML = '<div class="n-msg error">' + _esc(res.error) + '</div>';
    })
    .withFailureHandler(function() {
      wrap.innerHTML = '<div class="n-msg error">Koneksi terputus.</div>';
    })
    .pemantauan_getHistory(APP.token, APP.filter);
}

function _pemRenderHistory(data) {
  var isPimpinan = (APP.user && (APP.user.role === 'DIREKTUR' || APP.user.role === 'SUPERADMIN' || APP.user.role === 'KADIV'));
  var canWrite = (APP.user && (APP.user.role === 'SUPERADMIN' || (APP.user.divisiId === 'DIV-PANTAU' && (APP.user.role === 'STAF' || APP.user.role === 'KADIV'))));

  _histRender('pem-history-wrap', {
    columns: ['Periode', 'Kategori', 'Jumlah', 'Detail'],
    cells: function (r) {
      return [_esc(r.periode), _esc(PEM_LABELS[r.Jenis] || r.Jenis), _idNum(r.Jumlah), _esc(_pemDetail(r))];
    },
    refSheet: 'TX_Pemantauan',
    title: function (r) { return 'Pemantauan — ' + (PEM_LABELS[r.Jenis] || r.Jenis) + ' · Periode ' + r.periode; },
    detail: function (r) {
      var marabahaya = r.Jenis === 'MARABAHAYA';
      return [
        ['Periode', _esc(r.periode)],
        ['Kategori', _esc(PEM_LABELS[r.Jenis] || r.Jenis)],
        ['Jumlah', _idNum(r.Jumlah)],
        ['Nama Penyedia', r.Jenis !== 'PERSETUJUAN_PENYEDIA' ? '—' : _esc(r.NamaPenyedia || '—')],
        ['Kapal', !marabahaya ? '—' : _esc(r.namaKapal || r.KapalID || '—')],
        ['Kondisi Darurat', !marabahaya ? '—' : _esc(r.KondisiDarurat || '—')],
        ['Status Penanganan', !marabahaya ? '—' : _esc(r.StatusPenanganan || '—')],
        ['Keterangan', _esc(r.Keterangan || '—')],
        ['Detail', _esc(_pemDetail(r))],
        ['Dikirim', _esc(r.timestamp ? new Date(r.timestamp).toLocaleString('id-ID') : '—')],
        ['Status', _esc(r.status)]
      ];
    },
    revisi: canWrite  ? function (r) { return "pemOpenRevisiModal('" + _esc(r.rowId) + "')"; } : null,
    anulir: isPimpinan ? function (r) { return "pemOpenAnulirModal('" + _esc(r.rowId) + "')"; } : null,
    empty: 'Belum ada laporan untuk periode ini.'
  }, data);
}

// Nilai kolom "Detail" — sama antara baris tabel dan modal Lihat.
function _pemDetail(r) {
  if (r.Jenis === 'PERSETUJUAN_PENYEDIA') return r.NamaPenyedia || '—';
  if (r.Jenis === 'MARABAHAYA') return (r.namaKapal || r.KapalID || '—') + (r.KondisiDarurat ? ' · ' + r.KondisiDarurat : '');
  return '—';
}

// ── Submit ──
function pemSubmit(e) {
  _msg('pem-form-msg', '', '');
  var attachErr = _attachValidate('pem');
  if (attachErr) { _msg('pem-form-msg', 'error', attachErr); return; }
  var periode = _composePeriode('pem-');
  if (!periode) { _msg('pem-form-msg', 'error', 'Periode wajib dipilih.'); return; }

  var items = [];
  [['pem-username','USERNAME'],['pem-skat','SKAT'],['pem-migrasi','PEMASANGAN_MIGRASI']].forEach(function(pair){
    var v = _v(pair[0]);
    if (v !== '' && v !== null) items.push({ jenis: pair[1], jumlah: parseInt(v, 10) || 0 });
  });

  var pRows = document.querySelectorAll('#pem-penyedia-rows .pem-penyedia-row');
  for (var i = 0; i < pRows.length; i++) {
    var nama = pRows[i].querySelector('.pem-penyedia-nama');
    var jml  = pRows[i].querySelector('.pem-penyedia-jml');
    if (nama && nama.value.trim()) {
      items.push({ jenis: 'PERSETUJUAN_PENYEDIA', namaPenyedia: nama.value.trim(), jumlah: parseInt(jml && jml.value, 10) || 1 });
    }
  }

  var mRows = document.querySelectorAll('#pem-marabahaya-rows .pem-marabahaya-row');
  for (var j = 0; j < mRows.length; j++) {
    var nama  = mRows[j].querySelector('.pem-mb-nama');
    var jenis = mRows[j].querySelector('.pem-mb-jenis');
    var kond  = mRows[j].querySelector('.pem-mb-kondisi');
    var stat  = mRows[j].querySelector('.pem-mb-status');
    if (nama && nama.value.trim()) {
      items.push({ jenis: 'MARABAHAYA', namaKapal: nama.value.trim(), jenisKapal: jenis ? jenis.value : '', kondisiDarurat: kond ? kond.value : '', statusPenanganan: stat ? stat.value : '' });
    }
  }

  if (items.length === 0) { _msg('pem-form-msg', 'error', 'Minimal satu data pemantauan wajib diisi.'); return; }

  var btn = document.getElementById('pem-btn-submit');
  _setLoading(btn, true);

  google.script.run
    .withSuccessHandler(function(res) {
      _setLoading(btn, false);
      if (res.success) {
        _msg('pem-form-msg', 'success', res.data.message);
        var rowIds = (res.data && res.data.rowIds) || [];
        _pemResetForm();
        _attachUploadAll('pem', rowIds, function(ok) {
          _formSubmitDone('modal-pem-form', 'Laporan pemantauan tersimpan.', function () {
            _pemLoadKPI();
            _pemLoadHistory();
            _msg('pem-form-msg', '', '');
          }, ok);
        });
      } else {
        _msg('pem-form-msg', 'error', res.error);
      }
    })
    .withFailureHandler(function() {
      _setLoading(btn, false);
      _msg('pem-form-msg', 'error', 'Koneksi terputus.');
    })
    .pemantauan_submitMingguan(APP.token, { periode: periode, items: items });
}

function _pemResetForm() {

// ── FORMAT RUPIAH ─────────────────────────────────────────

function _rupiah(angka) {
  if (angka === null || angka === undefined) return 'Rp —';
  var n = parseFloat(angka) || 0;
  var prefix = n < 0 ? '-Rp ' : 'Rp ';
  return prefix + Math.abs(Math.round(n)).toLocaleString('id-ID');
}

function _opsLautBuildWppChart() {
  var kpi = _OPSLAUT.kpiData;

  var arr = [];
  for (var code in kpi.wppIntensitas) {
    if (Object.prototype.hasOwnProperty.call(kpi.wppIntensitas, code)) {
      arr.push({ code: code, val: kpi.wppIntensitas[code] });

  arr.sort(function (a, b) { return b.val - a.val; });
